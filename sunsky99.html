function _timeLabel(t,now){
  var d=new Date(t*1000);
  var diff=Math.round((t-now)/60);
  var hh=String(d.getHours()).padStart(2,'0');
  var mm=String(d.getMinutes()).padStart(2,'0');
  if(diff===0)return hh+':'+mm+' (TEĎ)';
  if(Math.abs(diff)<120)return hh+':'+mm+' ('+(diff>0?'+':'')+diff+'min)';
  var h=Math.round(diff/60);
  return hh+':'+mm+' ('+(h>0?'+':'')+h+'h)';
}

function _ensureMetnoLayer(){
  if(L.MetnoRadar)return;
  // Met.no "skandinavia" — Lambert Conformal Conic
  // +proj=lcc +lon_0=15 +lat_1=63 +lat_2=63 +lat_0=63 +R=6371000
  // Grid 719x929 @ 2500m; xfirst=-897442.2, yfirst=-1104322.0
  //
  // Projekce: per-strip drawImage BEZ getImageData (CORS-safe)
  // Pro každý horizontální strip výstupu:
  //   1. Zjistíme lat/lon levého okraje stripu (Mercator → lat/lon)
  //   2. Transformujeme lat/lon → LCC pixel (u,v) v obrázku
  //   3. Kreslíme clip obrázku na výstupní strip
  //
  // Kalibrace ověřena: Oslo→(col=264,row=622), Tromsø→(col=421,row=189)

  var LC_N    = 0.89100652;
  var LC_F    = 1.81666456;
  var LC_RHO0 = 3246186.64;
  var LC_R    = 6371000;
  var LC_LON0 = 15 * Math.PI / 180;
  var LC_XMIN = -897442.2, LC_XMAX = 900057.8;
  var LC_YMIN = -1104322.0, LC_YMAX = 1218178.0;

  // (lat°, lon°) → {u: 0..1 zleva, v: 0..1 shora} v LCC obrázku
  function toUV(lat, lon) {
    var phi = lat * Math.PI / 180;
    var lam = lon * Math.PI / 180;
    var rho = LC_R * LC_F / Math.pow(Math.tan(Math.PI/4 + phi/2), LC_N);
    var theta = LC_N * (lam - LC_LON0);
    var x = rho * Math.sin(theta);
    var y = LC_RHO0 - rho * Math.cos(theta);
    return {
      u: (x - LC_XMIN) / (LC_XMAX - LC_XMIN),
      v: (LC_YMAX - y) / (LC_YMAX - LC_YMIN)
    };
  }

  // LCC (x,y) → {lat°, lon°}
  function fromLCC(x, y) {
    var rho = Math.sqrt(x*x + (LC_RHO0-y)*(LC_RHO0-y));
    var lat = (2*Math.atan(Math.pow(LC_R*LC_F/rho, 1/LC_N)) - Math.PI/2) * 180/Math.PI;
    var lon = (Math.atan2(x, LC_RHO0-y) / LC_N + LC_LON0) * 180/Math.PI;
    return {lat: lat, lon: lon};
  }

  L.MetnoRadar = L.Layer.extend({
    initialize: function(opts) {
      this._opacity = (opts && opts.opacity) || 0.75;
      this._urls = opts.urls || [];
      this._urlIdx = 0;
      this._cachedImg = (opts && opts.cachedImg) || null;
    },
    onAdd: function(map) {
      this._map = map;
      this._canvas = document.createElement('canvas');
      this._canvas.style.cssText = 'position:absolute;pointer-events:none;';
      this._canvas.style.opacity = this._opacity;
      this._canvas.style.zIndex = 200;
      var self = this;
      if (this._cachedImg && this._cachedImg.complete && this._cachedImg.naturalWidth > 0) {
        this._img = this._cachedImg;
        // Ujistíme se že crossOrigin je nastaveno (potřeba i pro cached)
        this._redraw();
      } else {
        this._img = document.createElement('img');
        this._img.crossOrigin = 'anonymous';
        this._img.onload = function() { self._redraw(); };
        this._img.onerror = function() {
          self._urlIdx++;
          if (self._urlIdx < self._urls.length) self._img.src = self._urls[self._urlIdx];
        };
        this._img.src = this._urls[0] || '';
      }
      map.getPanes().overlayPane.appendChild(this._canvas);
      map.on('moveend zoomend', this._reset, this);
      map.on('zoomstart', function() { if(this._canvas) this._canvas.style.display='none'; }, this);
      map.on('zoomend',   function() { if(this._canvas) this._canvas.style.display=''; this._reset(); }, this);
      this._reset();
    },
    onRemove: function(map) {
      if (this._canvas && this._canvas.parentNode) this._canvas.parentNode.removeChild(this._canvas);
      map.off('moveend zoomend', this._reset, this);
      map.off('zoomstart', null, this);
      map.off('zoomend',   null, this);
    },
    setOpacity: function(v) { this._opacity = v; if (this._canvas) this._canvas.style.opacity = v; },
    _redraw: function() { this._reset(); },
    _reset: function() {
      if (!this._canvas || !this._map) return;
      if (!this._img || !this._img.complete || this._img.naturalWidth === 0) return;
      try {
        var map = this._map;
        var imgW = this._img.naturalWidth, imgH = this._img.naturalHeight;

        // 8 referenčních bodů (4 rohy + středy hran) pro výpočet bbox canvasu
        var refPts = [
          fromLCC(LC_XMIN, LC_YMAX), fromLCC(LC_XMAX, LC_YMAX),
          fromLCC(LC_XMIN, LC_YMIN), fromLCC(LC_XMAX, LC_YMIN),
          fromLCC(0,       LC_YMAX), fromLCC(0,       LC_YMIN),
          fromLCC(LC_XMIN, 0),       fromLCC(LC_XMAX, 0)
        ];
        var px = refPts.map(function(c) { return map.latLngToLayerPoint([c.lat, c.lon]); });
        var minX = px[0].x, maxX = px[0].x, minY = px[0].y, maxY = px[0].y;
        px.forEach(function(p) {
          if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
        });
        minX = minX|0; minY = minY|0;
        var W = (maxX - minX + 1)|0, H = (maxY - minY + 1)|0;
        if (W <= 0 || H <= 0 || W > 10000 || H > 10000) return;

        L.DomUtil.setPosition(this._canvas, L.point(minX, minY));
        this._canvas.width  = W;
        this._canvas.height = H;
        this._canvas.style.width  = W + 'px';
        this._canvas.style.height = H + 'px';

        var ctx = this._canvas.getContext('2d');
        ctx.clearRect(0, 0, W, H);

        // ── Per-strip reprojekce (CORS-safe: žádný getImageData) ──────────
        // Pro každý horizontální strip výstupu (výška 1-2px):
        //   Zjistíme u,v zdrojového obrázku pro levý a pravý okraj stripu.
        //   Pak kreslíme clip ze zdrojového obrázku na výstupní strip.
        //
        // Protože LCC→Mercator způsobuje mírné horizontální zkosení
        // (rohy obrázku nejsou pravoúhlé v Mercatoru), musíme pro každý strip
        // interpolovat také x-offset a x-šířku.

        var STRIPS = Math.min(H, 600); // max 600 strips
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'medium';

        for (var i = 0; i < STRIPS; i++) {
          var y0 = Math.round(i / STRIPS * H);
          var y1 = Math.round((i + 1) / STRIPS * H);
          if (y1 <= y0) continue;

          // Střed stripu v layer souřadnicích
          var layerY = minY + (y0 + y1) / 2;

          // Lat/lon na levém, středu a pravém okraji canvasu
          var llL = map.layerPointToLatLng(L.point(minX,     layerY));
          var llC = map.layerPointToLatLng(L.point(minX+W/2, layerY));
          var llR = map.layerPointToLatLng(L.point(maxX,     layerY));

          // UV v obrázku pro levý a pravý okraj
          var uvL = toUV(llL.lat, llL.lng);
          var uvR = toUV(llR.lat, llR.lng);
          var uvC = toUV(llC.lat, llC.lng);

          // Zdrojový obdélník: srcX, srcY, srcW, srcH (v pixelech obrázku)
          // Pro strip: v ≈ uvL.v (oba okraje mají stejnou v)
          // Šířkový mapping: u jde od uvL.u do uvR.u
          var srcU0 = Math.min(uvL.u, uvR.u);
          var srcU1 = Math.max(uvL.u, uvR.u);
          var srcV0 = uvL.v - 0.5/STRIPS; // malý přesah nahoru
          var srcV1 = uvL.v + 0.5/STRIPS + (y1-y0)/H; // přesah dolů

          // Ořez na [0,1]
          srcU0 = Math.max(0, srcU0);
          srcU1 = Math.min(1, srcU1);
          srcV0 = Math.max(0, srcV0);
          srcV1 = Math.min(1, srcV1);
          if (srcU1 <= srcU0 || srcV1 <= srcV0) continue;

          // Pixely v obrázku
          var sx = srcU0 * imgW;
          var sy = srcV0 * imgH;
          var sw = (srcU1 - srcU0) * imgW;
          var sh = (srcV1 - srcV0) * imgH;
          if (sw < 0.5 || sh < 0.5) continue;

          // Výstupní oblast: x offset závisí na zkosení
          // Levý okraj výstupu odpovídá uvL.u, ale canvas začíná u minX
          // → posun = (uvL.u - srcU0) / (srcU1 - srcU0) * W (kde se obraz začíná v canvasu)
          var dxL = (uvL.u < uvR.u)
            ? (uvL.u - srcU0) / (srcU1 - srcU0) * W
            : (srcU1 - uvL.u) / (srcU1 - srcU0) * W;
          // Šířka výstupu = celá šířka canvasu (roztáhnout obrázek od kraje ke kraji)
          var dxW = W;

          try {
            ctx.drawImage(this._img, sx, sy, sw, sh, 0, y0, dxW, y1 - y0);
          } catch(e2) {}
        }
        ctx.restore();

      } catch(e) { console.warn('MetnoRadar._reset:', e); }
    }
  });
}

function _metnoFmt(t){
  var d=new Date(t*1000);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'
    +String(d.getUTCDate()).padStart(2,'0')+'T'
    +String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+':00Z';
}

function _metnoLayer(time){
  _ensureMetnoLayer();
  var t5=Math.round(time/300)*300;
  var urls=[
    'https://radarapi.met.no/api/get/skandinavia/reflectivity/image/'+_metnoFmt(t5),
    'https://radarapi.met.no/api/get/skandinavia/reflectivity/image/'+_metnoFmt(t5-300),
    'https://radarapi.met.no/api/get/skandinavia/reflectivity/image/'+_metnoFmt(t5-600),
    'https://radarapi.met.no/api/get/skandinavia/reflectivity/image',
    'https://api.met.no/weatherapi/radar/2.0/?area=nordic&type=reflectivity&content=image'
  ];
  return new L.MetnoRadar({opacity:_precipOpacity,urls:urls});
}

function _noaaLayer(time){
  // WMS s opacity:0 — pre-přidán na mapu, opacity se přepíná v radarShowFrame
  var t5=Math.round(time/300)*300;
  var d=new Date(t5*1000);
  var tStr=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'
    +String(d.getUTCDate()).padStart(2,'0')+'T'
    +String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+':00Z';
  return L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r-t.cgi',{
    layers:'nexrad-n0r-wmst',format:'image/png',transparent:true,
    opacity:0,time:tStr,
    attribution:'NOAA NEXRAD via Iowa State IEM'
  });
}

// ── Open-Meteo 20×20 grid — persistentní canvas overlay ────────────────────
function _ensureOMGridLayer(){
  if(L.OMGridLayer)return;
  L.OMGridLayer=L.Layer.extend({
    initialize:function(){this._points=[];this._timeIdx=0;this._visible=false;},
    onAdd:function(map){
      this._map=map;
      this._canvas=document.createElement('canvas');
      this._canvas.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:201;display:none';
      map.getPanes().overlayPane.appendChild(this._canvas);
      map.on('moveend zoomend viewreset',this._draw,this);
    },
    onRemove:function(map){
      if(this._canvas&&this._canvas.parentNode)this._canvas.parentNode.removeChild(this._canvas);
      map.off('moveend zoomend viewreset',this._draw,this);
    },
    show:function(points,timeIdx,bbox){
      this._points=points||[];this._timeIdx=timeIdx||0;this._bbox=bbox||null;
      this._visible=true;this._canvas.style.display='';this._draw();
    },
    hide:function(){this._visible=false;this._canvas.style.display='none';},
    setOpacity:function(v){if(this._canvas)this._canvas.style.opacity=v;},
    _draw:function(){
      if(!this._visible||!this._map)return;
      var map=this._map,size=map.getSize();
      var canvas=this._canvas;
      canvas.width=size.x;canvas.height=size.y;
      canvas.style.width=size.x+'px';canvas.style.height=size.y+'px';
      L.DomUtil.setPosition(canvas,map.containerPointToLayerPoint([0,0]));
      var ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,size.x,size.y);
      var ti=this._timeIdx,zoom=map.getZoom();
      // Radius large enough for adjacent grid points (~10-12km apart) to overlap and blend
      var radius=Math.max(14,zoom*2.8);

      // Build list of (px,py,precip,color) for active points
      var active=[];
      this._points.forEach(function(pt){
        var pr=(pt.hourly&&pt.hourly.precipitation&&pt.hourly.precipitation[ti])||0;
        if(pr<0.05)return;
        var lp=map.latLngToContainerPoint([pt.latitude,pt.longitude]);
        active.push({x:lp.x,y:lp.y,pr:pr,col:_precipColor(pr)});
      });
      if(!active.length)return;

      // For each active point, sample neighbour activity to compute fade factor
      // A point at the edge of the precipitation area (no wet neighbours) will fade more
      function hasWetNeighbour(px,py){
        for(var k=0;k<active.length;k++){
          if(active[k].x===px&&active[k].y===py)continue;
          var dx=active[k].x-px,dy=active[k].y-py;
          if(dx*dx+dy*dy<(radius*1.4)*(radius*1.4))return true;
        }
        return false;
      }

      // Draw each blob as radial gradient — overlapping blobs merge smoothly via canvas compositing
      ctx.globalCompositeOperation='source-over';
      active.forEach(function(pt){
        var col=pt.col;
        var r2=parseInt(col.slice(1,3),16),g2=parseInt(col.slice(3,5),16),b2=parseInt(col.slice(5,7),16);
        // Edge fade: if no wet neighbour, fade more at outer edge
        var isolated=!hasWetNeighbour(pt.x,pt.y);
        var coreAlpha=0.88;
        var midStop=isolated?0.45:0.55;
        var midAlpha=isolated?0.28:0.48;
        var edgeAlpha=0; // always fade fully at edge
        var grad=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,radius);
        grad.addColorStop(0,'rgba('+r2+','+g2+','+b2+','+coreAlpha+')');
        grad.addColorStop(midStop,'rgba('+r2+','+g2+','+b2+','+midAlpha+')');
        grad.addColorStop(1,'rgba('+r2+','+g2+','+b2+','+edgeAlpha+')');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(pt.x,pt.y,radius,0,Math.PI*2);ctx.fill();
      });

      // Draw bounding box of forecast grid as dotted rectangle
      if(this._bbox){
        var bb=this._bbox;
        var nw=map.latLngToContainerPoint([bb.n,bb.w]);
        var se=map.latLngToContainerPoint([bb.s,bb.e]);
        ctx.save();
        ctx.strokeStyle='rgba(60,220,100,0.55)';
        ctx.lineWidth=1.5;
        ctx.setLineDash([5,4]);
        ctx.strokeRect(nw.x,nw.y,se.x-nw.x,se.y-nw.y);
        ctx.setLineDash([]);
        // "PŘEDPOVĚĎ" label in corner of bbox
        ctx.fillStyle='rgba(60,220,100,0.70)';
        ctx.font='bold 9px sans-serif';
        ctx.fillText(T('forecast'),nw.x+4,nw.y+11);
        ctx.restore();
      }
    }
  });
}

function _omGridCacheKey(lat,lon){
  return 'omgrid_'+lat.toFixed(2)+'_'+lon.toFixed(2);
}
function _fetchOMGrid(cb){
  var _lat=RDR.lat,_lon=RDR.lon;
  if(!_lat||!_lon||isNaN(_lat)||isNaN(_lon)){cb();return;}
  // 1) In-memory cache — stejná lokalita v rámci sezení
  if(RDR.omGrid&&RDR.omGrid.points&&RDR.omGrid.cachedLat!==undefined
     &&Math.abs(RDR.omGrid.cachedLat-_lat)<0.05&&Math.abs(RDR.omGrid.cachedLon-_lon)<0.05){
    _diag('OM grid: memory cache hit');cb();return;
  }
  // 2) localStorage cache — platnost 1 hodina
  try{
    var ckey=_omGridCacheKey(_lat,_lon);
    var cached=localStorage.getItem(ckey);
    if(cached){
      var obj=JSON.parse(cached);
      if(obj&&obj.ts&&(Date.now()-obj.ts)<1200000&&obj.points){ // 20 minut TTL
        RDR.omGrid={points:obj.points,cachedLat:_lat,cachedLon:_lon};
        _diag('OM grid: localStorage cache hit');cb();return;
      }
    }
  }catch(e){}
  // 15×15 = 225 bodů místo 400 — stejné pokrytí ~140×150km, 44% méně API volání
  var n=15,dlat=0.090,dlon=0.120,half=7;
  var lats=[],lons=[];
  for(var i=0;i<n;i++)for(var j=0;j<n;j++){
    lats.push((_lat+(i-half)*dlat).toFixed(4));
    lons.push((_lon+(j-half)*dlon).toFixed(4));
  }
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lats.join(',')
    +'&longitude='+lons.join(',')+'&hourly=precipitation&forecast_days=2&timezone=UTC';
  function _doFetch(attempt){
    fetch(url).then(function(r){
      if(r.status===429&&attempt<2){
        _diag('OM grid 429, retry in 4s');
        setTimeout(function(){_doFetch(attempt+1);},4000);return;
      }
      return r.json();
    }).then(function(d){
      if(!d)return; // retry pending
      if(Math.abs(RDR.lat-_lat)>0.1||Math.abs(RDR.lon-_lon)>0.1){_diag('OM grid: loc changed');return;}
      var pts=Array.isArray(d)?d:[d];
      RDR.omGrid={points:pts,cachedLat:_lat,cachedLon:_lon};
      _diag('OM grid: '+pts.length+' pts OK');
      // Uložit do localStorage (TTL 1h)
      try{localStorage.setItem(_omGridCacheKey(_lat,_lon),JSON.stringify({ts:Date.now(),points:pts}));}catch(e){}
      cb();
    }).catch(function(e){_diag('OM grid fail: '+e);RDR.omGrid=null;cb();});
  }
  _doFetch(0);
}

function _buildFrames(){
  if(!RDR.lat||!RDR.lon||isNaN(RDR.lat)||isNaN(RDR.lon))return[];
  var frames=[],now=Math.floor(Date.now()/1000);
  var useScand=_inScandinavia(RDR.lat,RDR.lon);
  var useUSA=_inUSA(RDR.lat,RDR.lon);

  // Radarové snímky z minulosti — 10min krok, 1.5h
  if(useScand||useUSA){
    for(var m=90;m>=0;m-=10){
      var t=Math.floor((now-m*60)/600)*600;
      (function(tt){
        frames.push({time:tt,type:'radar',label:_timeLabel(tt,now),
          src:useScand?'Met.no':'NOAA',
          layerFn:function(){return useScand?_metnoLayer(tt):_noaaLayer(tt);}
        });
      })(t);
    }
  }

  // Open-Meteo grid — hodinová předpověď (TEĎ → +12h, nebo +6h pro radarové zóny)
  if(RDR.omGrid&&RDR.omGrid.points.length){
    var refPt=RDR.omGrid.points[0];
    var times=refPt&&refPt.hourly&&refPt.hourly.time;
    if(times){
      var maxH=(useScand||useUSA)?6:12;
      for(var i=0;i<times.length;i++){
        var ft=Math.floor(new Date(times[i]).getTime()/1000);
        if(ft<now-1800)continue;
        if(ft>now+maxH*3600)break;
        (function(tt,ii){
          frames.push({time:tt,type:'fcst',label:_timeLabel(tt,now),
            src:'Open-Meteo',omTimeIdx:ii});
        })(ft,i);
      }
    }
  } else if(!useScand&&!useUSA){
    frames.push({time:now,type:'fcst',label:'Žádná data',src:'',omTimeIdx:0});
  }

  frames.sort(function(a,b){return a.time-b.time;});
  var seen={},out=[];
  frames.forEach(function(f){if(!seen[f.time]){seen[f.time]=1;out.push(f);}});
  return out;
}

// ── Preload Met.no PNG snímků ───────────────────────────────────────────────
function _preloadRadarFrames(onReady){
  _radarImgs={};
  var useScand=_inScandinavia(RDR.lat,RDR.lon);
  // NOAA WMS nepotřebuje preload — Leaflet načítá dlaždice sám
  if(!useScand){if(onReady)onReady();return;}
  var radarFs=[];
  RDR.frames.forEach(function(f,i){if(f.type==='radar')radarFs.push(i);});
  if(!radarFs.length){if(onReady)onReady();return;}
  var pending=radarFs.length,_done=false;
  var safetyT=setTimeout(function(){if(!_done){_done=true;if(onReady)onReady();}},8000);
  function finish(){if(--pending<=0&&!_done){_done=true;clearTimeout(safetyT);if(onReady)onReady();}}
  radarFs.forEach(function(i){
    var f=RDR.frames[i];
    var t5=Math.round(f.time/300)*300;
    var url='https://radarapi.met.no/api/get/skandinavia/reflectivity/image/'+_metnoFmt(t5);
    var obj={url:url,img:null,loaded:false,failed:false};
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){obj.loaded=true;finish();};
    img.onerror=function(){
      if(!obj._fb){obj._fb=true;
        img.src='https://api.met.no/weatherapi/radar/2.0/?area=nordic&type=reflectivity&content=image';
      }else{obj.failed=true;finish();}
    };
    img.src=url;obj.img=img;_radarImgs[i]=obj;
  });
}

// ── Preload NOAA tile layers — přidány na mapu s opacity 0 ─────────────────
function _preloadNOAAFrames(){
  // Odstraníme staré
  Object.keys(_noaaLayers).forEach(function(k){
    if(RDR.map&&RDR.map.hasLayer(_noaaLayers[k]))RDR.map.removeLayer(_noaaLayers[k]);
  });
  _noaaLayers={};
  // Přidáme nové vrstvy skrytě — dlaždice začnou načítat okamžitě
  RDR.frames.forEach(function(f,i){
    if(f.type==='radar'&&f.src==='NOAA'){
      var layer=_noaaLayer(f.time);
      layer.addTo(RDR.map);
      _noaaLayers[i]=layer;
    }
  });
  _diag('NOAA preloaded '+Object.keys(_noaaLayers).length+' frames');
}

// ── Hlavní životní cyklus ───────────────────────────────────────────────────
function radarOpen(){
  if(!WD||!WD.latitude||!WD.longitude)return;
  var _rbtn=document.getElementById('radarBtn');
  if(_rbtn&&_rbtn.disabled)return; // šedé tlačítko — bez pokrytí
  RDR.lat=parseFloat(WD.latitude);RDR.lon=parseFloat(WD.longitude);
  if(isNaN(RDR.lat)||isNaN(RDR.lon))return;
  document.getElementById('radarOverlay').style.display='flex';
  RDR.open=true;
  RDR._fcstZoomed=false;
  RDR.frames=[];_radarImgs={};
  // Smazat OM grid cache jen pokud se lokalita výrazně změnila (>~5km)
  if(!RDR.omGrid||!RDR.omGrid.cachedLat
     ||Math.abs(RDR.omGrid.cachedLat-RDR.lat)>0.05||Math.abs(RDR.omGrid.cachedLon-RDR.lon)>0.05){
    RDR.omGrid=null;
  }
  Object.keys(_noaaLayers).forEach(function(k){
    if(RDR.map&&RDR.map.hasLayer(_noaaLayers[k]))RDR.map.removeLayer(_noaaLayers[k]);
  });
  _noaaLayers={};
  if(RDR.radarLayer&&RDR.map){RDR.map.removeLayer(RDR.radarLayer);RDR.radarLayer=null;}
  if(_omCanvas)_omCanvas.hide();
  // Zoom nastavíme podle zóny v radarInit; tady resetujeme na výchozí radar zoom
  if(RDR.map){RDR.map.setMinZoom(3);RDR.map.setView([RDR.lat,RDR.lon],9);}
  setTimeout(radarInit,50);
}
function radarClose(){
  document.getElementById('radarOverlay').style.display='none';
  RDR.open=false;radarStop();
}
function radarInit(){
  if(!RDR.lat||!RDR.lon||isNaN(RDR.lat)||isNaN(RDR.lon)){_diag('radarInit: no valid coords');return;}
  var el=document.getElementById('leafletMap');
  if(!el.offsetWidth){setTimeout(radarInit,50);return;}
  if(!RDR.map){
    RDR.map=L.map('leafletMap',{zoomControl:true,attributionControl:true})
      .setView([RDR.lat,RDR.lon],RDR.zoom);
    RDR.tileLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains:'abcd',maxZoom:19
    }).addTo(RDR.map);
    RDR.tileLayer.setOpacity(_mapOpacity);
    var useM=!(activeLang&&activeLang.units&&activeLang.units.dist==='mi');
    L.control.scale({imperial:!useM,metric:useM,position:'bottomright'}).addTo(RDR.map);
    _ensureOMGridLayer();
    _omCanvas=new L.OMGridLayer();
    _omCanvas.addTo(RDR.map);
    radarBuildLegend();
  } else {
    RDR.map.setView([RDR.lat,RDR.lon],RDR.zoom);
    if(!_omCanvas||!RDR.map.hasLayer(_omCanvas)){
      _ensureOMGridLayer();
      _omCanvas=new L.OMGridLayer();
      _omCanvas.addTo(RDR.map);
    }
  }
  document.getElementById('radarTimeLabel').textContent='Načítám…';
  _diag('radarInit loc='+(RDR.lat||0).toFixed(2)+','+(RDR.lon||0).toFixed(2)
    +' scand='+_inScandinavia(RDR.lat,RDR.lon)+' usa='+_inUSA(RDR.lat,RDR.lon));
  _fetchOMGrid(function(){
    var useScand=_inScandinavia(RDR.lat,RDR.lon);
    var useUSA=_inUSA(RDR.lat,RDR.lon);
    RDR.frames=_buildFrames();
    if(!RDR.frames.length){document.getElementById('radarTimeLabel').textContent='Žádná data';return;}
    var now=Date.now()/1000,best=0,bestD=Infinity;
    RDR.frames.forEach(function(f,i){var d=Math.abs(f.time-now);if(d<bestD){bestD=d;best=i;}});
    RDR.frameIdx=best;
    var note=document.getElementById('radarDataNote');
    if(useScand||useUSA){
      if(note)note.style.display='none';
      // Radar zóna: volný zoom od 3
      RDR.map.setMinZoom(3);
      document.getElementById('radarTimeLabel').textContent='Načítám radar…';
      if(useScand){
        _preloadRadarFrames(function(){radarShowFrame(RDR.frameIdx);});
      }else{
        _preloadNOAAFrames();
        radarShowFrame(RDR.frameIdx);
      }
    }else{
      // Forecast-only zone — přiblížíme na ~70km (zoom 9) a zamkneme oddálení
      if(note){note.style.display='inline';note.textContent='⚠ Radar nedostupný · NWP model';}
      RDR.map.setMinZoom(9);
      RDR.map.setView([RDR.lat,RDR.lon],9,{animate:false});
      radarShowFrame(RDR.frameIdx);
    }
  });
}

function _diag(msg){if(window._radarDebug)console.log("[radar]",msg);}

function radarShowFrame(idx){
  if(!RDR.map||!RDR.frames.length)return;
  var f=RDR.frames[idx];
  RDR.frameIdx=idx;

  if(f.type==='radar'){
    if(_omCanvas)_omCanvas.hide();
    var useScand=_inScandinavia(RDR.lat,RDR.lon);
    if(useScand){
      var obj=_radarImgs[idx];
      if(obj&&!obj.failed){
        _ensureMetnoLayer();
        var layer=new L.MetnoRadar(
          {opacity:_precipOpacity,urls:[obj.img?obj.img.src:obj.url],cachedImg:obj.loaded?obj.img:null});
        if(RDR.radarLayer){RDR.map.removeLayer(RDR.radarLayer);RDR.radarLayer=null;}
        layer.addTo(RDR.map);RDR.radarLayer=layer;
      }
    } else {
      // NOAA: pouze přepínáme opacity (vrstvy jsou pre-added)
      Object.keys(_noaaLayers).forEach(function(k){
        _noaaLayers[k].setOpacity(parseInt(k)===idx?_precipOpacity:0);
      });
    }
  } else {
    if(RDR.radarLayer){RDR.map.removeLayer(RDR.radarLayer);RDR.radarLayer=null;}
    Object.keys(_noaaLayers).forEach(function(k){_noaaLayers[k].setOpacity(0);});
    if(_omCanvas&&RDR.omGrid&&RDR.omGrid.points){
      // Compute bounding box of the forecast grid
      var pts=RDR.omGrid.points;
      var bbox={n:-90,s:90,w:180,e:-180};
      pts.forEach(function(p){
        if(p.latitude>bbox.n)bbox.n=p.latitude;
        if(p.latitude<bbox.s)bbox.s=p.latitude;
        if(p.longitude<bbox.w)bbox.w=p.longitude;
        if(p.longitude>bbox.e)bbox.e=p.longitude;
      });
      // Add small padding
      var padLat=0.08,padLon=0.10;
      bbox.n+=padLat;bbox.s-=padLat;bbox.w-=padLon;bbox.e+=padLon;
      // Auto-fit map to forecast bbox (only once per forecast sequence to avoid jitter)
      if(!RDR._fcstZoomed){
        RDR._fcstZoomed=true;
        try{RDR.map.fitBounds([[bbox.s,bbox.w],[bbox.n,bbox.e]],{animate:true,maxZoom:10});}catch(e){}
      }
      _omCanvas.show(pts,f.omTimeIdx||0,bbox);
    } else if(_omCanvas){
      _omCanvas.hide();
    }
  }

  radarUpdateUI();
}

function radarBuildLegend(){
  var el=document.getElementById('radarLegend');
  if(!el)return;
  var stops=[{c:'#aaddff',l:'<0.1'},{c:'#55aaff',l:'0.1'},{c:'#00cc00',l:'0.5'},
    {c:'#ffee00',l:'2'},{c:'#ff8800',l:'5'},{c:'#ff2200',l:'10'},{c:'#cc00cc',l:'20+'}];
  el.innerHTML='<span style="margin-right:2px;color:#4a8060">mm/h:</span>'
    +stops.map(function(s){
      return '<span style="display:inline-flex;align-items:center;gap:1px">'
        +'<span style="width:10px;height:9px;background:'+s.c+';border-radius:1px;display:inline-block"></span>'
        +'<span style="font-size:7px;color:#70b080">'+s.l+'</span></span>';
    }).join('');
}

function radarDrawTimeAxis(){
  var el=document.getElementById('radarTimeAxis');
  if(!el||!RDR.frames.length)return;
  var W=el.offsetWidth||300,H=36,n=RDR.frames.length;
  var t0=RDR.frames[0].time,t1=RDR.frames[n-1].time,sp=Math.max(1,t1-t0);
  var now=Date.now()/1000;
  var nx=Math.round((now-t0)/sp*(W-4)+2);
  // find where forecast zone starts
  var fcstStart=-1;
  for(var fi=0;fi<n;fi++){if(RDR.frames[fi].type==='fcst'){fcstStart=fi;break;}}
  var fcstX=fcstStart>=0?(n>1?Math.round(fcstStart/(n-1)*(W-4)+2):W):W;

  var s='<svg width="'+W+'" height="'+H+'" style="display:block">';
  // Radar zone background
  if(fcstX>2)s+='<rect x="2" y="20" width="'+(fcstX-2)+'" height="9" fill="rgba(0,100,200,0.28)" rx="1"/>';
  // Forecast zone background + top border
  if(fcstX<W-2){
    s+='<rect x="'+fcstX+'" y="20" width="'+(W-fcstX-2)+'" height="9" fill="rgba(0,150,60,0.22)" rx="1"/>';
    s+='<rect x="'+fcstX+'" y="18" width="'+(W-fcstX-2)+'" height="2" fill="rgba(0,200,80,0.35)"/>';
    // "PŘEDPOVĚĎ" label in forecast zone
    var labelX=Math.round((fcstX+(W-2))/2);
    s+='<text x="'+labelX+'" y="14" fill="rgba(80,200,110,0.85)" font-size="7" text-anchor="middle" font-weight="bold">'+T('forecast')+'</text>';
    // small OM label
    s+='<text x="'+fcstX+'" y="14" fill="rgba(80,180,100,0.55)" font-size="6" text-anchor="start" dx="2">OM</text>';
  }
  // Hour ticks
  for(var t=Math.ceil(t0/3600)*3600;t<=t1;t+=3600){
    var x=Math.round((t-t0)/sp*(W-4)+2);
    if(x<4||x>W-4)continue;
    var d=new Date(t*1000);
    s+='<line x1="'+x+'" y1="16" x2="'+x+'" y2="29" stroke="#2a5a3a" stroke-width="1"/>';
    s+='<text x="'+x+'" y="10" fill="#4aaa6a" font-size="8" text-anchor="middle">'+String(d.getHours()).padStart(2,'0')+'h</text>';
  }
  // Now line
  if(nx>2&&nx<W-2)s+='<line x1="'+nx+'" y1="0" x2="'+nx+'" y2="'+H+'" stroke="#60e880" stroke-width="1.5" stroke-dasharray="2,2"/>';
  // Frame marker
  var fx=n>1?Math.round(RDR.frameIdx/(n-1)*(W-4)+2):2;
  s+='<line x1="'+fx+'" y1="0" x2="'+fx+'" y2="'+H+'" stroke="#c0ffd8" stroke-width="2.5"/>';
  s+='</svg>';
  el.innerHTML=s;
}

function radarUpdateUI(){
  if(!RDR.frames.length)return;
  var f=RDR.frames[RDR.frameIdx];
  var isRadar=(f.type==='radar');
  var src=f.src?(' ['+f.src+']'):'';
  var lbl=document.getElementById('radarTimeLabel');
  lbl.textContent=f.label+src;
  lbl.style.color=isRadar?'#60e880':'#e09040';
  var note=document.getElementById('radarDataNote');
  if(note)note.style.display=isRadar?'none':'inline';
  document.getElementById('radarProgress').style.width=
    (RDR.frameIdx/Math.max(1,RDR.frames.length-1)*100)+'%';
  radarDrawTimeAxis();
}

// Timeline seek - click + touch drag
(function(){
  var tl=document.getElementById('radarTimeline');
  var ax=document.getElementById('radarTimeAxis');

  function seek(clientX,el){
    if(!RDR.frames.length)return;
    var r=el.getBoundingClientRect();
    var pct=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    var idx=Math.round(pct*(RDR.frames.length-1));
    radarStop();radarShowFrame(idx);
  }

  [tl,ax].forEach(function(el){
    el.addEventListener('click',function(e){seek(e.clientX,el);});
    el.addEventListener('touchstart',function(e){
      e.preventDefault();
      seek(e.touches[0].clientX,el);
    },{passive:false});
    el.addEventListener('touchmove',function(e){
      e.preventDefault();
      seek(e.touches[0].clientX,el);
    },{passive:false});
  });
})();
function radarPlay(){
  if(RDR.playing){radarStop();return;}
  if(!RDR.frames.length)return;
  RDR.playing=true;
  document.getElementById('radarPlayBtn').textContent='⏸';
  radarShowFrame(RDR.frameIdx);
  radarScheduleNext();
}
function radarStop(){RDR.playing=false;if(RDR.playTimer)clearTimeout(RDR.playTimer);document.getElementById('radarPlayBtn').textContent='▶';}
function radarScheduleNext(){
  if(!RDR.playing)return;
  var delay=RDR.frameIdx===RDR.frames.length-1?1800:_radarSpeed;
  RDR.playTimer=setTimeout(radarStep,delay);
}
function radarStep(){if(!RDR.playing)return;RDR.frameIdx=(RDR.frameIdx+1)%RDR.frames.length;radarShowFrame(RDR.frameIdx);var delay=RDR.frameIdx===RDR.frames.length-1?1800:_radarSpeed;
  // Pokud je vrstva ještě nenačtena, počkej déle
  if(RDR.radarLayer&&RDR.radarLayer._img&&!RDR.radarLayer._img.complete)delay=Math.max(delay,600);
  RDR.playTimer=setTimeout(radarStep,delay);}

function radarSetMapOpacity(v){
  _mapOpacity=v/100;
  if(RDR.tileLayer)RDR.tileLayer.setOpacity(_mapOpacity);
}
function radarSetPrecipOpacity(v){
  _precipOpacity=v/100;
  if(RDR.radarLayer&&RDR.radarLayer.setOpacity)RDR.radarLayer.setOpacity(_precipOpacity);
  Object.keys(_noaaLayers).forEach(function(k){
    if(_noaaLayers[k]&&_noaaLayers[k]._map)_noaaLayers[k].setOpacity(parseInt(k)===RDR.frameIdx?_precipOpacity:0);
  });
  if(_omCanvas&&_omCanvas.setOpacity)_omCanvas.setOpacity(_precipOpacity);
}
document.getElementById('radarPlayBtn').addEventListener('click',radarPlay);
document.getElementById('radarClose').addEventListener('click',radarClose);
document.getElementById('radarRefresh').addEventListener('click',function(){
  // Smazat cache pro aktuální lokalitu a znovu načíst
  radarStop();
  try{
    var ckey=_omGridCacheKey(RDR.lat,RDR.lon);
    localStorage.removeItem(ckey);
  }catch(e){}
  RDR.omGrid=null; // invalidovat in-memory cache
  RDR.frames=[];_radarImgs={};
  Object.keys(_noaaLayers).forEach(function(k){
    if(RDR.map&&RDR.map.hasLayer(_noaaLayers[k]))RDR.map.removeLayer(_noaaLayers[k]);
  });
  _noaaLayers={};
  if(RDR.radarLayer){RDR.map.removeLayer(RDR.radarLayer);RDR.radarLayer=null;}
  if(_omCanvas)_omCanvas.hide();
  document.getElementById('radarTimeLabel').textContent='Obnovuji…';
  setTimeout(radarInit,50);
});
document.getElementById('radarBtn').addEventListener('click',radarOpen);
document.getElementById('radarSpeed05x').addEventListener('click',function(){radarSetSpeed(1000);});
document.getElementById('radarSpeed1x').addEventListener('click',function(){radarSetSpeed(500);});
document.getElementById('radarSpeed2x').addEventListener('click',function(){radarSetSpeed(250);});
document.getElementById('mapOpacitySlider').addEventListener('input',function(){radarSetMapOpacity(parseInt(this.value));});
document.getElementById('radarOpacitySlider').addEventListener('input',function(){radarSetPrecipOpacity(parseInt(this.value));});

document.getElementById('gpsBtn').addEventListener('click',useGPS);
document.getElementById('langBtn').addEventListener('click',openLang);
document.getElementById('goBtn').addEventListener('click',useCoords);
document.getElementById('fontBtn').addEventListener('click',cycleFontSize);
document.getElementById('langClose').addEventListener('click',closeLang);
document.getElementById('extraClose').addEventListener('click',closeExtraPopup);
document.getElementById('extraOK').addEventListener('click',applyExtras);
document.getElementById('cloudModeBtn').addEventListener('click',function(){
  cloudMode=cloudMode==='A'?'B':'A';localStorage.setItem('cloudMode',cloudMode);
  document.getElementById('cloudModeBtn').textContent=cloudMode==='A'?'A/B':'B/A';
  if(WD)draw();
});
document.getElementById('extraGraphsBtn').addEventListener('click',openExtraPopup);

// ══ STARTUP ════════════════════════════════════════════
applyLang();
renderLayerBar();
renderRecentChips();
window.addEventListener('load',function(){
  var last=localStorage.getItem('lastLocation');
  if(last){try{var loc=JSON.parse(last);cityQ.value=loc.name;loadWeather(loc.lat,loc.lon,loc.name);}catch(e){}}
});
