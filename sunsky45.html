// ══ SKY + SUN/MOON CURVE ══════════════════════════════
function drawSkyAndSunMoon(L,idxs,xOf,cTop,cBot,bgAlpha){
  if(!WD)return;
  var daily=WD.daily||{};
  var W=cssW();
  var hasSunData=!!(daily.sunrise&&daily.sunrise.length);
  var opa=bgAlpha!==undefined?bgAlpha:1.0; // opacity multiplier for sky

  // Sun altitude: returns -1..1, properly continuous across days
  function getSunAlt(timeMs){
    if(!hasSunData)return -1;
    // Find bracketing rise/set
    for(var di=0;di<daily.sunrise.length;di++){
      var rise=new Date(daily.sunrise[di]).getTime();
      var set=new Date(daily.sunset[di]).getTime();
      var dayLen=set-rise;
      if(dayLen<=0)continue;
      var prevSet=di>0?new Date(daily.sunset[di-1]).getTime():rise-43200000;
      var nextRise=di<daily.sunrise.length-1?new Date(daily.sunrise[di+1]).getTime():set+43200000;
      if(timeMs>=rise&&timeMs<=set){
        // Daytime: sine arch 0→1→0
        return Math.sin(Math.PI*(timeMs-rise)/dayLen);
      }
      if(timeMs>=prevSet&&timeMs<rise){
        // Night before: -1 dip shaped as negative cosine
        var nightLen=rise-prevSet;
        var t=(timeMs-prevSet)/nightLen; // 0..1
        return -Math.sin(Math.PI*t); // 0 → -1 → 0
      }
    }
    // Last night after last set
    var lastSet=new Date(daily.sunset[daily.sunset.length-1]).getTime();
    if(timeMs>lastSet){
      var t2=Math.min(1,(timeMs-lastSet)/43200000);
      return -Math.sin(Math.PI*t2);
    }
    return -1;
  }

  // Moon altitude: proper astronomical calculation
  function getMoonAlt(timeMs){
    var d=(timeMs/86400000)-10957.5;
    var Lv=125.1228-0.0529538083*d;
    var Mv=115.3654+13.0649929509*d;
    var Mrad=Mv*Math.PI/180;
    var moonLon=218.316+13.176396*d+6.289*Math.sin(Mrad);
    var moonLat=5.128*Math.sin((Lv+moonLon)*Math.PI/180);
    var eps=23.439*Math.PI/180;
    var lRad=moonLon*Math.PI/180,bRad=moonLat*Math.PI/180;
    var ra=Math.atan2(Math.sin(lRad)*Math.cos(eps)-Math.tan(bRad)*Math.sin(eps),Math.cos(lRad));
    var dec=Math.asin(Math.sin(bRad)*Math.cos(eps)+Math.cos(bRad)*Math.sin(eps)*Math.sin(lRad));
    var lat=WD.latitude||50,lon=WD.longitude||15;
    var gmst=(280.46061837+360.98564736629*(timeMs/86400000-10957.5))*Math.PI/180;
    var lst=gmst+lon*Math.PI/180;
    var H=lst-ra;
    var latR=lat*Math.PI/180;
    var alt=Math.asin(Math.sin(latR)*Math.sin(dec)+Math.cos(latR)*Math.cos(dec)*Math.cos(H));
    return alt/(Math.PI/2); // -1..1
  }

  // Moon phase icon from date
  var refNM=new Date('2000-01-06T18:14:00Z').getTime(),lunarMs=29.530588853*24*3600*1000;
  var MOON_ICOS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  function moonPhaseIco(t){
    var ph=((t-refNM)%lunarMs+lunarMs)%lunarMs/lunarMs;
    if(ph<0.04||ph>0.96)return MOON_ICOS[0];if(ph<0.23)return MOON_ICOS[1];
    if(ph<0.27)return MOON_ICOS[2];if(ph<0.48)return MOON_ICOS[3];
    if(ph<0.52)return MOON_ICOS[4];if(ph<0.73)return MOON_ICOS[5];
    if(ph<0.77)return MOON_ICOS[6];return MOON_ICOS[7];
  }

  // ── Sky gradient: per-column, smooth twilight transition ──
  // Civil twilight ≈ 30 min, nautical ≈ 60 min, astronomical ≈ 90 min
  var cellW=(W-L.pL-L.pR)/Math.max(1,idxs.length-1);
  for(var i=0;i<idxs.length;i++){
    var tMs=new Date(WD.hourly.time[idxs[i]]).getTime();
    var x=xOf(i),x0b=i===0?L.pL:x-cellW/2,x1b=i===idxs.length-1?W-L.pR:x+cellW/2;
    var sa=getSunAlt(tMs); // -1..1 continuous

    // Map sun altitude to sky colour:
    // sa>=0: blue day  (sa=1 → bright blue, sa=0 → horizon blue)
    // sa in -0.2..0: civil twilight → deep blue-purple
    // sa in -0.4..-0.2: nautical twi → dark blue
    // sa<-0.4: night → near black
    var t=Math.max(0,Math.min(1,sa));  // 0..1 for daytime
    var tw=Math.max(0,Math.min(1,(sa+0.5)/0.5)); // 0..1 over full twilight zone

    var rT,gT,bT,rB,gB,bB,aT,aB;
    if(sa>=0){
      rT=Math.round(20+t*80);gT=Math.round(80+t*100);bT=Math.round(200+t*50);
      rB=Math.round(40+t*80);gB=Math.round(110+t*90);bB=Math.round(210+t*30);
      aT=0.90*opa;aB=0.70*opa;
    } else if(sa>=-0.5){
      var tw2=Math.max(0,(sa+0.5)/0.5);
      rT=Math.round(5+tw2*18);gT=Math.round(8+tw2*40);bT=Math.round(20+tw2*130);
      rB=Math.round(8+tw2*25);gB=Math.round(12+tw2*55);bB=Math.round(25+tw2*120);
      aT=(0.92+tw2*0.02)*opa;aB=(0.85+tw2*0.05)*opa;
    } else {
      rT=5;gT=8;bT=20;rB=8;gB=12;bB=30;aT=0.95*opa;aB=0.90*opa;
    }
    var sg=CX.createLinearGradient(0,cTop,0,cBot);
    sg.addColorStop(0,'rgba('+rT+','+gT+','+bT+','+aT+')');
    sg.addColorStop(1,'rgba('+rB+','+gB+','+bB+','+aB+')');
    CX.fillStyle=sg;CX.fillRect(x0b,cTop,x1b-x0b,cBot-cTop);
  }

  // ── Curve geometry ──
  var chartH=cBot-cTop;
  // km-to-y helper (same as in cloud drawing)
  function kmToYcurve(km){return cBot-(km/10)*chartH;}
  var km10y=kmToYcurve(10); // y position of 10km line = cTop
  var km65y=kmToYcurve(6.5); // y position of 6.5km line
  var highBandH=km65y-km10y;

  // Sun: icon peaks sit just below the 10km line
  // sunBase = horizon crossing point (sa=0), sunAmp = half-height of curve
  var icoFs=Math.max(11,chartFS()+1);
  var iconRoom=icoFs*1.1; // space for icon above peak
  var sunPeakY=km10y+iconRoom+4; // where noon sun peak sits (below icon)
  var sunAmp=Math.max(5,highBandH*0.22); // small amplitude
  var sunBase=sunPeakY+sunAmp; // sa=0 baseline (horizon)

  // Moon: just below sun's lowest point
  var moonAmp=sunAmp*0.7;
  var moonBase=sunBase+sunAmp+moonAmp+2;

  // Build point arrays
  var allSunPts=[],allMoonPts=[];
  for(var i=0;i<idxs.length;i++){
    var tMs=new Date(WD.hourly.time[idxs[i]]).getTime(),x=xOf(i);
    var sa=getSunAlt(tMs);
    var sunY=sunBase-sa*sunAmp;
    allSunPts.push({x:x,y:sunY,alt:sa,above:sa>=0,t:tMs});
    var ma=getMoonAlt(tMs);
    var moonY=moonBase-ma*moonAmp;
    allMoonPts.push({x:x,y:moonY,alt:ma,above:ma>0,t:tMs});
  }

  // Draw a curve splitting into solid/dashed segments (continuous, no gaps)
  function drawCurve(pts,solidColor,dashColor,lw){
    CX.save();
    // Draw full curve as dashed first, then overlay solid where above horizon
    CX.strokeStyle=dashColor;CX.lineWidth=lw;CX.setLineDash([4,5]);
    CX.beginPath();pts.forEach(function(p,i){if(i===0)CX.moveTo(p.x,p.y);else CX.lineTo(p.x,p.y);});
    CX.stroke();
    // Overlay solid segments where above horizon
    CX.setLineDash([]);CX.strokeStyle=solidColor;CX.lineWidth=lw;
    var inSeg=false;
    pts.forEach(function(p){
      if(p.above){if(!inSeg){CX.beginPath();CX.moveTo(p.x,p.y);inSeg=true;}else CX.lineTo(p.x,p.y);}
      else{if(inSeg){CX.stroke();inSeg=false;}}
    });
    if(inSeg)CX.stroke();
    CX.setLineDash([]);CX.restore();
  }

  drawCurve(allSunPts,'rgba(255,225,45,0.95)','rgba(255,210,30,0.42)',2);
  drawCurve(allMoonPts,'rgba(215,228,255,0.88)','rgba(200,215,255,0.44)',1.5);

  // ── Icons & labels ──
  CX.save();
  var afs=Math.max(7,chartFS()-1);
  // icoFs defined above in geometry section

  // Sun icon at every daily noon peak
  var abovePts=allSunPts.filter(function(p){return p.above;});
  var sunPeaks=[];
  for(var i=1;i<abovePts.length-1;i++){
    if(abovePts[i].alt>=abovePts[i-1].alt&&abovePts[i].alt>=abovePts[i+1].alt&&abovePts[i].alt>0.5){
      var dup=sunPeaks.some(function(p){return Math.abs(p.x-abovePts[i].x)<(cssW()/8);});
      if(!dup)sunPeaks.push(abovePts[i]);
    }
  }
  if(!sunPeaks.length&&abovePts.length)sunPeaks=[abovePts.reduce(function(a,b){return a.alt>b.alt?a:b;})];
  sunPeaks.forEach(function(pk){
    CX.font=icoFs+'px sans-serif';CX.textAlign='center';
    CX.shadowColor='rgba(255,200,0,0.9)';CX.shadowBlur=8;
    CX.fillStyle='rgba(255,220,0,1.0)';
    CX.fillText('☀',pk.x,pk.y-icoFs*0.8); // plain sun char renders yellow
    CX.shadowBlur=0;
  });

  // Sunrise/sunset time labels near curve
  if(hasSunData){
    function nearX(ms){var b=null,bd=Infinity;idxs.forEach(function(idx,ii){var d=Math.abs(new Date(WD.hourly.time[idx]).getTime()-ms);if(d<bd){bd=d;b=xOf(ii);}});return b;}
    daily.sunrise.forEach(function(sr,di){
      var rx=nearX(new Date(sr).getTime());
      if(rx!==null&&rx>L.pL+10&&rx<W-L.pR-10){
        var closest=allSunPts.reduce(function(a,b){return Math.abs(a.x-rx)<Math.abs(b.x-rx)?a:b;});
        var tr=new Date(sr),lb=String(tr.getHours()).padStart(2,'0')+':'+String(tr.getMinutes()).padStart(2,'0');
        CX.font='bold '+afs+'px sans-serif';CX.fillStyle='rgba(255,220,80,0.95)';CX.textAlign='center';
        CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
        CX.fillText('↑'+lb,rx,closest.y-afs-1);CX.shadowBlur=0;
      }
      if(daily.sunset&&daily.sunset[di]){
        var sx=nearX(new Date(daily.sunset[di]).getTime());
        if(sx!==null&&sx>L.pL+10&&sx<W-L.pR-10){
          var closest2=allSunPts.reduce(function(a,b){return Math.abs(a.x-sx)<Math.abs(b.x-sx)?a:b;});
          var ts=new Date(daily.sunset[di]),ls=String(ts.getHours()).padStart(2,'0')+':'+String(ts.getMinutes()).padStart(2,'0');
          CX.font='bold '+afs+'px sans-serif';CX.fillStyle='rgba(255,200,60,0.95)';CX.textAlign='center';
          CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
          CX.fillText('↓'+ls,sx,closest2.y-afs-1);CX.shadowBlur=0;
        }
      }
    });
  }

  // Moon icon at every visible peak
  var aboveMoon=allMoonPts.filter(function(p){return p.above;});
  var moonPeaks=[];
  for(var i=1;i<aboveMoon.length-1;i++){
    if(aboveMoon[i].alt>=aboveMoon[i-1].alt&&aboveMoon[i].alt>=aboveMoon[i+1].alt&&aboveMoon[i].alt>0.1){
      var dup2=moonPeaks.some(function(p){return Math.abs(p.x-aboveMoon[i].x)<(cssW()/6);});
      if(!dup2)moonPeaks.push(aboveMoon[i]);
    }
  }
  if(!moonPeaks.length&&aboveMoon.length>=2)moonPeaks=[aboveMoon.reduce(function(a,b){return a.alt>b.alt?a:b;})];
  moonPeaks.forEach(function(mp){
    CX.font=icoFs+'px sans-serif';CX.textAlign='center';
    CX.shadowColor='rgba(0,0,0,0.8)';CX.shadowBlur=3;
    CX.fillText(moonPhaseIco(mp.t),mp.x,mp.y-icoFs*0.8);CX.shadowBlur=0;
  });
  if(!moonPeaks.length){
    for(var i=0;i<idxs.length;i++){
      if(new Date(WD.hourly.time[idxs[i]]).getHours()===0){
        CX.font=icoFs+'px sans-serif';CX.textAlign='center';
        CX.shadowColor='rgba(0,0,0,0.8)';CX.shadowBlur=3;
        CX.fillText(moonPhaseIco(new Date(WD.hourly.time[idxs[i]]).getTime()),xOf(i),moonBase-icoFs);
        CX.shadowBlur=0;break;
      }
    }
  }
  CX.restore();
}

// Cloud "fluffy" shading over sky
function drawCloudShading(L,idxs,clCover,xOf,cTop,cBot,seed){
  var W=cssW();
  var cellW=(W-L.pL-L.pR)/Math.max(1,idxs.length-1);
  // Simple deterministic "random" for puff positions
  function rng(n){return((n*1664525+1013904223)&0x7fffffff)/0x7fffffff;}
  CX.save();
  for(var i=0;i<clCover.length;i++){
    var pct=Math.min(100,Math.max(0,clCover[i]||0))/100;
    if(pct<0.05)continue;
    var cx=xOf(i);
    var bandW=Math.max(cellW*0.9,4);
    // Number of puffs proportional to coverage
    var nPuffs=Math.round(pct*5)+1;
    var s=seed*1000+i;
    for(var p=0;p<nPuffs;p++){
      var px=cx+(rng(s+p*7)-0.5)*bandW*0.85;
      var py=cTop+(rng(s+p*13+3))*(cBot-cTop)*0.85+0.05*(cBot-cTop);
      var rx=bandW*(0.25+rng(s+p*17+5)*0.35)*pct;
      var ry=rx*(0.4+rng(s+p*23+7)*0.35);
      var alpha=0.18+pct*0.38;
      var gr=CX.createRadialGradient(px,py,0,px,py,Math.max(rx,ry));
      gr.addColorStop(0,'rgba(255,255,255,'+(alpha+0.2)+')');
      gr.addColorStop(0.5,'rgba(240,245,250,'+alpha+')');
      gr.addColorStop(1,'rgba(220,228,236,0)');
      CX.save();
      CX.translate(px,py);CX.scale(1,ry/Math.max(rx,1));CX.translate(-px,-py);
      CX.beginPath();CX.arc(px,py,Math.max(rx,2),0,Math.PI*2);
      CX.fillStyle=gr;CX.fill();
      CX.restore();
    }
  }
  CX.restore();
}

// ══ CLOUD A ════════════════════════════════════════════
function drawCloud(L,idxs,h,xOf,cTop,cBot,split){
  var cloudTop=cTop+4,cloudBot=cBot;
  function kmToY(km){return cloudBot-(km/10)*(cloudBot-cloudTop);}

  // Sky background with day/night + sun/moon curves
  drawSkyAndSunMoon(L,idxs,xOf,cloudTop,cloudBot);

  CX.save();
  drawCloudIcons(cloudTop,cloudBot,L.pL);
  var cafs=Math.max(7,chartFS()-1);
  [0,2,6.5,10].forEach(function(km){
    var y=kmToY(km);CX.strokeStyle='rgba(255,255,255,0.15)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(cssW()-L.pR,y);CX.stroke();
    var distVal=convDist(km),distStr=distVal===0?'0'+U('dist'):distVal+U('dist');
    CX.textAlign='right';axisText(distStr,L.pL-2,y+cafs/2,'#a0c8e8',true,cafs);
  });

  var clH=idxs.map(function(i){return h.cloud_cover_high[i];});
  var clM=idxs.map(function(i){return h.cloud_cover_mid[i];});
  var clL=idxs.map(function(i){return h.cloud_cover_low[i];});
  var clT=idxs.map(function(i){return h.cloud_cover[i];});

  // Fluffy cloud shading per layer
  var clHsub=idxs.map(function(i){return h.cloud_cover_high[i]||0;});
  var clMsub=idxs.map(function(i){return h.cloud_cover_mid[i]||0;});
  var clLsub=idxs.map(function(i){return h.cloud_cover_low[i]||0;});

  // Cloud A: filled area curve per band (původní varianta A)
  function drawBandArea(data,yTop,yBot,alpha){
    CX.save();
    var grad=CX.createLinearGradient(0,yTop,0,yBot);
    grad.addColorStop(0,'rgba(255,255,255,'+alpha+')');
    grad.addColorStop(1,'rgba(200,215,230,'+(alpha*0.5)+')');
    CX.beginPath();
    var started=false;
    for(var i=0;i<data.length;i++){
      var pct=Math.min(100,Math.max(0,data[i]||0))/100;
      var y=yBot-pct*(yBot-yTop),x=xOf(i);
      if(!started){CX.moveTo(x,yBot);CX.lineTo(x,y);started=true;}
      else CX.lineTo(x,y);
    }
    CX.lineTo(xOf(data.length-1),yBot);
    CX.closePath();CX.fillStyle=grad;CX.fill();
    // outline curve
    CX.beginPath();started=false;
    for(var i=0;i<data.length;i++){
      var pct=Math.min(100,Math.max(0,data[i]||0))/100;
      var y=yBot-pct*(yBot-yTop),x=xOf(i);
      if(!started){CX.moveTo(x,y);started=true;}else CX.lineTo(x,y);
    }
    CX.strokeStyle='rgba(255,255,255,'+(alpha*0.7)+')';CX.lineWidth=1;CX.stroke();
    CX.restore();
  }

  // Clip per band and draw area only (no puff overlay)
  CX.save();
  CX.beginPath();CX.rect(L.pL,kmToY(10),cssW()-L.pL-L.pR,kmToY(6.5)-kmToY(10));CX.clip();
  drawBandArea(clHsub,kmToY(10),kmToY(6.5),0.45);
  CX.restore();
  CX.save();
  CX.beginPath();CX.rect(L.pL,kmToY(6.5),cssW()-L.pL-L.pR,kmToY(2)-kmToY(6.5));CX.clip();
  drawBandArea(clMsub,kmToY(6.5),kmToY(2),0.55);
  CX.restore();
  CX.save();
  CX.beginPath();CX.rect(L.pL,kmToY(2),cssW()-L.pL-L.pR,kmToY(0)-kmToY(2));CX.clip();
  drawBandArea(clLsub,kmToY(2),kmToY(0),0.65);
  CX.restore();

  // maxima/minima per band
  function drawCloudBandLabels(data,yTop,yBot,col){
    var lfs=Math.max(7,chartFS()-1);var placed=[];var minD=lfs*3;
    CX.save();CX.textAlign='center';
    for(var i=1;i<data.length-1;i++){
      var v=data[i],p=data[i-1],n=data[i+1];if(v==null)continue;
      var isMax=v>=p&&v>=n&&v>p+2;var isMin=v<=p&&v<=n&&v<p-2;
      if(!isMax&&!isMin)continue;
      var bx=xOf(i),by=yBot-Math.min(100,Math.max(0,v))/100*(yBot-yTop);
      var ly=isMax?by-3:by+lfs+2;
      ly=Math.max(yTop+lfs,Math.min(yBot-2,ly));
      if(placed.some(function(q){return Math.hypot(q.x-bx,q.y-ly)<minD;}))continue;
      placed.push({x:bx,y:ly});
      CX.font='bold '+lfs+'px sans-serif';
      CX.shadowColor='rgba(4,10,22,0.95)';CX.shadowBlur=3;
      CX.fillStyle=col;CX.fillText(Math.round(v)+'%',bx,ly);CX.shadowBlur=0;
    }
    CX.restore();
  }
  drawCloudBandLabels(clH,kmToY(10),kmToY(6.5),'rgba(230,242,255,0.95)');
  drawCloudBandLabels(clM,kmToY(6.5),kmToY(2),'rgba(210,228,248,0.95)');
  drawCloudBandLabels(clL,kmToY(2),kmToY(0),'rgba(190,215,240,0.95)');

  var hi2=hoverIdx!==null?hoverIdx:null;
  var cloudLabelFs=cafs*2;
  var sumFs=Math.round(cloudLabelFs*1.15);
  if(hi2!==null){
    CX.save();CX.textAlign='right';var labX=cssW()-L.pR-2;
    axisText('∑:'+Math.round(clT[hi2])+'%',labX,kmToY(0)-4,'rgba(232,242,255,1.0)',true,sumFs);
    CX.restore();
  }
  CX.restore();
  setLegend([{color:'rgba(255,255,255,0.75)',label:T('high')+' >'+convDist(6.5)+U('dist'),dash:false},{color:'rgba(220,228,238,0.75)',label:T('mid')+' '+convDist(2)+'–'+convDist(6.5)+U('dist'),dash:false},{color:'rgba(190,210,230,0.75)',label:T('low')+' 0–'+convDist(2)+U('dist'),dash:false}]);
}

// ══ CLOUD B – symmetric bar chart per band ════════════
function drawCloudB(L,idxs,h,xOf,cTop,cBot,split){
  var cloudTop=cTop+4,cloudBot=cBot;
  function kmToY(km){return cloudBot-(km/10)*(cloudBot-cloudTop);}

  // Sky background with day/night + sun/moon curves
  drawSkyAndSunMoon(L,idxs,xOf,cloudTop,cloudBot);

  var clH=idxs.map(function(i){return h.cloud_cover_high[i]||0;});
  var clM=idxs.map(function(i){return h.cloud_cover_mid[i]||0;});
  var clL=idxs.map(function(i){return h.cloud_cover_low[i]||0;});

  // Cloud B: symetrické sloupce od středu každého pásma (původní varianta B)
  var cellW=(cssW()-L.pL-L.pR)/Math.max(1,L.total-1);
  var bands=[
    {km0:0,km1:2,data:clL,seed:3},
    {km0:2,km1:6.5,data:clM,seed:2},
    {km0:6.5,km1:10,data:clH,seed:1}
  ];
  bands.forEach(function(b){
    var yTop=kmToY(b.km1),yBot=kmToY(b.km0),yMid=(yTop+yBot)/2;
    var bandH=yBot-yTop;
    // centre dashed line
    CX.save();CX.strokeStyle='rgba(255,255,255,0.18)';CX.lineWidth=1;CX.setLineDash([3,3]);
    CX.beginPath();CX.moveTo(L.pL,yMid);CX.lineTo(cssW()-L.pR,yMid);CX.stroke();
    CX.setLineDash([]);
    // symmetric bars
    for(var i=0;i<L.total;i++){
      var pct=Math.min(100,Math.max(0,b.data[i]||0))/100;
      if(pct<0.02)continue;
      var halfH=pct*bandH/2;
      var bx=xOf(i)-cellW*0.42,bw=cellW*0.84;
      var bg=CX.createLinearGradient(0,yMid-halfH,0,yMid+halfH);
      bg.addColorStop(0,'rgba(255,255,255,0.72)');
      bg.addColorStop(0.5,'rgba(235,242,250,0.55)');
      bg.addColorStop(1,'rgba(200,215,230,0.35)');
      CX.fillStyle=bg;CX.fillRect(bx,yMid-halfH,bw,halfH*2);
    }
    // symmetric bars only (no puff overlay)
    CX.restore();
  });

  // Band centre dashed lines
  var bands=[{km0:0,km1:2,midA:0.3},{km0:2,km1:6.5,midA:0.22},{km0:6.5,km1:10,midA:0.18}];
  CX.save();
  bands.forEach(function(b){
    var yMid=(kmToY(b.km0)+kmToY(b.km1))/2;
    CX.strokeStyle='rgba(255,255,255,'+b.midA+')';CX.lineWidth=1;CX.setLineDash([3,3]);
    CX.beginPath();CX.moveTo(L.pL,yMid);CX.lineTo(cssW()-L.pR,yMid);CX.stroke();
    CX.setLineDash([]);
  });

  // Band boundary lines
  var cbfs=Math.max(7,chartFS()-1);
  [0,2,6.5,10].forEach(function(km){
    var y=kmToY(km);CX.strokeStyle='rgba(255,255,255,0.22)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(cssW()-L.pR,y);CX.stroke();
    var distVal=convDist(km),distStr=distVal===0?'0'+U('dist'):distVal+U('dist');
    CX.textAlign='right';axisText(distStr,L.pL-2,y+cbfs/2,'#a0c8e8',true,cbfs);
  });
  CX.restore();

  drawCloudIcons(cloudTop,cloudBot,L.pL);

  // min/max % per band (cloud B)
  function drawCloudBBandLabels(data,yTop,yBot,col){
    var lfs=Math.max(7,chartFS()-1);var placed=[];var minD=lfs*3;
    CX.save();CX.textAlign='center';
    for(var i=1;i<data.length-1;i++){
      var v=data[i],p=data[i-1],n=data[i+1];if(v==null)continue;
      var isMax=v>=p&&v>=n&&v>p+2;var isMin=v<=p&&v<=n&&v<p-2;
      if(!isMax&&!isMin)continue;
      var pct=Math.min(100,Math.max(0,v))/100;
      var yMid=(yTop+yBot)/2,halfH=pct*(yBot-yTop)/2;
      var bx=xOf(i),by=isMax?yMid-halfH:yMid+halfH;
      var ly=isMax?by-3:by+lfs+2;
      ly=Math.max(yTop+lfs,Math.min(yBot-2,ly));
      if(placed.some(function(q){return Math.hypot(q.x-bx,q.y-ly)<minD;}))continue;
      placed.push({x:bx,y:ly});
      CX.font='bold '+lfs+'px sans-serif';
      CX.shadowColor='rgba(4,10,22,0.95)';CX.shadowBlur=3;
      CX.fillStyle=col;CX.fillText(Math.round(v)+'%',bx,ly);CX.shadowBlur=0;
    }
    CX.restore();
  }
  drawCloudBBandLabels(clL,kmToY(2),kmToY(0),'rgba(190,215,240,0.95)');
  drawCloudBBandLabels(clM,kmToY(6.5),kmToY(2),'rgba(210,228,248,0.95)');
  drawCloudBBandLabels(clH,kmToY(10),kmToY(6.5),'rgba(230,242,255,0.95)');

  var hi2=hoverIdx!==null?hoverIdx:null;
  var bCloudLabelFs=cbfs*2;
  if(hi2!==null){
    CX.save();CX.textAlign='right';var labX2=cssW()-L.pR-2;
    var sumFs2=Math.round(bCloudLabelFs*1.15);
    var clTb=idxs.map(function(i){return h.cloud_cover[i]||0;});
    axisText('∑:'+Math.round(clTb[hi2])+'%',labX2,kmToY(0)-4,'rgba(232,242,255,1.0)',true,sumFs2);
    CX.restore();
  }
  setLegend([{color:'rgba(255,255,255,0.75)',label:T('low')+' 0-'+convDist(2)+U('dist'),dash:false},{color:'rgba(220,228,238,0.75)',label:T('mid')+' '+convDist(2)+'-'+convDist(6.5)+U('dist'),dash:false},{color:'rgba(190,210,230,0.75)',label:T('high')+' '+convDist(6.5)+'-'+convDist(10)+U('dist'),dash:false}]);
}

// ══ HUM ════════════════════════════════════════════════
function drawHum(L,idxs,h,xOf,cTop,cBot,split){
  var hu=idxs.map(function(i){return h.relative_humidity_2m[i];});
  var dp=idxs.map(function(i){return convTemp(h.dewpoint_2m[i]);});
  var mn=0,mx=100,dpMn=Math.min.apply(null,dp)-2,dpMx=Math.max.apply(null,dp)+2;
  drawLeftAxisStep(mn,mx,cTop,cBot,25,'%','#5090a0');
  var gH=CX.createLinearGradient(0,cTop,0,cBot);gH.addColorStop(0,'rgba(60,200,240,0.40)');gH.addColorStop(1,'rgba(60,200,240,0.02)');
  drawFill(hu,xOf,cTop,cBot,mn,mx,gH);
  drawLine(hu.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,2);
  drawLine(hu.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#3cc8f0',[6,4],2);
  drawLine(dp.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,dpMn,dpMx,'rgba(50,130,255,0.95)',null,2);
  drawLine(dp.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,dpMn,dpMx,'rgba(50,130,255,0.80)',[4,4],2);
  drawDataLabels(hu,xOf,cTop,cBot,mn,mx,'%','rgba(120,230,255,1.0)');
  drawDataLabels(dp,xOf,cTop,cBot,dpMn,dpMx,U('temp'),'rgba(175,230,255,1.0)');
  CX.save();CX.textAlign='left';
  var rafs=Math.max(7,chartFS()-1);
  for(var i=0;i<=4;i++){var v=dpMn+(dpMx-dpMn)*i/4;axisText(Math.round(v)+U('temp'),cssW()-R_PAD+2,valToY(v,dpMn,dpMx,cTop,cBot)+rafs/2,'#5a90a8',true,rafs);}
  CX.restore();
  setLegend([{color:'#3cc8f0',label:T('hum')+' %',dash:false},{color:'#a0e0ff',label:T('dew')+' '+U('temp')+' →',dash:false}]);
}

// ══ PRESSURE ═══════════════════════════════════════════
function drawPressure(L,idxs,h,xOf,cTop,cBot,split){
  var pr=idxs.map(function(i){return convPress(h.surface_pressure[i]);});
  var rawMn=Math.min.apply(null,pr),rawMx=Math.max.apply(null,pr);
  var mn=Math.floor((rawMn-2)/5)*5,mx=Math.ceil((rawMx+2)/5)*5;
  var mid=(mn+mx)/2,yMid=valToY(mid,mn,mx,cTop,cBot);
  drawLeftAxisAuto(mn,mx,cTop,cBot,' '+U('pres'),'#9070b8');
  var prH=pr.map(function(v){return v>=mid?v:mid;}),prL=pr.map(function(v){return v<=mid?v:mid;});
  var gHi=CX.createLinearGradient(0,cTop,0,yMid);gHi.addColorStop(0,'rgba(160,100,255,0.50)');gHi.addColorStop(1,'rgba(160,100,255,0.05)');
  var gLo=CX.createLinearGradient(0,yMid,0,cBot);gLo.addColorStop(0,'rgba(40,80,220,0.08)');gLo.addColorStop(1,'rgba(40,80,220,0.58)');
  drawFill(prH,xOf,cTop,cBot,mn,mx,gHi,yMid);
  drawFill(prL,xOf,cTop,cBot,mn,mx,gLo,yMid);
  CX.save();CX.strokeStyle='rgba(165,135,225,0.52)';CX.lineWidth=1;CX.setLineDash([5,4]);
  CX.beginPath();CX.moveTo(L.pL,yMid);CX.lineTo(cssW()-L.pR,yMid);CX.stroke();CX.setLineDash([]);CX.restore();
  drawLine(pr.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#c080ff',null,2);
  drawLine(pr.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#c080ff',[6,4],2);
  drawDataLabels(pr,xOf,cTop,cBot,mn,mx,'','rgba(220,180,255,1.0)');
  setLegend([{color:'#c080ff',label:T('pressure')+' '+U('pres'),dash:false},{color:'rgba(160,100,255,0.65)',label:'↑ '+T('highPres'),dash:false},{color:'rgba(80,110,190,0.65)',label:'↓ '+T('lowPres'),dash:false}]);
}

function drawExtraGraph(tab,L,idxs,h,xOf,cTop,cBot,split){
  // ── Snow/Precip combined graph ────────────────────────
  if(tab==='snow'){
    var GAP=8;
    var chartMid=cTop+(cBot-cTop)*0.45;
    var chartMid2=chartMid+GAP;
    var prVals=idxs.map(function(i){return h.precipitation[i]||0;});
    var snfVals=idxs.map(function(i){return h.snowfall[i]||0;});
    var prMax=Math.max.apply(null,prVals.concat([0.2]));
    // TOP: precipitation bar chart with proper small-value axis
    var prStep=prMax<=0.5?0.1:prMax<=2?0.5:prMax<=5?1:prMax<=10?2:5;
    drawLeftAxisStep(0,prMax,cTop,chartMid,prStep,' mm','rgba(100,180,255,0.8)');
    // Section background label SRÁŽKY
    var lfs2=Math.max(9,chartFS()+1);
    CX.save();CX.textAlign='center';CX.textBaseline='middle';
    CX.font='bold '+lfs2+'px sans-serif';CX.fillStyle='rgba(100,180,255,0.20)';
    CX.fillText('SRÁŽKY',L.pL+(cssW()-L.pL-L.pR)/2,(cTop+chartMid)/2);
    CX.restore();
    var bW=Math.max(2,(cssW()-L.pL-L.pR)/Math.max(1,L.total-1)*0.8);
    for(var i2=0;i2<L.total;i2++){
      var pr=prVals[i2]||0,sf=snfVals[i2]||0;
      if(pr<0.005&&sf<0.005)continue;
      var x2=xOf(i2),totalH=chartMid-cTop;
      var snowFrac=Math.min(1,pr>0?Math.min(sf,pr)/pr:0);
      var rainH=(1-snowFrac)*(pr/prMax)*totalH;
      var snowH=snowFrac*(pr/prMax)*totalH;
      var by=chartMid;
      if(rainH>0.5){CX.fillStyle='rgba(60,140,255,0.82)';CX.fillRect(x2-bW/2,by-rainH,bW,rainH);by-=rainH;}
      if(snowH>0.5){CX.fillStyle='rgba(210,240,255,0.92)';CX.fillRect(x2-bW/2,by-snowH,bW,snowH);}
    }
    drawDataLabels(prVals.map(function(v){return v>0.05?v:null;}),xOf,cTop,chartMid,0,prMax,'','rgba(150,210,255,1.0)');
    // GAP
    CX.fillStyle='rgba(8,16,32,1.0)';CX.fillRect(L.pL,chartMid,cssW()-L.pL-L.pR,GAP);
    // BOTTOM: snow depth
    var sdVals=idxs.map(function(i){return(h.snow_depth[i]||0)*100;});
    var sdMax=Math.max.apply(null,sdVals.concat([1]));
    var sdStep=sdMax<=5?1:sdMax<=20?5:sdMax<=50?10:20;
    drawLeftAxisStep(0,sdMax,chartMid2,cBot,sdStep,' cm','rgba(200,230,255,0.8)');
    // Section background label LEŽÍCÍ SNÍH
    CX.save();CX.textAlign='center';CX.textBaseline='middle';
    CX.font='bold '+lfs2+'px sans-serif';CX.fillStyle='rgba(200,230,255,0.18)';
    CX.fillText('LEŽÍCÍ SNÍH',L.pL+(cssW()-L.pL-L.pR)/2,(chartMid2+cBot)/2);
    CX.restore();
    var gSd=CX.createLinearGradient(0,chartMid2,0,cBot);
    gSd.addColorStop(0,'rgba(200,230,255,0.60)');gSd.addColorStop(1,'rgba(180,220,255,0.08)');
    drawFill(sdVals,xOf,chartMid2,cBot,0,sdMax,gSd);
    drawLine(sdVals.map(function(v,i){return i<=split?v:null;}),xOf,chartMid2,cBot,0,sdMax,'rgba(220,245,255,0.95)',null,2);
    drawLine(sdVals.map(function(v,i){return i>=split?v:null;}),xOf,chartMid2,cBot,0,sdMax,'rgba(200,235,255,0.7)',[5,4],2);
    drawDataLabels(sdVals.map(function(v){return v>0?v:null;}),xOf,chartMid2,cBot,0,sdMax,'','rgba(220,245,255,1.0)');
    if(h.soil_moisture_0_to_1cm){
      var smVals=idxs.map(function(i){return(h.soil_moisture_0_to_1cm[i]||0)*100;});
      var smFs=Math.max(7,chartFS()-1);
      CX.save();CX.textAlign='left';
      [0,50,100].forEach(function(v){axisText(v+'%',cssW()-R_PAD+2,valToY(v,0,100,chartMid2,cBot)+smFs/2,'rgba(120,180,80,0.8)',true,smFs);});
      CX.restore();
      CX.save();CX.strokeStyle='rgba(120,200,80,0.85)';CX.lineWidth=2;CX.shadowColor='rgba(0,0,0,0.5)';CX.shadowBlur=2;
      CX.beginPath();smVals.forEach(function(v,i){var sx=xOf(i),sy=valToY(v,0,100,chartMid2,cBot);if(i===0)CX.moveTo(sx,sy);else CX.lineTo(sx,sy);});
      CX.stroke();CX.shadowBlur=0;CX.restore();
    }
    setLegend([{color:'rgba(60,140,255,0.82)',label:'Déšť mm',dash:false},{color:'rgba(210,240,255,0.92)',label:'Sněžení mm',dash:false},{color:'rgba(220,245,255,0.95)',label:'Sníh cm',dash:false},{color:'rgba(120,200,80,0.85)',label:'Půda %',dash:false}]);
    return;
  }
  // ── Air Quality (pollutants) ──────────────────────────
  if(tab==='aqi'){
    var aq=WD.aq;
    if(!aq){CX.save();CX.fillStyle='rgba(200,200,200,0.6)';CX.font='14px sans-serif';CX.textAlign='center';CX.fillText('Načítám data kvality ovzduší…',cssW()/2,(cTop+cBot)/2);CX.restore();setLegend([]);return;}
    // Align AQI hourly times with weather times
    function getAqIdx(wi){
      var wt=WD.hourly.time[idxs[wi]];
      if(!aq.time)return -1;
      return aq.time.indexOf(wt);
    }
    var pollutants=[
      {key:'pm2_5',label:'PM2.5',color:'rgba(255,100,100,0.9)',unit:'µg'},
      {key:'pm10',label:'PM10',color:'rgba(255,160,60,0.85)',unit:'µg'},
      {key:'ozone',label:'O₃',color:'rgba(100,200,255,0.85)',unit:'µg'},
      {key:'nitrogen_dioxide',label:'NO₂',color:'rgba(180,100,255,0.85)',unit:'µg'},
      {key:'sulphur_dioxide',label:'SO₂',color:'rgba(255,220,60,0.85)',unit:'µg'},
      {key:'carbon_monoxide',label:'CO',color:'rgba(100,200,100,0.85)',unit:'ppb'},
    ];
    // Find max across all pollutants for normalization
    var allMax=1;
    pollutants.forEach(function(p){
      if(!aq[p.key])return;
      var mx=Math.max.apply(null,idxs.map(function(idx,ii){var ai=getAqIdx(ii);return ai>=0?(aq[p.key][ai]||0):0;}));
      if(p.key==='carbon_monoxide')mx/=100; // scale CO to same range
      if(mx>allMax)allMax=mx;
    });
    // Draw each pollutant as line only (no fill)
    var afs=Math.max(7,chartFS()-1);
    axisText('µg/m³',L.pL+2,cTop+afs,'rgba(180,200,220,0.7)',false,afs);
    pollutants.forEach(function(p){
      if(!aq[p.key])return;
      var vals2=idxs.map(function(idx,ii){
        var ai=getAqIdx(ii);if(ai<0)return null;
        var v=aq[p.key][ai]||0;
        return p.key==='carbon_monoxide'?v/100:v;
      });
      CX.save();CX.strokeStyle=p.color;CX.lineWidth=1.5;CX.setLineDash([]);
      CX.shadowColor='rgba(0,0,0,0.5)';CX.shadowBlur=2;
      CX.beginPath();var started=false;
      vals2.forEach(function(v,i){if(v===null){started=false;return;}var x=xOf(i),y=valToY(v,0,allMax,cTop,cBot);if(!started){CX.moveTo(x,y);started=true;}else CX.lineTo(x,y);});
      CX.stroke();CX.shadowBlur=0;CX.restore();
    });
    // AQI index on right axis (european_aqi)
    if(aq.european_aqi){
      var eaqiVals=idxs.map(function(idx,ii){var ai=getAqIdx(ii);return ai>=0?(aq.european_aqi[ai]||0):0;});
      var eaqiMax=Math.max.apply(null,eaqiVals.concat([100]));
      CX.save();CX.textAlign='left';
      [0,25,50,75,100].forEach(function(v){
        axisText('EAQI'+v,cssW()-R_PAD+2,valToY(v,0,eaqiMax,cTop,cBot)+afs/2,'rgba(200,200,100,0.7)',false,afs);
      });
      CX.restore();
      CX.save();CX.strokeStyle='rgba(240,220,80,0.7)';CX.lineWidth=2;CX.setLineDash([4,3]);
      CX.beginPath();eaqiVals.forEach(function(v,i){var x=xOf(i),y=valToY(v,0,eaqiMax,cTop,cBot);if(i===0)CX.moveTo(x,y);else CX.lineTo(x,y);});
      CX.stroke();CX.setLineDash([]);CX.restore();
    }
    setLegend(pollutants.filter(function(p){return aq[p.key];}).map(function(p){return{color:p.color,label:p.label,dash:false};}).concat(aq.european_aqi?[{color:'rgba(240,220,80,0.7)',label:'EAQI',dash:true}]:[]));
    return;
  }

  // ── Pollen ───────────────────────────────────────────
  if(tab==='pollen'){
    var pol=WD.pol;
    if(!pol){CX.save();CX.fillStyle='rgba(200,200,200,0.6)';CX.font='14px sans-serif';CX.textAlign='center';CX.fillText('Načítám data alergenů…',cssW()/2,(cTop+cBot)/2);CX.restore();setLegend([]);return;}
    function getPolIdx(wi){var wt=WD.hourly.time[idxs[wi]];if(!pol.time)return -1;return pol.time.indexOf(wt);}
    var pollens=[
      {key:'grass_pollen',label:'Trávy',color:'rgba(100,200,60,0.9)'},
      {key:'birch_pollen',label:'Bříza',color:'rgba(200,180,60,0.9)'},
      {key:'alder_pollen',label:'Olše',color:'rgba(180,140,80,0.85)'},
      {key:'olive_pollen',label:'Oliva',color:'rgba(160,200,80,0.85)'},
      {key:'mugwort_pollen',label:'Pelyněk',color:'rgba(100,160,100,0.85)'},
      {key:'ragweed_pollen',label:'Ambrózia',color:'rgba(220,100,60,0.9)'},
    ];
    var polMax=1;
    pollens.forEach(function(p){
      if(!pol[p.key])return;
      var mx=Math.max.apply(null,idxs.map(function(idx,ii){var ai=getPolIdx(ii);return ai>=0?(pol[p.key][ai]||0):0;}));
      if(mx>polMax)polMax=mx;
    });
    drawLeftAxisAuto(0,polMax,cTop,cBot,' gr/m³','rgba(150,200,100,0.8)');
    // Risk zones: 0-10 low, 10-80 medium, 80-200 high, >200 very high
    var zones2=[
      {lo:0,hi:10,fill:'rgba(60,160,60,0.08)'},{lo:10,hi:80,fill:'rgba(220,200,0,0.10)'},
      {lo:80,hi:200,fill:'rgba(220,100,0,0.12)'},{lo:200,hi:9999,fill:'rgba(200,40,40,0.14)'}
    ];
    zones2.forEach(function(z){
      var yt=valToY(Math.min(z.hi,polMax),0,polMax,cTop,cBot);
      var yb=valToY(Math.min(z.lo,polMax),0,polMax,cTop,cBot);
      if(yb>yt){CX.fillStyle=z.fill;CX.fillRect(L.pL,yt,cssW()-L.pL-L.pR,yb-yt);}
    });
    pollens.forEach(function(p){
      if(!pol[p.key])return;
      var pvals=idxs.map(function(idx,ii){var ai=getPolIdx(ii);return ai>=0?(pol[p.key][ai]||0):0;});
      if(Math.max.apply(null,pvals)<0.1)return;
      CX.save();CX.strokeStyle=p.color;CX.lineWidth=2;CX.shadowColor='rgba(0,0,0,0.5)';CX.shadowBlur=2;
      CX.beginPath();pvals.forEach(function(v,i){var x=xOf(i),y=valToY(v,0,polMax,cTop,cBot);if(i===0)CX.moveTo(x,y);else CX.lineTo(x,y);});
      CX.stroke();CX.shadowBlur=0;CX.restore();
    });
    setLegend(pollens.filter(function(p){return pol[p.key];}).map(function(p){return{color:p.color,label:p.label,dash:false};}));
    return;
  }
  var vals,mn,mx,color,unit,label;
  if(tab==='vis'&&h.visibility){var visKm=idxs.map(function(i){return(h.visibility[i]||0)/1000;});vals=visKm.map(function(v){return convDist(v);});mn=0;mx=Math.max.apply(null,vals.concat([convDist(50)]));color='rgba(100,220,240,0.9)';unit=' '+U('dist');label=T('vis');}
  else if(tab==='wetbulb'&&h.wet_bulb_temperature_2m){
    vals=idxs.map(function(i){return convTemp(h.wet_bulb_temperature_2m[i]||0);});
    var av=vals.filter(function(v){return v!=null;});
    mn=Math.min(Math.floor(Math.min.apply(null,av)-2),-5);
    mx=Math.max(Math.ceil(Math.max.apply(null,av)+2),38);
    color='rgba(200,100,255,0.9)';unit=U('temp');label=T('wetbulb');
    // Draw coloured temperature zones BEFORE the line
    drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color);
    // Zone boundaries in °C
    var zones=[
      {lo:-999,hi:24,fill:'rgba(60,160,60,0.15)'},
      {lo:24,hi:28,fill:'rgba(220,200,0,0.18)'},
      {lo:28,hi:30,fill:'rgba(220,120,0,0.20)'},
      {lo:30,hi:35,fill:'rgba(200,40,40,0.22)'},
      {lo:35,hi:999,fill:'rgba(160,0,0,0.28)'},
    ];
    zones.forEach(function(z){
      var yTop=valToY(Math.min(z.hi,mx),mn,mx,cTop,cBot);
      var yBot=valToY(Math.max(z.lo,mn),mn,mx,cTop,cBot);
      if(yBot>yTop){CX.fillStyle=z.fill;CX.fillRect(L.pL,yTop,cssW()-L.pL-L.pR,yBot-yTop);}
    });
    // 35°C red survival line
    var y35=valToY(35,mn,mx,cTop,cBot);
    if(y35>cTop&&y35<cBot){
      CX.save();CX.strokeStyle='rgba(220,0,0,0.85)';CX.lineWidth=2;CX.setLineDash([4,3]);
      CX.beginPath();CX.moveTo(L.pL,y35);CX.lineTo(cssW()-L.pR,y35);CX.stroke();
      CX.setLineDash([]);
      var lfs=Math.max(7,chartFS()-1);
      CX.textAlign='right';axisText('35°C – hranice přežití',cssW()-R_PAD-3,y35-lfs-1,'rgba(255,80,80,0.9)',true,lfs);
      CX.restore();
    }
    // Heat-stress index (Steadman approximation from T and RH)
    if(h.temperature_2m&&h.relative_humidity_2m){
      var hsVals=idxs.map(function(i){
        var T=h.temperature_2m[i],RH=h.relative_humidity_2m[i];
        if(T<27)return null;
        var HI=-8.78469475556+1.61139411*T+2.33854883889*RH
          -0.14611605*T*RH-0.012308094*T*T-0.0164248277778*RH*RH
          +0.002211732*T*T*RH+0.00072546*T*RH*RH-0.000003582*T*T*RH*RH;
        return convTemp(HI);
      });
      var hasHS=hsVals.some(function(v){return v!==null;});
      if(hasHS){
        var gHS=CX.createLinearGradient(0,cTop,0,cBot);
        gHS.addColorStop(0,'rgba(255,140,0,0.38)');gHS.addColorStop(1,'rgba(255,140,0,0.05)');
        drawFill(hsVals,xOf,cTop,cBot,mn,mx,gHS);
        drawLine(hsVals.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'rgba(255,160,40,0.95)',null,2);
        drawLine(hsVals.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'rgba(255,160,40,0.7)',[5,4],2);
      }
    }
    var gWB=CX.createLinearGradient(0,cTop,0,cBot);gWB.addColorStop(0,'rgba(200,100,255,0.40)');gWB.addColorStop(1,'rgba(200,100,255,0.05)');
    drawFill(vals,xOf,cTop,cBot,mn,mx,gWB);
    drawLine(vals.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,color,null,2);
    drawLine(vals.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'rgba(180,80,235,0.8)',[5,4],2);
    drawDataLabels(vals,xOf,cTop,cBot,mn,mx,unit,color);
    setLegend([
      {color:'rgba(200,100,255,0.9)',label:T('wetbulb')+' '+unit,dash:false},
      {color:'rgba(255,160,40,0.95)',label:'Heat-stress',dash:false},
      {color:'rgba(60,160,60,0.6)',label:'<24° OK',dash:false},
      {color:'rgba(200,40,40,0.6)',label:'30-35° Riziko',dash:false},
    ]);
    return;
  }
  else if(tab==='solar'&&h.shortwave_radiation){vals=idxs.map(function(i){return h.shortwave_radiation[i]||0;});mn=0;mx=Math.max.apply(null,vals.concat([1000]));color='rgba(255,220,60,0.9)';unit=' W/m²';label=T('solar');}
  else{
    currentTab='temp';
    document.querySelectorAll('.mtile').forEach(function(t){t.classList.toggle('active',t.dataset.tab==='temp');});
    updateCloudModeBtn();scrollTileToActive();
    drawTemp(L,idxs,h,xOf,cTop,cBot,split);return;
  }
  // Solar: sky background first, then data, then UV overlay
  if(tab==='solar')drawSkyAndSunMoon(L,idxs,xOf,cTop,cBot,0.42);
  drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color);
  var fillAlpha=tab==='solar'?'0.65':'0.42';
  var fillAlpha2=tab==='solar'?'0.08':'0.02';
  var gE=CX.createLinearGradient(0,cTop,0,cBot);
  gE.addColorStop(0,color.replace('0.9',fillAlpha));gE.addColorStop(1,color.replace('0.9',fillAlpha2));
  drawFill(vals,xOf,cTop,cBot,mn,mx,gE);
  var lineW=tab==='solar'?3:2;
  drawLine(vals.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,color,null,lineW);
  drawLine(vals.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,color,[6,4],lineW);
  drawDataLabels(vals.map(function(v){return v>0?v:null;}),xOf,cTop,cBot,mn,mx,unit,color);
  // UV index overlay on solar graph (pink, secondary right axis)
  if(tab==='solar'&&h.uv_index){
    var uvColor='rgba(255,100,200,0.92)';
    var uvVals=idxs.map(function(i){return h.uv_index[i]||0;});
    var uvMax=Math.max.apply(null,uvVals.concat([11]));
    var uvFs=Math.max(7,chartFS()-1);
    CX.save();CX.textAlign='left';
    for(var v=0;v<=uvMax;v+=v<6?2:5){
      var vy=valToY(v,0,uvMax,cTop,cBot);
      axisText('UV'+v,cssW()-R_PAD+2,vy+uvFs/2,uvColor,true,uvFs);
    }
    CX.restore();
    function uvToY(v){return valToY(v,0,uvMax,cTop,cBot);}
    // UV line — no fill, full line (past+future), drawn on top
    CX.save();
    CX.strokeStyle=uvColor;CX.lineWidth=2.5;
    CX.shadowColor='rgba(0,0,0,0.5)';CX.shadowBlur=3;
    CX.beginPath();
    for(var i=0;i<uvVals.length;i++){
      var ux2=xOf(i),uy2=uvToY(uvVals[i]);
      if(i===0)CX.moveTo(ux2,uy2);else CX.lineTo(ux2,uy2);
    }
    CX.stroke();CX.shadowBlur=0;CX.restore();
    // UV data labels (peaks and troughs)
    drawDataLabels(uvVals,xOf,cTop,cBot,0,uvMax,'',uvColor);
    setLegend([{color:color,label:label,dash:false},{color:uvColor,label:'UV index',dash:false}]);
  } else {
    setLegend([{color:color,label:label,dash:false}]);
  }
}

// ══ LANG POPUP ═════════════════════════════════════════
var langViewEU=false;
function openLang(){langViewEU=false;renderLangGrid();document.getElementById('langPopup').classList.add('open');}
function renderLangGrid(){
  var grid=document.getElementById('langGrid');
  var title=document.getElementById('langPopupTitle');
  if(langViewEU){
    if(title)title.textContent='🇪🇺 Evropa / Europe';
    var euLangs=LANGS.filter(function(l){return l.eu;});
    grid.innerHTML='<div class="lang-item lang-back" onclick="langViewEU=false;renderLangGrid()">← Zpět</div>'
      +euLangs.map(function(l){
        return '<div class="lang-item'+(l.code===activeLang.code?' active':'')+'" onclick="selectLang(\''+l.code+'\')"><div class="lang-flag">'+l.flag+'</div><div>'+l.short+'</div></div>';
      }).join('');
  } else {
    if(title)title.textContent='Vyberte jazyk / Select language';
    var mainLangs=LANGS.filter(function(l){return !l.eu;});
    grid.innerHTML=mainLangs.map(function(l){
        return '<div class="lang-item'+(l.code===activeLang.code?' active':'')+'" onclick="selectLang(\''+l.code+'\')"><div class="lang-flag">'+l.flag+'</div><div>'+l.short+'</div></div>';
      }).join('')
      +'<div class="lang-item lang-eu-btn" onclick="langViewEU=true;renderLangGrid()"><div class="lang-flag">🇪🇺</div><div>EU</div></div>';
  }
}
function closeLang(){document.getElementById('langPopup').classList.remove('open');}
function selectLang(code){var f=LANGS.filter(function(l){return l.code===code;});if(f.length)activeLang=f[0];localStorage.setItem('lang',code);closeLang();applyLang();}

// ══ EXTRA POPUP ════════════════════════════════════════
var _pendingExtras=null; // temp copy while popup is open
function openExtraPopup(){
  document.getElementById('extraTitle').textContent=T('extraGraphs');
  _pendingExtras=enabledExtras.slice(); // work on a copy
  document.getElementById('extraList').innerHTML=EXTRA_DEFS.map(function(d){
    var chk=_pendingExtras.indexOf(d.id)>=0;
    return '<div class="extra-item"><input type="checkbox" id="ex_'+d.id+'"'+(chk?' checked':'')+' onchange="toggleExtra(\''+d.id+'\')"><label for="ex_'+d.id+'">'+d.icon+' '+T(d.id)+'</label></div>';
  }).join('');
  document.getElementById('extraPopup').classList.add('open');
}
function closeExtraPopup(){
  document.getElementById('extraPopup').classList.remove('open');
  _pendingExtras=null;
}
function toggleExtra(id){
  if(!_pendingExtras)return;
  var idx=_pendingExtras.indexOf(id);
  if(idx>=0)_pendingExtras.splice(idx,1);
  else _pendingExtras.push(id);
}
function applyExtras(){
  if(!_pendingExtras)_pendingExtras=enabledExtras.slice();
  var lastEnabled=enabledExtras.slice();
  enabledExtras=_pendingExtras.filter(function(id){return EXTRA_DEFS.some(function(d){return d.id===id;});});
  localStorage.setItem('enabledExtras',JSON.stringify(enabledExtras));
  rebuildTabs();
  // Fetch extra data if needed
  if(WD){
    var h=WD.hourly;
    var needFetch=[];
    if(enabledExtras.indexOf('vis')>=0&&!h.visibility)needFetch.push('visibility');
    if(enabledExtras.indexOf('wetbulb')>=0&&!h.wet_bulb_temperature_2m)needFetch.push('wet_bulb_temperature_2m');
    if(enabledExtras.indexOf('solar')>=0&&!h.shortwave_radiation)needFetch.push('shortwave_radiation');
    if(needFetch.length){
      var url2='https://api.open-meteo.com/v1/forecast?latitude='+WD.latitude+'&longitude='+WD.longitude
        +'&hourly='+needFetch.join(',')+'&past_days=1&forecast_days=10&timezone=auto';
      fetch(url2).then(function(r){return r.json();}).then(function(d){
        needFetch.forEach(function(f){if(d.hourly&&d.hourly[f])WD.hourly[f]=d.hourly[f];});
        buildMetricTiles();updateMetrics(null);draw();
      });
    }
  }
  // Find newly added tab to switch to
  var newlyAdded=enabledExtras.filter(function(id){return lastEnabled.indexOf(id)<0;});
  var switchTo=newlyAdded.length?newlyAdded[newlyAdded.length-1]:null;
  closeExtraPopup();
  buildMetricTiles();
  if(switchTo&&TABS.indexOf(switchTo)>=0){switchTabByName(switchTo);}
  if(WD){draw();updateMetrics(null);}
}

// ══ EVENTS ═════════════════════════════════════════════
document.getElementById('gpsBtn').addEventListener('click',useGPS);
document.getElementById('langBtn').addEventListener('click',openLang);
document.getElementById('goBtn').addEventListener('click',useCoords);
document.getElementById('fontBtn').addEventListener('click',cycleFontSize);
document.getElementById('langClose').addEventListener('click',closeLang);
document.getElementById('extraClose').addEventListener('click',closeExtraPopup);
document.getElementById('extraOK').addEventListener('click',applyExtras);
document.getElementById('cloudModeBtn').addEventListener('click',function(){
  cloudMode=cloudMode==='A'?'B':'A';localStorage.setItem('cloudMode',cloudMode);
  document.getElementById('cloudModeBtn').textContent=cloudMode==='A'?'A/B':'B/A';
  if(WD)draw();
});
document.getElementById('extraGraphsBtn').addEventListener('click',openExtraPopup);

// ══ STARTUP ════════════════════════════════════════════
applyLang();
renderRecentChips();
window.addEventListener('load',function(){
  var last=localStorage.getItem('lastLocation');
  if(last){try{var loc=JSON.parse(last);cityQ.value=loc.name;loadWeather(loc.lat,loc.lon,loc.name);}catch(e){}}
});
</script>
