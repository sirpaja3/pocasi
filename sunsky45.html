<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUN-SKY (by PF)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080c14;color:#d8eaff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
.hdr{display:flex;align-items:center;gap:8px;padding:8px 10px 5px;border-bottom:1px solid #1e3050}
.hdr-title{font-size:15px;font-weight:700;color:#f0f6ff;flex:1}
.hdr-time{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums}
.loc-bar{padding:5px 8px;border-bottom:1px solid #1e3050;display:flex;flex-direction:column;gap:4px}
.loc-row{display:flex;gap:5px;align-items:center}
.loc-input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:6px 9px;font-size:13px;outline:none;min-width:0}
.loc-input::placeholder{color:#3a5a7a}
.loc-input:focus{border-color:#3a6aaa}
.loc-btn{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1;display:flex;align-items:center;gap:3px}
.loc-btn:active{background:#1a2840}
.gps-row{display:flex;gap:5px;align-items:center}
.gps-row input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:6px 9px;font-size:13px;outline:none;min-width:0}
.gps-go{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0}
.font-btn{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:6px 8px;cursor:pointer;font-weight:700;flex-shrink:0;line-height:1}
.fl{display:inline-block;transition:color .15s}
.fl.active-letter{color:#ff4444}
.sug-box{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;overflow:hidden;display:none;max-height:240px;overflow-y:auto;position:relative;z-index:50}
.sug-box.open{display:block}
.sug-section{font-size:10px;color:#3a5a7a;padding:3px 10px 2px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid #142030}
.sug-section:first-child{border-top:none}
.sug-item{padding:8px 10px;font-size:13px;color:#b0cce8;cursor:pointer;border-bottom:1px solid #0e1a2e;display:flex;align-items:center;gap:6px}
.sug-item:hover,.sug-item:active{background:#142030}
.sug-item b{color:#60b8ff}
.sug-sub{font-size:11px;color:#486080;flex:1}
.sug-coords{font-size:10px;color:#2a4060;margin-left:auto}
.pin-btn{width:16px;flex-shrink:0;cursor:pointer;font-size:12px;opacity:0.35;user-select:none}
.pin-btn.pinned{opacity:1}
.recent-chips{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.recent-chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:#0e1a2e;border:1px solid #243a60;border-radius:20px;padding:2px 7px 2px 4px;font-size:11px;color:#90b8d8;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip:hover{background:#142030}
.chip-pin{font-size:10px;opacity:.35}
.chip-pin.pinned{opacity:1}
.chip-del{font-size:9px;opacity:.35;margin-left:1px}
.chip-del:hover{opacity:.8;color:#ff6060}
.overlay-popup{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,10,20,.93);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
.overlay-popup.open{display:flex}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.lang-item{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;padding:6px 3px;text-align:center;cursor:pointer;font-size:10px;color:#b0cce8;display:flex;flex-direction:column;align-items:center;gap:2px}
.lang-eu-btn{background:#0e2040;border-color:#2a5090;font-size:13px;font-weight:bold}
.lang-back{grid-column:1/-1;background:#0a1828;font-size:12px;color:#90b8d8;border-color:#1a3050;padding:6px}
.lang-flag{font-size:18px;line-height:1}
.popup-close{background:#1a2840;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:7px 22px;font-size:13px;cursor:pointer;margin-top:6px}
/* METRIC TILES */
.metrics-outer{border-bottom:1px solid #1e3050;background:#090f1c;position:relative}
.metrics-scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.metrics-scroll::-webkit-scrollbar{display:none}
.metrics-inner{display:flex;padding:4px 4px 2px;gap:0;width:max-content}
.mtile{flex:0 0 auto;width:calc(20vw - 4px);max-width:98px;min-width:62px;border:2px solid transparent;border-radius:10px;margin:0 3px;padding:5px 4px;cursor:pointer;transition:border-color .18s;user-select:none;position:relative;overflow:hidden}
.mtile:active{filter:brightness(1.2)}
.mtile.active{border-color:#58b0ff;box-shadow:0 0 12px rgba(88,176,255,.28)}
.mtile-icon{font-size:11px;margin-bottom:1px;position:relative;z-index:1}
.mtile-label{font-size:9px;font-weight:600;color:#a0c0d8;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:2px;position:relative;z-index:1;line-height:1.2;word-break:normal;overflow-wrap:break-word;overflow:hidden;white-space:normal;hyphens:auto}
.mtile.active .mtile-label{color:#5ab0ff}
.mtile-val{font-size:14px;font-weight:700;color:#f0f8ff;font-variant-numeric:tabular-nums;line-height:1;position:relative;z-index:1}
.mtile-sub{font-size:9px;color:#90b8d8;margin-top:1px;font-variant-numeric:tabular-nums;position:relative;z-index:1;white-space:normal;overflow:visible;word-break:break-word;line-height:1.2;max-width:100%}
.mtile-unit{font-size:7px;color:#3a5a80;margin-top:1px;position:relative;z-index:1}
.metric-time-bar{display:flex;align-items:center;padding:2px 6px 3px;border-top:1px solid #1e3050;background:#090f1c;min-height:22px}
.metric-time-bar .mtime{flex:1;text-align:center;font-size:10px;color:#507090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-time-bar .bar-btns{display:flex;gap:4px;flex-shrink:0}
.bar-btn{background:#14243a;color:#9fd0ff;border:1px solid #345070;border-radius:6px;padding:1px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
#cubeWrap{flex:1;overflow:hidden;position:relative}
#chartCanvas{display:block;width:100%;touch-action:none;flex:1;min-height:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#chartSection{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform,opacity;user-select:none;-webkit-user-select:none;}
.legend-bar{display:flex;gap:6px;flex-wrap:wrap;padding:3px 8px 4px;background:#080c14;height:22px;min-height:22px;max-height:22px;flex-shrink:0;border-top:1px solid #111820;overflow:hidden}
.leg{display:flex;align-items:center;gap:3px;font-size:10px;color:#8090a8}
.leg-swatch{width:14px;height:2px;flex-shrink:0}
.state{text-align:center;padding:40px 20px;color:#507090;font-size:13px;line-height:1.8}
.state-ico{font-size:36px;margin-bottom:10px}
.status{font-size:10px;color:#1e3050;padding:2px 10px 3px;text-align:right}
.datasrc{text-align:center;font-size:10px;color:#4e6c90;padding-bottom:6px}
.pf-logo{position:fixed;bottom:6px;left:8px;z-index:100;opacity:.4;pointer-events:none}
.pf-cloud{background:#2a3a50;border-radius:8px;padding:2px 5px 2px 3px;font-size:10px;font-weight:700;color:#d4b820;display:flex;align-items:center;gap:2px}
.extra-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:320px;max-height:70vh;overflow-y:auto}
.extra-item{display:flex;align-items:center;gap:10px;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;padding:8px 12px;cursor:pointer}
.extra-item input[type=checkbox]{width:16px;height:16px;accent-color:#5ab0ff;cursor:pointer;flex-shrink:0}
.extra-item label{font-size:13px;color:#b0cce8;cursor:pointer;flex:1}
</style>
</head>

<div id="app" style="display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;position:relative;overflow:hidden">
  <div class="hdr">
    <span style="font-size:18px;filter:sepia(1) saturate(4) hue-rotate(10deg)">🌤</span>
    <span class="hdr-title">SUN-SKY <span style="color:#7090b0;font-weight:400;font-size:11px">v35 (by PF)</span></span>
    <span class="hdr-time" id="clock">--:--</span>
  </div>
  <div class="loc-bar">

      <button class="loc-btn" id="langBtn"><span id="langFlag">🇨🇿</span><span id="langCode" style="font-size:10px;margin-left:2px">CZ</span></button>
    </div>
    <div class="sug-box" id="sugBox"></div>
    <div class="recent-chips" id="recentChips"></div>
    <div class="gps-row">
      <input class="loc-input" id="latIn" placeholder="Zeměšířka" type="number" step="0.0001">
      <input class="loc-input" id="lonIn" placeholder="Zemědelšířka" type="number" step="0.0001">
      <button class="gps-go" id="goBtn">GO</button>
      <button class="font-btn" id="fontBtn"></button>
    </div>
  </div>
  <div class="metrics-outer" id="metricsWrap" style="display:none">
    <div class="metrics-scroll" id="metricsScroll"><div class="metrics-inner" id="metricsTiles"></div></div>
    <div class="metric-time-bar">
      <span class="mtime" id="mTime">teď</span>
      <div class="bar-btns">
        <button class="bar-btn" id="cloudModeBtn" style="display:none">A/B</button>
        <button class="bar-btn" id="extraGraphsBtn">+ GRAF</button>
      </div>
    </div>
  </div>
  <div id="cubeWrap" style="display:none">
    <div id="chartSection">
      <canvas id="chartCanvas"></canvas>
      <div class="legend-bar" id="legendBar"></div>
    </div>
  </div>
  <div class="state" id="stateDiv">
    <div class="state-ico">🔍</div>
    <span id="stateMsg">Zadej název obce, použij GPS nebo zadej souřadnice</span>
  </div>
  <div class="status" id="statusBar"></div>
  <div class="datasrc" id="dataSrc">Data: Open-Meteo / ECMWF / ICON / GFS</div>
  <div class="overlay-popup" id="langPopup">
    <div id="langPopupTitle" style="font-size:13px;color:#90b8d8;margin-bottom:4px">Vyberte jazyk / Select language</div>
    <div class="lang-grid" id="langGrid"></div>
    <button class="popup-close" id="langClose">✕</button>
  </div>
  <div class="overlay-popup" id="extraPopup">
    <div style="font-size:13px;color:#90b8d8;margin-bottom:4px" id="extraTitle">Volitelné grafy</div>
    <div class="extra-list" id="extraList"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="popup-close" id="extraOK" style="background:#1a3a70;color:#90c8ff;flex:1">✓ OK</button>
      <button class="popup-close" id="extraClose" style="flex:0 0 auto" title="Zrušit">✕</button>
    </div>
  </div>
</div>
<div class="pf-logo"><div class="pf-cloud"><span style="color:#f0c010">⚡</span>PF<span style="color:#f0a010;font-size:9px">☀</span></div></div>

function getRecent(){try{return JSON.parse(localStorage.getItem('recentLocations')||'[]');}catch(e){return[];}}
function saveRecent(arr){localStorage.setItem('recentLocations',JSON.stringify(arr));}
function escQ(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function renderRecentChips(){
  var rc=document.getElementById('recentChips');
  var arr=getRecent();if(!arr.length){rc.innerHTML='';return;}
  var sorted=arr.filter(function(i){return i.pinned;}).concat(arr.filter(function(i){return !i.pinned;}));
  rc.innerHTML=sorted.map(function(loc){
    var short=loc.name.split(',')[0].trim();
    return '<div class="chip"><span class="chip-pin'+(loc.pinned?' pinned':'')+'" onclick="togglePin(event,\''+escQ(loc.name)+'\')">📌</span>'
      +'<span onclick="chipLoad(\''+escQ(loc.name)+'\')">'+short+'</span>'
      +'<span class="chip-del" onclick="removeRecent(event,\''+escQ(loc.name)+'\')">✕</span></div>';
  }).join('');
}
function chipLoad(name){
  var loc=getRecent().filter(function(l){return l.name===name;})[0];if(!loc)return;
  document.getElementById('cityQ').value=loc.name;
  document.getElementById('latIn').value=loc.lat;
  document.getElementById('lonIn').value=loc.lon;
  closeSug();loadWeather(parseFloat(loc.lat),parseFloat(loc.lon),loc.name);
}
function togglePin(e,name){
  e.stopPropagation();
  var arr=getRecent();var loc=arr.filter(function(l){return l.name===name;})[0];if(!loc)return;
  if(!loc.pinned&&arr.filter(function(l){return l.pinned&&l.name!==name;}).length>=10){alert('Max. 10!');return;}
  loc.pinned=!loc.pinned;saveRecent(arr);renderRecentChips();
}
function removeRecent(e,name){e.stopPropagation();saveRecent(getRecent().filter(function(l){return l.name!==name;}));renderRecentChips();}
function addToRecent(lat,lon,name){
  var arr=getRecent();
  var existing=arr.filter(function(i){return i.name===name;})[0];
  var wasPinned=existing?existing.pinned:false;
  arr=arr.filter(function(i){return i.name!==name;});
  arr.unshift({name:name,lat:lat,lon:lon,pinned:wasPinned,time:Date.now()});
  var p=arr.filter(function(i){return i.pinned;}),u=arr.filter(function(i){return !i.pinned;}).slice(0,20);
  saveRecent(p.concat(u));renderRecentChips();
}

var cityQ=document.getElementById('cityQ'),sugBox=document.getElementById('sugBox');
cityQ.addEventListener('focus',function(){
  if(cityQ.value.trim().length>0){cityQ.value='';sugBox.innerHTML='';showRecentInSug();return;}
  var q=cityQ.value.trim();if(q.length>=2)doSearch(q);else showRecentInSug();
});
cityQ.addEventListener('input',function(){clearTimeout(searchTimer);var q=cityQ.value.trim();if(q.length<2){showRecentInSug();return;}searchTimer=setTimeout(function(){doSearch(q);},380);});
cityQ.addEventListener('keydown',function(e){if(e.key==='Enter'){clearTimeout(searchTimer);doSearch(cityQ.value.trim());}});
function showRecentInSug(){
  var arr=getRecent();if(!arr.length){closeSug();return;}
  var p=arr.filter(function(i){return i.pinned;}),u=arr.filter(function(i){return !i.pinned;});
  var h='';
  if(p.length)h+='<div class="sug-section">📌 '+T('pinned')+'</div>'+p.map(rRI).join('');
  if(u.length)h+='<div class="sug-section">🕐 '+T('recent')+'</div>'+u.slice(0,10).map(rRI).join('');
  openSug(h);
}
function rRI(loc){
  return '<div class="sug-item" data-lat="'+loc.lat+'" data-lon="'+loc.lon+'" data-name="'+loc.name+'" onclick="pickSug(this)">'
    +'<span class="pin-btn'+(loc.pinned?' pinned':'')+'" onclick="tPS(event,\''+escQ(loc.name)+'\')">📌</span>'
    +'<b>'+loc.name.split(',')[0]+'</b><span class="sug-sub">'+loc.name.split(',').slice(1).join(',')+'</span>'
    +'<span class="sug-coords">'+parseFloat(loc.lat).toFixed(2)+' '+parseFloat(loc.lon).toFixed(2)+'</span></div>';
}
function tPS(e,name){e.stopPropagation();togglePin(e,name);showRecentInSug();}
function doSearch(q){
  if(q.length<2)return;
  openSug('<div class="sug-item"><span style="color:#507090">…</span></div>');
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=10&language='+activeLang.code.split('-')[0]+'&format=json')
    .then(function(r){return r.json();})
    .then(function(data){
      var hits=data.results||[];if(!hits.length){openSug('<div class="sug-item"><span style="color:#507090">–</span></div>');return;}
      openSug(hits.map(function(d){
        var sub=[d.admin2&&d.admin2!==d.name?d.admin2:'',d.admin1||'',d.country||''].filter(Boolean).join(', ');
        return '<div class="sug-item" data-lat="'+d.latitude+'" data-lon="'+d.longitude+'" data-name="'+d.name+(sub?', '+sub:'')+'" onclick="pickSug(this)"><b>'+d.name+'</b><span class="sug-sub">'+sub+'</span><span class="sug-coords">'+d.latitude.toFixed(2)+' '+d.longitude.toFixed(2)+'</span></div>';
      }).join(''));
    }).catch(function(){openSug('<div class="sug-item"><span style="color:#ff6060">!</span></div>');});
}
function openSug(h){sugBox.innerHTML=h;sugBox.className='sug-box open';}
function closeSug(){sugBox.className='sug-box';sugBox.innerHTML='';}
function pickSug(el){

// ══ GPS ════════════════════════════════════════════════
function useGPS(){
  if(!navigator.geolocation){setState('🚫','GPS není dostupná');return;}
  setState('📡','…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    document.getElementById('latIn').value=lat.toFixed(5);
    document.getElementById('lonIn').value=lon.toFixed(5);
    reverseGeocode(lat,lon);
  },function(err){setState('❌',{1:'Zamítnuto.',2:'Nedostupné.',3:'Vypršel.'}[err.code]||'Chyba GPS');},{enableHighAccuracy:true,timeout:15000});
}
function reverseGeocode(lat,lon){
  fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+activeLang.code.split('-')[0])
    .then(function(r){return r.json();})
    .then(function(d){var name=d.locality||d.city||d.principalSubdivision||(lat.toFixed(3)+','+lon.toFixed(3));cityQ.value=name;loadWeather(lat,lon,name+' (GPS)');})
    .catch(function(){loadWeather(lat,lon,'GPS '+lat.toFixed(3)+','+lon.toFixed(3));});
}
function useCoords(){
  var lat=parseFloat(document.getElementById('latIn').value),lon=parseFloat(document.getElementById('lonIn').value);
  if(isNaN(lat)||isNaN(lon)){setState('⚠️','Chybné souřadnice');return;}
  cityQ.value=lat.toFixed(4)+', '+lon.toFixed(4);loadWeather(lat,lon,lat.toFixed(4)+', '+lon.toFixed(4));
}

// ══ LOAD ═══════════════════════════════════════════════
function loadWeather(lat,lon,name){
  setState('⏳','…');
  var extraFields=[];
  if(enabledExtras.indexOf('vis')>=0)extraFields.push('visibility');
  if(enabledExtras.indexOf('wetbulb')>=0)extraFields.push('wet_bulb_temperature_2m');
  if(enabledExtras.indexOf('solar')>=0)extraFields.push('shortwave_radiation');
  var hourlyBase='temperature_2m,apparent_temperature,relative_humidity_2m,dewpoint_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,snowfall,'
    +'cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,weathercode,is_day,uv_index,'
    +'snow_depth,soil_moisture_0_to_1cm';
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&hourly='+hourlyBase+(extraFields.length?','+extraFields.join(','):'')
    +'&daily=sunrise,sunset'
    +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation,weathercode,is_day'
    +'&forecast_days=10&past_days=1&timezone=auto';
  fetch(url)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      WD=data;
      // Sanity-check snow_depth: max realistic change ≈ 20cm/hour (0.20m)
      if(WD.hourly&&WD.hourly.snow_depth){
        var sd=WD.hourly.snow_depth;
        var maxStep=0.20; // metres per hour
        for(var si=1;si<sd.length;si++){
          if(sd[si]!==null&&sd[si-1]!==null){
            var delta=sd[si]-sd[si-1];
            if(delta>maxStep){sd[si]=sd[si-1]+maxStep;}
            else if(delta<-maxStep){sd[si]=sd[si-1]-maxStep;}
          }
        }
      }
      scrollOffset=0;hoverIdx=null;
      buildMetricTiles();
      updateMetrics(null);
      document.getElementById('metricsWrap').style.display='block';
      document.getElementById('cubeWrap').style.display='block';
      document.getElementById('stateDiv').style.display='none';
      document.getElementById('dataSrc').textContent=T('data')+' · '+lat.toFixed(3)+', '+lon.toFixed(3);
      initCanvas();draw();
      setStatus('✓ '+name+' · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
      addToRecent(lat,lon,name);
      localStorage.setItem('lastLocation',JSON.stringify({lat:lat,lon:lon,name:name}));
      updateCloudModeBtn();
      scrollTileToActive();
      // Fetch Air Quality data (Open-Meteo AQI)
      var aqUrl='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon
        +'&hourly=pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,european_aqi,us_aqi'
        +'&past_days=1&forecast_days=4&timezone=auto';
      fetch(aqUrl).then(function(r){return r.json();}).then(function(aqd){WD.aq=aqd.hourly;}).catch(function(){WD.aq=null;});
      // Fetch Pollen data (Open-Meteo)
      var polUrl='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon
        +'&hourly=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen'
        +'&past_days=1&forecast_days=4&timezone=auto';
      fetch(polUrl).then(function(r){return r.json();}).then(function(pd){WD.pol=pd.hourly;}).catch(function(){WD.pol=null;});
    })
    .catch(function(e){setState('⚠️','Chyba: '+e.message);});
}

// ══ SCROLL TILE INTO VIEW ══════════════════════════════
function scrollTileToActive(){
  var scroll=document.getElementById('metricsScroll');
  var active=document.querySelector('.mtile.active');
  if(!scroll||!active)return;
  var tileLeft=active.offsetLeft;
  var tileW=active.offsetWidth;
  var scrollW=scroll.offsetWidth;
  var target=tileLeft-(scrollW/2-tileW/2);
  scroll.scrollTo({left:Math.max(0,target),behavior:'smooth'});
}

// ══ METRIC TILES ═══════════════════════════════════════
function buildMetricTiles(){
  rebuildTabs();
  document.getElementById('metricsTiles').innerHTML=TABS.map(function(tab){
    var bg=TILE_BG[tab]||'linear-gradient(150deg,#1a2a3a,#2a3a4a)';
    return '<div class="mtile'+(tab===currentTab?' active':'')+'" data-tab="'+tab+'" onclick="setTab(this)" style="background:'+bg+'">'
      +'<div class="mtile-icon">'+(TILE_ICONS[tab]||'📊')+'</div>'
      +'<div class="mtile-label" id="ml_'+tab+'">'+T(tab)+(tab==="solar"?'<br><span style="font-size:7px;opacity:0.7">W/m²</span>':'')+'</div>'
      +'<div class="mtile-val" id="mv_'+tab+'">–</div>'
      +'<div class="mtile-sub" id="ms_'+tab+'"> </div>'
      +'<div class="mtile-unit" id="mu_'+tab+'"></div></div>';
  }).join('');
  // Auto-compress long tile labels
  requestAnimationFrame(function(){
    TABS.forEach(function(tab){
      var el=document.getElementById('ml_'+tab);
      if(!el||!el.parentElement)return;
      var maxW=el.parentElement.offsetWidth-4;
      el.style.letterSpacing='';el.style.transform='';
      if(el.scrollWidth>maxW){
        var ratio=maxW/el.scrollWidth;
        if(ratio>0.82){el.style.letterSpacing='-0.04em';}
        else if(ratio>0.7){el.style.letterSpacing='-0.06em';el.style.transform='scaleX(0.92)';}
      }
    });
  });
}

function updateMetrics(idx){
  if(!WD)return;
  var h=WD.hourly,c=WD.current,hi,timeStr;
  if(idx===null){
    hi=Math.max(0,h.time.findIndex(function(t){return new Date(t)>Date.now();})-1);
    timeStr=T('now');
  }else{
    hi=getSlice().s+idx;
    var d=new Date(h.time[hi]);
    timeStr=d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }
  var t=idx===null?c.temperature_2m:h.temperature_2m[hi];
  var feel=idx===null?c.apparent_temperature:h.apparent_temperature[hi];
  var ws=idx===null?c.wind_speed_10m:h.wind_speed_10m[hi];
  var wg=idx===null?c.wind_gusts_10m:h.wind_gusts_10m[hi];
  var hum=idx===null?c.relative_humidity_2m:h.relative_humidity_2m[hi];
  var dew=h.dewpoint_2m[hi],pres=idx===null?c.surface_pressure:h.surface_pressure[hi];
  var cloud=idx===null?c.cloud_cover:h.cloud_cover[hi];
  var precip=idx===null?c.precipitation:h.precipitation[hi];
  function st(tab,val,sub,unit){
    var v=document.getElementById('mv_'+tab),s=document.getElementById('ms_'+tab),u=document.getElementById('mu_'+tab);
    if(v)v.textContent=val;if(s)s.textContent=sub!==undefined?sub:' ';if(u)u.textContent=unit||'';
  }
  var fs=Math.round(convTemp(feel)),ts=Math.round(convTemp(t));
  st('temp',ts+'',T('feel')+': '+(fs>=0?'+':'')+fs+U('temp'),U('temp'));
  st('wind',fmtWind(ws)+'','▲ '+fmtWind(wg),U('wind'));
  st('cloud',Math.round(cloud)+'%',T('precip')+': '+(precip||0).toFixed(1)+'mm/h','');
  var ds=Math.round(convTemp(dew));
  st('hum',Math.round(hum)+'%',T('dew')+': '+(ds>=0?'+':'')+ds+U('temp'),U('temp'));
  st('pressure',fmtPress(pres)+'','',U('pres'));
  if(h.shortwave_radiation){var uvSub=h.uv_index?'UV '+(h.uv_index[hi]||0).toFixed(1):'';st('solar',Math.round(h.shortwave_radiation[hi]||0)+'',uvSub,'W/m²');}
  if(h.snow_depth)st('snow',((h.snow_depth[hi]||0)*100).toFixed(0)+'cm','','');
  if(h.soil_moisture_0_to_1cm)st('soil',((h.soil_moisture_0_to_1cm[hi]||0)*100).toFixed(0)+'%','','');
  if(h.visibility){var vkm=convDist((h.visibility[hi]||0)/1000);st('vis',vkm.toFixed(0),'',U('dist'));}
  if(h.wet_bulb_temperature_2m){st('wetbulb',Math.round(convTemp(h.wet_bulb_temperature_2m[hi]))+'','',U('temp'));}
  document.getElementById('mTime').textContent=timeStr;
  updateCloudModeBtn();
}

function setTab(el){

  document.querySelectorAll('.mtile').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  var prevIdx=TABS.indexOf(prevTab),newIdx=TABS.indexOf(el.dataset.tab);
  currentTab=el.dataset.tab;
  updateCloudModeBtn();scrollTileToActive();
  if(WD)animateTabChange(prevIdx,newIdx);
}
function switchTabByName(tab){
  if(TABS.indexOf(tab)<0)return;
  var prevIdx=TABS.indexOf(currentTab),newIdx=TABS.indexOf(tab);
  var savedScroll=scrollOffset;
  currentTab=tab;
  document.querySelectorAll('.mtile').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});
  updateCloudModeBtn();scrollTileToActive();
  scrollOffset=savedScroll; // keep position so red line stays fixed
  if(WD)animateTabChange(prevIdx,newIdx);
}
function animateTabChange(prevIdx,newIdx){
  var cs=document.getElementById('chartSection');
  var dir=newIdx>=prevIdx?1:-1;
  var dur=400;
  cs.style.transition='transform '+dur+'ms cubic-bezier(0.4,0,0.6,1),opacity '+dur+'ms ease';
  cs.style.transform=dir>0?'perspective(700px) rotateY(-90deg)':'perspective(700px) rotateY(90deg)';
  cs.style.opacity='0';
  setTimeout(function(){
    draw();
    cs.style.transition='none';
    cs.style.transform=dir>0?'perspective(700px) rotateY(90deg)':'perspective(700px) rotateY(-90deg)';
    cs.style.opacity='0';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      cs.style.transition='transform '+dur+'ms cubic-bezier(0.4,0,0.2,1),opacity '+dur+'ms ease';
      cs.style.transform='perspective(700px) rotateY(0deg)';
      cs.style.opacity='1';
    });});
  },dur+10);
}

// ══ SLICE ══════════════════════════════════════════════
function getSlice(){
  var times=WD.hourly.time,nowMs=Date.now();
  var cur=times.findIndex(function(t){return new Date(t).getTime()>nowMs;})-1;
  if(cur<0)cur=0;
  var total=times.length;
  var back=10+scrollOffset;
  var s=Math.max(0,Math.min(total-1,cur-Math.round(back)));
  if(s+hoursVisible>total)s=Math.max(0,total-hoursVisible);
  var e=Math.min(total-1,s+hoursVisible-1);
  return{s:s,e:e,cur:cur,split:cur-s};
}

// ══ CANVAS ═════════════════════════════════════════════
function initCanvas(){
  if(CV)return;
  CV=document.getElementById('chartCanvas');CX=CV.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',function(){resizeCanvas();if(WD)draw();});
  CV.addEventListener('mousemove',function(e){if(!WD)return;var r=CV.getBoundingClientRect();setHoverX(e.clientX-r.left);});
  CV.addEventListener('mouseleave',function(){hoverIdx=null;if(WD)draw();updateMetrics(null);});
  CV.addEventListener('touchstart',onTS,{passive:false});
  CV.addEventListener('touchmove',onTM,{passive:false});
  CV.addEventListener('touchend',onTE,{passive:false});
  CV.addEventListener('touchcancel',onTE,{passive:false});
}
var _dpr=1;
function resizeCanvas(){
  var wrap=document.getElementById('cubeWrap');
  _dpr=window.devicePixelRatio||1;
  var cW=wrap.offsetWidth;
  var cH=Math.max(wrap.offsetHeight-22-4,140);
  CV.width=Math.round(cW*_dpr);
  CV.height=Math.round(cH*_dpr);
  CV.style.width=cW+'px';
  CV.style.height=cH+'px';
  CX.setTransform(_dpr,0,0,_dpr,0,0);
}

// ══ TOUCH ══════════════════════════════════════════════
// State
var txStart=null,tyStart=null,tTimeStart=0;
var pinchDist0=null,pinchHours0=null,pinchMidX0=null,pinchScrollOffset0=null;
var gestureResolved=false,gesturePan=false,gestureHover=false,gestureAxisPan=false;
var panOffset0=0,holdTimer=null;

function getTimeAxisY(){
  var fs=chartFS();
  var pL=Math.round(44+fs*0.8);
  var ICON_H=18,ARROW_H=(currentTab==='wind'?13:0),PRECIP_H=22;
  var topPad=ICON_H+ARROW_H+PRECIP_H+2;
  var H=cssH();
  var TIME_H=24;
  return topPad+Math.max(H-topPad-TIME_H,60);
}

function onTS(e){
  e.preventDefault();
  if(e.touches.length===2){
    // Pinch start — record midpoint and current scroll
    clearTimeout(holdTimer);
    var t0=e.touches[0],t1=e.touches[1];
    pinchDist0=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);
    pinchHours0=hoursVisible;
    var r=CV.getBoundingClientRect();
    pinchMidX0=((t0.clientX+t1.clientX)/2)-r.left; // CSS px midpoint
    pinchScrollOffset0=scrollOffset;
    txStart=null;gestureResolved=true;gesturePan=false;gestureHover=false;gestureAxisPan=false;
    return;
  }
  // Single touch start
  var t=e.touches[0];
  txStart=t.clientX;tyStart=t.clientY;tTimeStart=Date.now();
  gestureResolved=false;gesturePan=false;gestureHover=false;gestureAxisPan=false;
  pinchDist0=null;panOffset0=scrollOffset;
  clearTimeout(holdTimer);
  holdTimer=setTimeout(function(){
    if(!gesturePan&&!gestureAxisPan&&txStart!==null){
      gestureHover=true;gestureResolved=true;
      var r=CV.getBoundingClientRect();
      setHoverX(txStart-r.left);
    }
  },260);
}

function onTM(e){
  e.preventDefault();
  if(!WD)return;

  // ── Pinch zoom ─────────────────────────────────────────
  if(e.touches.length===2&&pinchDist0!==null){
    clearTimeout(holdTimer);
    var t0=e.touches[0],t1=e.touches[1];
    var d=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);
    var scale=pinchDist0/d;
    var newHours=Math.round(Math.max(HOURS_MIN,Math.min(HOURS_MAX,pinchHours0*scale)));
    var L=getLayout();
    var chartW=cssW()-L.pL-L.pR;
    // Use pinch midpoint captured at gesture START
    var frac=Math.max(0,Math.min(1,(pinchMidX0-L.pL)/chartW));
    // Compute start-of-gesture slice directly from pinchScrollOffset0
    var times=WD.hourly.time,nowMs=Date.now();
    var cur=Math.max(0,times.findIndex(function(tt){return new Date(tt).getTime()>nowMs;})-1);
    var pinchBack=10+pinchScrollOffset0;
    var pinchS=Math.max(0,Math.min(times.length-1,cur-Math.round(pinchBack)));
    if(pinchS+pinchHours0>times.length)pinchS=Math.max(0,times.length-pinchHours0);
    var pinchE=Math.min(times.length-1,pinchS+pinchHours0-1);
    // Absolute time index at pinch midpoint
    var midAbsIdx=pinchS+frac*(pinchE-pinchS);
    // New scrollOffset so midAbsIdx stays at frac
    var newS=midAbsIdx-frac*newHours;
    scrollOffset=(cur-10)-newS;
    scrollOffset=Math.max(-times.length,Math.min(times.length,scrollOffset));
    hoursVisible=newHours;
    hoverIdx=null;draw();
    return;
  }

  if(e.touches.length!==1||txStart===null)return;
  var tx=e.touches[0].clientX,ty=e.touches[0].clientY;
  var dx=tx-txStart,dy=ty-tyStart,dt=Date.now()-tTimeStart;
  var r=CV.getBoundingClientRect();
  var touchY=ty-r.top;
  var axisY=getTimeAxisY();

  // ── Resolve gesture type ───────────────────────────────
  if(!gestureResolved&&(Math.abs(dx)>8||Math.abs(dy)>8)){
    clearTimeout(holdTimer);gestureResolved=true;
    var hori=Math.abs(dx)>Math.abs(dy)*1.2;
    var TIME_H_TOT=Math.max(28,chartFS()*3+6);
    if(hori&&touchY>(axisY-TIME_H_TOT)&&touchY<(axisY+16)){
      gestureAxisPan=true; // pan only when finger is on/near time axis
    } else if(!hori){
      gestureHover=true;
    }
    // horizontal in chart area = potential swipe (decided in onTE) or hover
    // no gesturePan from chart area
  }

  // ── Axis pan (finger on time axis) — reversed direction ──
  if(gestureAxisPan){
    var sl=getSlice(),chartW=cssW()-L_PAD-R_PAD;
    var pxPerHour=chartW/Math.max(1,sl.e-sl.s);
    var maxScroll=WD.hourly.time.length-hoursVisible;
    scrollOffset=Math.max(-(WD.hourly.time.length),Math.min(maxScroll,
      panOffset0+Math.round((tx-txStart)/pxPerHour)));
    hoverIdx=null;draw();
    return;
  }

  // ── Hover / crosshair ─────────────────────────────────
  if(gestureHover){
    setHoverX(tx-r.left);
  }
}

function onTE(e){
  clearTimeout(holdTimer);
  if(e.changedTouches.length===1&&txStart!==null){
    var dx=e.changedTouches[0].clientX-txStart,dy=e.changedTouches[0].clientY-tyStart,dt=Date.now()-tTimeStart;
    // Swipe to change tab: fast (< 350ms), wide (> 55px), horizontal, not a pan that moved > 30% of screen
    var isSwipe=Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.8&&dt<350&&!gestureAxisPan&&!gestureHover;
    if(isSwipe){
      var savedScroll=scrollOffset; // preserve position across tab switch
      var ti=TABS.indexOf(currentTab);
      if(dx<0)switchTabByName(TABS[(ti+1)%TABS.length]);
      else switchTabByName(TABS[(ti-1+TABS.length)%TABS.length]);
      scrollOffset=savedScroll; // restore so red line stays in same position
      txStart=null;gestureResolved=false;gesturePan=false;gestureHover=false;gestureAxisPan=false;
      if(WD)updateMetrics(null);return;
    }
  }
  if(gesturePan||gestureAxisPan)panOffset0=scrollOffset;
  hoverIdx=null;txStart=null;pinchDist0=null;
  gestureResolved=false;gesturePan=false;gestureHover=false;gestureAxisPan=false;
  if(WD){draw();updateMetrics(null);}
}

function getSliceFor(hours,offset){
  var times=WD.hourly.time,nowMs=Date.now();
  var cur=Math.max(0,times.findIndex(function(t){return new Date(t).getTime()>nowMs;})-1);
  var total=times.length;
  var back=10+offset;if(back<0)back=0;
  var s=Math.max(0,cur-back);
  if(s+hours>total)s=Math.max(0,total-hours);
  var e=Math.min(total-1,s+hours-1);
  return{s:s,e:e,cur:cur,split:cur-s};
}

function setHoverX(mx){
  var L=getLayout(),sl=getSlice(),total=sl.e-sl.s+1;
  var idx=Math.round((mx-L.pL)/(cssW()-L.pL-L.pR)*(total-1));
  idx=Math.max(0,Math.min(total-1,idx));
  if(idx!==hoverIdx){hoverIdx=idx;draw();updateMetrics(idx);}
}
function cssW(){return parseInt(CV.style.width)||(CV.width/(window.devicePixelRatio||1));}
function cssH(){return parseInt(CV.style.height)||(CV.height/(window.devicePixelRatio||1));}

// ══ LAYOUT ═════════════════════════════════════════════
function getLayout(){
  var W=cssW(),H=cssH();
  var fs=chartFS();
  var cloudExtra=(currentTab==='cloud')?Math.max(10,fs):0;
  var pL=Math.min(Math.round(44+fs*0.8+cloudExtra),cssW()*0.35|0),pR=Math.min(Math.round(38+fs*0.8),cssW()*0.28|0);
  var TIME_H=Math.max(28,fs*3+6),ICON_H=18,ARROW_H=(currentTab==='wind'?13:0),PRECIP_H=22;
  var topPad=ICON_H+ARROW_H+PRECIP_H+2;
  var chartH=H-topPad-TIME_H;
  var sl=getSlice(),total=sl.e-sl.s+1;
  return{W:W,H:H,pL:pL,pR:pR,TIME_H:TIME_H,ICON_H:ICON_H,ARROW_H:ARROW_H,PRECIP_H:PRECIP_H,topPad:topPad,chartH:Math.max(chartH,60),total:total,s:sl.s,e:sl.e};
}

// ══ DRAW ═══════════════════════════════════════════════
function draw(){
  if(!CV||!WD)return;
  CX.setTransform(_dpr,0,0,_dpr,0,0);
  // Clear temp icon overlay when not on temp
  if(currentTab!=='temp'){var ov=document.getElementById('chartIconOverlay');if(ov)ov.innerHTML='';}
  var W=cssW(),H=cssH();
  CX.clearRect(0,0,W,H);
  var L=getLayout(),sl=getSlice(),h=WD.hourly;
  L_PAD=L.pL;R_PAD=L.pR;
  var idxs=[];for(var i=0;i<L.total;i++)idxs.push(L.s+i);
  function xOf(i){return L.pL+i*(W-L.pL-L.pR)/Math.max(1,L.total-1);}
  drawPrecipTop(L,idxs,h,xOf);
  drawIconRow(L,idxs,h,xOf);
  if(currentTab==='wind')drawWindArrows(L,idxs,h,xOf);
  var cTop=L.topPad,cBot=L.topPad+L.chartH;
  drawMidnightLines(idxs,cTop,cBot,xOf);
  if(currentTab==='temp')drawTemp(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='wind')drawWind(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='cloud'){if(cloudMode==='A')drawCloud(L,idxs,h,xOf,cTop,cBot,sl.split);else drawCloudB(L,idxs,h,xOf,cTop,cBot,sl.split);}
  else if(currentTab==='hum')drawHum(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='pressure')drawPressure(L,idxs,h,xOf,cTop,cBot,sl.split);
  else drawExtraGraph(currentTab,L,idxs,h,xOf,cTop,cBot,sl.split);
  drawNowLine(sl.split,cTop,cBot,xOf); // always on top of chart content
  drawTimeAxis(L,idxs,xOf);
  if(hoverIdx!==null)drawCrosshair(hoverIdx,cTop,cBot,xOf,h);
  CX.save();CX.font='bold '+Math.min(W/5,48)+'px sans-serif';CX.fillStyle='rgba(120,160,200,0.055)';
  CX.textAlign='center';CX.textBaseline='middle';CX.fillText('PF',cssW()/2,cTop+(cBot-cTop)/2);CX.restore();
}

// ══ PRECIP TOP ═════════════════════════════════════════
function drawPrecipTop(L,idxs,h,xOf){
  var pr=idxs.map(function(i){return h.precipitation[i]||0;});
  var sn=idxs.map(function(i){return h.snowfall[i]||0;});
  var maxPr=Math.max.apply(null,pr.concat(sn).concat([0.5]));
  var areaTop=L.ICON_H+(currentTab==='wind'?L.ARROW_H:0)+2;
  var barW=Math.max(1,(cssW()-L.pL-L.pR)/L.total-0.5);
  CX.save();
  for(var i=0;i<L.total;i++){
    var x=xOf(i)-barW/2,rH=(pr[i]||0)/maxPr*L.PRECIP_H,sH=(sn[i]||0)/maxPr*L.PRECIP_H;
    if(rH>0.3){CX.fillStyle='rgba(60,140,255,0.75)';CX.fillRect(x,areaTop,barW,rH);}
    if(sH>0.3){CX.fillStyle='rgba(210,235,255,0.7)';CX.fillRect(x,areaTop+rH,barW,sH);}
  }
  CX.strokeStyle='rgba(30,60,100,0.3)';CX.lineWidth=1;
  CX.beginPath();CX.moveTo(L.pL,areaTop);CX.lineTo(cssW()-R_PAD,areaTop);CX.stroke();
  CX.textAlign='left';CX.font='7px sans-serif';CX.fillStyle='#3c7aaa';
  CX.fillText(maxPr.toFixed(1)+'mm/h',cssW()-R_PAD+2,areaTop+8);
  CX.restore();
}

// ══ ICON ROW ═══════════════════════════════════════════
function cloudFracIcon(pct,isDay){if(pct<15)return isDay?'☀':'__STARS__';if(pct<50)return isDay?'⛅':'🌙';if(pct<85)return '🌥';return '☁';}
function wmoIcon(code,isDay){
  if(code===0)return isDay?'☀':'__STARS__';if(code<=2)return isDay?'⛅':'🌥';if(code===3)return '☁';
  if(code<=49)return '🌫';if(code<=57)return '🌦';if(code<=67)return '🌧';
  if(code<=77)return '❄';if(code<=82)return '🌧';if(code<=86)return '❄';return '⛈';
}
function drawStars(cx,cy,sz){
  // 3 white stars in triangle: big top-left, medium top-right, small bottom-center
  var stars=[{dx:-sz*0.35,dy:-sz*0.25,r:sz*0.28},{dx:sz*0.28,dy:-sz*0.30,r:sz*0.20},{dx:sz*0.05,dy:sz*0.28,r:sz*0.14}];
  CX.save();CX.fillStyle='rgba(255,255,255,0.92)';CX.shadowColor='rgba(200,220,255,0.6)';CX.shadowBlur=2;
  stars.forEach(function(s){
    CX.beginPath();
    for(var p=0;p<5;p++){
      var a=p*Math.PI*2/5-Math.PI/2;
      var ai=a+Math.PI/5;
      if(p===0)CX.moveTo(cx+s.dx+Math.cos(a)*s.r,cy+s.dy+Math.sin(a)*s.r);
      else CX.lineTo(cx+s.dx+Math.cos(a)*s.r,cy+s.dy+Math.sin(a)*s.r);
      CX.lineTo(cx+s.dx+Math.cos(ai)*s.r*0.42,cy+s.dy+Math.sin(ai)*s.r*0.42);
    }
    CX.closePath();CX.fill();
  });
  CX.shadowBlur=0;CX.restore();
}
function drawIconRow(L,idxs,h,xOf){
  var y=L.ICON_H/2+2,step=(cssW()-L.pL-L.pR)/(L.total-1);
  var every=step<12?6:step<18?3:step<30?2:1;
  var sz=6; // star size
  CX.save();CX.font='11px sans-serif';CX.textAlign='center';CX.textBaseline='middle';CX.fillStyle='#a0c8e8';
  for(var i=0;i<L.total;i+=every){
    var idx=idxs[i],code=h.weathercode[idx],isDay=h.is_day[idx];
    var ico=code<=1?cloudFracIcon(h.cloud_cover[idx],isDay):wmoIcon(code,isDay);
    if(ico==='__STARS__'){drawStars(xOf(i),y,sz);}
    else{CX.fillText(ico,xOf(i),y);}
  }
  CX.restore();
}

// ══ WIND ARROWS ════════════════════════════════════════
function drawWindArrows(L,idxs,h,xOf){
  var y=L.ICON_H+L.PRECIP_H+L.ARROW_H/2+2;
  var fs=chartFS();
  var baseR=Math.max(3,fs*0.48); // 60% of previous fs*0.8
  var maxWs=Math.max.apply(null,idxs.map(function(i){return h.wind_speed_10m[i];}).concat([1]));
  var step=(cssW()-L.pL-L.pR)/Math.max(1,L.total-1);
  // Skip arrows so they don't overlap: minimum gap = 2.5× max arrow diameter
  var maxDiam=(baseR+baseR*0.5)*1.2;
  var every=Math.max(1,Math.ceil(maxDiam/step));
  CX.save();
  for(var i=0;i<L.total;i+=every){
    var idx=idxs[i],ws=h.wind_speed_10m[idx],frac=ws/maxWs;
    var r=baseR*(0.7+frac*0.5);
    var x=xOf(i),deg=h.wind_direction_10m[idx];
    var goRad=((deg+180)%360)*Math.PI/180;
    CX.save();CX.translate(x,y);CX.rotate(goRad);
    CX.strokeStyle='rgba(140,190,220,'+(0.4+0.6*frac)+')';
    CX.lineWidth=0.8+frac*1.6;
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(0,r);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(-r*.45,r*.15);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(r*.45,r*.15);CX.stroke();
    CX.restore();
  }
  CX.restore();
}

// ══ MIDNIGHT / NOW ═════════════════════════════════════
function drawMidnightLines(idxs,cTop,cBot,xOf){
  CX.save();CX.setLineDash([4,4]);CX.strokeStyle='rgba(80,130,220,0.32)';CX.lineWidth=1.2;
  for(var i=1;i<idxs.length;i++){if(new Date(WD.hourly.time[idxs[i]]).getHours()===0){CX.beginPath();CX.moveTo(xOf(i),cTop);CX.lineTo(xOf(i),cBot);CX.stroke();}}
  CX.setLineDash([]);CX.restore();
}
function drawNowLine(split,cTop,cBot,xOf){
  if(split<0)return;
  var x=xOf(split);
  var nfs=Math.max(8,chartFS()-1);
  CX.save();
  // glow behind
  CX.strokeStyle='rgba(255,60,60,0.25)';CX.lineWidth=5;CX.setLineDash([]);
  CX.beginPath();CX.moveTo(x,cTop);CX.lineTo(x,cBot);CX.stroke();
  // solid line
  CX.strokeStyle='rgba(255,70,70,0.95)';CX.lineWidth=2;CX.setLineDash([4,3]);
  CX.beginPath();CX.moveTo(x,cTop);CX.lineTo(x,cBot);CX.stroke();CX.setLineDash([]);
  CX.fillStyle='rgba(255,100,100,1.0)';CX.font='bold '+nfs+'px sans-serif';CX.textAlign='left';CX.textBaseline='top';
  CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
  CX.fillText('▼'+T('now'),x+2,cTop);CX.shadowBlur=0;
  CX.restore();
}

// ══ CROSSHAIR – minimal ════════════════════════════════
function drawCrosshair(idx,cTop,cBot,xOf,h){
  var x=xOf(idx);
  CX.save();
  // Alternating dark-blue / white dashes for visibility on any background
  var segLen=4,gap=3,y=cTop;
  var toggle=true;
  while(y<cBot){
    CX.strokeStyle=toggle?'rgba(30,60,140,0.85)':'rgba(255,255,255,0.70)';
    CX.lineWidth=1.5;CX.setLineDash([]);
    CX.beginPath();CX.moveTo(x,y);CX.lineTo(x,Math.min(y+segLen,cBot));CX.stroke();
    y+=segLen+gap;toggle=!toggle;
  }
  CX.setLineDash([]);
  var hi=getSlice().s+idx;
  var d=new Date(WD.hourly.time[hi]);
  var dayStr=dayName(d.getDay())+' '+String(d.getHours()).padStart(2,'0')+':00';
  var pr=h.precipitation[hi]||0,sn=h.snowfall[hi]||0;
  var lines=[dayStr];
  if(currentTab==='temp'){lines.push(Math.round(convTemp(h.temperature_2m[hi]))+U('temp'),Math.round(convTemp(h.apparent_temperature[hi]))+U('temp'));}
  else if(currentTab==='wind'){lines.push(fmtWind(h.wind_speed_10m[hi])+U('wind'),'▲'+fmtWind(h.wind_gusts_10m[hi]));}
  else if(currentTab==='hum'){lines.push(Math.round(h.relative_humidity_2m[hi])+'%',Math.round(convTemp(h.dewpoint_2m[hi]))+U('temp'));}
  else if(currentTab==='pressure'){lines.push(fmtPress(h.surface_pressure[hi])+' '+U('pres'));}
  else if(currentTab==='cloud'){lines.push('H:'+Math.round(h.cloud_cover_high[hi])+'%','M:'+Math.round(h.cloud_cover_mid[hi])+'%','L:'+Math.round(h.cloud_cover_low[hi])+'%','∑:'+Math.round(h.cloud_cover[hi])+'%');}
  else if(currentTab==='vis'&&h.visibility){lines.push(convDist((h.visibility[hi]||0)/1000).toFixed(0)+' '+U('dist'));}
  else if(currentTab==='wetbulb'&&h.wet_bulb_temperature_2m){lines.push(Math.round(convTemp(h.wet_bulb_temperature_2m[hi]))+U('temp'));}
  else if(currentTab==='solar'&&h.shortwave_radiation){lines.push(Math.round(h.shortwave_radiation[hi])+' W/m²');if(h.uv_index)lines.push('UV '+(h.uv_index[hi]||0).toFixed(1));}
  else if(currentTab==='snow'&&h.snow_depth){lines.push(((h.snow_depth[hi]||0)*100).toFixed(0)+' cm');}
  else if(currentTab==='soil'&&h.soil_moisture_0_to_1cm){lines.push(((h.soil_moisture_0_to_1cm[hi]||0)*100).toFixed(0)+'%');}
  if(pr>0.05)lines.push('🌧'+pr.toFixed(1)+'mm/h');
  if(sn>0.05)lines.push('❄'+sn.toFixed(1)+'cm');
  var fs=Math.max(10,chartFS());
  CX.font='bold '+fs+'px sans-serif';
  var alignRight=x>cssW()*0.58;
  var tx=alignRight?x-5:x+5;
  CX.textBaseline='top';
  lines.forEach(function(l,i){
    var ly=cTop+5+i*(fs+3);
    // Dark blue background text for contrast, then white outline, then colored text
    CX.shadowColor='rgba(0,10,40,1.0)';CX.shadowBlur=6;
    CX.fillStyle=i===0?'rgba(160,200,255,0.95)':'rgba(255,255,255,1.0)';
    CX.textAlign=alignRight?'right':'left';
    CX.fillText(l,tx,ly);
    CX.shadowBlur=0;
  });
  CX.restore();
}

// ══ TIME AXIS ══════════════════════════════════════════
function drawTimeAxis(L,idxs,xOf){
  var axisTop=L.topPad+L.chartH;
  var tfs=Math.max(8,chartFS()-1);
  var row1=axisTop+tfs+2,row2=axisTop+tfs*2+5;
  CX.save();CX.textAlign='center';var lastDay=-1;
  for(var i=0;i<L.total;i++){
    var d=new Date(WD.hourly.time[idxs[i]]),hr=d.getHours(),x=xOf(i);
    if(hr%6===0){
      CX.strokeStyle='rgba(60,100,160,0.7)';CX.lineWidth=1;CX.beginPath();CX.moveTo(x,axisTop);CX.lineTo(x,axisTop+4);CX.stroke();
      CX.fillStyle='#8aaad8';CX.font='bold '+tfs+'px sans-serif';
      CX.shadowColor='rgba(0,0,0,0.8)';CX.shadowBlur=2;
      CX.fillText(String(hr).padStart(2,'0'),x,row1);CX.shadowBlur=0;
    }
    var day=d.getDay();
    if((hr===0||i===0)&&day!==lastDay){
      lastDay=day;
      CX.fillStyle='#c0d8ff';CX.font='bold '+(tfs+1)+'px sans-serif';
      CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
      CX.fillText(dayName(day),x,row2);CX.shadowBlur=0;
    }
  }
  CX.restore();
}

// ══ DRAW HELPERS ═══════════════════════════════════════
function valToY(v,mn,mx,cTop,cBot){return cBot-(v-mn)/(mx-mn+0.0001)*(cBot-cTop);}
function drawLine(vals,xOf,cTop,cBot,mn,mx,color,dash,lw){
  CX.save();CX.strokeStyle=color;CX.lineWidth=lw||2;if(dash)CX.setLineDash(dash);
  CX.beginPath();var first=true;
  for(var i=0;i<vals.length;i++){if(vals[i]==null){first=true;continue;}var x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);if(first){CX.moveTo(x,y);first=false;}else CX.lineTo(x,y);}
  CX.stroke();CX.setLineDash([]);CX.restore();
}
function drawFill(vals,xOf,cTop,cBot,mn,mx,fillColor,yBase){
  var base=yBase!==undefined?yBase:cBot;
  CX.save();CX.fillStyle=fillColor;CX.beginPath();var started=false;
  for(var i=0;i<vals.length;i++){if(vals[i]==null)continue;var x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);if(!started){CX.moveTo(x,base);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);}
  for(var i=vals.length-1;i>=0;i--){if(vals[i]!=null){CX.lineTo(xOf(i),base);break;}}
  CX.closePath();CX.fill();CX.restore();
}
function axisText(txt,x,y,color,bold,size){
  var fs=size||8;
  var W=cssW();
  // Clamp x so text doesn't go off screen
  x=Math.max(2,Math.min(W-2,x));
  CX.save();
  CX.font=(bold?'bold ':'')+fs+'px sans-serif';
  CX.shadowColor='rgba(4,10,22,0.95)';CX.shadowBlur=3;
  CX.fillStyle=color||'#7090b0';CX.fillText(txt,x,y);
  CX.shadowBlur=0;
  CX.restore();
}
function drawDataLabels(vals,xOf,cTop,cBot,mn,mx,unit,color){
  var fs=Math.max(8,chartFS()-1);
  CX.save();CX.textAlign='center';
  var placed=[],minD=fs*2.2;
  for(var i=1;i<vals.length-1;i++){
    var v=vals[i],p=vals[i-1],n=vals[i+1];if(v==null||p==null||n==null)continue;
    var isMax=v>=p&&v>=n&&(v>p+0.3||v>n+0.3),isMin=v<=p&&v<=n&&(v<p-0.3||v<n-0.3);
    if(!isMax&&!isMin)continue;
    var x=xOf(i),y=valToY(v,mn,mx,cTop,cBot),ly=isMax?y-5:y+11;
    if(placed.some(function(q){return Math.hypot(q.x-x,q.y-ly)<minD;}))continue;
    placed.push({x:x,y:ly});
    CX.font='bold '+fs+'px sans-serif';
    CX.shadowColor='rgba(4,10,22,0.98)';CX.shadowBlur=4;
    CX.fillStyle=color||'rgba(240,252,255,1.0)';CX.fillText(Math.round(v)+(unit||''),x,ly);
    CX.shadowBlur=0;
  }
  CX.restore();
}
function drawLeftAxisStep(mn,mx,cTop,cBot,step,unit,color){
  CX.save();var lo=Math.ceil(mn/step)*step,hi=Math.floor(mx/step)*step;
  for(var v=lo;v<=hi+0.001;v+=step){
    var y=valToY(v,mn,mx,cTop,cBot);
    CX.strokeStyle='rgba(80,130,200,0.22)';CX.lineWidth=1;CX.setLineDash([2,3]);
    CX.beginPath();CX.moveTo(L_PAD,y);CX.lineTo(cssW()-R_PAD,y);CX.stroke();CX.setLineDash([]);
  }
  CX.textAlign='right';
  var afs=Math.max(7,chartFS()-1);
  for(var v=lo;v<=hi+0.001;v+=step){
    axisText(Math.round(v)+(unit||''),L_PAD-3,valToY(v,mn,mx,cTop,cBot)+afs/2,color||'#8090b8',true,afs);
  }
  CX.restore();
}
function drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color){
  var range=mx-mn;if(range<=0)range=1;
  var rawStep=range/4,mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
  var niceStep=[1,2,5,10].map(function(s){return s*mag;}).filter(function(s){return range/s<=6;})[0]||rawStep;
  drawLeftAxisStep(mn,mx,cTop,cBot,niceStep,unit,color);
}
function setLegend(items){
  document.getElementById('legendBar').innerHTML=items.map(function(it){
    return '<div class="leg"><div class="leg-swatch" style="'+(it.dash?'background:repeating-linear-gradient(90deg,'+it.color+' 0,'+it.color+' 4px,transparent 4px,transparent 8px)':'background:'+it.color)+'"></div>'+it.label+'</div>';
  }).join('');
}

// ══ TEMP ═══════════════════════════════════════════════
function drawTemp(L,idxs,h,xOf,cTop,cBot,split){
  var rawT=idxs.map(function(i){return convTemp(h.temperature_2m[i]);});
  var rawF=idxs.map(function(i){return convTemp(h.apparent_temperature[i]);});
  var allV=rawT.concat(rawF).filter(function(v){return v!=null;});
  var step=U('temp')==='°F'?10:5;
  var mn=Math.floor((Math.min.apply(null,allV)-3)/step)*step;
  var mx=Math.ceil((Math.max.apply(null,allV)+3)/step)*step;
  var zero=U('temp')==='°F'?32:0;
  var t20=U('temp')==='°F'?68:20,tM10=U('temp')==='°F'?14:-10;
  var y0=Math.max(cTop,Math.min(cBot,valToY(zero,mn,mx,cTop,cBot)));
  var y20=valToY(t20,mn,mx,cTop,cBot);
  var yM10=valToY(tM10,mn,mx,cTop,cBot);
  drawLeftAxisStep(mn,mx,cTop,cBot,step,U('temp'),'#8090b8');
  // zero line
  if(mn<zero&&mx>zero){
    CX.save();CX.strokeStyle='rgba(130,170,240,0.6)';CX.lineWidth=1.2;CX.setLineDash([4,4]);
    CX.beginPath();CX.moveTo(L.pL,y0);CX.lineTo(cssW()-L.pR,y0);CX.stroke();CX.setLineDash([]);CX.restore();
  }
  // FILL above zero: red@20°C → blue@0°C (vertical gradient)
  if(mx>zero){
    var tPlus=rawT.map(function(v){return v>zero?v:zero;});
    var gP=CX.createLinearGradient(0,Math.max(cTop,y20),0,y0);
    gP.addColorStop(0,'rgba(220,40,20,0.62)');    // red at top (20°)
    gP.addColorStop(0.35,'rgba(200,80,30,0.50)');
    gP.addColorStop(0.7,'rgba(160,120,60,0.35)');
    gP.addColorStop(1,'rgba(80,140,230,0.12)');   // blue at 0°
    drawFill(tPlus,xOf,cTop,cBot,mn,mx,gP,y0);
  }
  // FILL below zero: blue@0°C → white@-10°C
  if(mn<zero){
    var tMinus=rawT.map(function(v){return v<zero?v:zero;});
    var gM=CX.createLinearGradient(0,y0,0,Math.min(cBot,yM10));
    gM.addColorStop(0,'rgba(80,140,230,0.12)');   // blue at 0°
    gM.addColorStop(0.4,'rgba(140,180,240,0.35)');
    gM.addColorStop(0.75,'rgba(200,220,255,0.5)');
    gM.addColorStop(1,'rgba(240,248,255,0.68)');   // white at -10°
    drawFill(tMinus,xOf,cTop,cBot,mn,mx,gM,y0);
  }
  drawLine(rawT.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ff4030',null,2);
