<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080c14">
<title>Počasí CZ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080c14;color:#d8eaff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;border-bottom:1px solid #1e3050}
.hdr-title{font-size:15px;font-weight:700;color:#f0f6ff;flex:1}
.hdr-time{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums}
.loc-bar{padding:8px 12px;border-bottom:1px solid #1e3050;display:flex;flex-direction:column;gap:6px}
.loc-row{display:flex;gap:6px}
.loc-input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:7px 10px;font-size:13px;outline:none;min-width:0}
.loc-input::placeholder{color:#3a5a7a}
.loc-input:focus{border-color:#3a6aaa}
.loc-btn{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:7px 11px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.loc-btn:active{background:#1a2840}
.gps-row{display:flex;gap:6px}
.gps-row input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:7px 10px;font-size:13px;outline:none;min-width:0}
.gps-row input::placeholder{color:#3a5a7a}
.gps-row input:focus{border-color:#3a6aaa}
.gps-go{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0}
.gps-go:active{background:#12295a}
.sug-box{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;overflow:hidden;display:none;max-height:200px;overflow-y:auto}
.sug-box.open{display:block}
.sug-item{padding:10px 12px;font-size:13px;color:#b0cce8;cursor:pointer;border-bottom:1px solid #142030;display:flex;align-items:baseline;gap:6px}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item:hover{background:#142030}
.sug-item b{color:#60b8ff}
.sug-sub{font-size:11px;color:#486080;flex:1}
.sug-coords{font-size:10px;color:#2a4060;margin-left:auto}

/* METRICS – tabs on top, values below */
.metrics-wrap{border-bottom:1px solid #1e3050;background:#090f1c}
.metric-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#1e3050}
.mtab{background:#0a1220;padding:4px 2px;text-align:center;cursor:pointer;font-size:10px;font-weight:600;color:#507090;letter-spacing:.02em;transition:color .15s;user-select:none}
.mtab.active{color:#5ab0ff;background:#0c1830}
.mtab:active{background:#0e1a30}
.metric-vals{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#1e3050}
.metric{background:#090f1c;padding:5px 4px;text-align:center}
.metric-val{font-size:15px;font-weight:700;color:#f0f8ff;line-height:1;font-variant-numeric:tabular-nums}
.metric-sub{font-size:11px;color:#90b8d8;margin-top:1px;font-variant-numeric:tabular-nums}
.metric-unit{font-size:8px;color:#3a5a80;margin-top:1px}
.metric-time{grid-column:1/-1;text-align:center;font-size:10px;color:#507090;padding:2px 0 3px;background:#090f1c;border-top:1px solid #1e3050}

#chartCanvas{display:block;width:100%;touch-action:none}
.legend-bar{display:flex;gap:10px;flex-wrap:wrap;padding:3px 10px 5px;background:#080c14}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#607090}
.leg-swatch{width:16px;height:2px;flex-shrink:0}
.state{text-align:center;padding:50px 20px;color:#507090;font-size:13px;line-height:1.8}
.state-ico{font-size:36px;margin-bottom:10px}
.status{font-size:10px;color:#1e3050;padding:3px 10px 5px;text-align:right}
.pf-logo{position:fixed;bottom:8px;left:10px;z-index:100;opacity:.5;pointer-events:none}
.pf-cloud{background:#2a3a50;border-radius:8px;padding:2px 5px 2px 3px;font-size:11px;font-weight:700;color:#d4b820;display:flex;align-items:center;gap:2px}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;position:relative">

  <div class="hdr">
    <span style="font-size:20px">🌤</span>
    <span class="hdr-title">Počasí CZ <span style="color:#7090b0;font-weight:400;font-size:12px">(by PF)</span></span>
    <span class="hdr-time" id="clock">--:--</span>
  </div>

  <div class="loc-bar">
    <div class="loc-row">
      <input class="loc-input" id="cityQ" placeholder="Název obce nebo města…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="loc-btn" onclick="useGPS()">📍 GPS</button>
    </div>
    <div class="sug-box" id="sugBox"></div>
    <div class="gps-row">
      <input class="loc-input" id="latIn" placeholder="Zeměšířka (49.82)" type="number" step="0.0001">
      <input class="loc-input" id="lonIn" placeholder="Zemědelšířka (18.26)" type="number" step="0.0001">
      <button class="gps-go" onclick="useCoords()">GO</button>
    </div>
  </div>

  <!-- METRIC TABS + VALUES -->
  <div class="metrics-wrap" id="metricsWrap" style="display:none">
    <div class="metric-tabs">
      <div class="mtab active" data-tab="temp"     onclick="setTab(this)">🌡 Teplota</div>
      <div class="mtab"        data-tab="wind"     onclick="setTab(this)">💨 Vítr</div>
      <div class="mtab"        data-tab="cloud"    onclick="setTab(this)">☁ Oblačnost</div>
      <div class="mtab"        data-tab="hum"      onclick="setTab(this)">💧 Vlhkost</div>
      <div class="mtab"        data-tab="pressure" onclick="setTab(this)">🌫 Tlak</div>
    </div>
    <div class="metric-vals">
      <div class="metric"><div class="metric-val" id="mTemp">–</div><div class="metric-sub" id="mFeel">–</div><div class="metric-unit">°C / pocit</div></div>
      <div class="metric"><div class="metric-val" id="mWind">–</div><div class="metric-sub" id="mGust">–</div><div class="metric-unit">km/h / nár.</div></div>
      <div class="metric"><div class="metric-val" id="mCloud">–</div><div class="metric-sub" id="mPrecip">–</div><div class="metric-unit">% / mm/h</div></div>
      <div class="metric"><div class="metric-val" id="mHum">–</div><div class="metric-sub" id="mDew">–</div><div class="metric-unit">% / ros.bod</div></div>
      <div class="metric"><div class="metric-val" id="mPres">–</div><div class="metric-sub" id="mPres2">–</div><div class="metric-unit">hPa</div></div>
    </div>
    <div class="metric-time" id="mTime">teď</div>
  </div>

  <div id="chartSection" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <canvas id="chartCanvas"></canvas>
    <div class="legend-bar" id="legendBar"></div>
  </div>

  <div class="state" id="stateDiv">
    <div class="state-ico">🔍</div>
    Zadej název obce, použij GPS<br>nebo zadej souřadnice
  </div>
  <div class="status" id="statusBar"></div>
</div>

<div class="pf-logo">
  <div class="pf-cloud"><span style="color:#f0c010">⚡</span>PF<span style="color:#f0a010;font-size:10px">☀</span></div>
</div>

<script>
// ─── CLOCK ───────────────────────────────────────────
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
tickClock();setInterval(tickClock,1000);

// ─── GLOBALS ─────────────────────────────────────────
let WD=null, currentTab='temp', searchTimer=null;
let CV=null, CX=null;
const DAYS=['Ne','Po','Út','St','Čt','Pá','So'];
const TABS=['temp','wind','cloud','hum','pressure'];
let hoursVisible=77; // zoom state
const HOURS_MIN=18, HOURS_MAX=120;
let hoverIdx=null;
// touch state
let touchStartX=null, touchStartY=null, touchStartTime=0;
let pinchStartDist=null, pinchStartHours=null;
let isScrolling=null; // null=undecided, 'h'=horizontal swipe, 'v'=vertical/hover

// ─── SEARCH ──────────────────────────────────────────
const cityQ=document.getElementById('cityQ');
const sugBox=document.getElementById('sugBox');
cityQ.addEventListener('input',()=>{clearTimeout(searchTimer);const q=cityQ.value.trim();if(q.length<2){closeSug();return;}searchTimer=setTimeout(()=>doSearch(q),380);});
cityQ.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);doSearch(cityQ.value.trim());}});
async function doSearch(q){
  if(q.length<2)return;
  openSug('<div class="sug-item"><span style="color:#507090">Hledám…</span></div>');
  try{
    const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=cs&format=json`);
    const data=await res.json();
    const hits=(data.results||[]).filter(d=>d.country_code==='CZ');
    if(!hits.length){openSug('<div class="sug-item"><span style="color:#507090">Nenalezeno</span></div>');return;}
    openSug(hits.map(d=>{
      const dist=d.admin2||'',reg=d.admin1||'';
      const sub=dist&&dist!==d.name?dist+(reg?', '+reg:''):reg;
      return `<div class="sug-item" data-lat="${d.latitude}" data-lon="${d.longitude}" data-name="${d.name}${sub?', '+sub:''}" onclick="pickSug(this)"><b>${d.name}</b><span class="sug-sub">${sub}</span><span class="sug-coords">${d.latitude.toFixed(3)}, ${d.longitude.toFixed(3)}</span></div>`;
    }).join(''));
  }catch(e){openSug('<div class="sug-item"><span style="color:#ff6060">Chyba připojení</span></div>');}
}
function openSug(h){sugBox.innerHTML=h;sugBox.className='sug-box open';}
function closeSug(){sugBox.className='sug-box';sugBox.innerHTML='';}
function pickSug(el){cityQ.value=el.dataset.name;document.getElementById('latIn').value=parseFloat(el.dataset.lat).toFixed(5);document.getElementById('lonIn').value=parseFloat(el.dataset.lon).toFixed(5);closeSug();loadWeather(parseFloat(el.dataset.lat),parseFloat(el.dataset.lon),el.dataset.name);}
document.addEventListener('click',e=>{if(!e.target.closest('.loc-bar'))closeSug();});

// ─── GPS ─────────────────────────────────────────────
function useGPS(){
  if(!navigator.geolocation){setState('🚫','Geolokace není dostupná');return;}
  setState('📡','Zjišťuji GPS polohu…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    document.getElementById('latIn').value=lat.toFixed(5);document.getElementById('lonIn').value=lon.toFixed(5);
    reverseGeocode(lat,lon);
  },err=>{const m={1:'GPS zamítnuto.',2:'GPS signál nedostupný.',3:'GPS vypršel.'};setState('❌',m[err.code]||'Chyba GPS');},{enableHighAccuracy:true,timeout:15000});
}
async function reverseGeocode(lat,lon){
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=cs`);const d=await r.json();const name=d.locality||d.city||d.principalSubdivision||`${lat.toFixed(4)},${lon.toFixed(4)}`;cityQ.value=name;loadWeather(lat,lon,name+' (GPS)');}
  catch(e){loadWeather(lat,lon,`GPS ${lat.toFixed(4)},${lon.toFixed(4)}`);}
}
function useCoords(){
  const lat=parseFloat(document.getElementById('latIn').value),lon=parseFloat(document.getElementById('lonIn').value);
  if(isNaN(lat)||isNaN(lon)){setState('⚠️','Zadej platné souřadnice');return;}
  cityQ.value=`${lat.toFixed(4)}, ${lon.toFixed(4)}`;loadWeather(lat,lon,`${lat.toFixed(4)}, ${lon.toFixed(4)}`);
}

// ─── LOAD WEATHER ────────────────────────────────────
async function loadWeather(lat,lon,name){
  setState('⏳',`Načítám data pro <b>${name}</b>…`);
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      +`&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,dewpoint_2m,`
      +`wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,snowfall,`
      +`cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,weathercode,is_day`
      +`&current=temperature_2m,apparent_temperature,relative_humidity_2m,`
      +`wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation,weathercode,is_day`
      +`&forecast_days=4&past_days=1&timezone=Europe%2FPrague`;
    const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);
    WD=await res.json();
    updateMetrics(null);
    document.getElementById('metricsWrap').style.display='block';
    const cs=document.getElementById('chartSection');cs.style.display='flex';cs.style.flexDirection='column';
    document.getElementById('stateDiv').style.display='none';
    initCanvas();draw();
    setStatus(`✓ ${name} · ${new Date().toLocaleTimeString('cs-CZ')}`);
  }catch(e){setState('⚠️','Nepodařilo se načíst data.<br>Zkontroluj připojení.');setStatus('Chyba: '+e.message);}
}

// ─── UPDATE METRICS ───────────────────────────────────
function updateMetrics(idx){
  const h=WD.hourly;
  let t,feel,ws,wg,hum,dew,pres,cloud,precip,timeStr;
  if(idx===null){
    const c=WD.current;
    const ci=Math.max(0,h.time.findIndex(t=>new Date(t)>Date.now())-1);
    t=c.temperature_2m;feel=c.apparent_temperature;ws=c.wind_speed_10m;wg=c.wind_gusts_10m;
    hum=c.relative_humidity_2m;dew=h.dewpoint_2m[ci];pres=c.surface_pressure;cloud=c.cloud_cover;precip=c.precipitation;
    timeStr='teď';
  }else{
    const {s}=getSlice();const i=s+idx;
    t=h.temperature_2m[i];feel=h.apparent_temperature[i];ws=h.wind_speed_10m[i];wg=h.wind_gusts_10m[i];
    hum=h.relative_humidity_2m[i];dew=h.dewpoint_2m[i];pres=h.surface_pressure[i];cloud=h.cloud_cover[i];precip=h.precipitation[i];
    timeStr=new Date(h.time[i]).toLocaleString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  document.getElementById('mTemp').textContent=Math.round(t);
  document.getElementById('mFeel').textContent=(feel>=0?'+':'')+Math.round(feel)+'°';
  document.getElementById('mWind').textContent=Math.round(ws);
  document.getElementById('mGust').textContent='▲'+Math.round(wg);
  document.getElementById('mCloud').textContent=Math.round(cloud)+'%';
  document.getElementById('mPrecip').textContent=(precip||0).toFixed(1)+'mm';
  document.getElementById('mHum').textContent=Math.round(hum)+'%';
  document.getElementById('mDew').textContent=(dew>=0?'+':'')+Math.round(dew)+'°';
  document.getElementById('mPres').textContent=Math.round(pres);
  document.getElementById('mPres2').textContent='hPa';
  document.getElementById('mTime').textContent=timeStr;
}

function setState(ico,msg){
  document.getElementById('metricsWrap').style.display='none';document.getElementById('chartSection').style.display='none';
  const el=document.getElementById('stateDiv');el.style.display='block';el.innerHTML=`<div class="state-ico">${ico}</div><span>${msg}</span>`;
}
function setStatus(msg){document.getElementById('statusBar').textContent=msg;}

function setTab(el){
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');currentTab=el.dataset.tab;if(WD)draw();
}
function switchTabByName(tab){
  currentTab=tab;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  if(WD)draw();
}

// ─── SLICE ───────────────────────────────────────────
function getSlice(){
  const times=WD.hourly.time,nowMs=Date.now();
  let cur=times.findIndex(t=>new Date(t).getTime()>nowMs)-1;if(cur<0)cur=0;
  const back=5,fwd=hoursVisible-back;
  const s=Math.max(0,cur-back),e=Math.min(times.length-1,cur+fwd);
  return{s,e,cur,split:cur-s};
}

// ─── CANVAS INIT ─────────────────────────────────────
function initCanvas(){
  if(CV)return;
  CV=document.getElementById('chartCanvas');CX=CV.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',()=>{resizeCanvas();if(WD)draw();});
  CV.addEventListener('mousemove',e=>{if(!WD)return;const r=CV.getBoundingClientRect();setHoverX(e.clientX-r.left);});
  CV.addEventListener('mouseleave',()=>{hoverIdx=null;if(WD)draw();updateMetrics(null);});
  CV.addEventListener('touchstart',onTS,{passive:false});
  CV.addEventListener('touchmove',onTM,{passive:false});
  CV.addEventListener('touchend',onTE,{passive:false});
}
function resizeCanvas(){
  const sec=document.getElementById('chartSection');
  const lb=document.getElementById('legendBar');
  const H=sec.offsetHeight-lb.offsetHeight-2;
  CV.width=sec.offsetWidth;CV.height=Math.max(H,180);
  CV.style.width='100%';CV.style.height=CV.height+'px';
}

// ─── TOUCH HANDLERS ──────────────────────────────────
function onTS(e){
  if(e.touches.length===2){
    pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchStartHours=hoursVisible;touchStartX=null;isScrolling=null;return;
  }
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;touchStartTime=Date.now();
  isScrolling=null;pinchStartDist=null;
}
function onTM(e){
  e.preventDefault();
  if(!WD)return;
  // pinch zoom
  if(e.touches.length===2&&pinchStartDist!==null){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    hoursVisible=Math.round(Math.max(HOURS_MIN,Math.min(HOURS_MAX,pinchStartHours*(pinchStartDist/d))));
    hoverIdx=null;draw();return;
  }
  if(e.touches.length!==1||touchStartX===null)return;
  const tx=e.touches[0].clientX;
  // Always update hover crosshair as finger moves – no direction restriction
  const r=CV.getBoundingClientRect();
  setHoverX(tx-r.left);
}
function onTE(e){
  if(e.changedTouches.length===1&&touchStartX!==null){
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){
      // swipe between tabs (wraps around)
      const ti=TABS.indexOf(currentTab);
      if(dx<0) switchTabByName(TABS[(ti+1)%TABS.length]);
      else     switchTabByName(TABS[(ti-1+TABS.length)%TABS.length]);
    }
  }
  hoverIdx=null;touchStartX=null;pinchStartDist=null;isScrolling=null;
  if(WD){draw();updateMetrics(null);}
}

function setHoverX(mx){
  const L=getLayout(),total=getSlice().e-getSlice().s+1;
  const chartW=CV.width-L.pL-L.pR;
  let idx=Math.round((mx-L.pL)/chartW*(total-1));
  idx=Math.max(0,Math.min(total-1,idx));
  if(idx!==hoverIdx){hoverIdx=idx;draw();updateMetrics(idx);}
}

// ─── LAYOUT ──────────────────────────────────────────
function getLayout(){
  const W=CV.width,H=CV.height;
  const pL=42,pR=44;
  const TIME_H=28;
  const ICON_H=20; // slightly taller to avoid overlap with cloud bands
  const ARROW_H=currentTab==='wind'?14:0;
  const PRECIP_H=currentTab==='cloud'?0:32;
  const topPad=ICON_H+ARROW_H+4;
  const chartH=H-topPad-PRECIP_H-TIME_H;
  const {s,e}=getSlice();const total=e-s+1;
  return{W,H,pL,pR,TIME_H,ICON_H,ARROW_H,PRECIP_H,topPad,chartH,total,s,e};
}
let L_PAD=42,R_PAD=44;

// ─── MASTER DRAW ─────────────────────────────────────
function draw(){
  if(!CV||!WD)return;
  CX.clearRect(0,0,CV.width,CV.height);
  const L=getLayout();const{s,e,split}=getSlice();
  const h=WD.hourly;const idxs=Array.from({length:L.total},(_,i)=>s+i);
  function xOf(i){return L.pL+i*(CV.width-L.pL-L.pR)/(L.total-1);}
  drawIconRow(L,idxs,h,xOf);
  if(currentTab==='wind')drawWindArrows(L,idxs,h,xOf);
  const cTop=L.topPad,cBot=L.topPad+L.chartH;
  drawMidnightLines(idxs,cTop,cBot,xOf);
  drawNowLine(split,cTop,cBot,xOf);
  if(currentTab==='temp')drawTemp(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='wind')drawWind(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='cloud')drawCloud(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='hum')drawHum(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='pressure')drawPressure(L,idxs,h,xOf,cTop,cBot,split);
  if(currentTab!=='cloud')drawPrecipOverlay(L,idxs,h,xOf,cBot);
  drawTimeAxis(L,idxs,xOf);
  if(hoverIdx!==null)drawCrosshair(hoverIdx,cTop,cBot,xOf);
  // PF watermark – more visible
  CX.save();CX.font=`bold ${Math.min(CV.width/4,60)}px sans-serif`;CX.fillStyle='rgba(120,160,200,0.09)';
  CX.textAlign='center';CX.textBaseline='middle';CX.fillText('PF',CV.width/2,cTop+(cBot-cTop)/2);CX.restore();
}

// ─── ICON ROW ────────────────────────────────────────
function wmoIcon(code,isDay){
  if(code===0)return isDay?'☀':'✦'; // plain text sun/star to avoid emoji background
  if(code===1)return isDay?'🌤':'🌤';if(code===2)return '⛅';if(code===3)return '☁';
  if(code<=49)return '≋';if(code<=57)return '🌦';if(code<=67)return '🌧';
  if(code<=77)return '❄';if(code<=82)return '🌧';if(code<=86)return '❄';return '⛈';
}
function cloudFracIcon(pct,isDay){
  if(pct<15)return isDay?'☀':'✦';
  if(pct<40)return isDay?'⛅':'🌤';if(pct<70)return '⛅';if(pct<95)return '☁';return '☁';
}
function drawIconRow(L,idxs,h,xOf){
  const y=L.ICON_H/2+1;
  const step=(CV.width-L.pL-L.pR)/(L.total-1);
  const every=step<14?6:step<20?3:1;
  CX.save();
  // use plain text font – no emoji backgrounds on mobile
  CX.font='12px sans-serif';CX.textAlign='center';CX.textBaseline='middle';CX.fillStyle='#a0c8e8';
  for(let i=0;i<L.total;i+=every){
    const idx=idxs[i];const code=h.weathercode[idx],isDay=h.is_day[idx];
    let icon;
    if(code<=1)icon=cloudFracIcon(h.cloud_cover[idx],isDay);
    else icon=wmoIcon(code,isDay);
    // draw as text (no emoji box rendering on mobile)
    CX.fillText(icon,xOf(i),y);
  }
  CX.restore();
}

// ─── WIND ARROWS ─────────────────────────────────────
const DIR_CH=['↑','↗','→','↘','↓','↙','←','↖'];
function dirArrow(deg){return DIR_CH[Math.round(((deg+180)%360)/45)%8];}
function drawWindArrows(L,idxs,h,xOf){
  const y=L.ICON_H+L.ARROW_H/2+2;
  const wsAll=idxs.map(i=>h.wind_speed_10m[i]);
  const maxWs=Math.max(...wsAll,1);
  const step=(CV.width-L.pL-L.pR)/(L.total-1);
  const every=step<9?2:1;
  CX.save();CX.textAlign='center';CX.textBaseline='middle';
  // Use monospace to prevent emoji-button rendering on mobile
  for(let i=0;i<L.total;i+=every){
    const idx=idxs[i];const ws=h.wind_speed_10m[idx];
    const frac=ws/maxWs;
    const alpha=0.3+0.7*frac;
    const size=Math.round(8+frac*5);
    CX.font=`${size}px monospace`;
    CX.fillStyle=`rgba(140,190,220,${alpha})`;
    // draw arrow as path instead of text to avoid OS emoji rendering
    const x=xOf(i),deg=h.wind_direction_10m[idx];
    const goRad=((deg+180)%360)*Math.PI/180;
    const r=size*0.45;
    CX.save();CX.translate(x,y);CX.rotate(goRad);
    CX.strokeStyle=`rgba(140,190,220,${alpha})`;CX.lineWidth=0.8+frac*1.2;
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(0,r);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(-r*0.45,r*0.1);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(r*0.45,r*0.1);CX.stroke();
    CX.restore();
  }
  CX.restore();
}

// ─── HELPERS ─────────────────────────────────────────
function valToY(v,mn,mx,cTop,cBot){return cBot-(v-mn)/(mx-mn)*(cBot-cTop);}

function drawFilledLine(vals,xOf,cTop,cBot,mn,mx,strokeColor,fillColor,dash){
  CX.save();
  if(fillColor){
    CX.beginPath();let started=false;
    for(let i=0;i<vals.length;i++){if(vals[i]===null)continue;const x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);if(!started){CX.moveTo(x,cBot);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);}
    for(let i=vals.length-1;i>=0;i--){if(vals[i]!==null){CX.lineTo(xOf(i),cBot);break;}}
    CX.closePath();CX.fillStyle=fillColor;CX.fill();
  }
  CX.beginPath();if(dash)CX.setLineDash(dash);CX.strokeStyle=strokeColor;CX.lineWidth=2;
  let first=true;
  for(let i=0;i<vals.length;i++){if(vals[i]===null){first=true;continue;}const x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);if(first){CX.moveTo(x,y);first=false;}else CX.lineTo(x,y);}
  CX.stroke();CX.setLineDash([]);CX.restore();
}

// Data labels at ALL local extrema with anti-overlap
function drawDataLabels(vals,xOf,cTop,cBot,mn,mx,unit,color,fontSize){
  CX.save();
  const fs=fontSize||11;
  CX.font=`bold ${fs}px sans-serif`;CX.fillStyle=color||'rgba(220,240,255,0.95)';CX.textAlign='center';
  const placed=[]; // [{x,y}] already drawn labels
  const minDist=fs*2.5; // minimum pixel distance between labels
  for(let i=1;i<vals.length-1;i++){
    const v=vals[i],p=vals[i-1],n=vals[i+1];
    if(v===null||p===null||n===null)continue;
    const isMax=v>=p&&v>=n&&(v>p+0.1||v>n+0.1);
    const isMin=v<=p&&v<=n&&(v<p-0.1||v<n-0.1);
    if(!isMax&&!isMin)continue;
    const x=xOf(i),y=valToY(v,mn,mx,cTop,cBot);
    const ly=isMax?y-6:y+13;
    // check distance from all already placed labels
    const tooClose=placed.some(p=>Math.hypot(p.x-x,p.y-ly)<minDist);
    if(tooClose)continue;
    placed.push({x,y:ly});
    CX.fillText(Math.round(v)+(unit||''),x,ly);
  }
  CX.restore();
}

// Left axis with fixed step, grid lines, minor ticks
function drawLeftAxisStep(mn,mx,cTop,cBot,step,unit,color,gridColor){
  CX.save();
  const lo=Math.ceil(mn/step)*step,hi=Math.floor(mx/step)*step;
  // first pass: draw grid lines BEHIND everything
  for(let v=lo;v<=hi+0.001;v+=step){
    const y=valToY(v,mn,mx,cTop,cBot);
    CX.strokeStyle='rgba(60,100,160,0.35)';
    CX.lineWidth=1;
    CX.setLineDash([3,3]);
    CX.beginPath();CX.moveTo(L_PAD,y);CX.lineTo(CV.width-R_PAD,y);CX.stroke();
    CX.setLineDash([]);
  }
  // second pass: axis labels on top
  CX.textAlign='right';CX.font='9px sans-serif';CX.fillStyle=color||'#7090b0';
  for(let v=lo;v<=hi+0.001;v+=step){
    const y=valToY(v,mn,mx,cTop,cBot);
    CX.fillText(Math.round(v)+(unit||''),L_PAD-3,y+3);
  }
  CX.restore();
}
function drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color,drawGrid){
  const range=mx-mn;
  const rawStep=range/4;
  const mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
  const niceStep=[1,2,5,10].map(s=>s*mag).find(s=>range/s<=6)||rawStep;
  drawLeftAxisStep(mn,mx,cTop,cBot,niceStep,unit,color,'rgba(60,100,160,0.35)');
}
function drawRightAxis(mn,mx,cTop,cBot,unit,color){
  CX.save();CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle=color||'#507090';
  const steps=4;
  for(let i=0;i<=steps;i++){const v=mn+(mx-mn)*i/steps;const y=valToY(v,mn,mx,cTop,cBot);CX.fillText((Math.round(v*10)/10)+(unit||''),CV.width-R_PAD+2,y+3);}
  CX.restore();
}

// ─── PRECIP OVERLAY ──────────────────────────────────
function drawPrecipOverlay(L,idxs,h,xOf,cBot){
  const pr=idxs.map(i=>h.precipitation[i]),sn=idxs.map(i=>h.snowfall[i]);
  const maxPr=Math.max(...pr,...sn,0.5);
  const pTop=cBot,pBot=cBot+L.PRECIP_H-2;
  const barW=Math.max(1,(CV.width-L.pL-L.pR)/(L.total)-0.5);
  CX.save();
  for(let i=0;i<L.total;i++){
    const x=xOf(i)-barW/2;
    const rH=(pr[i]||0)/maxPr*(pBot-pTop),sH=(sn[i]||0)/maxPr*(pBot-pTop);
    if(rH>0.2){CX.fillStyle='rgba(60,140,255,0.7)';CX.fillRect(x,pBot-rH,barW,rH);}
    if(sH>0.2){CX.fillStyle='rgba(180,220,255,0.6)';CX.fillRect(x,pBot-rH-sH,barW,sH);}
  }
  CX.strokeStyle='rgba(30,60,100,0.4)';CX.lineWidth=1;CX.beginPath();CX.moveTo(L.pL,pTop);CX.lineTo(CV.width-R_PAD,pTop);CX.stroke();
  CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle='#3c7aaa';
  CX.fillText(maxPr.toFixed(1)+'mm',CV.width-R_PAD+2,pTop+8);CX.fillText('0',CV.width-R_PAD+2,pBot+3);
  CX.restore();
}

// ─── TEMP ────────────────────────────────────────────
function drawTemp(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const temps=idxs.map(i=>h.temperature_2m[i]),feels=idxs.map(i=>h.apparent_temperature[i]);
  const allV=[...temps,...feels].filter(v=>v!==null);
  const rawMn=Math.min(...allV),rawMx=Math.max(...allV);
  const mn=Math.floor((rawMn-3)/5)*5,mx=Math.ceil((rawMx+3)/5)*5;

  if(mn<0&&mx>0){
    CX.save();CX.strokeStyle='rgba(100,150,220,0.35)';CX.lineWidth=1;CX.setLineDash([4,4]);
    const y0=valToY(0,mn,mx,cTop,cBot);CX.beginPath();CX.moveTo(L.pL,y0);CX.lineTo(CV.width-L.pR,y0);CX.stroke();CX.setLineDash([]);CX.restore();
  }
  function makeTG(alpha){
    const g=CX.createLinearGradient(0,cTop,0,cBot);
    if(mn>=0){g.addColorStop(0,`rgba(255,130,30,${alpha})`);g.addColorStop(1,`rgba(255,130,30,0.02)`);}
    else if(mx<=0){g.addColorStop(0,`rgba(100,180,255,${alpha})`);g.addColorStop(1,`rgba(100,180,255,0.02)`);}
    else{const zf=mx/(mx-mn);g.addColorStop(0,`rgba(255,130,30,${alpha})`);g.addColorStop(Math.min(0.99,zf-0.01),`rgba(255,130,30,${alpha*0.25})`);g.addColorStop(Math.min(0.99,zf+0.01),`rgba(100,180,255,${alpha*0.25})`);g.addColorStop(1,`rgba(100,180,255,0.02)`);}
    return g;
  }
  // draw grid FIRST so lines appear behind the chart
  drawLeftAxisStep(mn,mx,cTop,cBot,5,'°C','#7090b0','rgba(60,100,160,0.35)');
  drawFilledLine(temps,xOf,cTop,cBot,mn,mx,'#ff8c28',makeTG(0.6),null);
  drawFilledLine(temps.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#ff8c28',null,null);
  drawFilledLine(temps.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#ff8c28',null,[6,4]);
  drawFilledLine(feels.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#5ab0ff',null,null);
  drawFilledLine(feels.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#5ab0ff',null,[4,4]);
  // data labels
  drawDataLabels(temps,xOf,cTop,cBot,mn,mx,'°','rgba(255,210,130,1.0)',11);
  drawDataLabels(feels,xOf,cTop,cBot,mn,mx,'°','rgba(150,210,255,0.95)',11);
  setLegend([{color:'#ff8c28',label:'Teplota °C',dash:false},{color:'#ff8c28',label:'předpověď',dash:true},{color:'#5ab0ff',label:'Pocitová °C',dash:false}]);
}

// ─── WIND ────────────────────────────────────────────

  L_PAD=L.pL;R_PAD=L.pR;

// ─── CLOUD ───────────────────────────────────────────
function drawCloud(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  // shrink cloud area: leave room for integrated precip (30px) + time axis (28px)
  const cloudTop=cTop+4;
  const cloudBot=cBot-30; // pull bottom up so precip+time axis fits below
  const KM=[0,2,6.5,10];
  function kmToY(km){return cloudBot-(km/10)*(cloudBot-cloudTop);}
  CX.save();
  KM.forEach(km=>{
    const y=kmToY(km);CX.strokeStyle='rgba(40,80,140,0.4)';CX.lineWidth=1;CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(CV.width-L.pR,y);CX.stroke();
    CX.fillStyle='#507090';CX.font='9px sans-serif';CX.textAlign='right';CX.fillText(km===0?'0km':km+'km',L.pL-2,y+3);
  });
  function drawBand(data,yTop,yBot,color){
    CX.save();CX.beginPath();let started=false;
    for(let i=0;i<L.total;i++){const pct=Math.min(100,Math.max(0,data[i]||0))/100,y=yBot-pct*(yBot-yTop),x=xOf(i);if(!started){CX.moveTo(x,yBot);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);}
    CX.lineTo(xOf(L.total-1),yBot);CX.lineTo(xOf(0),yBot);CX.closePath();CX.fillStyle=color;CX.fill();CX.restore();
  }
  const clH=idxs.map(i=>h.cloud_cover_high[i]),clM=idxs.map(i=>h.cloud_cover_mid[i]),clL=idxs.map(i=>h.cloud_cover_low[i]),clT=idxs.map(i=>h.cloud_cover[i]);
  drawBand(clH,kmToY(10),kmToY(6.5),'rgba(200,220,255,0.2)');
  drawBand(clM,kmToY(6.5),kmToY(2),'rgba(128,148,196,0.3)');
  drawBand(clL,kmToY(2),kmToY(0),'rgba(80,100,164,0.4)');
  // extrema % labels in each band
  function cloudBandLabels(data,yTop,yBot,color){
    CX.save();CX.font='bold 9px sans-serif';CX.fillStyle=color;CX.textAlign='center';
    for(let i=1;i<L.total-1;i++){
      const v=data[i],p=data[i-1],n=data[i+1];
      if(v===null||p===null||n===null)continue;
      const isMax=v>=p&&v>=n&&(v>p+3||v>n+3)&&v>10;
      const isMin=v<=p&&v<=n&&(v<p-3||v<n-3);
      if(!isMax&&!isMin)continue;
      const bandH=yBot-yTop;
      const pct=Math.min(100,Math.max(0,v))/100;
      const y=yBot-pct*bandH;
      CX.fillText(Math.round(v)+'%',xOf(i),isMax?y-4:y+10);
    }
    CX.restore();
  }
  cloudBandLabels(clH,kmToY(10),kmToY(6.5),'rgba(200,225,255,0.9)');
  cloudBandLabels(clM,kmToY(6.5),kmToY(2),'rgba(170,190,230,0.9)');
  cloudBandLabels(clL,kmToY(2),kmToY(0),'rgba(130,155,210,0.9)');
  // current hover value labels on right edge
  const hi=hoverIdx!==null?hoverIdx:getSlice().split;
  CX.save();CX.textAlign='right';CX.font='bold 9px sans-serif';const labX=CV.width-L.pR-2;
  CX.fillStyle='rgba(200,225,255,0.85)';CX.fillText('H:'+Math.round(clH[hi])+'%',labX,kmToY(8)+3);
  CX.fillStyle='rgba(170,190,230,0.85)';CX.fillText('M:'+Math.round(clM[hi])+'%',labX,kmToY(4.2)+3);
  CX.fillStyle='rgba(130,155,210,0.85)';CX.fillText('L:'+Math.round(clL[hi])+'%',labX,kmToY(1)+3);
  CX.fillStyle='rgba(220,235,255,0.95)';CX.fillText('∑:'+Math.round(clT[hi])+'%',labX,kmToY(0)-8);
  CX.restore();
  // precip bars below cloudBot (not cBot)
  const pr=idxs.map(i=>h.precipitation[i]),sn=idxs.map(i=>h.snowfall[i]);
  const maxPr=Math.max(...pr,...sn,0.5);
  const PRECIP_H_C=28,pTop2=cloudBot,pBot2=cloudBot+PRECIP_H_C;
  const barW=Math.max(1,(CV.width-L.pL-L.pR)/(L.total)-0.5);
  CX.save();
  for(let i=0;i<L.total;i++){const x=xOf(i)-barW/2;const rH=(pr[i]||0)/maxPr*(pBot2-pTop2),sH=(sn[i]||0)/maxPr*(pBot2-pTop2);if(rH>0.2){CX.fillStyle='rgba(60,140,255,0.75)';CX.fillRect(x,pBot2-rH,barW,rH);}if(sH>0.2){CX.fillStyle='rgba(180,220,255,0.65)';CX.fillRect(x,pBot2-rH-sH,barW,sH);}}
  CX.strokeStyle='rgba(30,60,100,0.45)';CX.lineWidth=1;CX.beginPath();CX.moveTo(L.pL,pTop2);CX.lineTo(CV.width-L.pR,pTop2);CX.stroke();
  CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle='#3c7aaa';CX.fillText(maxPr.toFixed(1)+'mm',CV.width-L.pR+2,pTop2+8);CX.restore();
  setLegend([{color:'#c8deff',label:'Vysoká >6.5km',dash:false},{color:'#8090b8',label:'Střední 2–6.5km',dash:false},{color:'#506098',label:'Nízká 0–2km',dash:false},{color:'#3c8cff',label:'Srážky mm',dash:false}]);
  // time axis offset for cloud: starts at cloudBot+PRECIP_H_C
  // (handled in drawTimeAxis via precipOff=30 already)
}

// ─── HUM ─────────────────────────────────────────────
function drawHum(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const hu=idxs.map(i=>h.relative_humidity_2m[i]),dp=idxs.map(i=>h.dewpoint_2m[i]);
  const mn=0,mx=100,dpMn=Math.min(...dp)-2,dpMx=Math.max(...dp)+2;
  // grid lines for humidity (left axis only) – drawn first
  drawLeftAxisStep(mn,mx,cTop,cBot,25,'%','#5090a0','rgba(60,100,160,0.35)');
  // right axis for dew point °C (no grid)
  drawRightAxis(dpMn,dpMx,cTop,cBot,'°C','#4a7090');
  const grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(60,200,240,0.55)');grad.addColorStop(1,'rgba(60,200,240,0.02)');
  drawFilledLine(hu,xOf,cTop,cBot,mn,mx,'#3cc8f0',grad,null);
  drawFilledLine(hu.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,null);
  drawFilledLine(hu.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,[6,4]);
  drawFilledLine(dp.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,null);
  drawFilledLine(dp.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,[4,4]);
  drawDataLabels(hu,xOf,cTop,cBot,mn,mx,'%','rgba(100,220,250,0.95)',11);
  drawDataLabels(dp,xOf,cTop,cBot,dpMn,dpMx,'°','rgba(160,224,255,0.95)',11);
  setLegend([{color:'#3cc8f0',label:'Vlhkost %',dash:false},{color:'#a0e0ff',label:'Rosný bod °C →',dash:false}]);
}

// ─── PRESSURE ────────────────────────────────────────
function drawPressure(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const pr=idxs.map(i=>h.surface_pressure[i]);
  const rawMn=Math.min(...pr),rawMx=Math.max(...pr);
  const mn=Math.floor((rawMn-2)/5)*5,mx=Math.ceil((rawMx+2)/5)*5;
  const grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(180,120,255,0.55)');grad.addColorStop(1,'rgba(180,120,255,0.02)');
  drawLeftAxisAuto(mn,mx,cTop,cBot,' hPa','#9070b8',true);
  drawFilledLine(pr,xOf,cTop,cBot,mn,mx,'#c080ff',grad,null);
  drawFilledLine(pr.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#c080ff',null,null);
  drawFilledLine(pr.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#c080ff',null,[6,4]);
  drawDataLabels(pr,xOf,cTop,cBot,mn,mx,'','rgba(210,170,255,0.95)',11);
  setLegend([{color:'#c080ff',label:'Tlak hPa',dash:false},{color:'#c080ff',label:'předpověď',dash:true}]);
}

// ─── LEGEND ──────────────────────────────────────────
function setLegend(items){
  document.getElementById('legendBar').innerHTML=items.map(it=>`<div class="leg"><div class="leg-swatch" style="${it.dash?'background:repeating-linear-gradient(90deg,'+it.color+' 0,'+it.color+' 4px,transparent 4px,transparent 8px)':'background:'+it.color}"></div>${it.label}</div>`).join('');
}
</script>
