<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUN-SKY (by PF)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080c14;color:#d8eaff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;border-bottom:1px solid #1e3050}
.hdr-title{font-size:15px;font-weight:700;color:#f0f6ff;flex:1}
.hdr-time{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums}
.loc-bar{padding:6px 8px;border-bottom:1px solid #1e3050;display:flex;flex-direction:column;gap:5px}
.loc-row{display:flex;gap:5px;align-items:center}
.loc-input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:7px 10px;font-size:13px;outline:none;min-width:0}
.loc-input::placeholder{color:#3a5a7a}
.loc-input:focus{border-color:#3a6aaa}
.loc-btn{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1}
.loc-btn:active{background:#1a2840}
.gps-row{display:flex;gap:5px;align-items:center}
.gps-row input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:7px 10px;font-size:13px;outline:none;min-width:0}
.gps-go{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0}
.gps-go:active{background:#12295a}
.font-btn{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:7px 10px;font-size:11px;cursor:pointer;font-weight:700;flex-shrink:0}
.sug-box{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;overflow:hidden;display:none;max-height:260px;overflow-y:auto}
.sug-box.open{display:block}
.sug-section{font-size:10px;color:#3a5a7a;padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid #142030}
.sug-section:first-child{border-top:none}
.sug-item{padding:9px 10px;font-size:13px;color:#b0cce8;cursor:pointer;border-bottom:1px solid #0e1a2e;display:flex;align-items:center;gap:6px}
.sug-item:hover,.sug-item:active{background:#142030}
.sug-item b{color:#60b8ff}
.sug-sub{font-size:11px;color:#486080;flex:1}
.sug-coords{font-size:10px;color:#2a4060;margin-left:auto}
.pin-btn{width:18px;height:18px;flex-shrink:0;cursor:pointer;font-size:13px;opacity:0.4;user-select:none}
.pin-btn.pinned{opacity:1}
.recent-chips{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.recent-chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:3px;background:#0e1a2e;border:1px solid #243a60;border-radius:20px;padding:3px 8px 3px 5px;font-size:11px;color:#90b8d8;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip:hover{background:#142030}
.chip-pin{font-size:11px;opacity:.4}
.chip-pin.pinned{opacity:1}
.chip-del{font-size:10px;opacity:.4;margin-left:2px}
.chip-del:hover{opacity:.8;color:#ff6060}
.lang-popup,.fontsize-popup{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,10,20,.93);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
.lang-popup.open,.fontsize-popup.open{display:flex}
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:380px;width:100%}
.lang-item{background:#0e1a2e;border:1px solid #243a60;border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;font-size:12px;color:#b0cce8;display:flex;flex-direction:column;align-items:center;gap:4px}
.lang-item:hover,.lang-item.active{background:#1a3060;border-color:#3a6aaa}
.lang-flag{font-size:22px;line-height:1}
.lang-close{background:#1a2840;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:8px 24px;font-size:13px;cursor:pointer;margin-top:8px}
.fontsize-opts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px}
.fso{background:#0e1a2e;border:1px solid #243a60;border-radius:10px;padding:12px 18px;cursor:pointer;color:#b0cce8;text-align:center}
.fso:hover,.fso.active{background:#1a3060;border-color:#5ab0ff}
.metrics-outer{border-bottom:1px solid #1e3050;background:#090f1c;overflow-x:auto;scrollbar-width:none}
.metrics-outer::-webkit-scrollbar{display:none}
.metrics-inner{display:flex;min-width:max-content}
.mtile{flex:0 0 auto;width:110px;background:#0a1220;border:2px solid transparent;border-radius:10px;margin:5px 4px;padding:7px 8px;cursor:pointer;transition:border-color .18s,background .18s;user-select:none}
.mtile:active{background:#0e1a30}
.mtile.active{border-color:#58b0ff;background:#0c1830;box-shadow:0 0 14px rgba(88,176,255,.3)}
.mtile-icon{font-size:13px;margin-bottom:2px}
.mtile-label{font-size:10px;font-weight:600;color:#507090;letter-spacing:.02em;text-transform:uppercase;margin-bottom:4px}
.mtile.active .mtile-label{color:#5ab0ff}
.mtile-val{font-size:17px;font-weight:700;color:#f0f8ff;font-variant-numeric:tabular-nums;line-height:1}
.mtile-sub{font-size:11px;color:#90b8d8;margin-top:1px;font-variant-numeric:tabular-nums}
.mtile-unit{font-size:8px;color:#3a5a80;margin-top:2px}
.metric-time-bar{text-align:center;font-size:10px;color:#507090;padding:2px 8px 4px;background:#090f1c;border-top:1px solid #1e3050;display:flex;align-items:center;justify-content:center;gap:8px}
#chartCanvas{display:block;width:100%;touch-action:none}
.legend-bar{display:flex;gap:10px;flex-wrap:wrap;padding:3px 10px 5px;background:#080c14}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#607090}
.leg-swatch{width:16px;height:2px;flex-shrink:0}
.state{text-align:center;padding:50px 20px;color:#507090;font-size:13px;line-height:1.8}
.state-ico{font-size:36px;margin-bottom:10px}
.status{font-size:10px;color:#1e3050;padding:3px 10px 5px;text-align:right}
.datasrc{text-align:center;font-size:10px;color:#4e6c90;padding-bottom:8px}
.pf-logo{position:fixed;bottom:8px;left:10px;z-index:100;opacity:.5;pointer-events:none}
.pf-cloud{background:#2a3a50;border-radius:8px;padding:2px 5px 2px 3px;font-size:11px;font-weight:700;color:#d4b820;display:flex;align-items:center;gap:2px}
#chartSection{transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s;transform-style:preserve-3d}
.chart-cube-next{transform:perspective(1200px) rotateY(-15deg) translateX(-15px);opacity:.4}
.chart-cube-prev{transform:perspective(1200px) rotateY(15deg) translateX(15px);opacity:.4}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;position:relative;overflow:hidden">

  <div class="hdr">
    <span style="font-size:20px">🌤</span>
    <span class="hdr-title">SUN-SKY <span style="color:#7090b0;font-weight:400;font-size:12px">v18 (by PF)</span></span>
    <span class="hdr-time" id="clock">--:--</span>
  </div>

  <div class="loc-bar">
    <div class="loc-row">
      <input class="loc-input" id="cityQ" placeholder="Název obce nebo města…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="loc-btn" id="gpsBtn" title="GPS">📍</button>
      <button class="loc-btn" id="langBtn" title="Jazyk">🇨🇿</button>
    </div>
    <div class="sug-box" id="sugBox"></div>
    <div class="recent-chips" id="recentChips"></div>
    <div class="gps-row">
      <input class="loc-input" id="latIn" placeholder="Zeměšířka" type="number" step="0.0001">
      <input class="loc-input" id="lonIn" placeholder="Zemědelšířka" type="number" step="0.0001">
      <button class="gps-go" id="goBtn">GO</button>
      <button class="font-btn" id="fontBtn"><span style="font-size:9px">T</span><span style="font-size:11px">E</span><span style="font-size:13px">X</span><span style="font-size:15px">T</span><span style="font-size:17px">+</span></button>
    </div>
  </div>

  <div class="metrics-outer" id="metricsWrap" style="display:none">
    <div class="metrics-inner" id="metricsTiles"></div>
    <div class="metric-time-bar">
      <span id="mTime">teď</span>
      <button id="cloudModeBtn" style="background:#14243a;color:#9fd0ff;border:1px solid #345070;border-radius:6px;padding:1px 8px;font-size:10px">A/B</button>
      <button id="extraGraphsBtn" style="background:#14243a;color:#9fd0ff;border:1px solid #345070;border-radius:6px;padding:1px 8px;font-size:10px">+ Grafy</button>
    </div>
  </div>

  <div id="chartSection" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <canvas id="chartCanvas"></canvas>
    <div class="legend-bar" id="legendBar"></div>
  </div>

  <div class="state" id="stateDiv">
    <div class="state-ico">🔍</div>
    Zadej název obce, použij GPS<br>nebo zadej souřadnice
  </div>
  <div class="status" id="statusBar"></div>
  <div class="datasrc" id="dataSrc">Data: Open-Meteo / ECMWF / ICON / GFS</div>

  <div class="lang-popup" id="langPopup">
    <div style="font-size:14px;color:#90b8d8;margin-bottom:4px">Vyberte jazyk / Select language</div>
    <div class="lang-grid" id="langGrid"></div>
    <button class="lang-close" id="langClose">✕ Zavřít</button>
  </div>

  <div class="fontsize-popup" id="fontsizePopup">
    <div style="font-size:14px;color:#90b8d8;margin-bottom:4px">Velikost textu</div>
    <div class="fontsize-opts" id="fontsizeOpts"></div>
    <button class="lang-close" id="fontsizeClose">✕ Zavřít</button>
  </div>
</div>

<div class="pf-logo">
  <div class="pf-cloud"><span style="color:#f0c010">⚡</span>PF<span style="color:#f0a010;font-size:10px">☀</span></div>
</div>

var activeLang=LANGS[0];
(function(){var lc=localStorage.getItem('lang');if(lc){var f=LANGS.filter(function(l){return l.code===lc;});if(f.length)activeLang=f[0];}})();

function T(k){return activeLang.t[k]||LANGS[0].t[k]||k;}
function U(k){return activeLang.units[k]||'';}
function convTemp(v){return activeLang.tempFn(v);}
function convWind(v){return activeLang.windFn(v);}
function convPress(v){return activeLang.pressFn(v);}
function fmtTemp(v){return Math.round(convTemp(v))+U('temp');}
function fmtWind(v){return Math.round(convWind(v));}
function fmtPress(v){var p=convPress(v);return U('pres')==='inHg'?p.toFixed(2):Math.round(p);}

function applyLang(){
  document.getElementById('cityQ').placeholder=T('search');
  document.getElementById('langBtn').textContent=activeLang.flag;
  document.getElementById('dataSrc').textContent=T('data');
  renderRecentChips();
  if(WD)updateMetrics(null);
}

function openLang(){
  var grid=document.getElementById('langGrid');
  grid.innerHTML=LANGS.map(function(l){
    return '<div class="lang-item'+(l.code===activeLang.code?' active':'')+'" onclick="selectLang(\''+l.code+'\')"><div class="lang-flag">'+l.flag+'</div><div>'+l.name+'</div></div>';
  }).join('');
  document.getElementById('langPopup').classList.add('open');
}
function closeLang(){document.getElementById('langPopup').classList.remove('open');}
function selectLang(code){
  var f=LANGS.filter(function(l){return l.code===code;});
  if(f.length)activeLang=f[0];
  localStorage.setItem('lang',code);
  closeLang();applyLang();if(WD)draw();
}

// ── FONT SIZE ────────────────────────────────────────
var FONT_SCALES=['xs','s','m','l','xl'];
var FONT_SIZES={xs:'11px',s:'12px',m:'14px',l:'16px',xl:'18px'};
var FONT_LABELS={xs:'XS – nejmenší',s:'S – malý',m:'M – střední',l:'L – velký',xl:'XL – největší'};
var currentFontScale=localStorage.getItem('fontScale')||'m';
function applyFontScale(){document.documentElement.style.fontSize=FONT_SIZES[currentFontScale]||'14px';}
applyFontScale();
function openFontSize(){
  var opts=document.getElementById('fontsizeOpts');
  opts.innerHTML=FONT_SCALES.map(function(s){
    return '<div class="fso'+(s===currentFontScale?' active':'')+'" onclick="selectFontSize(\''+s+'\')">'+FONT_LABELS[s]+'</div>';
  }).join('');
  document.getElementById('fontsizePopup').classList.add('open');
}
function closeFontSize(){document.getElementById('fontsizePopup').classList.remove('open');}
function selectFontSize(s){currentFontScale=s;localStorage.setItem('fontScale',s);applyFontScale();closeFontSize();}

// ── CLOCK ────────────────────────────────────────────
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
tickClock();setInterval(tickClock,1000);

// ── GLOBALS ──────────────────────────────────────────
var WD=null, currentTab='temp', searchTimer=null;
var CV=null, CX=null;
var DAYS=['Ne','Po','Út','St','Čt','Pá','So'];
var TABS=['temp','cloud','wind','hum','pressure'];
var hoursVisible=77;
var HOURS_MIN=18, HOURS_MAX=120;
var hoverIdx=null;
var cloudMode='A';
var scrollOffset=0;
// touch vars – single declaration
var txStart=null, tyStart=null, tTimeStart=0;
var pinchDist0=null, pinchHours0=null;
var gestureResolved=false, gesturePan=false, gestureHover=false;
var panOffset0=0;
var L_PAD=42, R_PAD=44;

// ── RECENT ───────────────────────────────────────────
function getRecent(){try{return JSON.parse(localStorage.getItem('recentLocations')||'[]');}catch(e){return[];}}
function saveRecent(arr){localStorage.setItem('recentLocations',JSON.stringify(arr));}

function renderRecentChips(){
  var rc=document.getElementById('recentChips');
  var arr=getRecent();
  if(!arr.length){rc.innerHTML='';return;}
  var pinned=arr.filter(function(i){return i.pinned;});
  var unpinned=arr.filter(function(i){return !i.pinned;});
  var sorted=pinned.concat(unpinned);
  rc.innerHTML=sorted.map(function(loc){
    return '<div class="chip"><span class="chip-pin'+(loc.pinned?' pinned':'')+'" onclick="togglePin(event,\''+loc.name+'\')">📌</span>'
      +'<span onclick="chipLoad(\''+loc.name+'\')">'+loc.name+'</span>'
      +'<span class="chip-del" onclick="removeRecent(event,\''+loc.name+'\')">✕</span></div>';
  }).join('');
}
function chipLoad(name){
  var arr=getRecent();var loc=arr.filter(function(l){return l.name===name;})[0];
  if(!loc)return;
  document.getElementById('cityQ').value=loc.name;
  document.getElementById('latIn').value=loc.lat;
  document.getElementById('lonIn').value=loc.lon;
  closeSug();loadWeather(parseFloat(loc.lat),parseFloat(loc.lon),loc.name);
}
function togglePin(e,name){
  e.stopPropagation();
  var arr=getRecent();
  var loc=arr.filter(function(l){return l.name===name;})[0];if(!loc)return;
  var pc=arr.filter(function(l){return l.pinned&&l.name!==name;}).length;
  if(!loc.pinned&&pc>=10){alert('Max. 10 přišpendlených měst.');return;}
  loc.pinned=!loc.pinned;saveRecent(arr);renderRecentChips();
}
function removeRecent(e,name){
  e.stopPropagation();
  saveRecent(getRecent().filter(function(l){return l.name!==name;}));
  renderRecentChips();
}
function addToRecent(lat,lon,name){
  var arr=getRecent().filter(function(i){return i.name!==name;});
  arr.unshift({name:name,lat:lat,lon:lon,pinned:false,time:Date.now()});
  var pinned=arr.filter(function(i){return i.pinned;});
  var unpinned=arr.filter(function(i){return !i.pinned;}).slice(0,20);
  saveRecent(pinned.concat(unpinned));
  renderRecentChips();
}

// ── SEARCH ───────────────────────────────────────────
var cityQ=document.getElementById('cityQ');
var sugBox=document.getElementById('sugBox');
cityQ.addEventListener('focus',function(){
  var q=cityQ.value.trim();
  if(q.length>=2){doSearch(q);}else{showRecentInSug();}
});
cityQ.addEventListener('input',function(){
  clearTimeout(searchTimer);
  var q=cityQ.value.trim();
  if(q.length<2){showRecentInSug();return;}
  searchTimer=setTimeout(function(){doSearch(q);},380);
});
cityQ.addEventListener('keydown',function(e){if(e.key==='Enter'){clearTimeout(searchTimer);doSearch(cityQ.value.trim());}});

function showRecentInSug(){
  var arr=getRecent();if(!arr.length){closeSug();return;}
  var pinned=arr.filter(function(i){return i.pinned;});
  var unpinned=arr.filter(function(i){return !i.pinned;});
  var html='';
  if(pinned.length)html+='<div class="sug-section">📌 '+T('pinned')+'</div>'+pinned.map(renderRecentItem).join('');
  if(unpinned.length)html+='<div class="sug-section">🕐 '+T('recent')+'</div>'+unpinned.slice(0,10).map(renderRecentItem).join('');
  openSug(html);
}
function renderRecentItem(loc){
  return '<div class="sug-item" data-lat="'+loc.lat+'" data-lon="'+loc.lon+'" data-name="'+loc.name+'" onclick="pickSug(this)">'
    +'<span class="pin-btn'+(loc.pinned?' pinned':'')+'" onclick="togglePinSug(event,\''+loc.name+'\')">📌</span>'
    +'<b>'+loc.name+'</b><span class="sug-sub"></span>'
    +'<span class="sug-coords">'+parseFloat(loc.lat).toFixed(3)+', '+parseFloat(loc.lon).toFixed(3)+'</span></div>';
}
function togglePinSug(e,name){e.stopPropagation();togglePin(e,name);showRecentInSug();}

function doSearch(q){
  if(q.length<2)return;
  openSug('<div class="sug-item"><span style="color:#507090">Hledám…</span></div>');
  var lang=activeLang.code.split('-')[0];
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=10&language='+lang+'&format=json')
    .then(function(r){return r.json();})
    .then(function(data){
      var hits=data.results||[];
      if(!hits.length){openSug('<div class="sug-item"><span style="color:#507090">Nenalezeno</span></div>');return;}
      openSug(hits.map(function(d){
        var sub=[d.admin2&&d.admin2!==d.name?d.admin2:'',d.admin1||'',d.country||''].filter(Boolean).join(', ');
        return '<div class="sug-item" data-lat="'+d.latitude+'" data-lon="'+d.longitude+'" data-name="'+d.name+(sub?', '+sub:'')+'" onclick="pickSug(this)"><b>'+d.name+'</b><span class="sug-sub">'+sub+'</span><span class="sug-coords">'+d.latitude.toFixed(3)+', '+d.longitude.toFixed(3)+'</span></div>';
      }).join(''));
    })
    .catch(function(){openSug('<div class="sug-item"><span style="color:#ff6060">Chyba připojení</span></div>');});
}
function openSug(h){sugBox.innerHTML=h;sugBox.className='sug-box open';}
function closeSug(){sugBox.className='sug-box';sugBox.innerHTML='';}
function pickSug(el){
  cityQ.value=el.dataset.name;
  document.getElementById('latIn').value=parseFloat(el.dataset.lat).toFixed(5);
  document.getElementById('lonIn').value=parseFloat(el.dataset.lon).toFixed(5);
  closeSug();loadWeather(parseFloat(el.dataset.lat),parseFloat(el.dataset.lon),el.dataset.name);
}
document.addEventListener('click',function(e){if(!e.target.closest('.loc-bar'))closeSug();});

// ── GPS ──────────────────────────────────────────────
function useGPS(){
  if(!navigator.geolocation){setState('🚫','Geolokace není dostupná');return;}
  setState('📡','Zjišťuji GPS polohu…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    document.getElementById('latIn').value=lat.toFixed(5);
    document.getElementById('lonIn').value=lon.toFixed(5);
    reverseGeocode(lat,lon);
  },function(err){
    var m={1:'GPS zamítnuto.',2:'GPS signál nedostupný.',3:'GPS vypršel.'};
    setState('❌',m[err.code]||'Chyba GPS');
  },{enableHighAccuracy:true,timeout:15000});
}
function reverseGeocode(lat,lon){
  var lang=activeLang.code.split('-')[0];
  fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+lang)
    .then(function(r){return r.json();})
    .then(function(d){
      var name=d.locality||d.city||d.principalSubdivision||(lat.toFixed(4)+','+lon.toFixed(4));
      cityQ.value=name;loadWeather(lat,lon,name+' (GPS)');
    })
    .catch(function(){loadWeather(lat,lon,'GPS '+lat.toFixed(4)+','+lon.toFixed(4));});
}
function useCoords(){
  var lat=parseFloat(document.getElementById('latIn').value),lon=parseFloat(document.getElementById('lonIn').value);
  if(isNaN(lat)||isNaN(lon)){setState('⚠️','Zadej platné souřadnice');return;}
  cityQ.value=lat.toFixed(4)+', '+lon.toFixed(4);
  loadWeather(lat,lon,lat.toFixed(4)+', '+lon.toFixed(4));
}

// ── LOAD WEATHER ─────────────────────────────────────
function loadWeather(lat,lon,name){
  setState('⏳','Načítám data pro <b>'+name+'</b>…');
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,dewpoint_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,snowfall,'
    +'cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,weathercode,is_day'
    +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation,weathercode,is_day'
    +'&forecast_days=4&past_days=1&timezone=auto';
  fetch(url)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      WD=data;scrollOffset=0;
      updateMetrics(null);
      buildMetricTiles();
      document.getElementById('metricsWrap').style.display='block';
      var cs=document.getElementById('chartSection');
      cs.style.display='flex';cs.style.flexDirection='column';
      document.getElementById('stateDiv').style.display='none';
      document.getElementById('dataSrc').textContent=T('data')+' · '+lat.toFixed(4)+', '+lon.toFixed(4);
      initCanvas();draw();
      setStatus('✓ '+name+' · '+new Date().toLocaleTimeString('cs-CZ'));
      addToRecent(lat,lon,name);
      localStorage.setItem('lastLocation',JSON.stringify({lat:lat,lon:lon,name:name}));
    })
    .catch(function(e){setState('⚠️','Nepodařilo se načíst data.<br>Zkontroluj připojení.');setStatus('Chyba: '+e.message);});
}

// ── METRIC TILES ─────────────────────────────────────
function buildMetricTiles(){
  var icons={temp:'🌡',cloud:'☁',wind:'💨',hum:'💧',pressure:'🌫'};
  document.getElementById('metricsTiles').innerHTML=TABS.map(function(tab){
    return '<div class="mtile'+(tab===currentTab?' active':'')+'" data-tab="'+tab+'" onclick="setTab(this)">'
      +'<div class="mtile-icon">'+icons[tab]+'</div>'
      +'<div class="mtile-label">'+T(tab)+'</div>'
      +'<div class="mtile-val" id="mv_'+tab+'">–</div>'
      +'<div class="mtile-sub" id="ms_'+tab+'">–</div>'
      +'<div class="mtile-unit" id="mu_'+tab+'"></div></div>';
  }).join('');
}

function updateMetrics(idx){
  if(!WD)return;
  var h=WD.hourly,t,feel,ws,wg,hum,dew,pres,cloud,precip,timeStr;
  if(idx===null){
    var c=WD.current;
    var ci=Math.max(0,h.time.findIndex(function(t){return new Date(t)>Date.now();})-1);
    t=c.temperature_2m;feel=c.apparent_temperature;ws=c.wind_speed_10m;wg=c.wind_gusts_10m;
    hum=c.relative_humidity_2m;dew=h.dewpoint_2m[ci];pres=c.surface_pressure;cloud=c.cloud_cover;precip=c.precipitation;
    timeStr=T('now');
  }else{
    var sl=getSlice(),i=sl.s+idx;
    t=h.temperature_2m[i];feel=h.apparent_temperature[i];ws=h.wind_speed_10m[i];wg=h.wind_gusts_10m[i];
    hum=h.relative_humidity_2m[i];dew=h.dewpoint_2m[i];pres=h.surface_pressure[i];cloud=h.cloud_cover[i];precip=h.precipitation[i];
    timeStr=new Date(h.time[i]).toLocaleString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function st(tab,val,sub,unit){
    var v=document.getElementById('mv_'+tab);var s=document.getElementById('ms_'+tab);var u=document.getElementById('mu_'+tab);
    if(v)v.textContent=val;if(s)s.textContent=sub;if(u)u.textContent=unit;
  }
  st('temp',Math.round(convTemp(t)),T('feel')+': '+(convTemp(feel)>=0?'+':'')+Math.round(convTemp(feel))+U('temp'),U('temp'));
  st('wind',fmtWind(ws),'▲ '+fmtWind(wg),U('wind'));
  st('cloud',Math.round(cloud)+'%',(precip||0).toFixed(1)+'mm','% / mm');
  st('hum',Math.round(hum)+'%',T('dew')+': '+(convTemp(dew)>=0?'+':'')+Math.round(convTemp(dew))+U('temp'),U('temp'));
  st('pressure',fmtPress(pres),'',U('pres'));
  document.getElementById('mTime').textContent=timeStr;
}

function setState(ico,msg){
  document.getElementById('metricsWrap').style.display='none';
  document.getElementById('chartSection').style.display='none';
  var el=document.getElementById('stateDiv');el.style.display='block';
  el.innerHTML='<div class="state-ico">'+ico+'</div><span>'+msg+'</span>';
}
function setStatus(msg){document.getElementById('statusBar').textContent=msg;}

function setTab(el){
  var prevTab=currentTab;
  document.querySelectorAll('.mtile').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  var prevIdx=TABS.indexOf(prevTab),newIdx=TABS.indexOf(el.dataset.tab);
  currentTab=el.dataset.tab;
  if(WD)animateTabChange(prevIdx,newIdx);
}
function switchTabByName(tab){
  var prevIdx=TABS.indexOf(currentTab),newIdx=TABS.indexOf(tab);
  currentTab=tab;
  document.querySelectorAll('.mtile').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});
  if(WD)animateTabChange(prevIdx,newIdx);
}
function animateTabChange(prevIdx,newIdx){
  var cs=document.getElementById('chartSection');
  var cls=newIdx>prevIdx?'chart-cube-next':'chart-cube-prev';
  cs.classList.add(cls);
  setTimeout(function(){cs.classList.remove(cls);draw();},200);
}

// ── SLICE ────────────────────────────────────────────
function getSlice(){
  var times=WD.hourly.time,nowMs=Date.now();
  var cur=times.findIndex(function(t){return new Date(t).getTime()>nowMs;})-1;
  if(cur<0)cur=0;
  var total=times.length;
  var back=Math.max(0,5+scrollOffset);
  var s=Math.max(0,cur-back);
  if(s+hoursVisible>total)s=Math.max(0,total-hoursVisible);
  var e=Math.min(total-1,s+hoursVisible-1);
  return{s:s,e:e,cur:cur,split:cur-s};
}

// ── CANVAS ───────────────────────────────────────────
function initCanvas(){
  if(CV)return;
  CV=document.getElementById('chartCanvas');CX=CV.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',function(){resizeCanvas();if(WD)draw();});
  CV.addEventListener('mousemove',function(e){if(!WD)return;var r=CV.getBoundingClientRect();setHoverX(e.clientX-r.left);});
  CV.addEventListener('mouseleave',function(){hoverIdx=null;if(WD)draw();updateMetrics(null);});
  CV.addEventListener('touchstart',onTS,{passive:false});
  CV.addEventListener('touchmove',onTM,{passive:false});
  CV.addEventListener('touchend',onTE,{passive:false});
}
function resizeCanvas(){
  var sec=document.getElementById('chartSection');
  var lb=document.getElementById('legendBar');
  var H=sec.offsetHeight-lb.offsetHeight-2;
  CV.width=sec.offsetWidth;CV.height=Math.max(H,180);
  CV.style.width='100%';CV.style.height=CV.height+'px';
}

// ── TOUCH ────────────────────────────────────────────
function onTS(e){
  if(e.touches.length===2){
    pinchDist0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchHours0=hoursVisible;txStart=null;gestureResolved=false;return;
  }
  txStart=e.touches[0].clientX;tyStart=e.touches[0].clientY;tTimeStart=Date.now();
  gestureResolved=false;gesturePan=false;gestureHover=false;pinchDist0=null;panOffset0=scrollOffset;
}
function onTM(e){
  e.preventDefault();if(!WD)return;
  if(e.touches.length===2&&pinchDist0!==null){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    hoursVisible=Math.round(Math.max(HOURS_MIN,Math.min(HOURS_MAX,pinchHours0*(pinchDist0/d))));
    hoverIdx=null;draw();return;
  }
  if(e.touches.length!==1||txStart===null)return;
  var tx=e.touches[0].clientX,ty=e.touches[0].clientY;
  var dx=tx-txStart,dy=ty-tyStart;
  if(!gestureResolved&&(Math.abs(dx)>8||Math.abs(dy)>8)){
    gestureResolved=true;
    gesturePan=Math.abs(dx)>Math.abs(dy)*1.5;
    gestureHover=!gesturePan;
  }
  if(gesturePan){
    var sl=getSlice();var chartW=CV.width-42-44;
    var pxPerHour=chartW/Math.max(1,sl.e-sl.s);
    scrollOffset=Math.max(-10,Math.min(WD.hourly.time.length-hoursVisible,panOffset0+Math.round(-dx/pxPerHour)));
    hoverIdx=null;draw();
  }else if(gestureHover){
    var r=CV.getBoundingClientRect();setHoverX(tx-r.left);
  }
}
function onTE(e){
  if(e.changedTouches.length===1&&txStart!==null&&!gesturePan){
    var dx=e.changedTouches[0].clientX-txStart;
    var dy=e.changedTouches[0].clientY-tyStart;
    var dt=Date.now()-tTimeStart;
    if(!gestureHover&&Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2&&dt<400){
      var ti=TABS.indexOf(currentTab);
      if(dx<0)switchTabByName(TABS[(ti+1)%TABS.length]);
      else switchTabByName(TABS[(ti-1+TABS.length)%TABS.length]);
    }
  }
  if(gesturePan)panOffset0=scrollOffset;
  hoverIdx=null;txStart=null;pinchDist0=null;gestureResolved=false;gesturePan=false;gestureHover=false;
  if(WD){draw();updateMetrics(null);}
}
function setHoverX(mx){
  var L=getLayout(),sl=getSlice(),total=sl.e-sl.s+1;
  var idx=Math.round((mx-L.pL)/(CV.width-L.pL-L.pR)*(total-1));
  idx=Math.max(0,Math.min(total-1,idx));
  if(idx!==hoverIdx){hoverIdx=idx;draw();updateMetrics(idx);}
}

// ── LAYOUT ───────────────────────────────────────────
function getLayout(){
  var W=CV.width,H=CV.height;
  var pL=42,pR=44,TIME_H=28,ICON_H=22,ARROW_H=(currentTab==='wind'?16:0),PRECIP_H=28;
  var topPad=ICON_H+ARROW_H+PRECIP_H+2;
  var chartH=H-topPad-TIME_H;
  var sl=getSlice(),total=sl.e-sl.s+1;
  return{W:W,H:H,pL:pL,pR:pR,TIME_H:TIME_H,ICON_H:ICON_H,ARROW_H:ARROW_H,PRECIP_H:PRECIP_H,topPad:topPad,chartH:chartH,total:total,s:sl.s,e:sl.e};
}

// ── DRAW ─────────────────────────────────────────────
function draw(){
  if(!CV||!WD)return;
  CX.clearRect(0,0,CV.width,CV.height);
  var L=getLayout();var sl=getSlice();
  var h=WD.hourly;
  var idxs=[];for(var i=0;i<L.total;i++)idxs.push(L.s+i);
  function xOf(i){return L.pL+i*(CV.width-L.pL-L.pR)/(L.total-1);}
  drawPrecipTop(L,idxs,h,xOf);
  drawIconRow(L,idxs,h,xOf);
  if(currentTab==='wind')drawWindArrows(L,idxs,h,xOf);
  var cTop=L.topPad,cBot=L.topPad+L.chartH;
  drawMidnightLines(idxs,cTop,cBot,xOf);
  drawNowLine(sl.split,cTop,cBot,xOf);
  if(currentTab==='temp')drawTemp(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='wind')drawWind(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='cloud'){if(cloudMode==='A')drawCloud(L,idxs,h,xOf,cTop,cBot,sl.split);else drawCloudB(L,idxs,h,xOf,cTop,cBot,sl.split);}
  else if(currentTab==='hum')drawHum(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='pressure')drawPressure(L,idxs,h,xOf,cTop,cBot,sl.split);
  drawTimeAxis(L,idxs,xOf);
  if(hoverIdx!==null)drawCrosshair(hoverIdx,cTop,cBot,xOf);
  CX.save();CX.font='bold '+Math.min(CV.width/4,60)+'px sans-serif';CX.fillStyle='rgba(120,160,200,0.07)';
  CX.textAlign='center';CX.textBaseline='middle';CX.fillText('PF',CV.width/2,cTop+(cBot-cTop)/2);CX.restore();
}

// ── PRECIP TOP ───────────────────────────────────────
function drawPrecipTop(L,idxs,h,xOf){
  var pr=idxs.map(function(i){return h.precipitation[i];});
  var sn=idxs.map(function(i){return h.snowfall[i];});
  var maxPr=Math.max.apply(null,pr.concat(sn).concat([0.5]));
  var areaTop=L.ICON_H+(currentTab==='wind'?L.ARROW_H:0)+2;
  var areaBot=areaTop+L.PRECIP_H;
  var barW=Math.max(1,(CV.width-L.pL-L.pR)/L.total-0.5);
  CX.save();
  CX.strokeStyle='rgba(30,60,100,0.4)';CX.lineWidth=1;
  CX.beginPath();CX.moveTo(L.pL,areaTop);CX.lineTo(CV.width-R_PAD,areaTop);CX.stroke();
  for(var i=0;i<L.total;i++){
    var x=xOf(i)-barW/2;
    var rH=(pr[i]||0)/maxPr*L.PRECIP_H;
    var sH=(sn[i]||0)/maxPr*L.PRECIP_H;
    if(rH>0.2){CX.fillStyle='rgba(60,140,255,0.75)';CX.fillRect(x,areaTop,barW,rH);}
    if(sH>0.2){CX.fillStyle='rgba(200,230,255,0.7)';CX.fillRect(x,areaTop+rH,barW,sH);}
  }
  CX.textAlign='left';CX.font='8px sans-serif';CX.fillStyle='#3c7aaa';
  CX.fillText(maxPr.toFixed(1)+'mm',CV.width-R_PAD+2,areaTop+9);
  CX.restore();
}

// ── ICON ROW ─────────────────────────────────────────
function cloudFracIcon(pct,isDay){
  if(pct<15)return isDay?'☀':'✦';
  if(pct<40)return '⛅';if(pct<70)return '⛅';if(pct<95)return '☁';return '☁';
}
function wmoIcon(code,isDay){
  if(code===0)return isDay?'☀':'✦';
  if(code===1)return isDay?'🌤':'🌤';if(code===2)return '⛅';if(code===3)return '☁';
  if(code<=49)return '≋';if(code<=57)return '🌦';if(code<=67)return '🌧';
  if(code<=77)return '❄';if(code<=82)return '🌧';if(code<=86)return '❄';return '⛈';
}
function drawIconRow(L,idxs,h,xOf){
  var y=L.ICON_H/2+2;

// ── WIND ARROWS ──────────────────────────────────────
function drawWindArrows(L,idxs,h,xOf){
  var y=L.ICON_H+L.PRECIP_H+L.ARROW_H/2+2;
  var wsAll=idxs.map(function(i){return h.wind_speed_10m[i];});
  var maxWs=Math.max.apply(null,wsAll.concat([1]));
  var step=(CV.width-L.pL-L.pR)/(L.total-1);
  var every=step<9?2:1;
  CX.save();
  for(var i=0;i<L.total;i+=every){
    var idx=idxs[i],ws=h.wind_speed_10m[idx],frac=ws/maxWs;
    var alpha=0.3+0.7*frac,size=Math.round(8+frac*5);
    var x=xOf(i),deg=h.wind_direction_10m[idx];
    var goRad=((deg+180)%360)*Math.PI/180,r=size*0.45;
    CX.save();CX.translate(x,y);CX.rotate(goRad);
    CX.strokeStyle='rgba(140,190,220,'+alpha+')';CX.lineWidth=0.8+frac*1.2;
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(0,r);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(-r*.45,r*.1);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(r*.45,r*.1);CX.stroke();
    CX.restore();
  }
  CX.restore();
}

// ── TOOLTIP / CROSSHAIR ──────────────────────────────
function drawTooltipBox(x,y,lines){

function drawCrosshair(idx,cTop,cBot,xOf){

// ── HELPERS ──────────────────────────────────────────
function valToY(v,mn,mx,cTop,cBot){return cBot-(v-mn)/(mx-mn)*(cBot-cTop);}
function drawFilledLine(vals,xOf,cTop,cBot,mn,mx,strokeColor,fillColor,dash){
  CX.save();
  if(fillColor){
    CX.beginPath();var started=false;
    for(var i=0;i<vals.length;i++){
      if(vals[i]===null)continue;
      var x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);
      if(!started){CX.moveTo(x,cBot);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);
    }
    for(var i=vals.length-1;i>=0;i--){if(vals[i]!==null){CX.lineTo(xOf(i),cBot);break;}}
    CX.closePath();CX.fillStyle=fillColor;CX.fill();
  }
  CX.beginPath();if(dash)CX.setLineDash(dash);CX.strokeStyle=strokeColor;CX.lineWidth=2;
  var first=true;
  for(var i=0;i<vals.length;i++){
    if(vals[i]===null){first=true;continue;}
    var x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);
    if(first){CX.moveTo(x,y);first=false;}else CX.lineTo(x,y);
  }
  CX.stroke();CX.setLineDash([]);CX.restore();
}
function drawDataLabels(vals,xOf,cTop,cBot,mn,mx,unit,color,fontSize){
  CX.save();var fs=fontSize||11;
  CX.font='bold '+fs+'px sans-serif';CX.fillStyle=color||'rgba(220,240,255,0.95)';CX.textAlign='center';
  var placed=[],minDist=fs*2.5;
  for(var i=1;i<vals.length-1;i++){
    var v=vals[i],p=vals[i-1],n=vals[i+1];
    if(v===null||p===null||n===null)continue;
    var isMax=v>=p&&v>=n&&(v>p+0.1||v>n+0.1);
    var isMin=v<=p&&v<=n&&(v<p-0.1||v<n-0.1);
    if(!isMax&&!isMin)continue;
    var x=xOf(i),y=valToY(v,mn,mx,cTop,cBot),ly=isMax?y-6:y+13;
    var tooClose=placed.some(function(p){return Math.hypot(p.x-x,p.y-ly)<minDist;});
    if(tooClose)continue;
    placed.push({x:x,y:ly});CX.fillText(Math.round(v)+(unit||''),x,ly);
  }
  CX.restore();
}
function drawLeftAxisStep(mn,mx,cTop,cBot,step,unit,color){
  CX.save();var lo=Math.ceil(mn/step)*step,hi=Math.floor(mx/step)*step;
  for(var v=lo;v<=hi+0.001;v+=step){
    var y=valToY(v,mn,mx,cTop,cBot);
    CX.strokeStyle='rgba(60,100,160,0.35)';CX.lineWidth=1;CX.setLineDash([3,3]);
    CX.beginPath();CX.moveTo(L_PAD,y);CX.lineTo(CV.width-R_PAD,y);CX.stroke();CX.setLineDash([]);
  }
  CX.textAlign='right';CX.font='9px sans-serif';CX.fillStyle=color||'#7090b0';
  for(var v=lo;v<=hi+0.001;v+=step){
    var y=valToY(v,mn,mx,cTop,cBot);CX.fillText(Math.round(v)+(unit||''),L_PAD-3,y+3);
  }
  CX.restore();
}
function drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color){
  var range=mx-mn,rawStep=range/4;
  var mag=Math.pow(10,Math.floor(Math.log10(Math.max(rawStep,0.001))));
  var niceStep=[1,2,5,10].map(function(s){return s*mag;}).filter(function(s){return range/s<=6;})[0]||rawStep;
  drawLeftAxisStep(mn,mx,cTop,cBot,niceStep,unit,color);
}
function drawRightAxis(mn,mx,cTop,cBot,unit,color){
  CX.save();CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle=color||'#507090';
  for(var i=0;i<=4;i++){var v=mn+(mx-mn)*i/4;var y=valToY(v,mn,mx,cTop,cBot);CX.fillText((Math.round(v*10)/10)+(unit||''),CV.width-R_PAD+2,y+3);}
  CX.restore();
}
function setLegend(items){
  document.getElementById('legendBar').innerHTML=items.map(function(it){
    return '<div class="leg"><div class="leg-swatch" style="'+(it.dash?'background:repeating-linear-gradient(90deg,'+it.color+' 0,'+it.color+' 4px,transparent 4px,transparent 8px)':'background:'+it.color)+'"></div>'+it.label+'</div>';
  }).join('');
}

// ── TEMP ─────────────────────────────────────────────
function drawTemp(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  var rawT=idxs.map(function(i){return convTemp(h.temperature_2m[i]);});
  var rawF=idxs.map(function(i){return convTemp(h.apparent_temperature[i]);});
  var allV=rawT.concat(rawF).filter(function(v){return v!==null;});
  var rawMn=Math.min.apply(null,allV),rawMx=Math.max.apply(null,allV);
  var mn=Math.floor((rawMn-3)/5)*5,mx=Math.ceil((rawMx+3)/5)*5;
  var zero=U('temp')==='°F'?32:0;
  if(mn<zero&&mx>zero){
    CX.save();CX.strokeStyle='rgba(100,150,220,0.35)';CX.lineWidth=1;CX.setLineDash([4,4]);
    var y0=valToY(zero,mn,mx,cTop,cBot);CX.beginPath();CX.moveTo(L.pL,y0);CX.lineTo(CV.width-L.pR,y0);CX.stroke();CX.setLineDash([]);CX.restore();
  }
  function makeTG(alpha){
    var g=CX.createLinearGradient(0,cTop,0,cBot);
    if(mn>=zero){g.addColorStop(0,'rgba(255,30,30,'+alpha+')');g.addColorStop(1,'rgba(180,220,255,'+(alpha*0.3)+')');}
    else if(mx<=zero){g.addColorStop(0,'rgba(180,220,255,'+alpha+')');g.addColorStop(1,'rgba(255,255,255,'+(alpha*0.7)+')');}
    else{var zf=(mx-zero)/(mx-mn);g.addColorStop(0,'rgba(255,30,30,'+alpha+')');g.addColorStop(Math.max(0,zf-0.02),'rgba(200,80,80,'+(alpha*0.7)+')');g.addColorStop(Math.min(1,zf),'rgba(180,220,255,'+(alpha*0.5)+')');g.addColorStop(1,'rgba(255,255,255,'+(alpha*0.65)+')');}
    return g;
  }
  drawLeftAxisStep(mn,mx,cTop,cBot,U('temp')==='°F'?9:5,U('temp'),'#7090b0');
  drawFilledLine(rawT,xOf,cTop,cBot,mn,mx,'#ff4040',makeTG(0.65),null);
  drawFilledLine(rawT.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ff4040',null,null);
  drawFilledLine(rawT.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ff4040',null,[6,4]);
  drawFilledLine(rawF.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#80c0ff',null,null);
  drawFilledLine(rawF.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#80c0ff',null,[4,4]);
  drawDataLabels(rawT,xOf,cTop,cBot,mn,mx,U('temp'),'rgba(255,180,160,1.0)',11);
  drawDataLabels(rawF,xOf,cTop,cBot,mn,mx,U('temp'),'rgba(150,210,255,0.95)',11);
  setLegend([{color:'#ff4040',label:T('temp')+' '+U('temp'),dash:false},{color:'#ff4040',label:'předpověď',dash:true},{color:'#80c0ff',label:T('feel')+' '+U('temp'),dash:false}]);
}

// ── WIND ─────────────────────────────────────────────
function drawWind(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  var ws=idxs.map(function(i){return convWind(h.wind_speed_10m[i]);});
  var wg=idxs.map(function(i){return convWind(h.wind_gusts_10m[i]);});
  var mx=Math.ceil((Math.max.apply(null,ws.concat(wg))+3)/5)*5,mn=0;
  var grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(255,255,255,0.45)');grad.addColorStop(1,'rgba(255,255,255,0.03)');
  drawLeftAxisAuto(mn,mx,cTop,cBot,' '+U('wind'),'#7090a0');
  drawFilledLine(ws,xOf,cTop,cBot,mn,mx,'#ffffff',grad,null);
  drawFilledLine(ws.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ffffff',null,null);
  drawFilledLine(ws.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ffffff',null,[6,4]);
  drawFilledLine(wg.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#4aa8ff',null,null);
  drawFilledLine(wg.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#4aa8ff',null,[3,3]);
  drawDataLabels(ws,xOf,cTop,cBot,mn,mx,'','rgba(220,240,255,0.95)',11);
  drawDataLabels(wg,xOf,cTop,cBot,mn,mx,'','rgba(100,180,255,0.95)',11);
  // right axis m/s
  var range=mx-mn,rawStep=range/4;
  var mag=Math.pow(10,Math.floor(Math.log10(Math.max(rawStep,0.001))));
  var niceStep=[1,2,5,10].map(function(s){return s*mag;}).filter(function(s){return range/s<=6;})[0]||rawStep;
  var lo=Math.ceil(mn/niceStep)*niceStep,hi=Math.floor(mx/niceStep)*niceStep;
  CX.save();CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle='#4a8060';
  for(var v=lo;v<=hi+0.001;v+=niceStep){
    var y=valToY(v,mn,mx,cTop,cBot);
    var ms=U('wind')==='mph'?+(v*0.44704).toFixed(1):+(v/3.6).toFixed(1);
    CX.fillText(ms+' m/s',CV.width-R_PAD+2,y+3);
  }
  CX.restore();
  setLegend([{color:'#ffffff',label:T('wind')+' '+U('wind'),dash:false},{color:'#4aa8ff',label:T('gust')+' '+U('wind'),dash:false}]);
}

// ── CLOUD A ──────────────────────────────────────────
function drawCloudIcons(cloudTop,cloudBot){

  var items=[{km:0,icon:'🚶'},{km:0.75,icon:'🎈'},{km:1.5,icon:'🚁'},{km:2,icon:'🛩'},{km:6.5,icon:'✈'},{km:10,icon:'🛫'}];

}
function drawCloud(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  var cloudTop=cTop+4,cloudBot=cBot;

  function drawBand(data,yTop,yBot,color){

  }
  var clH=idxs.map(function(i){return h.cloud_cover_high[i];}),clM=idxs.map(function(i){return h.cloud_cover_mid[i];}),clL=idxs.map(function(i){return h.cloud_cover_low[i];}),clT=idxs.map(function(i){return h.cloud_cover[i];});

  CX.fillStyle='rgba(130,155,210,0.85)';CX.fillText('L:'+Math.round(clL[hi])+'%',labX,kmToY(1)+3);
  CX.fillStyle='rgba(220,235,255,0.95)';CX.fillText('∑:'+Math.round(clT[hi])+'%',labX,kmToY(0)-8);

  setLegend([{color:'#c8deff',label:T('high')+' >6.5km',dash:false},{color:'#8090b8',label:T('mid')+' 2–6.5km',dash:false},{color:'#506098',label:T('low')+' 0–2km',dash:false}]);
}

// ── CLOUD B ──────────────────────────────────────────
function drawCloudB(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  var cloudTop=cTop+4,cloudBot=cBot;
  function kmToY(km){return cloudBot-(km/10)*(cloudBot-cloudTop);}
  var nBands=40,bandKm=10/nBands;
  CX.save();
  var bg=CX.createLinearGradient(0,cloudTop,0,cloudBot);
  bg.addColorStop(0,'rgba(10,20,50,0.6)');bg.addColorStop(1,'rgba(20,40,90,0.6)');
  CX.fillStyle=bg;CX.fillRect(L.pL,cloudTop,CV.width-L.pL-L.pR,cloudBot-cloudTop);
  var clH=idxs.map(function(i){return h.cloud_cover_high[i];});
  var clM=idxs.map(function(i){return h.cloud_cover_mid[i];});
  var clL=idxs.map(function(i){return h.cloud_cover_low[i];});
  var barW=Math.max(1,(CV.width-L.pL-L.pR)/L.total);
  for(var band=0;band<nBands;band++){
    var km=(band+0.5)*bandKm;
    var y1=kmToY((band+1)*bandKm),y2=kmToY(band*bandKm);
    for(var i=0;i<L.total;i++){
      var pct=km<=2?clL[i]||0:km<=6.5?clM[i]||0:clH[i]||0;
      if(pct<5)continue;
      CX.fillStyle='rgba(220,230,255,'+(pct/100*0.85)+')';
      CX.fillRect(xOf(i)-barW/2,y1,barW,y2-y1);
    }
  }
  [0,2,6.5,10].forEach(function(km){
    var y=kmToY(km);CX.strokeStyle='rgba(80,140,220,0.5)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(CV.width-L.pR,y);CX.stroke();
    CX.fillStyle='#7ab0d0';CX.font='9px sans-serif';CX.textAlign='right';
    CX.fillText(km===0?'0km':km+'km',L.pL-2,y+3);
  });
  drawCloudIcons(cloudTop,cloudBot);
  var hi=hoverIdx!==null?hoverIdx:getSlice().split;
  CX.save();CX.textAlign='right';CX.font='bold 9px sans-serif';var labX=CV.width-L.pR-2;
  CX.fillStyle='rgba(200,225,255,0.9)';CX.fillText('H:'+Math.round(clH[hi])+'%',labX,kmToY(8)+3);
  CX.fillStyle='rgba(170,190,230,0.9)';CX.fillText('M:'+Math.round(clM[hi])+'%',labX,kmToY(4.2)+3);
  CX.fillStyle='rgba(130,155,210,0.9)';CX.fillText('L:'+Math.round(clL[hi])+'%',labX,kmToY(1)+3);
  CX.restore();CX.restore();
  setLegend([{color:'#dde8ff',label:'Oblačnost – heatmapa',dash:false}]);
}

// ── HUM ──────────────────────────────────────────────
function drawHum(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  var hu=idxs.map(function(i){return h.relative_humidity_2m[i];});
  var dp=idxs.map(function(i){return convTemp(h.dewpoint_2m[i]);});
  var mn=0,mx=100,dpMn=Math.min.apply(null,dp)-2,dpMx=Math.max.apply(null,dp)+2;
  drawLeftAxisStep(mn,mx,cTop,cBot,25,'%','#5090a0');
  drawRightAxis(dpMn,dpMx,cTop,cBot,U('temp'),'#4a7090');
  var grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(60,200,240,0.55)');grad.addColorStop(1,'rgba(60,200,240,0.02)');
  drawFilledLine(hu,xOf,cTop,cBot,mn,mx,'#3cc8f0',grad,null);
  drawFilledLine(hu.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,null);
  drawFilledLine(hu.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,[6,4]);
  drawFilledLine(dp.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,null);
  drawFilledLine(dp.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,[4,4]);
  drawDataLabels(hu,xOf,cTop,cBot,mn,mx,'%','rgba(100,220,250,0.95)',11);
  drawDataLabels(dp,xOf,cTop,cBot,dpMn,dpMx,U('temp'),'rgba(160,224,255,0.95)',11);
  setLegend([{color:'#3cc8f0',label:T('hum')+' %',dash:false},{color:'#a0e0ff',label:T('dew')+' '+U('temp')+' →',dash:false}]);
}

// ── PRESSURE ─────────────────────────────────────────
function drawPressure(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  var pr=idxs.map(function(i){return convPress(h.surface_pressure[i]);});
  var rawMn=Math.min.apply(null,pr),rawMx=Math.max.apply(null,pr);
  var mn=Math.floor((rawMn-2)/5)*5,mx=Math.ceil((rawMx+2)/5)*5;
  var grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(180,120,255,0.55)');grad.addColorStop(1,'rgba(180,120,255,0.02)');
  drawLeftAxisAuto(mn,mx,cTop,cBot,' '+U('pres'),'#9070b8');
  drawFilledLine(pr,xOf,cTop,cBot,mn,mx,'#c080ff',grad,null);
  drawFilledLine(pr.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#c080ff',null,null);
  drawFilledLine(pr.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#c080ff',null,[6,4]);
  drawDataLabels(pr,xOf,cTop,cBot,mn,mx,'','rgba(210,170,255,0.95)',11);
  setLegend([{color:'#c080ff',label:T('pressure')+' '+U('pres'),dash:false},{color:'#c080ff',label:'předpověď',dash:true}]);
}
