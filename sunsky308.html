  cloud:'A diagram a <b>felhőzetet</b> mutatja – az ég felhőborítottságát %-ban. Válthatsz alacsony / közepes / magas felhők között (A/B vált. gomb). 0 % = derült, 100 % = borult.',
  snow:'A diagram a <b>csapadékot</b> mutatja: a hó <b>fehér</b>, az eső <b>kék</b>; az oszlop teljes magassága a csapadékösszeg mm/h-ban. A görbe emellett a <b>talajnedvességet</b> mutatja (a víz aránya a 0–1 cm-es felső rétegben, térfogat-%-ban).',
  wind:'A diagram a <b>szélsebességet</b> (folytonos vonal) és a <b>széllökéseket</b> (második görbe – rövid csúcsok) mutatja. Az irány/nyilak azt mutatják, honnan fúj a szél.',
  hum:'A diagram a levegő <b>relatív páratartalmát</b> mutatja %-ban és a <b>harmatpontot</b> (az a hőmérséklet, amelynél a levegő eléri a 100% páratartalmat és megindul a kicsapódás – minél közelebb van a levegő hőmérsékletéhez, annál párásabb).',
  pressure:'A diagram a tengerszintre átszámított <b>légnyomást</b> mutatja (hPa). A csökkenő nyomás gyakran rosszabbodó időt jelez előre, az emelkedő javulást.',
  vis:'A diagram a <b>látótávolságot</b> mutatja – meddig lehet ellátni (km). Az alacsony látótávolság ködöt, heves esőt vagy havazást jelent.',
  wetbulb:'A diagram a <b>nedves hőmérőjű hőmérsékletet</b> mutatja (a víz párolgásával elérhető legalacsonyabb hőmérséklet; a párás körülmények valódi hőterhelését jelzi – magas értékeknél az izzadás már nem hűti a testet).',
  solar:'A diagram a <b>napsugárzást</b> mutatja – a vízszintes felületre érkező napteljesítményt (W/m²). A rózsaszín görbe az <b>UV-index</b> (az ultraibolya sugárzás erőssége; minél magasabb, annál gyorsabb a leégés veszélye).',
  aqi:'A diagram a <b>levegőminőséget</b> mutatja. A színes terület a <b>levegőminőségi index</b> (a szennyezettség összesített értékelése – minél magasabb, annál rosszabb). A vonalak az egyes anyagok: <b>PM2.5</b> és <b>PM10</b> (szálló por), <b>O₃</b> (talajközeli ózon), <b>NO₂</b>, <b>SO₂</b> és <b>CO</b>.',
  pollen:'A diagram az egyes növények <b>pollenkoncentrációját</b> mutatja (szem/m³) az időben – fűfélék, nyír, éger, olajfa, üröm és parlagfű. A diagram fölötti táblázat az aktuális értékeket, az értékelést és a pollenszezont mutatja.',
  },
  'sk':{
  temp:'Graf zobrazuje <b>teplotu vzduchu</b> pre vybranú lokalitu. Plná čiara je teplota, čiarkovaná je <b>pocitová teplota</b> (ako teplo alebo zimu vníma ľudské telo – zohľadňuje vietor, vlhkosť a slnečné žiarenie).',
  cloud:'Graf zobrazuje <b>oblačnosť</b> – pokrytie oblohy mrakmi v %. Dá sa prepínať oblačnosť nízka / stredná / vysoká (tlačidlo var. A/B). 0 % = jasno, 100 % = zamračené.',
  snow:'Graf zobrazuje <b>zrážky</b>: snehové <b>bielo</b> a dažďové <b>modro</b>; celková výška stĺpca je úhrn zrážok v mm/h. Krivka navyše ukazuje <b>pôdnu vlhkosť</b> (podiel vody v povrchovej vrstve 0–1 cm, v % objemu).',
  wind:'Graf zobrazuje <b>rýchlosť vetra</b> (plná čiara) a <b>nárazy/poryvy</b> (druhá krivka – krátke najvyššie rýchlosti). Smer/šípky ukazujú, odkiaľ vietor fúka.',
  hum:'Graf zobrazuje <b>relatívnu vlhkosť</b> vzduchu v % a <b>rosný bod</b> (teplota, pri ktorej by vzduch dosiahol 100% vlhkosť a začala kondenzácia – čím bližšie k teplote vzduchu, tým vlhkejšie).',
  pressure:'Graf zobrazuje <b>atmosférický tlak</b> prepočítaný na hladinu mora (hPa). Klesajúci tlak často predznamenáva zhoršenie počasia, rastúci zlepšenie.',
  vis:'Graf zobrazuje <b>dohľadnosť</b> – ako ďaleko je vidieť (km). Nízka dohľadnosť znamená hmlu, hustý dážď alebo sneženie.',
  wetbulb:'Graf zobrazuje <b>teplotu vlhkého teplomera</b> (najnižšia teplota dosiahnuteľná odparovaním vody; udáva skutočnú tepelnú záťaž pri vlhku – pri vysokých hodnotách už potenie telo neochladí).',
  solar:'Graf zobrazuje <b>slnečnú radiáciu</b> – príkon slnečného žiarenia na vodorovnú plochu (W/m²). Ružová krivka je <b>UV index</b> (intenzita ultrafialového žiarenia; čím vyšší, tým rýchlejšie hrozí spálenie).',
  aqi:'Graf zobrazuje <b>kvalitu ovzdušia</b>. Farebná plocha je <b>index kvality ovzdušia</b> (súhrnné hodnotenie znečistenia – čím vyšší, tým horšie). Čiary sú jednotlivé látky: <b>PM2.5</b> a <b>PM10</b> (prachové častice), <b>O₃</b> (prízemný ozón), <b>NO₂</b>, <b>SO₂</b> a <b>CO</b>.',
  pollen:'Graf zobrazuje <b>koncentráciu peľu</b> jednotlivých rastlín (zrná/m³) v čase – trávy, breza, jelša, oliva, palina a ambrózia. Tabuľka nad grafom ukazuje aktuálne hodnoty, hodnotenie a peľovú sezónu.',
  },
  'pl':{
  temp:'Wykres pokazuje <b>temperaturę powietrza</b> dla wybranej lokalizacji. Linia ciągła to temperatura, przerywana to <b>temperatura odczuwalna</b> (jak ciepło lub zimno odczuwa ludzkie ciało – uwzględnia wiatr, wilgotność i promieniowanie słoneczne).',
  cloud:'Wykres pokazuje <b>zachmurzenie</b> – pokrycie nieba chmurami w %. Można przełączać chmury niskie / średnie / wysokie (przycisk war. A/B). 0 % = bezchmurnie, 100 % = całkowite zachmurzenie.',
  snow:'Wykres pokazuje <b>opady</b>: śnieg na <b>biało</b>, deszcz na <b>niebiesko</b>; całkowita wysokość słupka to suma opadów w mm/h. Krzywa pokazuje dodatkowo <b>wilgotność gleby</b> (udział wody w warstwie powierzchniowej 0–1 cm, w % objętości).',
  wind:'Wykres pokazuje <b>prędkość wiatru</b> (linia ciągła) i <b>porywy</b> (druga krzywa – krótkie maksima). Kierunek/strzałki pokazują, skąd wieje wiatr.',
  hum:'Wykres pokazuje <b>wilgotność względną</b> powietrza w % i <b>punkt rosy</b> (temperatura, przy której powietrze osiągnęłoby 100% wilgotności i zaczęłaby się kondensacja – im bliżej temperatury powietrza, tym wilgotniej).',
  pressure:'Wykres pokazuje <b>ciśnienie atmosferyczne</b> sprowadzone do poziomu morza (hPa). Spadek ciśnienia często zapowiada pogorszenie pogody, wzrost – poprawę.',
  vis:'Wykres pokazuje <b>widzialność</b> – jak daleko widać (km). Niska widzialność oznacza mgłę, gęsty deszcz lub śnieg.',
  wetbulb:'Wykres pokazuje <b>temperaturę termometru mokrego</b> (najniższa temperatura osiągalna przez parowanie wody; pokazuje rzeczywiste obciążenie cieplne przy wilgoci – przy wysokich wartościach pocenie już nie chłodzi ciała).',
  solar:'Wykres pokazuje <b>promieniowanie słoneczne</b> – moc promieniowania słonecznego padającego na powierzchnię poziomą (W/m²). Różowa krzywa to <b>indeks UV</b> (intensywność promieniowania ultrafioletowego; im wyższy, tym szybciej grozi oparzenie).',
  aqi:'Wykres pokazuje <b>jakość powietrza</b>. Kolorowy obszar to <b>indeks jakości powietrza</b> (łączna ocena zanieczyszczenia – im wyższy, tym gorzej). Linie to poszczególne substancje: <b>PM2.5</b> i <b>PM10</b> (pyły), <b>O₃</b> (ozon przy powierzchni), <b>NO₂</b>, <b>SO₂</b> i <b>CO</b>.',
  pollen:'Wykres pokazuje <b>stężenie pyłków</b> poszczególnych roślin (ziarna/m³) w czasie – trawy, brzoza, olcha, oliwka, bylica i ambrozja. Tabela nad wykresem pokazuje aktualne wartości, ocenę i sezon pyłkowy.',
  },
  'nl':{
  temp:'De grafiek toont de <b>luchttemperatuur</b> voor de gekozen locatie. De doorgetrokken lijn is de temperatuur, de stippellijn is de <b>gevoelstemperatuur</b> (hoe warm of koud het menselijk lichaam het ervaart – houdt rekening met wind, vochtigheid en zonnestraling).',
  cloud:'De grafiek toont de <b>bewolking</b> – hoeveel van de hemel bedekt is, in %. Je kunt wisselen tussen lage / middelhoge / hoge bewolking (knop var. A/B). 0 % = onbewolkt, 100 % = volledig bewolkt.',
  snow:'De grafiek toont de <b>neerslag</b>: sneeuw in <b>wit</b> en regen in <b>blauw</b>; de totale staafhoogte is de som in mm/u. De curve toont ook de <b>bodemvochtigheid</b> (aandeel water in de toplaag 0–1 cm, in volume-%).',
  wind:'De grafiek toont de <b>windsnelheid</b> (doorgetrokken lijn) en <b>windstoten</b> (tweede curve – korte pieken). Richting/pijlen tonen waar de wind vandaan komt.',
  hum:'De grafiek toont de <b>relatieve luchtvochtigheid</b> in % en het <b>dauwpunt</b> (de temperatuur waarbij de lucht 100% vochtigheid bereikt en condensatie begint – hoe dichter bij de luchttemperatuur, hoe vochtiger).',
  pressure:'De grafiek toont de <b>luchtdruk</b> herleid tot zeeniveau (hPa). Dalende druk kondigt vaak slechter weer aan, stijgende beter weer.',
  vis:'De grafiek toont het <b>zicht</b> – hoe ver je kunt zien (km). Slecht zicht betekent mist, zware regen of sneeuw.',
  wetbulb:'De grafiek toont de <b>natteboltemperatuur</b> (de laagste temperatuur die door verdamping van water haalbaar is; geeft de werkelijke warmtebelasting bij vocht aan – bij hoge waarden koelt zweten het lichaam niet meer af).',
  solar:'De grafiek toont de <b>zonnestraling</b> – het invallende zonvermogen op een horizontaal vlak (W/m²). De roze curve is de <b>UV-index</b> (intensiteit van uv-straling; hoe hoger, hoe sneller verbrandingsgevaar).',
  aqi:'De grafiek toont de <b>luchtkwaliteit</b>. Het gekleurde vlak is de <b>luchtkwaliteitsindex</b> (totale beoordeling van vervuiling – hoe hoger, hoe slechter). De lijnen zijn afzonderlijke stoffen: <b>PM2.5</b> en <b>PM10</b> (fijnstof), <b>O₃</b> (ozon op grondniveau), <b>NO₂</b>, <b>SO₂</b> en <b>CO</b>.',
  pollen:'De grafiek toont de <b>pollenconcentratie</b> van afzonderlijke planten (korrels/m³) in de tijd – grassen, berk, els, olijf, alsem en ambrosia. De tabel boven de grafiek toont de actuele waarden, beoordeling en het pollenseizoen.',
  },
  'pt':{
  temp:'O gráfico mostra a <b>temperatura do ar</b> para o local selecionado. A linha sólida é a temperatura, a tracejada é a <b>temperatura aparente</b> (como o corpo humano sente o calor ou o frio – tem em conta o vento, a humidade e a radiação solar).',
  cloud:'O gráfico mostra a <b>nebulosidade</b> – quanto do céu está coberto, em %. Podes alternar nuvens baixas / médias / altas (botão var. A/B). 0 % = céu limpo, 100 % = encoberto.',
  snow:'O gráfico mostra a <b>precipitação</b>: neve a <b>branco</b> e chuva a <b>azul</b>; a altura total da barra é o total em mm/h. A curva mostra ainda a <b>humidade do solo</b> (proporção de água na camada superficial 0–1 cm, em % de volume).',
  wind:'O gráfico mostra a <b>velocidade do vento</b> (linha sólida) e as <b>rajadas</b> (segunda curva – picos curtos). A direção/setas mostram de onde sopra o vento.',
  hum:'O gráfico mostra a <b>humidade relativa</b> do ar em % e o <b>ponto de orvalho</b> (a temperatura à qual o ar atingiria 100% de humidade e começaria a condensação – quanto mais perto da temperatura do ar, mais húmido).',
  pressure:'O gráfico mostra a <b>pressão atmosférica</b> reduzida ao nível do mar (hPa). Pressão a descer costuma anunciar piora do tempo, a subir melhoria.',
  vis:'O gráfico mostra a <b>visibilidade</b> – até onde se consegue ver (km). Visibilidade baixa significa nevoeiro, chuva forte ou neve.',
  wetbulb:'O gráfico mostra a <b>temperatura de bolbo húmido</b> (a temperatura mais baixa atingível por evaporação da água; indica a carga térmica real com humidade – com valores altos, transpirar já não arrefece o corpo).',
  solar:'O gráfico mostra a <b>radiação solar</b> – a potência solar incidente numa superfície horizontal (W/m²). A curva rosa é o <b>índice UV</b> (intensidade da radiação ultravioleta; quanto maior, mais rápido o risco de queimadura).',
  aqi:'O gráfico mostra a <b>qualidade do ar</b>. A área colorida é o <b>índice de qualidade do ar</b> (avaliação global da poluição – quanto maior, pior). As linhas são as substâncias: <b>PM2.5</b> e <b>PM10</b> (partículas), <b>O₃</b> (ozono ao nível do solo), <b>NO₂</b>, <b>SO₂</b> e <b>CO</b>.',
  pollen:'O gráfico mostra a <b>concentração de pólen</b> de cada planta (grãos/m³) ao longo do tempo – gramíneas, bétula, amieiro, oliveira, artemísia e ambrósia. A tabela acima mostra os valores atuais, a avaliação e a época de pólen.',
  },
 en:{
  temp:'The graph shows the <b>air temperature</b> for the selected location. The solid line is the temperature, the dashed one is the <b>apparent temperature</b> (how warm or cold the body feels – taking wind, humidity and sunshine into account).',
  cloud:'The graph shows <b>cloud cover</b> – how much of the sky is covered, in %. You can switch low / mid / high clouds (var. A/B button). 0 % = clear, 100 % = overcast.',
  snow:'The graph shows <b>precipitation</b>: snow in <b>white</b> and rain in <b>blue</b>; the total column height is the rainfall in mm/h. The curve also shows <b>soil moisture</b> (water in the topsoil 0–1 cm; given in % of volume, i.e. how much of the soil is water).',
  wind:'The graph shows <b>wind speed</b> (solid line) and <b>gusts</b> (second curve – short peak speeds). The direction/arrows show where the wind blows from.',
  hum:'The graph shows <b>relative humidity</b> in % and the <b>dew point</b> (the temperature at which the air would reach 100% humidity and condensation would start – the closer to the air temperature, the more humid).',
  pressure:'The graph shows <b>atmospheric pressure</b> reduced to sea level (hPa). Falling pressure often signals worsening weather, rising pressure improving.',
  vis:'The graph shows <b>visibility</b> – how far you can see (km). Low visibility means fog, heavy rain or snow.',
  wetbulb:'The graph shows the <b>wet-bulb temperature</b> (the lowest temperature reachable by evaporating water; it shows the real heat stress in humid air – at high values sweating no longer cools the body).',
  solar:'The graph shows <b>solar radiation</b> – the incoming solar power on a horizontal surface (W/m²). The pink curve is the <b>UV index</b> (UV radiation intensity; the higher, the faster the risk of sunburn).',
  aqi:'The graph shows <b>air quality</b>. The coloured area is the <b>air quality index</b> (an overall pollution rating – the higher, the worse). The lines are individual pollutants: <b>PM2.5</b> and <b>PM10</b> (dust particles), <b>O₃</b> (ground-level ozone), <b>NO₂</b>, <b>SO₂</b> and <b>CO</b>.',
  pollen:'The graph shows the <b>pollen concentration</b> of individual plants (grains/m³) over time – grass, birch, alder, olive, mugwort and ragweed. The table above shows current values, ratings and the pollen season.'
 },
 de:{
  temp:'Das Diagramm zeigt die <b>Lufttemperatur</b> für den gewählten Ort. Die durchgezogene Linie ist die Temperatur, die gestrichelte die <b>gefühlte Temperatur</b> (wie warm oder kalt sich der Körper anfühlt – berücksichtigt Wind, Feuchte und Sonne).',
  cloud:'Das Diagramm zeigt die <b>Bewölkung</b> – wie viel Himmel von Wolken bedeckt ist, in %. Tiefe / mittlere / hohe Wolken umschaltbar (Taste var. A/B). 0 % = klar, 100 % = bedeckt.',
  snow:'Das Diagramm zeigt <b>Niederschlag</b>: Schnee in <b>Weiß</b> und Regen in <b>Blau</b>; die Gesamthöhe der Säule ist die Menge in mm/h. Die Kurve zeigt zusätzlich die <b>Bodenfeuchte</b> (Wasser in der obersten Bodenschicht 0–1 cm; in % des Volumens, also wie viel des Bodens Wasser ist).',
  wind:'Das Diagramm zeigt die <b>Windgeschwindigkeit</b> (durchgezogene Linie) und <b>Böen</b> (zweite Kurve – kurze Spitzen). Richtung/Pfeile zeigen, woher der Wind weht.',
  hum:'Das Diagramm zeigt die <b>relative Luftfeuchte</b> in % und den <b>Taupunkt</b> (Temperatur, bei der die Luft 100% Feuchte erreichen würde und Kondensation beginnt – je näher an der Lufttemperatur, desto feuchter).',
  pressure:'Das Diagramm zeigt den <b>Luftdruck</b> auf Meereshöhe umgerechnet (hPa). Fallender Druck deutet oft auf schlechteres Wetter hin, steigender auf besseres.',
  vis:'Das Diagramm zeigt die <b>Sichtweite</b> – wie weit man sieht (km). Geringe Sicht bedeutet Nebel, starken Regen oder Schneefall.',
  wetbulb:'Das Diagramm zeigt die <b>Feuchtkugeltemperatur</b> (niedrigste durch Verdunstung erreichbare Temperatur; zeigt die echte Hitzebelastung bei Feuchte – bei hohen Werten kühlt Schwitzen den Körper nicht mehr).',
  solar:'Das Diagramm zeigt die <b>Sonneneinstrahlung</b> – die einfallende Sonnenleistung auf eine waagerechte Fläche (W/m²). Die rosa Kurve ist der <b>UV-Index</b> (Intensität der UV-Strahlung; je höher, desto schneller droht Sonnenbrand).',
  aqi:'Das Diagramm zeigt die <b>Luftqualität</b>. Die farbige Fläche ist der <b>Luftqualitätsindex</b> (Gesamtbewertung der Belastung – je höher, desto schlechter). Die Linien sind einzelne Schadstoffe: <b>PM2.5</b> und <b>PM10</b> (Staubpartikel), <b>O₃</b> (bodennahes Ozon), <b>NO₂</b>, <b>SO₂</b> und <b>CO</b>.',
  pollen:'Das Diagramm zeigt die <b>Pollenkonzentration</b> einzelner Pflanzen (Körner/m³) über die Zeit – Gräser, Birke, Erle, Olive, Beifuß und Ambrosia. Die Tabelle oben zeigt aktuelle Werte, Bewertung und Pollensaison.'
 },
 fr:{
  temp:'Le graphique montre la <b>température de l\'air</b> pour le lieu choisi. La ligne pleine est la température, la pointillée la <b>température ressentie</b> (sensation de chaud ou de froid – tient compte du vent, de l\'humidité et du soleil).',
  cloud:'Le graphique montre la <b>nébulosité</b> – la part du ciel couverte par les nuages, en %. Nuages bas / moyens / hauts commutables (bouton var. A/B). 0 % = ciel clair, 100 % = couvert.',
  snow:'Le graphique montre les <b>précipitations</b> : neige en <b>blanc</b> et pluie en <b>bleu</b> ; la hauteur totale de la barre est le cumul en mm/h. La courbe montre aussi l\'<b>humidité du sol</b> (eau dans la couche superficielle 0–1 cm ; en % du volume, soit la part d\'eau dans le sol).',
  wind:'Le graphique montre la <b>vitesse du vent</b> (ligne pleine) et les <b>rafales</b> (deuxième courbe – pointes brèves). La direction/les flèches indiquent d\'où vient le vent.',
  hum:'Le graphique montre l\'<b>humidité relative</b> en % et le <b>point de rosée</b> (température à laquelle l\'air atteindrait 100% d\'humidité et la condensation commencerait – plus il est proche de la température de l\'air, plus c\'est humide).',
  pressure:'Le graphique montre la <b>pression atmosphérique</b> ramenée au niveau de la mer (hPa). Une pression qui baisse annonce souvent une dégradation, qui monte une amélioration.',
  vis:'Le graphique montre la <b>visibilité</b> – jusqu\'où l\'on voit (km). Une faible visibilité signifie brouillard, forte pluie ou neige.',
  wetbulb:'Le graphique montre la <b>température du thermomètre mouillé</b> (température la plus basse atteignable par évaporation ; indique la vraie contrainte thermique par temps humide – à valeurs élevées, la transpiration ne refroidit plus le corps).',
  solar:'Le graphique montre le <b>rayonnement solaire</b> – la puissance solaire reçue sur une surface horizontale (W/m²). La courbe rose est l\'<b>indice UV</b> (intensité du rayonnement UV ; plus il est élevé, plus le risque de coup de soleil est rapide).',
  aqi:'Le graphique montre la <b>qualité de l\'air</b>. La zone colorée est l\'<b>indice de qualité de l\'air</b> (évaluation globale de la pollution – plus c\'est haut, plus c\'est mauvais). Les lignes sont les polluants : <b>PM2.5</b> et <b>PM10</b> (particules), <b>O₃</b> (ozone de surface), <b>NO₂</b>, <b>SO₂</b> et <b>CO</b>.',
  pollen:'Le graphique montre la <b>concentration de pollen</b> par plante (grains/m³) dans le temps – graminées, bouleau, aulne, olivier, armoise et ambroisie. Le tableau au-dessus indique les valeurs actuelles, l\'évaluation et la saison pollinique.'
 },
 es:{
  temp:'El gráfico muestra la <b>temperatura del aire</b> del lugar elegido. La línea continua es la temperatura, la discontinua la <b>sensación térmica</b> (cómo de calor o frío siente el cuerpo – tiene en cuenta viento, humedad y sol).',
  cloud:'El gráfico muestra la <b>nubosidad</b> – cuánto cielo cubren las nubes, en %. Nubes bajas / medias / altas conmutables (botón var. A/B). 0 % = despejado, 100 % = cubierto.',
  snow:'El gráfico muestra la <b>precipitación</b>: nieve en <b>blanco</b> y lluvia en <b>azul</b>; la altura total de la barra es el total en mm/h. La curva muestra además la <b>humedad del suelo</b> (agua en la capa superficial 0–1 cm; en % del volumen, es decir cuánto del suelo es agua).',
  wind:'El gráfico muestra la <b>velocidad del viento</b> (línea continua) y las <b>rachas</b> (segunda curva – picos breves). La dirección/las flechas indican de dónde sopla el viento.',
  hum:'El gráfico muestra la <b>humedad relativa</b> en % y el <b>punto de rocío</b> (temperatura a la que el aire alcanzaría el 100% de humedad y empezaría la condensación – cuanto más cerca de la temperatura del aire, más húmedo).',
  pressure:'El gráfico muestra la <b>presión atmosférica</b> reducida al nivel del mar (hPa). Una presión que baja suele anunciar empeoramiento; que sube, mejora.',
  vis:'El gráfico muestra la <b>visibilidad</b> – hasta dónde se ve (km). Poca visibilidad significa niebla, lluvia intensa o nieve.',
  wetbulb:'El gráfico muestra la <b>temperatura de bulbo húmedo</b> (la temperatura más baja alcanzable por evaporación; indica el estrés térmico real con humedad – con valores altos el sudor ya no enfría el cuerpo).',
  solar:'El gráfico muestra la <b>radiación solar</b> – la potencia solar recibida en una superficie horizontal (W/m²). La curva rosa es el <b>índice UV</b> (intensidad de la radiación UV; cuanto más alto, antes hay riesgo de quemadura).',
  aqi:'El gráfico muestra la <b>calidad del aire</b>. El área de color es el <b>índice de calidad del aire</b> (valoración global de la contaminación – cuanto más alto, peor). Las líneas son contaminantes: <b>PM2.5</b> y <b>PM10</b> (partículas), <b>O₃</b> (ozono troposférico), <b>NO₂</b>, <b>SO₂</b> y <b>CO</b>.',
  pollen:'El gráfico muestra la <b>concentración de polen</b> de cada planta (granos/m³) en el tiempo – gramíneas, abedul, aliso, olivo, artemisa y ambrosía. La tabla de arriba muestra valores actuales, valoración y temporada de polen.'
 },
 it:{
  temp:'Il grafico mostra la <b>temperatura dell\'aria</b> per il luogo scelto. La linea continua è la temperatura, quella tratteggiata la <b>temperatura percepita</b> (come il corpo sente caldo o freddo – considera vento, umidità e sole).',
  cloud:'Il grafico mostra la <b>nuvolosità</b> – quanta parte di cielo è coperta dalle nubi, in %. Nubi basse / medie / alte commutabili (pulsante var. A/B). 0 % = sereno, 100 % = coperto.',
  snow:'Il grafico mostra le <b>precipitazioni</b>: neve in <b>bianco</b> e pioggia in <b>blu</b>; l\'altezza totale della barra è il totale in mm/h. La curva mostra anche l\'<b>umidità del suolo</b> (acqua nello strato superficiale 0–1 cm; in % del volume, cioè quanta parte del suolo è acqua).',
  wind:'Il grafico mostra la <b>velocità del vento</b> (linea continua) e le <b>raffiche</b> (seconda curva – picchi brevi). La direzione/le frecce indicano da dove soffia il vento.',
  hum:'Il grafico mostra l\'<b>umidità relativa</b> in % e il <b>punto di rugiada</b> (temperatura alla quale l\'aria raggiungerebbe il 100% di umidità e inizierebbe la condensa – più è vicino alla temperatura dell\'aria, più è umido).',
  pressure:'Il grafico mostra la <b>pressione atmosferica</b> ridotta al livello del mare (hPa). Una pressione in calo annuncia spesso peggioramento, in aumento miglioramento.',
  vis:'Il grafico mostra la <b>visibilità</b> – fin dove si vede (km). Bassa visibilità significa nebbia, pioggia intensa o neve.',
  wetbulb:'Il grafico mostra la <b>temperatura di bulbo umido</b> (la temperatura più bassa raggiungibile per evaporazione; indica il reale stress da calore in presenza di umidità – con valori alti il sudore non raffredda più il corpo).',
  solar:'Il grafico mostra la <b>radiazione solare</b> – la potenza solare ricevuta su una superficie orizzontale (W/m²). La curva rosa è l\'<b>indice UV</b> (intensità della radiazione UV; più è alto, più rapido è il rischio di scottature).',
  aqi:'Il grafico mostra la <b>qualità dell\'aria</b>. L\'area colorata è l\'<b>indice di qualità dell\'aria</b> (valutazione complessiva dell\'inquinamento – più è alto, peggio è). Le linee sono i singoli inquinanti: <b>PM2.5</b> e <b>PM10</b> (polveri), <b>O₃</b> (ozono al suolo), <b>NO₂</b>, <b>SO₂</b> e <b>CO</b>.',
  pollen:'Il grafico mostra la <b>concentrazione di pollini</b> delle singole piante (granuli/m³) nel tempo – graminacee, betulla, ontano, olivo, artemisia e ambrosia. La tabella sopra mostra i valori attuali, la valutazione e la stagione pollinica.'
 }
,  'el':{
  temp:'Το γράφημα δείχνει τη <b>θερμοκρασία του αέρα</b> για την επιλεγμένη τοποθεσία. Η συνεχής γραμμή είναι η θερμοκρασία, η διακεκομμένη είναι η <b>αισθητή θερμοκρασία</b> (πόσο ζεστό ή κρύο νιώθει το σώμα – λαμβάνοντας υπόψη άνεμο, υγρασία και ηλιοφάνεια).',
  cloud:'Το γράφημα δείχνει τη <b>νεφοκάλυψη</b> – πόσο μέρος του ουρανού καλύπτεται, σε %. Μπορείτε να εναλλάσσετε χαμηλά / μεσαία / υψηλά νέφη (κουμπί παρ. A/B). 0 % = αίθριος, 100 % = συννεφιά.',
  snow:'Το γράφημα δείχνει τη <b>βροχόπτωση</b>: χιόνι με <b>λευκό</b> και βροχή με <b>μπλε</b>· το συνολικό ύψος της στήλης είναι η βροχόπτωση σε mm/h. Η καμπύλη δείχνει επίσης την <b>υγρασία του εδάφους</b> (νερό στο επιφανειακό έδαφος 0–1 cm· σε % του όγκου, δηλαδή πόσο μέρος του εδάφους είναι νερό).',
  wind:'Το γράφημα δείχνει την <b>ταχύτητα του ανέμου</b> (συνεχής γραμμή) και τις <b>ριπές</b> (δεύτερη καμπύλη – σύντομες κορυφές ταχύτητας). Η κατεύθυνση/τα βέλη δείχνουν από πού φυσά ο άνεμος.',
  hum:'Το γράφημα δείχνει τη <b>σχετική υγρασία</b> σε % και το <b>σημείο δρόσου</b> (τη θερμοκρασία στην οποία ο αέρας θα έφτανε 100% υγρασία και θα ξεκινούσε η συμπύκνωση – όσο πιο κοντά στη θερμοκρασία του αέρα, τόσο πιο υγρός).',
  pressure:'Το γράφημα δείχνει την <b>ατμοσφαιρική πίεση</b> ανηγμένη στη στάθμη της θάλασσας (hPa). Η πτώση της πίεσης συχνά σημαίνει επιδείνωση του καιρού, η άνοδος βελτίωση.',
  vis:'Το γράφημα δείχνει την <b>ορατότητα</b> – πόσο μακριά βλέπετε (km). Η χαμηλή ορατότητα σημαίνει ομίχλη, έντονη βροχή ή χιόνι.',
  wetbulb:'Το γράφημα δείχνει τη <b>θερμοκρασία υγρού βολβού</b> (τη χαμηλότερη θερμοκρασία που μπορεί να επιτευχθεί με εξάτμιση νερού· δείχνει την πραγματική θερμική καταπόνηση σε υγρό αέρα – σε υψηλές τιμές η εφίδρωση δεν δροσίζει πλέον το σώμα).',
  solar:'Το γράφημα δείχνει την <b>ηλιακή ακτινοβολία</b> – την προσπίπτουσα ηλιακή ισχύ σε οριζόντια επιφάνεια (W/m²). Η ροζ καμπύλη είναι ο <b>δείκτης UV</b> (ένταση υπεριώδους ακτινοβολίας· όσο υψηλότερος, τόσο ταχύτερος ο κίνδυνος ηλιακού εγκαύματος).',
  aqi:'Το γράφημα δείχνει την <b>ποιότητα του αέρα</b>. Η έγχρωμη περιοχή είναι ο <b>δείκτης ποιότητας αέρα</b> (συνολική βαθμολογία ρύπανσης – όσο υψηλότερος, τόσο χειρότερα). Οι γραμμές είναι μεμονωμένοι ρύποι: <b>PM2.5</b> και <b>PM10</b> (σωματίδια σκόνης), <b>O₃</b> (όζον εδάφους), <b>NO₂</b>, <b>SO₂</b> και <b>CO</b>.',
  pollen:'Το γράφημα δείχνει τη <b>συγκέντρωση γύρης</b> μεμονωμένων φυτών (κόκκοι/m³) στον χρόνο – αγρωστώδη, σημύδα, σκλήθρα, ελιά, αρτεμισία και αμβροσία. Ο πίνακας πάνω δείχνει τρέχουσες τιμές, αξιολογήσεις και την εποχή γύρης.',
  },
  'is':{
  temp:'Ritið sýnir <b>lofthita</b> fyrir valda staðsetningu. Heila línan er hitinn, sú brotna er <b>upplifaður hiti</b> (hversu heitt eða kalt líkamanum finnst – með tilliti til vinds, raka og sólar).',
  cloud:'Ritið sýnir <b>skýjahulu</b> – hversu mikið af himninum er hulið, í %. Þú getur skipt á milli lágra / miðlungs / hárra skýja (hnappur útg. A/B). 0 % = heiðskírt, 100 % = alskýjað.',
  snow:'Ritið sýnir <b>úrkomu</b>: snjór í <b>hvítu</b> og regn í <b>bláu</b>; heildarhæð súlunnar er úrkoman í mm/klst. Ferillinn sýnir einnig <b>jarðvegsraka</b> (vatn í efsta jarðvegslaginu 0–1 cm; gefið í % af rúmmáli, þ.e. hversu mikið af jarðveginum er vatn).',
  wind:'Ritið sýnir <b>vindhraða</b> (heil lína) og <b>hviður</b> (annar ferill – stutt hámarkshraði). Stefnan/örvarnar sýna hvaðan vindurinn blæs.',
  hum:'Ritið sýnir <b>rakastig</b> í % og <b>daggarmark</b> (hitastigið þar sem loftið næði 100% raka og þétting hæfist – því nær lofthitanum, því rakara).',
  pressure:'Ritið sýnir <b>loftþrýsting</b> umreiknaðan að sjávarmáli (hPa). Lækkandi þrýstingur boðar oft versnandi veður, hækkandi batnandi.',
  vis:'Ritið sýnir <b>skyggni</b> – hversu langt sést (km). Lítið skyggni þýðir þoku, mikla rigningu eða snjó.',
  wetbulb:'Ritið sýnir <b>vothitastig</b> (lægsta hitastig sem næst með uppgufun vatns; það sýnir raunverulegt hitaálag í röku lofti – við há gildi kælir sviti líkamann ekki lengur).',
  solar:'Ritið sýnir <b>sólgeislun</b> – aðkomið sólarafl á láréttan flöt (W/m²). Bleiki ferillinn er <b>UV-stuðullinn</b> (styrkur útfjólublárrar geislunar; því hærri, því hraðari hætta á sólbruna).',
  aqi:'Ritið sýnir <b>loftgæði</b>. Litaða svæðið er <b>loftgæðavísitalan</b> (heildareinkunn mengunar – því hærri, því verri). Línurnar eru einstök mengunarefni: <b>PM2.5</b> og <b>PM10</b> (rykagnir), <b>O₃</b> (óson við jörðu), <b>NO₂</b>, <b>SO₂</b> og <b>CO</b>.',
  pollen:'Ritið sýnir <b>frjókornaþéttni</b> einstakra plantna (korn/m³) yfir tíma – gras, birki, elri, ólífa, malurt og ambrosía. Taflan að ofan sýnir núverandi gildi, einkunnir og frjótímabilið.',
  },
  'uk':{
  temp:'Графік показує <b>температуру повітря</b> для вибраного місця. Суцільна лінія – температура, пунктирна – <b>відчутна температура</b> (наскільки тепло чи холодно відчуває тіло – з урахуванням вітру, вологості та сонця).',
  cloud:'Графік показує <b>хмарність</b> – яка частина неба вкрита, у %. Можна перемикати низькі / середні / високі хмари (кнопка вар. A/B). 0 % = ясно, 100 % = суцільна хмарність.',
  snow:'Графік показує <b>опади</b>: сніг <b>білим</b> і дощ <b>синім</b>; загальна висота стовпчика – кількість опадів у мм/год. Крива також показує <b>вологість ґрунту</b> (вода у верхньому шарі ґрунту 0–1 см; у % обʼєму, тобто яка частина ґрунту є водою).',
  wind:'Графік показує <b>швидкість вітру</b> (суцільна лінія) та <b>пориви</b> (друга крива – короткі пікові швидкості). Напрямок/стрілки показують, звідки дме вітер.',
  hum:'Графік показує <b>відносну вологість</b> у % та <b>точку роси</b> (температуру, за якої повітря досягло б 100% вологості й почалася б конденсація – чим ближче до температури повітря, тим вологіше).',
  pressure:'Графік показує <b>атмосферний тиск</b>, зведений до рівня моря (гПа). Падіння тиску часто віщує погіршення погоди, зростання – покращення.',
  vis:'Графік показує <b>видимість</b> – як далеко видно (км). Низька видимість означає туман, сильний дощ або сніг.',
  wetbulb:'Графік показує <b>температуру вологого термометра</b> (найнижчу температуру, досяжну випаровуванням води; вона показує реальне теплове навантаження у вологому повітрі – за високих значень піт уже не охолоджує тіло).',
  solar:'Графік показує <b>сонячну радіацію</b> – потужність сонячного випромінювання на горизонтальну поверхню (Вт/м²). Рожева крива – <b>УФ-індекс</b> (інтенсивність ультрафіолету; чим вищий, тим швидший ризик сонячного опіку).',
  aqi:'Графік показує <b>якість повітря</b>. Кольорова ділянка – <b>індекс якості повітря</b> (загальна оцінка забруднення – чим вищий, тим гірше). Лінії – окремі забруднювачі: <b>PM2.5</b> та <b>PM10</b> (частинки пилу), <b>O₃</b> (приземний озон), <b>NO₂</b>, <b>SO₂</b> та <b>CO</b>.',
  pollen:'Графік показує <b>концентрацію пилку</b> окремих рослин (зерен/м³) у часі – трава, береза, вільха, олива, полин та амброзія. Таблиця вгорі показує поточні значення, оцінки та сезон пилку.',
  },
  'ca':{
  temp:'El gràfic mostra la <b>temperatura de l’aire</b> per al lloc seleccionat. La línia contínua és la temperatura, la discontínua és la <b>temperatura aparent</b> (com de calent o fred el sent el cos – tenint en compte el vent, la humitat i el sol).',
  cloud:'El gràfic mostra la <b>cobertura de núvols</b> – quina part del cel està coberta, en %. Pots canviar entre núvols baixos / mitjans / alts (botó var. A/B). 0 % = serè, 100 % = cobert.',
  snow:'El gràfic mostra la <b>precipitació</b>: neu en <b>blanc</b> i pluja en <b>blau</b>; l’altura total de la columna és la precipitació en mm/h. La corba també mostra la <b>humitat del sòl</b> (aigua a la capa superficial 0–1 cm; en % de volum, és a dir, quina part del sòl és aigua).',
  wind:'El gràfic mostra la <b>velocitat del vent</b> (línia contínua) i les <b>ràfegues</b> (segona corba – pics breus de velocitat). La direcció/les fletxes mostren d’on bufa el vent.',
  hum:'El gràfic mostra la <b>humitat relativa</b> en % i el <b>punt de rosada</b> (la temperatura a la qual l’aire arribaria al 100% d’humitat i començaria la condensació – com més a prop de la temperatura de l’aire, més humit).',
  pressure:'El gràfic mostra la <b>pressió atmosfèrica</b> reduïda al nivell del mar (hPa). Una pressió que baixa sovint indica empitjorament del temps, i una que puja, millora.',
  vis:'El gràfic mostra la <b>visibilitat</b> – fins a quina distància es veu (km). Una visibilitat baixa indica boira, pluja forta o neu.',
  wetbulb:'El gràfic mostra la <b>temperatura de bulb humit</b> (la temperatura més baixa assolible evaporant aigua; mostra l’estrès tèrmic real en aire humit – amb valors alts, suar ja no refreda el cos).',
  solar:'El gràfic mostra la <b>radiació solar</b> – la potència solar incident sobre una superfície horitzontal (W/m²). La corba rosa és l’<b>índex UV</b> (intensitat de la radiació UV; com més alt, més ràpid el risc de cremada solar).',
  aqi:'El gràfic mostra la <b>qualitat de l’aire</b>. L’àrea de color és l’<b>índex de qualitat de l’aire</b> (valoració global de la contaminació – com més alt, pitjor). Les línies són contaminants individuals: <b>PM2.5</b> i <b>PM10</b> (partícules de pols), <b>O₃</b> (ozó troposfèric), <b>NO₂</b>, <b>SO₂</b> i <b>CO</b>.',
  pollen:'El gràfic mostra la <b>concentració de pol·len</b> de plantes individuals (grans/m³) al llarg del temps – gramínies, bedoll, vern, olivera, artemísia i ambrosia. La taula de dalt mostra els valors actuals, les valoracions i la temporada de pol·len.',
  },
  'gl':{
  temp:'O gráfico mostra a <b>temperatura do aire</b> para o lugar seleccionado. A liña continua é a temperatura, a descontinua é a <b>temperatura aparente</b> (canto de quente ou frío o sente o corpo – tendo en conta o vento, a humidade e o sol).',
  cloud:'O gráfico mostra a <b>cobertura de nubes</b> – que parte do ceo está cuberta, en %. Podes cambiar entre nubes baixas / medias / altas (botón var. A/B). 0 % = despexado, 100 % = cuberto.',
  snow:'O gráfico mostra a <b>precipitación</b>: neve en <b>branco</b> e choiva en <b>azul</b>; a altura total da columna é a precipitación en mm/h. A curva tamén mostra a <b>humidade do solo</b> (auga na capa superficial 0–1 cm; en % de volume, é dicir, que parte do solo é auga).',
  wind:'O gráfico mostra a <b>velocidade do vento</b> (liña continua) e as <b>refachadas</b> (segunda curva – picos breves de velocidade). A dirección/as frechas mostran de onde sopra o vento.',
  hum:'O gráfico mostra a <b>humidade relativa</b> en % e o <b>punto de orballo</b> (a temperatura á que o aire acadaría o 100% de humidade e comezaría a condensación – canto máis preto da temperatura do aire, máis húmido).',
  pressure:'O gráfico mostra a <b>presión atmosférica</b> reducida ao nivel do mar (hPa). Unha presión que baixa adoita indicar empeoramento do tempo, e unha que sobe, mellora.',
  vis:'O gráfico mostra a <b>visibilidade</b> – ata que distancia se ve (km). Unha visibilidade baixa indica néboa, choiva forte ou neve.',
  wetbulb:'O gráfico mostra a <b>temperatura de bulbo húmido</b> (a temperatura máis baixa acadable evaporando auga; mostra o estrés térmico real no aire húmido – con valores altos, suar xa non arrefría o corpo).',
  solar:'O gráfico mostra a <b>radiación solar</b> – a potencia solar incidente sobre unha superficie horizontal (W/m²). A curva rosa é o <b>índice UV</b> (intensidade da radiación UV; canto máis alto, máis rápido o risco de queimadura solar).',
  aqi:'O gráfico mostra a <b>calidade do aire</b>. A área de cor é o <b>índice de calidade do aire</b> (valoración global da contaminación – canto máis alto, peor). As liñas son contaminantes individuais: <b>PM2.5</b> e <b>PM10</b> (partículas de po), <b>O₃</b> (ozono troposférico), <b>NO₂</b>, <b>SO₂</b> e <b>CO</b>.',
  pollen:'O gráfico mostra a <b>concentración de pole</b> de plantas individuais (grans/m³) ao longo do tempo – herba, bidueiro, ameneiro, oliveira, artemisia e ambrosia. A táboa de arriba mostra os valores actuais, as valoracións e a tempada de pole.',
  },
  'eu':{
  temp:'Grafikoak hautatutako tokiaren <b>aire-tenperatura</b> erakusten du. Lerro jarraitua tenperatura da, etena <b>itxurazko tenperatura</b> da (gorputzak zenbat bero edo hotz sentitzen duen – haizea, hezetasuna eta eguzkia kontuan hartuta).',
  cloud:'Grafikoak <b>hodei-estaldura</b> erakusten du – zeruaren zer zati dagoen estalita, %tan. Hodei baxu / ertain / altuen artean alda dezakezu (A/B aldaera botoia). % 0 = oskarbi, % 100 = hodeitsu.',
  snow:'Grafikoak <b>prezipitazioa</b> erakusten du: elurra <b>zuriz</b> eta euria <b>urdinez</b>; zutabearen altuera osoa prezipitazioa da mm/h-tan. Kurbak <b>lurzoruaren hezetasuna</b> ere erakusten du (ura goiko geruzan 0–1 cm; bolumenaren %tan, hau da, lurzoruaren zer zati den ura).',
  wind:'Grafikoak <b>haizearen abiadura</b> (lerro jarraitua) eta <b>haize-bolada</b> (bigarren kurba – abiadura-gailur laburrak) erakusten ditu. Norabideak/geziek haizea nondik datorren erakusten dute.',
  hum:'Grafikoak <b>hezetasun erlatiboa</b> %tan eta <b>ihintz-puntua</b> erakusten ditu (aireak % 100eko hezetasuna lortuko lukeen eta kondentsazioa hasiko litzatekeen tenperatura – aire-tenperaturatik zenbat eta gertuago, orduan eta hezeagoa).',
  pressure:'Grafikoak itsas mailara murriztutako <b>presio atmosferikoa</b> erakusten du (hPa). Presioa jaistea sarritan eguraldia okertzearen seinale da, igotzea berriz hobetzearena.',
  vis:'Grafikoak <b>ikusgaitasuna</b> erakusten du – zenbat urrutira ikusten den (km). Ikusgaitasun baxuak lainoa, euri zaparrada edo elurra esan nahi du.',
  wetbulb:'Grafikoak <b>tenperatura termometro hezean</b> erakusten du (ura lurrunduz lor daitekeen tenperaturarik baxuena; aire hezean benetako bero-estresa erakusten du – balio altuetan izerditzeak ez du gorputza hozten jada).',
  solar:'Grafikoak <b>eguzki-erradiazioa</b> erakusten du – gainazal horizontal batean jasotako eguzki-potentzia (W/m²). Kurba arrosa <b>UV indizea</b> da (UV erradiazioaren intentsitatea; zenbat eta altuago, orduan eta azkarrago eguzki-erredura izateko arriskua).',
  aqi:'Grafikoak <b>airearen kalitatea</b> erakusten du. Kolorezko eremua <b>airearen kalitate-indizea</b> da (kutsaduraren balorazio orokorra – zenbat eta altuago, okerrago). Lerroak banakako kutsatzaileak dira: <b>PM2.5</b> eta <b>PM10</b> (hauts-partikulak), <b>O₃</b> (lurzoruko ozonoa), <b>NO₂</b>, <b>SO₂</b> eta <b>CO</b>.',
  pollen:'Grafikoak banakako landareen <b>polen-kontzentrazioa</b> erakusten du (aleak/m³) denboran zehar – belarra, urkia, haltza, olibondoa, asentsioa eta anbrosia. Goiko taulak uneko balioak, balorazioak eta polen-denboraldia erakusten ditu.',
  },
  'tr':{
  temp:'Grafik, seçilen konum için <b>hava sıcaklığını</b> gösterir. Düz çizgi sıcaklıktır, kesik çizgi <b>hissedilen sıcaklıktır</b> (vücudun ne kadar sıcak veya soğuk hissettiği – rüzgâr, nem ve güneş dikkate alınarak).',
  cloud:'Grafik <b>bulut örtüsünü</b> gösterir – gökyüzünün ne kadarının kaplı olduğu, % olarak. Alçak / orta / yüksek bulutlar arasında geçiş yapabilirsiniz (var. A/B düğmesi). % 0 = açık, % 100 = kapalı.',
  snow:'Grafik <b>yağışı</b> gösterir: kar <b>beyaz</b> ve yağmur <b>mavi</b>; sütunun toplam yüksekliği mm/sa cinsinden yağış miktarıdır. Eğri ayrıca <b>toprak nemini</b> gösterir (yüzey toprağındaki su 0–1 cm; hacmin % olarak, yani toprağın ne kadarının su olduğu).',
  wind:'Grafik <b>rüzgâr hızını</b> (düz çizgi) ve <b>rüzgâr darbelerini</b> (ikinci eğri – kısa süreli zirve hızları) gösterir. Yön/oklar rüzgârın nereden estiğini gösterir.',
  hum:'Grafik <b>bağıl nemi</b> % olarak ve <b>çiy noktasını</b> gösterir (havanın %100 neme ulaşacağı ve yoğuşmanın başlayacağı sıcaklık – hava sıcaklığına ne kadar yakınsa, o kadar nemli).',
  pressure:'Grafik deniz seviyesine indirgenmiş <b>atmosfer basıncını</b> gösterir (hPa). Düşen basınç çoğu zaman havanın kötüleşeceğini, yükselen basınç ise düzeleceğini gösterir.',
  vis:'Grafik <b>görüş mesafesini</b> gösterir – ne kadar uzağın görüldüğü (km). Düşük görüş mesafesi sis, şiddetli yağmur veya kar anlamına gelir.',
  wetbulb:'Grafik <b>ıslak termometre sıcaklığını</b> gösterir (suyun buharlaşmasıyla ulaşılabilen en düşük sıcaklık; nemli havadaki gerçek ısı stresini gösterir – yüksek değerlerde terleme vücudu artık serinletmez).',
  solar:'Grafik <b>güneş ışınımını</b> gösterir – yatay bir yüzeye gelen güneş gücü (W/m²). Pembe eğri <b>UV indeksidir</b> (UV ışınımının şiddeti; ne kadar yüksekse, güneş yanığı riski o kadar hızlı).',
  aqi:'Grafik <b>hava kalitesini</b> gösterir. Renkli alan <b>hava kalitesi indeksidir</b> (genel kirlilik derecesi – ne kadar yüksekse, o kadar kötü). Çizgiler tek tek kirleticilerdir: <b>PM2.5</b> ve <b>PM10</b> (toz parçacıkları), <b>O₃</b> (yer seviyesi ozonu), <b>NO₂</b>, <b>SO₂</b> ve <b>CO</b>.',
  pollen:'Grafik tek tek bitkilerin <b>polen yoğunluğunu</b> gösterir (tane/m³) zaman içinde – çimen, huş, kızılağaç, zeytin, pelin ve kanyaş. Yukarıdaki tablo güncel değerleri, dereceleri ve polen mevsimini gösterir.',
  },
  'id':{
  temp:'Grafik menunjukkan <b>suhu udara</b> untuk lokasi terpilih. Garis penuh adalah suhu, garis putus-putus adalah <b>suhu terasa</b> (seberapa hangat atau dingin yang dirasakan tubuh – dengan memperhitungkan angin, kelembapan, dan sinar matahari).',
  cloud:'Grafik menunjukkan <b>tutupan awan</b> – seberapa banyak langit yang tertutup, dalam %. Anda dapat beralih antara awan rendah / menengah / tinggi (tombol var. A/B). 0 % = cerah, 100 % = mendung total.',
  snow:'Grafik menunjukkan <b>presipitasi</b>: salju dengan warna <b>putih</b> dan hujan dengan warna <b>biru</b>; tinggi total kolom adalah curah hujan dalam mm/jam. Kurva juga menunjukkan <b>kelembapan tanah</b> (air di lapisan tanah atas 0–1 cm; dalam % volume, yaitu berapa banyak bagian tanah yang berupa air).',
  wind:'Grafik menunjukkan <b>kecepatan angin</b> (garis penuh) dan <b>embusan</b> (kurva kedua – puncak kecepatan singkat). Arah/panah menunjukkan dari mana angin bertiup.',
  hum:'Grafik menunjukkan <b>kelembapan relatif</b> dalam % dan <b>titik embun</b> (suhu saat udara mencapai kelembapan 100% dan kondensasi mulai terjadi – semakin dekat dengan suhu udara, semakin lembap).',
  pressure:'Grafik menunjukkan <b>tekanan atmosfer</b> yang dikonversi ke permukaan laut (hPa). Tekanan yang turun sering menandakan cuaca memburuk, tekanan yang naik menandakan membaik.',
  vis:'Grafik menunjukkan <b>jarak pandang</b> – seberapa jauh dapat dilihat (km). Jarak pandang rendah berarti kabut, hujan lebat, atau salju.',
  wetbulb:'Grafik menunjukkan <b>suhu bola basah</b> (suhu terendah yang dapat dicapai dengan penguapan air; menunjukkan tekanan panas nyata di udara lembap – pada nilai tinggi, berkeringat tidak lagi mendinginkan tubuh).',
  solar:'Grafik menunjukkan <b>radiasi matahari</b> – daya matahari yang datang pada permukaan horizontal (W/m²). Kurva merah muda adalah <b>indeks UV</b> (intensitas radiasi UV; semakin tinggi, semakin cepat risiko terbakar matahari).',
  aqi:'Grafik menunjukkan <b>kualitas udara</b>. Area berwarna adalah <b>indeks kualitas udara</b> (penilaian polusi secara keseluruhan – semakin tinggi, semakin buruk). Garis-garisnya adalah masing-masing polutan: <b>PM2.5</b> dan <b>PM10</b> (partikel debu), <b>O₃</b> (ozon permukaan), <b>NO₂</b>, <b>SO₂</b>, dan <b>CO</b>.',
  pollen:'Grafik menunjukkan <b>konsentrasi serbuk sari</b> masing-masing tanaman (butir/m³) dari waktu ke waktu – rumput, birch, alder, zaitun, baru cina, dan ragweed. Tabel di atas menunjukkan nilai saat ini, penilaian, dan musim serbuk sari.',
  },
  'vi':{
  temp:'Biểu đồ hiển thị <b>nhiệt độ không khí</b> cho địa điểm đã chọn. Đường liền là nhiệt độ, đường nét đứt là <b>nhiệt độ cảm nhận</b> (cơ thể cảm thấy nóng hay lạnh ra sao – có tính đến gió, độ ẩm và nắng).',
  cloud:'Biểu đồ hiển thị <b>lượng mây</b> – bao nhiêu phần bầu trời bị che phủ, tính bằng %. Bạn có thể chuyển giữa mây thấp / trung / cao (nút biến thể A/B). 0 % = quang đãng, 100 % = u ám hoàn toàn.',
  snow:'Biểu đồ hiển thị <b>giáng thủy</b>: tuyết màu <b>trắng</b> và mưa màu <b>xanh</b>; tổng chiều cao cột là lượng mưa tính bằng mm/giờ. Đường cong cũng hiển thị <b>độ ẩm đất</b> (nước ở lớp đất mặt 0–1 cm; tính bằng % thể tích, tức bao nhiêu phần của đất là nước).',
  wind:'Biểu đồ hiển thị <b>tốc độ gió</b> (đường liền) và <b>gió giật</b> (đường cong thứ hai – các đỉnh tốc độ ngắn). Hướng/mũi tên cho biết gió thổi từ đâu tới.',
  hum:'Biểu đồ hiển thị <b>độ ẩm tương đối</b> tính bằng % và <b>điểm sương</b> (nhiệt độ mà tại đó không khí đạt độ ẩm 100% và bắt đầu ngưng tụ – càng gần nhiệt độ không khí thì càng ẩm).',
  pressure:'Biểu đồ hiển thị <b>áp suất khí quyển</b> quy về mực nước biển (hPa). Áp suất giảm thường báo hiệu thời tiết xấu đi, áp suất tăng báo hiệu tốt lên.',
  vis:'Biểu đồ hiển thị <b>tầm nhìn</b> – nhìn được xa bao nhiêu (km). Tầm nhìn thấp nghĩa là sương mù, mưa lớn hoặc tuyết.',
  wetbulb:'Biểu đồ hiển thị <b>nhiệt độ bầu ướt</b> (nhiệt độ thấp nhất đạt được nhờ bay hơi nước; nó cho thấy mức stress nhiệt thực sự trong không khí ẩm – ở giá trị cao, đổ mồ hôi không còn làm mát cơ thể).',
  solar:'Biểu đồ hiển thị <b>bức xạ mặt trời</b> – công suất mặt trời tới trên một bề mặt nằm ngang (W/m²). Đường cong màu hồng là <b>chỉ số UV</b> (cường độ bức xạ UV; càng cao, nguy cơ cháy nắng càng nhanh).',
  aqi:'Biểu đồ hiển thị <b>chất lượng không khí</b>. Vùng tô màu là <b>chỉ số chất lượng không khí</b> (xếp hạng ô nhiễm tổng thể – càng cao càng xấu). Các đường là từng chất ô nhiễm: <b>PM2.5</b> và <b>PM10</b> (hạt bụi), <b>O₃</b> (ô-dôn tầng mặt đất), <b>NO₂</b>, <b>SO₂</b> và <b>CO</b>.',
  pollen:'Biểu đồ hiển thị <b>nồng độ phấn hoa</b> của từng loài cây (hạt/m³) theo thời gian – cỏ, bạch dương, tống quán sủi, ô liu, ngải cứu và cỏ phấn hương. Bảng phía trên hiển thị giá trị hiện tại, mức đánh giá và mùa phấn hoa.',
  },
  'tl':{
  temp:'Ipinapakita ng graph ang <b>temperatura ng hangin</b> para sa napiling lokasyon. Ang tuloy-tuloy na linya ay ang temperatura, ang putol-putol ay ang <b>nararamdamang temperatura</b> (kung gaano kainit o kalamig ang nararamdaman ng katawan – isinasaalang-alang ang hangin, halumigmig at sikat ng araw).',
  cloud:'Ipinapakita ng graph ang <b>takip ng ulap</b> – kung gaano kalaki sa langit ang natatakpan, sa %. Maaari kang lumipat sa mababa / katamtaman / mataas na ulap (button na var. A/B). 0 % = aliwalas, 100 % = makulimlim.',
  snow:'Ipinapakita ng graph ang <b>ulan/snow</b>: niyebe sa <b>puti</b> at ulan sa <b>asul</b>; ang kabuuang taas ng kolumna ay ang dami ng ulan sa mm/oras. Ipinapakita rin ng curve ang <b>halumigmig ng lupa</b> (tubig sa ibabaw ng lupa 0–1 cm; sa % ng volume, ibig sabihin kung gaano karami sa lupa ang tubig).',
  wind:'Ipinapakita ng graph ang <b>bilis ng hangin</b> (tuloy-tuloy na linya) at ang <b>mga biglaang hangin</b> (ikalawang curve – maikling pinakamataas na bilis). Ipinapakita ng direksyon/mga arrow kung saan nagmumula ang hangin.',
  hum:'Ipinapakita ng graph ang <b>relative humidity</b> sa % at ang <b>dew point</b> (ang temperatura kung saan aabot ng 100% na halumigmig ang hangin at magsisimula ang condensation – kung mas malapit sa temperatura ng hangin, mas mahalumigmig).',
  pressure:'Ipinapakita ng graph ang <b>presyon ng atmospera</b> na isinaayos sa antas ng dagat (hPa). Ang bumababang presyon ay madalas na tanda ng paglala ng panahon, ang umaakyat ay paggaling.',
  vis:'Ipinapakita ng graph ang <b>visibility</b> – gaano kalayo ang nakikita (km). Ang mababang visibility ay nangangahulugan ng fog, malakas na ulan o niyebe.',
  wetbulb:'Ipinapakita ng graph ang <b>wet-bulb temperature</b> (ang pinakamababang temperaturang maaabot sa pamamagitan ng pagsingaw ng tubig; ipinapakita nito ang tunay na heat stress sa mahalumigmig na hangin – sa mataas na halaga, hindi na nagpapalamig sa katawan ang pagpapawis).',
  solar:'Ipinapakita ng graph ang <b>solar radiation</b> – ang dumarating na lakas ng araw sa isang pahalang na ibabaw (W/m²). Ang kulay-rosas na curve ay ang <b>UV index</b> (lakas ng UV radiation; kung mas mataas, mas mabilis ang panganib ng sunburn).',
  aqi:'Ipinapakita ng graph ang <b>kalidad ng hangin</b>. Ang may kulay na bahagi ay ang <b>air quality index</b> (pangkalahatang marka ng polusyon – kung mas mataas, mas malala). Ang mga linya ay mga indibidwal na polutant: <b>PM2.5</b> at <b>PM10</b> (mga particle ng alikabok), <b>O₃</b> (ozone sa ibabaw ng lupa), <b>NO₂</b>, <b>SO₂</b> at <b>CO</b>.',
  pollen:'Ipinapakita ng graph ang <b>konsentrasyon ng pollen</b> ng bawat halaman (butil/m³) sa paglipas ng panahon – damo, birch, alder, olibo, mugwort at ragweed. Ipinapakita ng talahanayan sa itaas ang kasalukuyang halaga, marka at ang panahon ng pollen.',
  },
  'sw':{
  temp:'Grafu inaonyesha <b>joto la hewa</b> kwa eneo lililochaguliwa. Mstari uliojaa ni joto, uliokatika ni <b>joto linalohisiwa</b> (jinsi mwili unavyohisi joto au baridi – kwa kuzingatia upepo, unyevu na jua).',
  cloud:'Grafu inaonyesha <b>uwingu</b> – ni kiasi gani cha anga kimefunikwa, kwa %. Unaweza kubadili mawingu ya chini / kati / juu (kitufe cha lahaja A/B). 0 % = wazi, 100 % = mawingu kabisa.',
  snow:'Grafu inaonyesha <b>mvua</b>: theluji kwa rangi <b>nyeupe</b> na mvua kwa rangi ya <b>buluu</b>; urefu wa jumla wa nguzo ni kiasi cha mvua kwa mm/saa. Mkunjo pia unaonyesha <b>unyevu wa udongo</b> (maji katika udongo wa juu 0–1 cm; kwa % ya ujazo, yaani ni kiasi gani cha udongo ni maji).',
  wind:'Grafu inaonyesha <b>kasi ya upepo</b> (mstari uliojaa) na <b>mvumo wa upepo</b> (mkunjo wa pili – vilele vifupi vya kasi). Mwelekeo/mishale huonyesha upepo unakotoka.',
  hum:'Grafu inaonyesha <b>unyevu wa hewa</b> kwa % na <b>kiwango cha umande</b> (joto ambalo hewa ingefikia unyevu wa 100% na ufinyazi ungeanza – kadiri inavyokaribia joto la hewa, ndivyo unyevu unavyozidi).',
  pressure:'Grafu inaonyesha <b>shinikizo la angahewa</b> lililorekebishwa hadi usawa wa bahari (hPa). Shinikizo linaloshuka mara nyingi linaashiria hali ya hewa kuwa mbaya zaidi, linalopanda kuwa nzuri zaidi.',
  vis:'Grafu inaonyesha <b>uonekano</b> – ni umbali gani unaweza kuona (km). Uonekano mdogo unamaanisha ukungu, mvua kubwa au theluji.',
  wetbulb:'Grafu inaonyesha <b>joto la balbu yenye unyevu</b> (joto la chini kabisa linaloweza kufikiwa kwa uvukizaji wa maji; linaonyesha mkazo halisi wa joto katika hewa yenye unyevu – kwa thamani za juu, kutokwa jasho hakupozi tena mwili).',
  solar:'Grafu inaonyesha <b>mnururisho wa jua</b> – nguvu ya jua inayofika kwenye uso ulionyooka (W/m²). Mkunjo wa waridi ni <b>kielelezo cha UV</b> (kiwango cha mnururisho wa UV; kadiri kinavyozidi, ndivyo hatari ya kuungua na jua inavyoongezeka kwa kasi).',
  aqi:'Grafu inaonyesha <b>ubora wa hewa</b>. Eneo lenye rangi ni <b>kielelezo cha ubora wa hewa</b> (kadirio la jumla la uchafuzi – kadiri kinavyozidi, ndivyo inavyozidi kuwa mbaya). Mistari ni vichafuzi mahususi: <b>PM2.5</b> na <b>PM10</b> (chembe za vumbi), <b>O₃</b> (ozoni ya usawa wa ardhi), <b>NO₂</b>, <b>SO₂</b> na <b>CO</b>.',
  pollen:'Grafu inaonyesha <b>mkusanyiko wa chavua</b> wa mimea mbalimbali (chembe/m³) kwa muda – nyasi, birch, alder, mzeituni, mchungu na ragweed. Jedwali lililo juu linaonyesha thamani za sasa, makadirio na msimu wa chavua.',
  },
  'zh':{
  temp:'图表显示所选地点的<b>气温</b>。实线为气温，虚线为<b>体感温度</b>（身体感觉到的冷暖——考虑了风、湿度和日照）。',
  cloud:'图表显示<b>云量</b>——天空被云覆盖的比例，以 % 表示。可切换低／中／高云（变体 A/B 按钮）。0 % = 晴朗，100 % = 阴天。',
  snow:'图表显示<b>降水</b>：雪为<b>白色</b>，雨为<b>蓝色</b>；柱的总高度为降水量（mm/h）。曲线还显示<b>土壤湿度</b>（表层土壤 0–1 cm 中的水分；以体积 % 表示，即土壤中有多少是水）。',
  wind:'图表显示<b>风速</b>（实线）和<b>阵风</b>（第二条曲线——短时峰值风速）。风向／箭头表示风从何处吹来。',
  hum:'图表显示<b>相对湿度</b>（%）和<b>露点</b>（空气达到 100% 湿度并开始凝结时的温度——越接近气温就越潮湿）。',
  pressure:'图表显示换算到海平面的<b>大气压</b>（hPa）。气压下降通常预示天气转坏，气压上升则转好。',
  vis:'图表显示<b>能见度</b>——能看多远（km）。能见度低意味着雾、大雨或雪。',
  wetbulb:'图表显示<b>湿球温度</b>（通过水分蒸发可达到的最低温度；它反映潮湿空气中真实的热应激——数值高时出汗已无法为身体降温）。',
  solar:'图表显示<b>太阳辐射</b>——到达水平面的太阳功率（W/m²）。粉色曲线为<b>紫外线指数</b>（UV 辐射强度；越高，晒伤风险来得越快）。',
  aqi:'图表显示<b>空气质量</b>。彩色区域为<b>空气质量指数</b>（总体污染评级——越高越差）。各线条为单项污染物：<b>PM2.5</b> 和 <b>PM10</b>（粉尘颗粒）、<b>O₃</b>（近地面臭氧）、<b>NO₂</b>、<b>SO₂</b> 和 <b>CO</b>。',
  pollen:'图表显示各种植物随时间变化的<b>花粉浓度</b>（颗粒/m³）——草、桦树、桤木、橄榄、艾蒿和豚草。上方表格显示当前数值、评级和花粉季。',
  },
  'ja':{
  temp:'グラフは選択した場所の<b>気温</b>を示します。実線は気温、破線は<b>体感温度</b>（風・湿度・日射を考慮した、体が感じる暑さ・寒さ）です。',
  cloud:'グラフは<b>雲量</b>を示します。空のどれだけが雲に覆われているか（%）。下層／中層／上層の雲を切り替えられます（バリエーション A/B ボタン）。0 % = 快晴、100 % = 曇天。',
  snow:'グラフは<b>降水</b>を示します。雪は<b>白</b>、雨は<b>青</b>。柱の合計の高さが降水量（mm/h）です。曲線は<b>土壌水分</b>（表層土 0–1 cm の水分。体積 % で、土のうちどれだけが水か）も示します。',
  wind:'グラフは<b>風速</b>（実線）と<b>突風</b>（2本目の曲線――短時間の最大風速）を示します。方向／矢印は風がどこから吹くかを示します。',
  hum:'グラフは<b>相対湿度</b>（%）と<b>露点</b>（空気が湿度100%に達して結露が始まる温度――気温に近いほど湿っています）を示します。',
  pressure:'グラフは海面に換算した<b>気圧</b>（hPa）を示します。気圧の低下は天気の悪化、上昇は回復を示すことが多いです。',
  vis:'グラフは<b>視程</b>――どれだけ遠くまで見えるか（km）を示します。視程が低いと霧・大雨・雪を意味します。',
  wetbulb:'グラフは<b>湿球温度</b>（水の蒸発で到達できる最低温度。湿った空気での実際の熱ストレスを示します――高い値では発汗で体を冷やせなくなります）を示します。',
  solar:'グラフは<b>日射量</b>――水平面に入射する太陽の出力（W/m²）を示します。ピンクの曲線は<b>UV指数</b>（紫外線の強さ。高いほど日焼けの危険が早く高まります）です。',
  aqi:'グラフは<b>大気質</b>を示します。色のついた面は<b>大気質指数</b>（全体的な汚染の評価――高いほど悪い）。各線は個別の汚染物質：<b>PM2.5</b> と <b>PM10</b>（粉じん粒子）、<b>O₃</b>（地表オゾン）、<b>NO₂</b>、<b>SO₂</b>、<b>CO</b>です。',
  pollen:'グラフは各植物の<b>花粉濃度</b>（粒/m³）の時間変化を示します――草、カバノキ、ハンノキ、オリーブ、ヨモギ、ブタクサ。上の表は現在値、評価、花粉シーズンを示します。',
  },
  'ko':{
  temp:'그래프는 선택한 위치의 <b>기온</b>을 보여줍니다. 실선은 기온, 점선은 <b>체감 온도</b>(바람, 습도, 일사를 고려해 몸이 느끼는 더위나 추위)입니다.',
  cloud:'그래프는 <b>운량</b>을 보여줍니다 – 하늘이 얼마나 구름에 덮여 있는지, % 단위. 하층 / 중층 / 상층 구름을 전환할 수 있습니다(변형 A/B 버튼). 0 % = 맑음, 100 % = 흐림.',

function helpRel(el){ // pozice prvku vůči #app
  var app=document.getElementById('app').getBoundingClientRect(),r=el.getBoundingClientRect();
  return {l:r.left-app.left,t:r.top-app.top,w:r.width,h:r.height,r:r.right-app.left,b:r.bottom-app.top};
}
function toggleHelp(){
  helpMode=!helpMode;
  var ov=document.getElementById('helpOverlay'),btn=document.getElementById('helpBtn'),q=document.getElementById('helpQ');
  if(helpMode){btn.classList.add('active');q.textContent=HT('zavři help mód');buildHelp();ov.classList.add('on');}
  else{btn.classList.remove('active');q.textContent='???';ov.classList.remove('on');ov.innerHTML='';}
}
function helpNote(ov,cx,cy,ico,txt,desc){
  var d=document.createElement('div');d.className='help-note'+(desc?' tap':'');d.style.left=cx+'px';d.style.top=cy+'px';
  d.innerHTML='<span class="hn-ico">'+ico+'</span>'+(txt?'<span class="hn-cap">'+txt+'</span>':'');
  if(desc)d.onclick=function(e){e.stopPropagation();openHelpPop(cx,cy,desc);};
  ov.appendChild(d);return d;
}
function helpArea(ov,l,t,w,h,lbl,alt){
  var d=document.createElement('div');d.className='help-area'+(alt?' alt':'');
  d.style.left=l+'px';d.style.top=t+'px';d.style.width=w+'px';d.style.height=h+'px';
  if(lbl)d.innerHTML='<span class="ha-lbl">'+lbl+'</span>';
  ov.appendChild(d);return d;
}
// Velký tiskací popisek oblasti umístěný do prostoru (ne na rámeček). anchor: 'left'|'center'|'right' (vodorovně), y = svislý střed.
function helpAreaLabel(ov,x,y,txt,color,anchor){
  var d=document.createElement('div');
  d.style.cssText='position:absolute;font-weight:800;font-size:15px;letter-spacing:0.5px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 5px #000,0 0 5px #000;pointer-events:none';
  d.style.color=color;d.style.left=x+'px';d.style.top=y+'px';
  d.style.transform=(anchor==='right'?'translate(-100%,-50%)':anchor==='center'?'translate(-50%,-50%)':'translate(0,-50%)');
  d.textContent=txt;ov.appendChild(d);return d;
}
function helpHot(ov,x,y,desc,cls){
  var d=document.createElement('div');d.className='help-hot'+(cls?' '+cls:'');d.style.left=x+'px';d.style.top=y+'px';d.textContent='?';
  d.onclick=function(e){e.stopPropagation();openHelpPop(x,y,desc);};
  ov.appendChild(d);return d;
}
function openHelpPop(x,y,desc){
  var ov=document.getElementById('helpOverlay');
  var old=ov.querySelector('.help-pop');if(old)old.remove();
  var p=document.createElement('div');p.className='help-pop';
  p.innerHTML=desc+'<span class="hp-x">✕</span>';
  ov.appendChild(p);
  // umísti popup poblíž otazníku, ale ať se vejde do #app
  var app=document.getElementById('app').getBoundingClientRect();
  var pw=p.offsetWidth,ph=p.offsetHeight;
  var px=x+16,py=y-ph-6;
  if(px+pw>app.width-6)px=app.width-pw-6; if(px<6)px=6;
  if(py<4)py=y+18; if(py+ph>app.height-4)py=app.height-ph-4; if(py<4)py=4;
  p.style.left=px+'px';p.style.top=py+'px';
  p.querySelector('.hp-x').onclick=function(e){e.stopPropagation();p.remove();};
}
function buildHelp(){
  var ov=document.getElementById('helpOverlay');ov.innerHTML='';
  var appR=document.getElementById('app').getBoundingClientRect();
  var W=appR.width,H=appR.height;
  // kliknutí mimo otazník zavře popup
  ov.onclick=function(){var p=ov.querySelector('.help-pop');if(p)p.remove();};

  var hint=document.createElement('div');hint.className='help-hint';
  hint.innerHTML='✋ '+HT('Nápověda – ťukni na žluté <b>?</b> nebo na ikonky pro popis. Zavřeš tlačítkem vpravo dole.');
  ov.appendChild(hint);
  var chartShown=document.getElementById('cubeWrap').style.display!=='none';

  function pairCtr(idA,idB){var a=document.getElementById(idA),b=document.getElementById(idB);if(!a||!b||a.offsetParent===null||b.offsetParent===null)return null;var ra=helpRel(a),rb=helpRel(b);return {x:(ra.l+ra.r+rb.l+rb.r)/4,y:(ra.t+ra.b+rb.t+rb.b)/4};}

  // PRAVÁ OSA: GO+refresh, GPS+stát, +GRAF+písmo (každý 1 otazník mezi dvojicí tlačítek)

  if(pGps)helpHot(ov,rAxis,pGps.y,HT('<b>GPS</b> zjistí tvoji polohu a načte počasí pro ni. <b>Stát / jazyk</b> vybere zemi a jazyk – podle toho se zobrazují jednotky a názvy.'));
  if(pGraf)helpHot(ov,rAxis,pGraf.y,HT('<b>+ GRAF</b> přidá nebo ubere další grafy (dohlednost, UV, kvalita ovzduší, pyl…). <b>AAAA</b> mění velikost písma v aplikaci.'));

    var _ms=document.getElementById('metricsScroll');var _sL=_ms?_ms.scrollLeft:0;
    lAxis=(_t1?(r0.r+helpRel(_t1).l)/2:(r0.l+r0.w*0.5))+_sL;   // +scroll → pevná poloha (jako u grafu teploty), neutíká s posunem dlaždic
    tilesY=r0.t+r0.h*0.5;}
  if(lAxis===null){var mw=document.getElementById('metricsWrap');if(mw&&mw.style.display!=='none'){var rm=helpRel(mw);lAxis=rm.l+30;tilesY=rm.t+rm.h*0.5;}}
  var cq=document.getElementById('cityQ');
  if(cq&&cq.offsetParent!==null){var cr=helpRel(cq);
    helpHot(ov,(lAxis!=null?lAxis:cr.l+20),cr.t+cr.h*0.5,HT('<b>Zadání místa</b> – do pole napiš název obce a vyber ho z <b>našeptávače</b>, nebo zadej <b>souřadnice</b> (zeměpisnou šířku a délku) do políček vpravo. Pak ťukni na <b>GO</b>.'));}
  var rc=document.getElementById('recentChips');

    helpHot(ov,(lAxis!=null?lAxis:rr.l+20),rr.t+rr.h*0.5,HT('<b>Historie míst</b> – ťuknutím vybereš dříve načtené místo. Lokalitu si můžeš <b>připíchnout špendlíkem 📌</b>, aby v historii zůstala. <b>Podržením prstu</b> se tato část <b>zvětší (lupa)</b> pro pohodlnější výběr.'));}

      // DALŠÍ GRAF – pod zoomem
      helpNote(ov,midX,c.t+c.h*0.25+50,'✋⇄',HT('další graf'),
        HT('<b>Další graf</b> – <b>rychlým</b> vodorovným švihnutím (swipe) <b>v ploše horní poloviny grafu</b> přepneš na další/předchozí graf. Posun po časové ose uděláš <b>pomalým tažením v oblasti poblíž časové osy</b> (dole).'));
      // PODRŽ = hodnoty
      helpNote(ov,c.l+c.w*0.76,midY+22,'👆⏱',HT('podrž = hodnoty'),
        HT('<b>Hodnoty v čase</b> – <b>podrž prst</b> na grafu a posouvej; u všech křivek se ukáže hodnota pro daný čas.'));
      // POSUN ČASU – dole nad časovou osou
      helpNote(ov,midX,c.b-60,'👆⟷',HT('posun času'),
        HT('<b>Posun po čase</b> – <b>pomalým</b> tažením do strany <b>v oblasti poblíž časové osy (dole)</b> posouváš graf v čase (do minulosti/budoucnosti). Rychlý švih v horní polovině grafu naopak přepne graf.'));
      // popis aktuálního grafu (žlutý ? cca uprostřed grafu, výrazně zvýrazněný)
      var _cdesc=HC(currentTab)||HT('<b>Graf</b> – průběh hodnoty v čase. Svislá čára „teď" ukazuje aktuální okamžik.');
      if(hasCurves)_cdesc+=' <i>'+HT('Jednotlivé křivky zapneš/vypneš štítky nad grafem.')+'</i>';
      helpHot(ov,midX,c.t+c.h*0.60,_cdesc,'big');
    }
    // zapínání/vypínání křivek (layer bar) – jen když graf přepínatelné křivky má a štítky jsou viditelné
    if(hasCurves&&lb.offsetParent!==null){var l=helpRel(lb),fc=helpRel(lb.children[0]);
      var nx=Math.max(c.l+48,Math.min(c.r-48,fc.l+fc.w*0.5));
      helpNote(ov,nx,l.b+2,'👆',HT('zapni/vypni křivku'),
        HT('<b>Křivky</b> – štítky nad grafem zapínáš nebo vypínáš jednotlivé křivky.'));
    }
  } else {
    helpNote(ov,W*0.5,H*0.42,'🔎',HT('Nejdřív zadej obec, GPS nebo souřadnice a stiskni GO. Pak se tu zobrazí grafy a další nápověda.'));
  }
}
window.addEventListener('resize',function(){if(helpMode)buildHelp();});

renderLayerBar();
renderRecentChips();

  var last=localStorage.getItem('lastLocation');
  if(last){try{var loc=JSON.parse(last);cityQ.value=loc.name;loadWeather(loc.lat,loc.lon,loc.name);}catch(e){}}
});
