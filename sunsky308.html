<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUN-SKY (by PF)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{height:100%;background:#080c14;color:#d8eaff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
.hdr{display:flex;align-items:center;gap:8px;padding:8px 10px 5px;border-bottom:1px solid #1e3050}
.hdr-title{font-size:15px;font-weight:700;color:#f0f6ff;flex:1}
.hdr-time{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums}
.hdr-date{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums;margin-right:4px}
.hdr-brand{display:flex;align-items:center;gap:7px;flex:1;cursor:pointer;min-width:0}
/* Logo: slunce + bílý mráček před ním */
.sklogo{position:relative;display:inline-block;width:24px;height:20px;flex-shrink:0;vertical-align:middle}
.sklogo .sk-s{position:absolute;left:1px;top:-2px;font-size:16px;line-height:1;color:#ffc63a;text-shadow:0 0 5px rgba(255,170,0,.6)}
.sklogo .sk-c{position:absolute;left:6px;top:5px;font-size:15px;line-height:1;color:#ffffff;text-shadow:0 1px 2px rgba(0,40,80,.55)}
/* Vyskakovací okno O aplikaci */
#aboutPopup{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#aboutPopup.open{display:flex}
.about-box{position:relative;background:linear-gradient(160deg,#17273f 0%,#0d1626 100%);border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.5);padding:18px 22px;overflow:hidden;max-width:min(92vw,420px);max-height:88vh;display:flex;flex-direction:column}
.about-close{position:absolute;top:8px;right:10px;z-index:3;width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#cfe0f5;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.about-close:active{background:rgba(255,255,255,.2)}
.about-disc{position:relative;margin-top:10px;text-align:left;color:#c4d6ee;font-size:11px;line-height:1.5;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.about-lang-row{display:flex;justify-content:center;margin-top:12px}
#aboutLangBtn{min-width:64px;height:30px;justify-content:center;font-size:13px}
.about-actions{display:flex;gap:10px;margin-top:12px}
.about-btn{flex:1;border:none;border-radius:10px;padding:11px 8px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.about-agree{background:linear-gradient(160deg,#1f7a43,#135e30)}
.about-agree:active{background:#135e30}
.about-quit{background:linear-gradient(160deg,#8a2f2f,#6a1f1f)}
.about-quit:active{background:#6a1f1f}
#langPopup{z-index:360}
.about-disc .ab-dt{font-size:13px;font-weight:800;color:#f0f6ff;text-align:center;margin-bottom:8px}
.about-disc p{margin-bottom:7px}
.about-disc ol{margin:0;padding-left:18px}
.about-disc li{margin-bottom:6px}
.about-logo-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.13;pointer-events:none}
.about-logo-bg .sklogo{width:120px;height:100px}
.about-logo-bg .sk-s{font-size:80px;left:6px;top:-6px;text-shadow:none}
.about-logo-bg .sk-c{font-size:74px;left:34px;top:28px;text-shadow:none}
.about-frame{position:relative;border:1.5px solid #4a6a9a;border-radius:10px;padding:14px 26px;text-align:center;color:#dceaff;line-height:1.55;background:rgba(8,16,30,.35)}
.about-frame .ab-t{font-size:18px;font-weight:800;letter-spacing:1px;color:#f0f6ff}
.about-frame .ab-v{font-size:12px;color:#9fc0e6;margin-top:2px}
.loc-bar{padding:5px 8px;display:flex;flex-direction:column;gap:4px;position:relative}
.loc-bar::after{content:"";position:absolute;left:8px;right:76px;bottom:0;height:1px;background:#1e3050;pointer-events:none}
.vdiv-line{position:absolute;width:1px;background:#2a4a80;pointer-events:none;z-index:1}
.loc-row{display:flex;gap:5px;align-items:center}
.loc-input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:6px 9px;font-size:13px;outline:none;min-width:0}
.coord-wrap{flex:0 0 3.7em;width:3.7em;min-width:0;display:flex;align-items:center;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;padding:0 3px}
.coord-in{flex:1 1 0;min-width:0;background:transparent;border:none;color:#d8eaff;padding:2px 0;font-size:11px;text-align:right;outline:none;-moz-appearance:textfield;appearance:textfield}
.coord-in::-webkit-outer-spin-button,.coord-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.deg{font-size:11px;color:#8fb0dc;flex-shrink:0;padding-left:1px}
.coord-in::placeholder{color:#3a5a7a}
.loc-input::placeholder{color:#3a5a7a}
.loc-input:focus{border-color:#3a6aaa}
.loc-btn{background:linear-gradient(180deg,#2a4a88 0%,#1a3a70 60%,#142e5a 100%);border:none;border-radius:8px;color:#a8d4ff;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1;display:flex;align-items:center;gap:3px;font-weight:600;box-shadow:0 2px 0 #0a1830,inset 0 1px 0 rgba(180,220,255,0.18);text-shadow:0 1px 2px rgba(0,0,30,0.7)}
.loc-btn:active{box-shadow:0 0px 0 #0a1830,inset 0 2px 4px rgba(0,0,40,0.5);transform:translateY(1px)}
.gps-go{background:linear-gradient(180deg,#2a4a88 0%,#1a3a70 60%,#142e5a 100%);border:none;border-radius:8px;color:#a8d4ff;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0;box-shadow:0 2px 0 #0a1830,inset 0 1px 0 rgba(180,220,255,0.18);text-shadow:0 1px 2px rgba(0,0,30,0.7)}
.gps-go:active{box-shadow:0 0px 0 #0a1830,inset 0 2px 4px rgba(0,0,40,0.5);transform:translateY(1px)}
.font-btn{background:linear-gradient(180deg,#2a4a88 0%,#1a3a70 60%,#142e5a 100%);border:none;border-radius:8px;color:#a8d4ff;padding:6px 8px;cursor:pointer;font-weight:700;flex-shrink:0;line-height:1;box-shadow:0 2px 0 #0a1830,inset 0 1px 0 rgba(180,220,255,0.18);text-shadow:0 1px 2px rgba(0,0,30,0.7)}
.font-btn:active{box-shadow:0 0px 0 #0a1830,inset 0 2px 4px rgba(0,0,40,0.5);transform:translateY(1px)}
.gps-row{display:flex;gap:5px;align-items:center}
.gps-row input{flex:0 1 6.2em;width:6.2em;min-width:0;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:6px 6px;font-size:13px;outline:none;text-align:center}
.fl-wrap{display:inline-block;line-height:1;white-space:nowrap}
.fl{display:inline;vertical-align:baseline;transition:color .15s}
.fl.active-letter{color:#ff4444}
.sug-box{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;overflow:hidden;display:none;max-height:240px;overflow-y:auto;position:relative;z-index:50}
.sug-box.open{display:block}
.sug-section{font-size:10px;color:#3a5a7a;padding:3px 10px 2px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid #142030}
.sug-section:first-child{border-top:none}
.sug-item{padding:8px 10px;font-size:13px;color:#b0cce8;cursor:pointer;border-bottom:1px solid #0e1a2e;display:flex;align-items:center;gap:6px}
.sug-item:hover,.sug-item:active{background:#142030}
.sug-item b{color:#60b8ff}
.sug-sub{font-size:11px;color:#486080;flex:1}
.sug-coords{font-size:10px;color:#2a4060;margin-left:auto}
.pin-btn{width:16px;flex-shrink:0;cursor:pointer;font-size:12px;opacity:0.35;user-select:none}
.pin-btn.pinned{opacity:1}
.loc-main{display:flex;align-items:stretch;gap:6px;padding-right:60px}
.loc-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.loc-top{display:flex;gap:5px;align-items:stretch}
.recent-chips{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,minmax(19px,auto));grid-auto-columns:max-content;justify-items:stretch;align-content:center;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip-name{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#histLoupe .chip{cursor:default}
.loupe-cursor{position:absolute;pointer-events:none;z-index:30;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.85))}
#histLoupe [data-act].loupe-sel{border-radius:8px}
#histLoupe .chip-pin[data-act="pin"].loupe-sel,#histLoupe [data-act="del"].loupe-sel{background:rgba(255,45,45,0.85)!important;box-shadow:0 0 0 2px #fff,0 0 12px 4px rgba(255,60,60,1)!important;color:#fff!important;opacity:1!important}
#histLoupe [data-act="pinord"].loupe-sel{background:rgba(70,150,255,0.95)!important;box-shadow:0 0 0 2px #fff,0 0 10px 3px rgba(90,160,255,1)!important;color:#fff!important}
#histLoupe [data-act="select"].loupe-sel{background:rgba(70,150,255,0.9)!important;box-shadow:0 0 0 2px #fff,0 0 12px 4px rgba(90,160,255,1)!important;color:#fff!important}
#histLoupe [data-act="edit"].loupe-sel>div{background:rgba(30,100,210,0.98)!important;box-shadow:0 0 0 2px #fff,0 0 10px 3px rgba(80,160,255,0.9)!important}
.hist-divider{display:block;width:1px;background:transparent;align-self:stretch;margin:2px 0;flex-shrink:0}
.btn-stack{display:flex;flex-direction:column;gap:4px;width:54px;flex-shrink:0;position:absolute;top:5px;right:8px;z-index:3;height:91px}
.btn-stack>button,.btn-stack>.go-row{flex:1;width:100%;min-height:0}
.btn-stack>.go-row,.btn-stack>#gpsBtn,.btn-stack>#langBtn{flex:none;height:calc((100% - 8px)/3);min-height:0}
.btn-stack>.go-row{display:flex;gap:2px}
.btn-stack button{min-height:0;padding:2px;display:flex;align-items:center;justify-content:center;font-size:12px}
.go-row>button{flex:1;min-width:0}
.go-row>#refreshBtn{padding:0}
.btn-stack>#gpsBtn{font-size:11px;gap:2px}
.recent-chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:#0e1a2e;border:1px solid #243a60;border-radius:20px;padding:2px 7px 2px 4px;font-size:11px;color:#90b8d8;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip:hover{background:#142030}
.chip.pinned{background:linear-gradient(180deg,#2a4a88 0%,#1a3a70 60%,#142e5a 100%);border-color:#3a6aaa;color:#a8d4ff;box-shadow:0 2px 0 #0a1830,inset 0 1px 0 rgba(180,220,255,0.18)}
.chip.pinned:hover{background:linear-gradient(180deg,#33559a 0%,#20437e 60%,#183566 100%)}
.chip-pin{font-size:10px;opacity:.35}
.chip-pin.pinned{opacity:1}
.chip-del{font-size:9px;opacity:.35;margin-left:1px}
.chip-del:hover{opacity:.8;color:#ff6060}
.overlay-popup{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,10,20,.93);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 16px;overflow-y:auto}
.overlay-popup.open{display:flex}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.lang-item{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;padding:6px 3px;text-align:center;cursor:pointer;font-size:10px;color:#b0cce8;display:flex;flex-direction:column;align-items:center;gap:2px}
.lang-eu-btn{background:#0e2040;border-color:#2a5090;font-size:13px;font-weight:bold}
.lang-back{grid-column:1/-1;background:#0a1828;font-size:12px;color:#90b8d8;border-color:#1a3050;padding:6px}
.lang-flag{font-size:18px;line-height:1}
.popup-close{background:#1a2840;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:7px 22px;font-size:13px;cursor:pointer;margin-top:6px}
/* METRIC TILES */
.metrics-outer{border-bottom:1px solid #1e3050;background:#090f1c;position:relative}
.metrics-scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.metrics-scroll::-webkit-scrollbar{display:none}
.metrics-inner{display:flex;padding:4px 4px 2px;gap:0;width:max-content}
.mtile{flex:0 0 auto;width:calc(14.5vw - 4px);max-width:60px;min-width:56px;min-height:40px;border:2px solid transparent;border-radius:10px;margin:0 3px;padding:2px 3px;cursor:pointer;transition:border-color .18s,box-shadow .1s,transform .1s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.10)}
.mtile:active{box-shadow:0 1px 0 rgba(0,0,0,0.55),inset 0 2px 4px rgba(0,0,0,0.4);transform:translateY(1px);filter:brightness(1.1)}
.mtile.active{border-color:#58b0ff;box-shadow:0 3px 0 rgba(0,30,80,0.7),0 0 10px rgba(88,176,255,.22),inset 0 1px 0 rgba(180,220,255,0.15)}
.mtile.tile-disabled{filter:grayscale(1) brightness(0.6);opacity:0.6;cursor:default;pointer-events:none}
.mtile.tile-disabled .mtile-sub{color:#9aa6b2}
.mtile-icon{font-size:11px;margin-bottom:0;position:relative;z-index:1;text-align:left}
.mtile-label{font-size:9px;font-weight:600;color:#a0c0d8;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:1px;position:relative;z-index:1;line-height:10px;white-space:nowrap;text-align:left}
.mtile.active .mtile-label{color:#5ab0ff}
.mtile-val{font-size:14px;font-weight:700;color:#f0f8ff;font-variant-numeric:tabular-nums;line-height:14px;position:relative;z-index:1;white-space:nowrap;text-align:left}

.mtile-sub{font-size:11px;color:#90b8d8;margin-top:1px;font-variant-numeric:tabular-nums;position:relative;z-index:1;white-space:nowrap;line-height:12px;text-align:left}
.mtile-unit{font-size:9px;color:#5a8aaa;margin-top:1px;position:relative;z-index:1;white-space:nowrap;line-height:11px;text-align:left}
.metric-time-bar{display:flex;align-items:center;gap:4px;padding:2px 6px 3px;border-top:1px solid #1e3050;background:#090f1c;min-height:22px}
.metric-time-bar .mtime{font-size:10px;color:#507090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;max-width:130px;margin-left:auto}
.metric-time-bar{position:relative}
.metric-time-bar .bar-btns{display:flex;gap:4px;flex-shrink:0;margin-left:auto}
.bar-btn{background:#14243a;color:#9fd0ff;border:1px solid #345070;border-radius:6px;padding:1px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
.layer-bar{display:flex;flex-wrap:nowrap;gap:3px;overflow-x:auto;padding:0;flex:1;min-width:0;scrollbar-width:none;align-items:center}
.layer-bar::-webkit-scrollbar{display:none}
.extra-graph-tile{flex-shrink:0;width:26px;background:linear-gradient(180deg,#2a4a88 0%,#1a3a70 60%,#142e5a 100%);border:none;border-left:1px solid #2a4a80;border-radius:10px;color:#a8d4ff;cursor:pointer;writing-mode:vertical-rl;text-orientation:upright;font-size:9px;font-weight:700;letter-spacing:0;padding:4px 2px;margin:11px 0 2px 5px;display:flex;align-items:center;justify-content:center;user-select:none;align-self:stretch;box-shadow:0 3px 0 #0a1830,inset 0 1px 0 rgba(180,220,255,0.15);text-shadow:0 1px 2px rgba(0,0,30,0.7);position:relative}
.vtile-sep{display:block;width:2px;background:#000;align-self:stretch;margin:4px 0 2px;flex-shrink:0}
.font-vtile{writing-mode:horizontal-tb;transform:none;flex-direction:column;letter-spacing:0;padding:3px 2px;margin:11px 8px 2px 0;border-left:none}
.state-vtile{align-self:center;flex-shrink:0;height:26px;padding:0 9px;margin:4px 8px 2px 0;font-size:12px;border-radius:8px;box-shadow:0 3px 0 #0a1830,inset 0 1px 0 rgba(180,220,255,0.18)}
.font-vtile:active{box-shadow:0 0px 0 #0a1830,inset 0 2px 4px rgba(0,0,40,0.5);transform:translateY(1px)}
.fl-col{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.fl-col .fl{display:block;line-height:1.05;text-align:center}
.extra-graph-tile:active{box-shadow:0 0px 0 #0a1830,inset 0 2px 4px rgba(0,0,40,0.5);transform:translateY(1px)}
.lbtn{background:#0e1a2e;border:2px solid transparent;border-radius:6px;color:#a0c8e8;padding:1px 7px;font-size:9px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .15s,color .15s,background .15s}
.lbtn.on{border-color:#5090d0}
.lbtn.nodata{background:#161f2e;color:#5a6678;border-color:transparent;cursor:default;opacity:0.6}
#cubeWrap{flex:1;overflow:hidden;position:relative}
#chartCanvas{display:block;width:100%;touch-action:none;flex:1;min-height:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#aqiInfoPanel{display:none;order:-1;background:rgba(5,12,28,0.97);border-bottom:1px solid rgba(60,100,180,0.3);padding:5px 8px;font-size:11px;color:#c0d8f0;flex-shrink:0;overflow-y:auto;max-height:45vh;}
#aqiInfoPanel table{border-collapse:collapse;width:100%;}
#aqiInfoPanel td{padding:1px 4px 1px 2px;vertical-align:top;white-space:nowrap;}
#aqiInfoPanel .aip-key{color:#80a8d0;font-weight:bold;min-width:48px;}
#aqiInfoPanel .aip-val{font-weight:bold;}
#aqiInfoPanel .aip-name{color:#8090a8;font-size:10px;white-space:normal;overflow-wrap:break-word;}
#aqiInfoPanel .aip-rating{font-size:10px;padding-left:6px;white-space:normal;overflow-wrap:break-word;}
#aqiInfoPanel .aip-dash{min-width:28px;text-align:center;}
#pollenPanel{display:none;order:-1;background:rgba(5,12,28,0.97);border-bottom:1px solid rgba(60,180,60,0.3);padding:5px 8px;font-size:11px;color:#c0d8f0;flex-shrink:0;overflow:visible;}
#pollenPanel table{border-collapse:collapse;width:100%;}
#pollenPanel td{padding:1px 6px 1px 2px;vertical-align:top;white-space:nowrap;}
#pollenPanel .pp-key{color:#80c8a0;font-weight:bold;min-width:60px;}
#pollenPanel .pp-val{font-weight:bold;min-width:52px;}
#pollenPanel .pp-name{color:#8090a8;font-size:10px;}
#pollenPanel .pp-season{color:#607060;font-size:9px;}
#pollenPanel .pp-rating{font-size:10px;padding-left:4px;font-weight:bold;white-space:nowrap;}
#chartSection{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform,opacity;user-select:none;-webkit-user-select:none;}
.legend-bar{display:flex;gap:6px;flex-wrap:wrap;padding:3px 8px 4px;background:#080c14;min-height:22px;max-height:64px;flex-shrink:0;border-top:1px solid #111820;overflow:hidden}
.leg{display:flex;align-items:center;gap:3px;font-size:var(--leg-fs,10px);color:#8090a8}
.leg-swatch{width:14px;height:2px;flex-shrink:0}
.state{text-align:center;padding:40px 20px;color:#507090;font-size:13px;line-height:1.8}
.state-ico{font-size:36px;margin-bottom:10px}
.status{font-size:10px;color:#1e3050;padding:2px 10px 3px;text-align:right}
.datasrc{text-align:center;font-size:10px;color:#4e6c90;padding-bottom:6px}
.extra-list{display:flex;flex-direction:column;gap:4px;width:100%;max-width:360px;max-height:calc(100vh - 130px);overflow-y:auto}
.extra-item{display:flex;align-items:center;gap:10px;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;padding:8px 12px;cursor:pointer}
.extra-item input[type=checkbox]{width:16px;height:16px;accent-color:#5ab0ff;cursor:pointer;flex-shrink:0}
.extra-item label{font-size:13px;color:#b0cce8;cursor:pointer;flex:1}
.extra-item2{display:flex;align-items:center;gap:6px;border-radius:10px;padding:5px 8px;margin:1px 0;cursor:grab;user-select:none;-webkit-user-select:none;border:2px solid transparent;transition:border-color .15s}
.extra-item2:active{cursor:grabbing}
.extra-item2 .ei2-drag{font-size:16px;color:rgba(150,180,220,0.5);flex-shrink:0}

var activeLang=LANGS[0];

function T(k){return activeLang.t[k]||LANGS[0].t[k]||k;}
function U(k){return activeLang.units[k]||'';}
function convTemp(v){return activeLang.tFn(v);}
function convWind(v){return activeLang.wFn(v);}
function convPress(v){return activeLang.pFn(v);}
function convDist(v){return activeLang.dFn?activeLang.dFn(v):v;}
function fmtWind(v){return Math.round(convWind(v));}
function fmtPress(v){var p=convPress(v);return U('pres')==='inHg'?p.toFixed(2):Math.round(p);}
function convPrecip(v){return activeLang.rFn?activeLang.rFn(v):v;}
function useUsAqi(){return activeLang.code==='en-US';}
function getAqiField(){return useUsAqi()?'us_aqi':'european_aqi';}
function getAqiLabel(v){
  if(v==null)return'–';

    if(v<=50)return'Good';if(v<=100)return'Moderate';if(v<=150)return'USG';
    if(v<=200)return'Unhealthy';if(v<=300)return'Very Unhl.';return'Hazardous';
  } else {
    if(v<=25)return T('aqiGood');if(v<=50)return T('aqiFair');if(v<=75)return T('aqiPoor');
    if(v<=100)return T('aqiVeryPoor');return T('aqiHazardous');
  }
}
function getAqiName(){return useUsAqi()?'US AQI':'EAQI';}
function getAqiMax(){return useUsAqi()?500:150;}
function fmtPrecip(v,dec){var p=convPrecip(v);var d=dec!=null?dec:(U('rain')==='in'?3:1);return p.toFixed(d);}
function U_rain(){return activeLang.units.rain||'mm';}

var FONT_STEPS=['xs','s','m','l'];
var FONT_SIZES_MAP={xs:9,s:11,m:13,l:16};
var currentFontIdx=parseInt(localStorage.getItem('fontIdx')||'1');
function chartFS(){return FONT_SIZES_MAP[FONT_STEPS[currentFontIdx]];}
// Znaky na tlačítku velikosti písma (4×, od nejmenšího po největší).
// Výchozí: latinka → "A". Jiná písma: reprezentativní písmeno daného písma.
// Logografická čínština (znak = celé slovo): 4 znaky pro velikost (malý→velký).
function fontBtnLetters(){
  var code=(activeLang&&activeLang.code)||'cs';
  if(code==='zh')return ['小','中','大','巨']; // čínština: malý/střední/velký/obří
  var map={
    'uk':'А','by':'А','bg':'А','sr':'А','mk':'А','kk':'А', // cyrilice
    'el':'Α',                                              // řečtina
    'ar':'ا','fa':'ا','ur':'ا',                            // arabské písmo
    'hi':'अ','mr':'अ',                                     // dévanágarí
    'bn':'অ',                                              // bengálské
    'ta':'அ',                                              // tamilské
    'ja':'あ',                                             // japonská kana
    'ko':'가'                                              // korejské
  };
  var ch=map[code]||'A';
  return [ch,ch,ch,ch];
}
function renderFontBtn(){
  var btn=document.getElementById('fontBtn');
  if(!btn)return;
  var sz=[9,11,13,17];
  var letters=fontBtnLetters();
  btn.innerHTML='<span class="fl-col">'+letters.map(function(l,i){
    return '<span class="fl'+(i===currentFontIdx?' active-letter':'')+'" style="font-size:'+sz[i]+'px">'+l+'</span>';
  }).join('')+'</span>';
}
function updateMTimeFont(){var el=document.getElementById('mTime');if(el){var _map={xs:10,s:12,m:14,l:16};el.style.fontSize=(_map[FONT_STEPS[currentFontIdx]]||10)+'px';}
  // Aktualizovat font legendy
  var _legMap={xs:8,s:9,m:10,l:12};
  document.documentElement.style.setProperty('--leg-fs',(_legMap[FONT_STEPS[currentFontIdx]]||10)+'px');
  // Přizpůsobit výšku legend-bar
  var lb=document.getElementById('legendBar');
  if(lb){var _hMap={xs:20,s:22,m:24,l:28};lb.style.maxHeight=_hMap[FONT_STEPS[currentFontIdx]]+'px';}}
function cycleFontSize(){currentFontIdx=(currentFontIdx+1)%FONT_STEPS.length;localStorage.setItem('fontIdx',currentFontIdx);renderFontBtn();updateMTimeFont();if(WD){draw();if(currentTab==='aqi')updateAqiPanel(hoverIdx!==null?hoverIdx:-1);if(currentTab==='pollen')updatePollenPanel(hoverIdx!==null?hoverIdx:-1);}}
renderFontBtn();

'pl':{t:'Wyłączenie odpowiedzialności',i:'Użytkownik potwierdza, że przed użyciem aplikacji zapoznał się z poniższymi informacjami i akceptuje je:',p:['Aplikacja udostępnia informacje, dane oraz ewentualne prognozy pozyskane z publicznie dostępnych lub innych zewnętrznych źródeł.','Wszelkie informacje, dane i prognozy udostępniane za pośrednictwem aplikacji mają charakter wyłącznie informacyjny i nie stanowią profesjonalnej porady ani gwarancji ich poprawności, kompletności, aktualności lub przydatności do określonego celu.','Użytkownik przyjmuje do wiadomości, że wszelkie decyzje podjęte na podstawie informacji uzyskanych za pośrednictwem aplikacji podejmuje wyłącznie na własną odpowiedzialność.','Ani operator, ani autor aplikacji nie ponoszą odpowiedzialności za szkody, utracone korzyści ani inne straty powstałe w związku z korzystaniem lub niemożnością korzystania z udostępnianych informacji, danych lub prognoz, w maksymalnym zakresie dozwolonym przez prawo.','Prognozy i szacunki udostępniane przez aplikację opierają się na modelach matematycznych i statystycznych i nie stanowią informacji wiążącej ani gwarancji przyszłego rozwoju.'],a:'Akceptuję',q:'Zakończ'},
'sk':{t:'Zrieknutie sa zodpovednosti',i:'Používateľ potvrdzuje, že sa pred použitím aplikácie oboznámil s nasledujúcimi informáciami a súhlasí s nimi:',p:['Aplikácia sprostredkúva informácie, údaje a prípadné predpovede získané z verejne dostupných alebo iných externých zdrojov.','Všetky informácie, údaje a predpovede poskytované prostredníctvom aplikácie majú výlučne informatívny charakter a nepredstavujú odborné odporúčanie ani záruku ich správnosti, úplnosti, aktuálnosti alebo vhodnosti na konkrétny účel.','Používateľ berie na vedomie, že všetky rozhodnutia prijaté na základe informácií získaných prostredníctvom aplikácie robí výlučne na vlastnú zodpovednosť.','Prevádzkovateľ ani autor aplikácie nezodpovedajú za škodu, ušlý zisk ani iné ujmy vzniknuté v súvislosti s použitím alebo nemožnosťou použitia poskytovaných informácií, údajov či predpovedí, a to v maximálnom rozsahu povolenom právnymi predpismi.','Predpovede a odhady poskytované aplikáciou sú založené na matematických a štatistických modeloch a nepredstavujú záväznú informáciu ani záruku budúceho vývoja.'],a:'Súhlasím',q:'Koniec'},
'hu':{t:'Felelősség kizárása',i:'A felhasználó megerősíti, hogy az alkalmazás használata előtt megismerte és elfogadja az alábbi információkat:',p:['Az alkalmazás nyilvánosan elérhető vagy egyéb külső forrásokból származó információkat, adatokat és esetleges előrejelzéseket közvetít.','Az alkalmazáson keresztül nyújtott valamennyi információ, adat és előrejelzés kizárólag tájékoztató jellegű, és nem minősül szakmai tanácsnak, sem azok helyességére, teljességére, aktualitására vagy adott célra való alkalmasságára vonatkozó garanciának.','A felhasználó tudomásul veszi, hogy az alkalmazáson keresztül szerzett információk alapján hozott minden döntést kizárólag saját felelősségére hoz meg.','Sem az üzemeltető, sem az alkalmazás szerzője nem felel a nyújtott információk, adatok vagy előrejelzések használatával vagy használatának lehetetlenségével összefüggésben keletkezett károkért, elmaradt haszonért vagy egyéb hátrányokért, a jogszabályok által megengedett legnagyobb mértékben.','Az alkalmazás által nyújtott előrejelzések és becslések matematikai és statisztikai modelleken alapulnak, és nem minősülnek kötelező érvényű információnak vagy a jövőbeli alakulásra vonatkozó garanciának.'],a:'Elfogadom',q:'Kilépés'},
'ro':{t:'Declinarea responsabilității',i:'Utilizatorul confirmă că, înainte de a utiliza aplicația, a luat la cunoștință și este de acord cu următoarele informații:',p:['Aplicația furnizează informații, date și eventuale prognoze obținute din surse public accesibile sau din alte surse externe.','Toate informațiile, datele și prognozele furnizate prin intermediul aplicației au caracter exclusiv informativ și nu constituie o recomandare profesională și nici o garanție privind corectitudinea, completitudinea, actualitatea sau adecvarea lor pentru un anumit scop.','Utilizatorul ia la cunoștință că orice decizie luată pe baza informațiilor obținute prin intermediul aplicației este luată exclusiv pe propria răspundere.','Nici operatorul, nici autorul aplicației nu răspund pentru daune, profit nerealizat sau alte prejudicii apărute în legătură cu utilizarea sau imposibilitatea utilizării informațiilor, datelor sau prognozelor furnizate, în limita maximă permisă de lege.','Prognozele și estimările furnizate de aplicație se bazează pe modele matematice și statistice și nu constituie informații obligatorii și nici garanția evoluției viitoare.'],a:'Sunt de acord',q:'Ieșire'},
'el':{t:'Αποποίηση ευθύνης',i:'Ο χρήστης επιβεβαιώνει ότι, πριν από τη χρήση της εφαρμογής, έλαβε γνώση των ακόλουθων πληροφοριών και τις αποδέχεται:',p:['Η εφαρμογή παρέχει πληροφορίες, δεδομένα και τυχόν προβλέψεις που λαμβάνονται από δημόσια διαθέσιμες ή άλλες εξωτερικές πηγές.','Όλες οι πληροφορίες, τα δεδομένα και οι προβλέψεις που παρέχονται μέσω της εφαρμογής έχουν αποκλειστικά ενημερωτικό χαρακτήρα και δεν συνιστούν επαγγελματική συμβουλή ούτε εγγύηση ως προς την ορθότητα, την πληρότητα, την επικαιρότητα ή την καταλληλότητά τους για συγκεκριμένο σκοπό.','Ο χρήστης αναγνωρίζει ότι κάθε απόφαση που λαμβάνεται βάσει των πληροφοριών που αποκτώνται μέσω της εφαρμογής λαμβάνεται αποκλειστικά με δική του ευθύνη.','Ούτε ο φορέας εκμετάλλευσης ούτε ο δημιουργός της εφαρμογής ευθύνονται για ζημίες, διαφυγόντα κέρδη ή άλλες βλάβες που προκύπτουν σε σχέση με τη χρήση ή την αδυναμία χρήσης των παρεχόμενων πληροφοριών, δεδομένων ή προβλέψεων, στον μέγιστο βαθμό που επιτρέπεται από τον νόμο.','Οι προβλέψεις και οι εκτιμήσεις που παρέχει η εφαρμογή βασίζονται σε μαθηματικά και στατιστικά μοντέλα και δεν συνιστούν δεσμευτική πληροφορία ούτε εγγύηση μελλοντικής εξέλιξης.'],a:'Συμφωνώ',q:'Έξοδος'},
'tr':{t:'Sorumluluk reddi',i:'Kullanıcı, uygulamayı kullanmadan önce aşağıdaki bilgileri okuduğunu ve kabul ettiğini onaylar:',p:['Uygulama, kamuya açık veya diğer harici kaynaklardan elde edilen bilgileri, verileri ve varsa tahminleri sunar.','Uygulama aracılığıyla sağlanan tüm bilgiler, veriler ve tahminler yalnızca bilgilendirme amaçlıdır ve profesyonel bir tavsiye ya da bunların doğruluğu, eksiksizliği, güncelliği veya belirli bir amaca uygunluğu konusunda herhangi bir garanti teşkil etmez.','Kullanıcı, uygulama aracılığıyla elde edilen bilgilere dayanarak verdiği tüm kararları yalnızca kendi sorumluluğunda verdiğini kabul eder.','Uygulamanın işletmecisi veya yazarı, sağlanan bilgilerin, verilerin veya tahminlerin kullanılması ya da kullanılamamasıyla bağlantılı olarak doğan zararlardan, kâr kaybından veya diğer zararlardan, yasaların izin verdiği azami ölçüde sorumlu değildir.','Uygulama tarafından sağlanan tahminler ve öngörüler matematiksel ve istatistiksel modellere dayanır ve bağlayıcı bir bilgi veya gelecekteki gelişmelerin garantisi teşkil etmez.'],a:'Kabul ediyorum',q:'Çıkış'},
'uk':{t:'Відмова від відповідальності',i:'Користувач підтверджує, що перед використанням застосунку ознайомився з наведеною нижче інформацією та погоджується з нею:',p:['Застосунок надає інформацію, дані та можливі прогнози, отримані із загальнодоступних або інших зовнішніх джерел.','Уся інформація, дані та прогнози, що надаються через застосунок, мають виключно інформативний характер і не є професійною рекомендацією чи гарантією їх правильності, повноти, актуальності або придатності для конкретної мети.','Користувач усвідомлює, що будь-які рішення, прийняті на основі інформації, отриманої через застосунок, він приймає виключно під власну відповідальність.','Ні оператор, ні автор застосунку не несуть відповідальності за збитки, втрачену вигоду чи інші втрати, що виникли у зв’язку з використанням або неможливістю використання наданої інформації, даних чи прогнозів, у максимальному обсязі, дозволеному законодавством.','Прогнози та оцінки, що надаються застосунком, ґрунтуються на математичних і статистичних моделях і не є обов’язковою інформацією чи гарантією майбутнього розвитку.'],a:'Погоджуюсь',q:'Вихід'},
'bg':{t:'Отказ от отговорност',i:'Потребителят потвърждава, че преди използването на приложението се е запознал със следната информация и я приема:',p:['Приложението предоставя информация, данни и евентуални прогнози, получени от публично достъпни или други външни източници.','Цялата информация, данни и прогнози, предоставяни чрез приложението, имат единствено информативен характер и не представляват професионален съвет, нито гаранция за тяхната точност, пълнота, актуалност или пригодност за конкретна цел.','Потребителят е наясно, че всички решения, взети въз основа на информацията, получена чрез приложението, се вземат изцяло на негова собствена отговорност.','Нито операторът, нито авторът на приложението носят отговорност за вреди, пропуснати ползи или други щети, възникнали във връзка с използването или невъзможността за използване на предоставяната информация, данни или прогнози, в максималната степен, разрешена от закона.','Прогнозите и оценките, предоставяни от приложението, се основават на математически и статистически модели и не представляват обвързваща информация, нито гаранция за бъдещото развитие.'],a:'Съгласен съм',q:'Изход'},
'hr':{t:'Izjava o odricanju odgovornosti',i:'Korisnik potvrđuje da se prije korištenja aplikacije upoznao sa sljedećim informacijama i da ih prihvaća:',p:['Aplikacija posreduje informacije, podatke i eventualne prognoze dobivene iz javno dostupnih ili drugih vanjskih izvora.','Sve informacije, podaci i prognoze pružene putem aplikacije isključivo su informativne naravi i ne predstavljaju stručnu preporuku niti jamstvo njihove točnosti, potpunosti, aktualnosti ili prikladnosti za određenu svrhu.','Korisnik prima na znanje da sve odluke donesene na temelju informacija dobivenih putem aplikacije donosi isključivo na vlastitu odgovornost.','Ni operator ni autor aplikacije ne odgovaraju za štetu, izgubljenu dobit ni druge gubitke nastale u vezi s korištenjem ili nemogućnošću korištenja pruženih informacija, podataka ili prognoza, u najvećoj mjeri dopuštenoj zakonom.','Prognoze i procjene koje pruža aplikacija temelje se na matematičkim i statističkim modelima i ne predstavljaju obvezujuću informaciju niti jamstvo budućeg razvoja.'],a:'Prihvaćam',q:'Izlaz'},
'sr':{t:'Izjava o odricanju odgovornosti',i:'Korisnik potvrđuje da se pre korišćenja aplikacije upoznao sa sledećim informacijama i da ih prihvata:',p:['Aplikacija posreduje informacije, podatke i eventualne prognoze dobijene iz javno dostupnih ili drugih spoljnih izvora.','Sve informacije, podaci i prognoze pružene putem aplikacije isključivo su informativne prirode i ne predstavljaju stručnu preporuku niti garanciju njihove tačnosti, potpunosti, aktuelnosti ili pogodnosti za određenu svrhu.','Korisnik prima na znanje da sve odluke donete na osnovu informacija dobijenih putem aplikacije donosi isključivo na sopstvenu odgovornost.','Ni operater ni autor aplikacije ne odgovaraju za štetu, izgubljenu dobit ni druge gubitke nastale u vezi sa korišćenjem ili nemogućnošću korišćenja pruženih informacija, podataka ili prognoza, u najvećoj meri dozvoljenoj zakonom.','Prognoze i procene koje pruža aplikacija zasnivaju se na matematičkim i statističkim modelima i ne predstavljaju obavezujuću informaciju niti garanciju budućeg razvoja.'],a:'Prihvatam',q:'Izlaz'},
'sl':{t:'Izjava o omejitvi odgovornosti',i:'Uporabnik potrjuje, da se je pred uporabo aplikacije seznanil z naslednjimi informacijami in se z njimi strinja:',p:['Aplikacija posreduje informacije, podatke in morebitne napovedi, pridobljene iz javno dostopnih ali drugih zunanjih virov.','Vse informacije, podatki in napovedi, ki jih zagotavlja aplikacija, so zgolj informativne narave in ne pomenijo strokovnega priporočila niti jamstva glede njihove pravilnosti, popolnosti, ažurnosti ali primernosti za določen namen.','Uporabnik se zaveda, da vse odločitve, sprejete na podlagi informacij, pridobljenih prek aplikacije, sprejema izključno na lastno odgovornost.','Niti upravljavec niti avtor aplikacije ne odgovarjata za škodo, izgubljeni dobiček ali druge izgube, nastale v zvezi z uporabo ali nezmožnostjo uporabe zagotovljenih informacij, podatkov ali napovedi, in sicer v največjem obsegu, ki ga dovoljuje zakon.','Napovedi in ocene, ki jih zagotavlja aplikacija, temeljijo na matematičnih in statističnih modelih ter ne pomenijo zavezujoče informacije niti jamstva za prihodnji razvoj.'],a:'Strinjam se',q:'Izhod'},
'sv':{t:'Ansvarsfriskrivning',i:'Användaren bekräftar att hen före användningen av appen har tagit del av och godkänner följande information:',p:['Appen tillhandahåller information, data och eventuella prognoser som hämtats från offentligt tillgängliga eller andra externa källor.','All information, alla data och alla prognoser som tillhandahålls via appen är endast av informativ karaktär och utgör varken professionell rådgivning eller någon garanti för deras riktighet, fullständighet, aktualitet eller lämplighet för ett visst ändamål.','Användaren är medveten om att alla beslut som fattas på grundval av information som erhållits via appen fattas helt på eget ansvar.','Varken operatören eller appens upphovsman ansvarar för skador, utebliven vinst eller andra förluster som uppstår i samband med användningen av eller oförmågan att använda den information, de data eller de prognoser som tillhandahålls, i den utsträckning som lagen tillåter.','De prognoser och uppskattningar som appen tillhandahåller bygger på matematiska och statistiska modeller och utgör varken bindande information eller någon garanti för den framtida utvecklingen.'],a:'Jag godkänner',q:'Avsluta'},
'da':{t:'Ansvarsfraskrivelse',i:'Brugeren bekræfter, at vedkommende før brugen af appen har gjort sig bekendt med og accepterer følgende oplysninger:',p:['Appen formidler oplysninger, data og eventuelle prognoser indhentet fra offentligt tilgængelige eller andre eksterne kilder.','Alle oplysninger, data og prognoser, der leveres via appen, er udelukkende af informativ karakter og udgør hverken professionel rådgivning eller nogen garanti for deres rigtighed, fuldstændighed, aktualitet eller egnethed til et bestemt formål.','Brugeren er indforstået med, at enhver beslutning, der træffes på grundlag af oplysninger indhentet via appen, udelukkende træffes på eget ansvar.','Hverken operatøren eller appens ophavsmand er ansvarlige for skader, tabt fortjeneste eller andre tab, der opstår i forbindelse med brugen af eller manglende mulighed for at bruge de leverede oplysninger, data eller prognoser, i det maksimale omfang loven tillader.','De prognoser og estimater, som appen leverer, er baseret på matematiske og statistiske modeller og udgør hverken bindende oplysninger eller nogen garanti for den fremtidige udvikling.'],a:'Jeg accepterer',q:'Afslut'},
'no':{t:'Ansvarsfraskrivelse',i:'Brukeren bekrefter at vedkommende før bruk av appen har gjort seg kjent med og godtar følgende informasjon:',p:['Appen formidler informasjon, data og eventuelle prognoser innhentet fra offentlig tilgjengelige eller andre eksterne kilder.','All informasjon, alle data og alle prognoser som leveres via appen, er utelukkende av informativ karakter og utgjør verken profesjonell rådgivning eller noen garanti for deres riktighet, fullstendighet, aktualitet eller egnethet for et bestemt formål.','Brukeren er innforstått med at enhver beslutning som tas på grunnlag av informasjon innhentet via appen, utelukkende tas på eget ansvar.','Verken operatøren eller appens opphavsperson er ansvarlig for skade, tapt fortjeneste eller andre tap som oppstår i forbindelse med bruken av eller manglende mulighet til å bruke den leverte informasjonen, dataene eller prognosene, i den grad loven tillater det.','Prognosene og estimatene som appen leverer, er basert på matematiske og statistiske modeller og utgjør verken bindende informasjon eller noen garanti for den fremtidige utviklingen.'],a:'Jeg godtar',q:'Avslutt'},
'fi':{t:'Vastuuvapauslauseke',i:'Käyttäjä vahvistaa, että hän on ennen sovelluksen käyttöä tutustunut seuraaviin tietoihin ja hyväksyy ne:',p:['Sovellus välittää julkisesti saatavilla olevista tai muista ulkoisista lähteistä saatuja tietoja, dataa ja mahdollisia ennusteita.','Kaikki sovelluksen kautta tarjottavat tiedot, data ja ennusteet ovat luonteeltaan yksinomaan informatiivisia eivätkä ole ammatillinen suositus eivätkä takaa niiden oikeellisuutta, täydellisyyttä, ajantasaisuutta tai soveltuvuutta tiettyyn tarkoitukseen.','Käyttäjä ymmärtää, että kaikki sovelluksen kautta saatujen tietojen perusteella tehdyt päätökset tehdään yksinomaan omalla vastuulla.','Sovelluksen ylläpitäjä tai tekijä ei vastaa vahingoista, saamatta jääneestä voitosta tai muista menetyksistä, jotka aiheutuvat tarjottujen tietojen, datan tai ennusteiden käytöstä tai käytön estymisestä, lain sallimissa enimmäisrajoissa.','Sovelluksen tarjoamat ennusteet ja arviot perustuvat matemaattisiin ja tilastollisiin malleihin eivätkä ole sitovaa tietoa tai takuuta tulevasta kehityksestä.'],a:'Hyväksyn',q:'Lopeta'},

'ja':{t:'免責事項',i:'ユーザーは、本アプリを使用する前に以下の情報を確認し、これに同意したことを認めます。',p:['本アプリは、公開されている情報源またはその他の外部情報源から取得した情報、データおよび予報を提供します。','本アプリを通じて提供されるすべての情報、データおよび予報は情報提供のみを目的としており、専門的な助言を構成するものではなく、その正確性、完全性、最新性または特定目的への適合性を保証するものでもありません。','ユーザーは、本アプリを通じて得た情報に基づいて行うすべての決定について、自己の責任において行うことを了承します。','本アプリの運営者および作成者は、法律で認められる最大限の範囲において、提供される情報、データまたは予報の使用または使用不能に関連して生じた損害、逸失利益その他の損害について一切責任を負いません。','本アプリが提供する予報および推定は、数学的および統計的モデルに基づくものであり、拘束力のある情報や将来の推移の保証を構成するものではありません。'],a:'同意する',q:'終了'},
'ko':{t:'면책 조항',i:'사용자는 애플리케이션을 사용하기 전에 다음 정보를 확인하였으며 이에 동의함을 확인합니다:',p:['본 애플리케이션은 공개적으로 이용 가능한 출처 또는 기타 외부 출처에서 획득한 정보, 데이터 및 예보를 제공합니다.','애플리케이션을 통해 제공되는 모든 정보, 데이터 및 예보는 정보 제공 목적으로만 제공되며, 전문적인 조언이나 그 정확성, 완전성, 최신성 또는 특정 목적에의 적합성에 대한 어떠한 보증도 구성하지 않습니다.','사용자는 애플리케이션을 통해 얻은 정보를 바탕으로 내린 모든 결정이 전적으로 본인의 책임하에 이루어진다는 점을 인정합니다.','애플리케이션의 운영자나 제작자는 법률이 허용하는 최대 범위 내에서, 제공되는 정보, 데이터 또는 예보의 사용 또는 사용 불능과 관련하여 발생한 손해, 일실 이익 또는 기타 손해에 대해 책임을 지지 않습니다.','애플리케이션이 제공하는 예보와 추정치는 수학적·통계적 모델에 기반하며, 구속력 있는 정보나 미래 전개에 대한 보증을 구성하지 않습니다.'],a:'동의합니다',q:'종료'},
'ar':{t:'إخلاء المسؤولية',i:'يؤكد المستخدم أنه اطّلع على المعلومات التالية ووافق عليها قبل استخدام التطبيق:',p:['يوفّر التطبيق معلومات وبيانات وتوقعات محتملة يتم الحصول عليها من مصادر متاحة للعموم أو مصادر خارجية أخرى.','جميع المعلومات والبيانات والتوقعات المقدمة عبر التطبيق ذات طابع إعلامي فقط ولا تشكّل نصيحة مهنية ولا أي ضمان لدقتها أو اكتمالها أو حداثتها أو ملاءمتها لغرض معيّن.','يقرّ المستخدم بأن أي قرارات يتخذها بناءً على المعلومات التي يحصل عليها عبر التطبيق يتخذها على مسؤوليته الخاصة وحده.','لا يتحمل مشغّل التطبيق ولا مؤلفه المسؤولية عن أي أضرار أو خسارة في الأرباح أو أي أضرار أخرى تنشأ فيما يتعلق باستخدام أو تعذّر استخدام المعلومات أو البيانات أو التوقعات المقدمة، وذلك إلى أقصى حد يسمح به القانون.','تستند التوقعات والتقديرات التي يقدمها التطبيق إلى نماذج رياضية وإحصائية ولا تشكّل معلومات ملزمة ولا ضماناً للتطورات المستقبلية.'],a:'أوافق',q:'خروج'},
'hi':{t:'अस्वीकरण',i:'उपयोगकर्ता पुष्टि करता है कि एप्लिकेशन का उपयोग करने से पहले उसने निम्नलिखित जानकारी पढ़ ली है और उससे सहमत है:',p:['एप्लिकेशन सार्वजनिक रूप से उपलब्ध या अन्य बाहरी स्रोतों से प्राप्त जानकारी, डेटा और संभावित पूर्वानुमान प्रदान करता है।','एप्लिकेशन के माध्यम से प्रदान की गई सभी जानकारी, डेटा और पूर्वानुमान केवल सूचनात्मक प्रकृति के हैं और किसी पेशेवर सलाह या उनकी सटीकता, पूर्णता, सामयिकता या किसी विशेष उद्देश्य के लिए उपयुक्तता की गारंटी नहीं हैं।','उपयोगकर्ता स्वीकार करता है कि एप्लिकेशन के माध्यम से प्राप्त जानकारी के आधार पर लिए गए सभी निर्णय वह पूरी तरह से अपनी जिम्मेदारी पर लेता है।','एप्लिकेशन का संचालक या लेखक, कानून द्वारा अनुमत अधिकतम सीमा तक, प्रदान की गई जानकारी, डेटा या पूर्वानुमानों के उपयोग या उपयोग न कर पाने के संबंध में उत्पन्न किसी भी क्षति, लाभ की हानि या अन्य नुकसान के लिए उत्तरदायी नहीं हैं।','एप्लिकेशन द्वारा प्रदान किए गए पूर्वानुमान और अनुमान गणितीय और सांख्यिकीय मॉडल पर आधारित हैं और कोई बाध्यकारी जानकारी या भविष्य के विकास की गारंटी नहीं हैं।'],a:'मैं सहमत हूँ',q:'बाहर निकलें'},
'id':{t:'Penafian',i:'Pengguna mengonfirmasi bahwa sebelum menggunakan aplikasi, ia telah membaca dan menyetujui informasi berikut:',p:['Aplikasi menyediakan informasi, data, dan kemungkinan prakiraan yang diperoleh dari sumber yang tersedia untuk umum atau sumber eksternal lainnya.','Semua informasi, data, dan prakiraan yang disediakan melalui aplikasi bersifat informatif semata dan bukan merupakan nasihat profesional maupun jaminan atas keakuratan, kelengkapan, kemutakhiran, atau kesesuaiannya untuk tujuan tertentu.','Pengguna menyadari bahwa segala keputusan yang diambil berdasarkan informasi yang diperoleh melalui aplikasi sepenuhnya menjadi tanggung jawabnya sendiri.','Baik operator maupun pembuat aplikasi tidak bertanggung jawab atas kerugian, kehilangan keuntungan, atau kerugian lain yang timbul sehubungan dengan penggunaan atau ketidakmampuan menggunakan informasi, data, atau prakiraan yang disediakan, sejauh diizinkan oleh hukum.','Prakiraan dan perkiraan yang disediakan aplikasi didasarkan pada model matematis dan statistik serta bukan merupakan informasi yang mengikat atau jaminan atas perkembangan di masa depan.'],a:'Saya setuju',q:'Keluar'},
'vi':{t:'Tuyên bố miễn trừ trách nhiệm',i:'Người dùng xác nhận rằng trước khi sử dụng ứng dụng, họ đã đọc và đồng ý với các thông tin sau:',p:['Ứng dụng cung cấp thông tin, dữ liệu và các dự báo có thể có được lấy từ các nguồn công khai hoặc các nguồn bên ngoài khác.','Mọi thông tin, dữ liệu và dự báo được cung cấp thông qua ứng dụng chỉ mang tính chất tham khảo và không cấu thành lời khuyên chuyên môn hay bất kỳ bảo đảm nào về tính chính xác, đầy đủ, kịp thời hoặc phù hợp cho một mục đích cụ thể.','Người dùng thừa nhận rằng mọi quyết định được đưa ra dựa trên thông tin thu được thông qua ứng dụng đều do chính họ tự chịu trách nhiệm.','Cả nhà vận hành lẫn tác giả của ứng dụng đều không chịu trách nhiệm về bất kỳ thiệt hại, lợi nhuận bị mất hay tổn thất nào khác phát sinh liên quan đến việc sử dụng hoặc không thể sử dụng thông tin, dữ liệu hoặc dự báo được cung cấp, trong phạm vi tối đa mà pháp luật cho phép.','Các dự báo và ước tính do ứng dụng cung cấp dựa trên các mô hình toán học và thống kê và không cấu thành thông tin ràng buộc hay bảo đảm cho sự phát triển trong tương lai.'],a:'Tôi đồng ý',q:'Thoát'},
'fa':{t:'سلب مسئولیت',i:'کاربر تأیید می‌کند که پیش از استفاده از برنامه، اطلاعات زیر را مطالعه کرده و با آن موافق است:',p:['برنامه اطلاعات، داده‌ها و پیش‌بینی‌های احتمالی به‌دست‌آمده از منابع عمومی یا دیگر منابع خارجی را ارائه می‌دهد.','تمام اطلاعات، داده‌ها و پیش‌بینی‌های ارائه‌شده از طریق برنامه صرفاً جنبه اطلاع‌رسانی دارند و مشاوره تخصصی یا هیچ‌گونه تضمینی درباره صحت، کامل بودن، به‌روز بودن یا مناسب بودن آن‌ها برای هدفی خاص محسوب نمی‌شوند.','کاربر می‌پذیرد که هرگونه تصمیمی که بر اساس اطلاعات به‌دست‌آمده از طریق برنامه گرفته می‌شود، تنها بر عهده و مسئولیت خود اوست.','نه گرداننده و نه نویسنده برنامه، تا حداکثر حدی که قانون اجازه می‌دهد، مسئول هیچ خسارت، سود ازدست‌رفته یا زیان دیگری که در ارتباط با استفاده یا عدم امکان استفاده از اطلاعات، داده‌ها یا پیش‌بینی‌های ارائه‌شده ایجاد شود، نخواهند بود.','پیش‌بینی‌ها و برآوردهای ارائه‌شده توسط برنامه بر اساس مدل‌های ریاضی و آماری هستند و اطلاعات الزام‌آور یا تضمینی برای تحولات آینده محسوب نمی‌شوند.'],a:'موافقم',q:'خروج'},
'et':{t:'Vastutusest loobumine',i:'Kasutaja kinnitab, et on enne rakenduse kasutamist tutvunud järgmise teabega ja nõustub sellega:',p:['Rakendus vahendab avalikult kättesaadavatest või muudest välistest allikatest saadud teavet, andmeid ja võimalikke prognoose.','Kogu rakenduse kaudu pakutav teave, andmed ja prognoosid on üksnes informatiivse iseloomuga ega kujuta endast professionaalset soovitust ega mingit garantiid nende õigsuse, täielikkuse, ajakohasuse või konkreetseks otstarbeks sobivuse kohta.','Kasutaja võtab teadmiseks, et kõik rakenduse kaudu saadud teabe põhjal tehtud otsused teeb ta üksnes omal vastutusel.','Ei rakenduse haldaja ega autor ei vastuta kahju, saamata jäänud tulu ega muu kahju eest, mis tekib seoses pakutava teabe, andmete või prognooside kasutamise või kasutamise võimatusega, seaduses lubatud maksimaalses ulatuses.','Rakenduse pakutavad prognoosid ja hinnangud põhinevad matemaatilistel ja statistilistel mudelitel ega kujuta endast siduvat teavet ega tulevase arengu tagatist.'],a:'Nõustun',q:'Välju'},
'lv':{t:'Atbildības atruna',i:'Lietotājs apliecina, ka pirms lietotnes lietošanas ir iepazinies ar tālāk norādīto informāciju un tai piekrīt:',p:['Lietotne sniedz informāciju, datus un iespējamās prognozes, kas iegūtas no publiski pieejamiem vai citiem ārējiem avotiem.','Visa lietotnē sniegtā informācija, dati un prognozes ir tikai informatīva rakstura un nav uzskatāmas par profesionālu ieteikumu vai garantiju attiecībā uz to pareizību, pilnīgumu, aktualitāti vai piemērotību konkrētam mērķim.','Lietotājs apzinās, ka jebkurus lēmumus, kas pieņemti, pamatojoties uz lietotnē iegūto informāciju, viņš pieņem tikai uz savu atbildību.','Ne lietotnes operators, ne autors neatbild par zaudējumiem, negūto peļņu vai citu kaitējumu, kas radies saistībā ar sniegtās informācijas, datu vai prognožu izmantošanu vai neiespējamību tos izmantot, ciktāl to pieļauj likums.','Lietotnes sniegtās prognozes un aplēses balstās uz matemātiskiem un statistiskiem modeļiem un nav uzskatāmas par saistošu informāciju vai nākotnes attīstības garantiju.'],a:'Piekrītu',q:'Iziet'},
'lt':{t:'Atsakomybės atsisakymas',i:'Naudotojas patvirtina, kad prieš naudodamasis programėle susipažino su toliau pateikta informacija ir su ja sutinka:',p:['Programėlė teikia informaciją, duomenis ir galimas prognozes, gautas iš viešai prieinamų ar kitų išorinių šaltinių.','Visa per programėlę teikiama informacija, duomenys ir prognozės yra tik informacinio pobūdžio ir nėra profesionali rekomendacija ar kokia nors garantija dėl jų teisingumo, išsamumo, aktualumo ar tinkamumo konkrečiam tikslui.','Naudotojas pripažįsta, kad visus sprendimus, priimtus remiantis per programėlę gauta informacija, jis priima tik savo paties atsakomybe.','Nei programėlės operatorius, nei autorius neatsako už žalą, negautą pelną ar kitus nuostolius, atsiradusius dėl teikiamos informacijos, duomenų ar prognozių naudojimo arba negalėjimo jais naudotis, kiek tai leidžia įstatymai.','Programėlės teikiamos prognozės ir įverčiai pagrįsti matematiniais ir statistiniais modeliais ir nėra įpareigojanti informacija ar būsimos raidos garantija.'],a:'Sutinku',q:'Išeiti'},
'ca':{t:'Exempció de responsabilitat',i:"L'usuari confirma que, abans d'utilitzar l'aplicació, ha llegit la informació següent i hi està d'acord:",p:["L'aplicació facilita informació, dades i possibles previsions obtingudes de fonts d'accés públic o d'altres fonts externes.","Tota la informació, les dades i les previsions facilitades a través de l'aplicació tenen caràcter merament informatiu i no constitueixen assessorament professional ni cap garantia sobre la seva exactitud, integritat, actualitat o idoneïtat per a una finalitat determinada.","L'usuari reconeix que qualsevol decisió presa sobre la base de la informació obtinguda a través de l'aplicació es pren exclusivament sota la seva pròpia responsabilitat.","Ni l'operador ni l'autor de l'aplicació no es fan responsables dels danys, el lucre cessant o altres perjudicis derivats de l'ús o de la impossibilitat d'ús de la informació, les dades o les previsions facilitades, en la màxima mesura permesa per la llei.","Les previsions i estimacions facilitades per l'aplicació es basen en models matemàtics i estadístics i no constitueixen informació vinculant ni garantia de l'evolució futura."],a:'Hi estic d’acord',q:'Sortir'},
'gl':{t:'Exención de responsabilidade',i:'O usuario confirma que, antes de utilizar a aplicación, leu a seguinte información e está de acordo con ela:',p:['A aplicación facilita información, datos e posibles predicións obtidas de fontes de acceso público ou doutras fontes externas.','Toda a información, os datos e as predicións facilitadas a través da aplicación teñen carácter meramente informativo e non constitúen asesoramento profesional nin garantía ningunha sobre a súa exactitude, integridade, actualidade ou idoneidade para un fin determinado.','O usuario recoñece que calquera decisión tomada sobre a base da información obtida a través da aplicación tómase exclusivamente baixo a súa propia responsabilidade.','Nin o operador nin o autor da aplicación serán responsables dos danos, lucro cesante ou outros prexuízos derivados do uso ou da imposibilidade de uso da información, os datos ou as predicións facilitadas, na máxima medida permitida pola lei.','As predicións e estimacións facilitadas pola aplicación baséanse en modelos matemáticos e estatísticos e non constitúen información vinculante nin garantía da evolución futura.'],a:'Acepto',q:'Saír'},
'sq':{t:'Mohim përgjegjësie',i:'Përdoruesi konfirmon se, përpara përdorimit të aplikacionit, është njohur me informacionin e mëposhtëm dhe e pranon atë:',p:['Aplikacioni ofron informacione, të dhëna dhe parashikime të mundshme të marra nga burime publikisht të disponueshme ose burime të tjera të jashtme.','I gjithë informacioni, të dhënat dhe parashikimet e ofruara nëpërmjet aplikacionit kanë karakter thjesht informativ dhe nuk përbëjnë këshillë profesionale apo ndonjë garanci për saktësinë, plotësinë, aktualitetin ose përshtatshmërinë e tyre për një qëllim të caktuar.','Përdoruesi pranon se çdo vendim i marrë mbi bazën e informacionit të marrë nëpërmjet aplikacionit merret vetëm me përgjegjësinë e tij.','As operatori as autori i aplikacionit nuk mbajnë përgjegjësi për dëme, fitim të humbur apo dëme të tjera që lindin në lidhje me përdorimin ose pamundësinë e përdorimit të informacionit, të dhënave ose parashikimeve të ofruara, në masën maksimale të lejuar nga ligji.','Parashikimet dhe vlerësimet e ofruara nga aplikacioni bazohen në modele matematikore dhe statistikore dhe nuk përbëjnë informacion detyrues apo garanci për zhvillimet e ardhshme.'],a:'Pranoj',q:'Dil'},
'mk':{t:'Одрекување од одговорност',i:'Корисникот потврдува дека пред користењето на апликацијата се запознал со следните информации и се согласува со нив:',p:['Апликацијата посредува информации, податоци и евентуални прогнози добиени од јавно достапни или други надворешни извори.','Сите информации, податоци и прогнози дадени преку апликацијата се исклучиво од информативен карактер и не претставуваат стручна препорака ниту гаранција за нивната точност, целосност, актуелност или соодветност за одредена намена.','Корисникот прима на знаење дека сите одлуки донесени врз основа на информациите добиени преку апликацијата ги донесува исклучиво на сопствена одговорност.','Ниту операторот ниту авторот на апликацијата не одговараат за штета, изгубена добивка или други загуби настанати во врска со користењето или неможноста за користење на дадените информации, податоци или прогнози, во најголема мера дозволена со закон.','Прогнозите и проценките дадени од апликацијата се засноваат на математички и статистички модели и не претставуваат обврзувачка информација ниту гаранција за идниот развој.'],a:'Се согласувам',q:'Излез'},
'is':{t:'Fyrirvari um ábyrgð',i:'Notandinn staðfestir að hann hafi fyrir notkun forritsins kynnt sér eftirfarandi upplýsingar og samþykki þær:',p:['Forritið miðlar upplýsingum, gögnum og hugsanlegum spám sem fengnar eru úr opinberum eða öðrum ytri heimildum.','Allar upplýsingar, gögn og spár sem veittar eru í gegnum forritið eru eingöngu til upplýsingar og fela hvorki í sér faglega ráðgjöf né ábyrgð á réttmæti þeirra, heilleika, tímabærni eða hæfi til tiltekins tilgangs.','Notandinn gerir sér grein fyrir því að allar ákvarðanir sem teknar eru á grundvelli upplýsinga sem fengnar eru í gegnum forritið eru teknar alfarið á eigin ábyrgð.','Hvorki rekstraraðili né höfundur forritsins bera ábyrgð á tjóni, töpuðum hagnaði eða öðru tjóni sem hlýst af notkun eða ómöguleika á notkun upplýsinga, gagna eða spáa sem forritið veitir, að því marki sem lög leyfa.','Spár og áætlanir sem forritið veitir byggjast á stærðfræðilegum og tölfræðilegum líkönum og fela hvorki í sér bindandi upplýsingar né ábyrgð á framtíðarþróun.'],a:'Ég samþykki',q:'Hætta'},
'sw':{t:'Kanusho la dhima',i:'Mtumiaji anathibitisha kwamba kabla ya kutumia programu amesoma na anakubaliana na taarifa zifuatazo:',p:['Programu hutoa taarifa, data na utabiri unaowezekana uliopatikana kutoka vyanzo vinavyopatikana hadharani au vyanzo vingine vya nje.','Taarifa, data na utabiri wote unaotolewa kupitia programu ni kwa madhumuni ya taarifa pekee na hauwakilishi ushauri wa kitaalamu wala dhamana yoyote kuhusu usahihi, ukamilifu, uhalisia au ufaafu wake kwa kusudi fulani.','Mtumiaji anatambua kwamba maamuzi yoyote yanayofanywa kwa msingi wa taarifa zilizopatikana kupitia programu hufanywa kwa jukumu lake binafsi pekee.','Wala mwendeshaji wala mwandishi wa programu hatawajibika kwa uharibifu wowote, faida iliyopotea au madhara mengine yanayotokana na matumizi au kutoweza kutumia taarifa, data au utabiri unaotolewa, kwa kiwango cha juu kinachoruhusiwa na sheria.','Utabiri na makadirio yanayotolewa na programu yanategemea miundo ya kihisabati na kitakwimu na hayawakilishi taarifa za kulazimisha wala dhamana ya maendeleo ya baadaye.'],a:'Nakubali',q:'Toka'},
'tl':{t:'Pagtatatwa ng pananagutan',i:'Kinukumpirma ng user na bago gamitin ang application, nabasa niya at sumasang-ayon siya sa sumusunod na impormasyon:',p:['Ang application ay nagbibigay ng impormasyon, datos at posibleng mga forecast na nakuha mula sa mga pampublikong magagamit o iba pang panlabas na pinagmulan.','Ang lahat ng impormasyon, datos at forecast na ibinibigay sa pamamagitan ng application ay para sa layuning pang-impormasyon lamang at hindi bumubuo ng propesyonal na payo o anumang garantiya tungkol sa katumpakan, pagkakumpleto, pagiging napapanahon o kaangkupan nito para sa isang partikular na layunin.','Kinikilala ng user na anumang desisyong ginawa batay sa impormasyong nakuha sa pamamagitan ng application ay ginagawa nang buo sa kanyang sariling pananagutan.','Hindi mananagot ang operator o ang may-akda ng application sa anumang pinsala, nawalang kita o iba pang pinsalang magmumula kaugnay ng paggamit o kawalan ng kakayahang gamitin ang ibinigay na impormasyon, datos o forecast, sa pinakamataas na saklaw na pinapahintulutan ng batas.','Ang mga forecast at pagtatantya na ibinibigay ng application ay batay sa mga modelong matematikal at istatistikal at hindi bumubuo ng nagbubuklod na impormasyon o garantiya ng hinaharap na pag-unlad.'],a:'Sumasang-ayon ako',q:'Lumabas'}

var _discBase={'en-US':'en','en-GB':'en','en-AU':'en','ie':'en','at':'de','ch-de':'de','be-fr':'fr','ch-fr':'fr','lu':'fr','mc':'fr','ch-it':'it','sm':'it','be-nl':'nl','bs':'hr','me':'sr','by':'uk','kk':'ru'};
function discData(){var c=(activeLang&&activeLang.code)||'cs';return DISC[c]||DISC[_discBase[c]]||DISC['en'];}
function renderDisclaimer(){
  var d=discData(),box=document.getElementById('aboutDisc');if(!box)return;
  var rtl=['ar','fa','ur'].indexOf((activeLang&&activeLang.code)||'')>=0;
  box.style.direction=rtl?'rtl':'ltr';
  box.style.textAlign=rtl?'right':'left';
  var html='<div class="ab-dt">'+d.t+'</div><p>'+d.i+'</p><ol>';
  for(var k=0;k<d.p.length;k++)html+='<li>'+d.p[k]+'</li>';
  html+='</ol>';
  box.innerHTML=html;
  var ab=document.getElementById('aboutAgree'),qb=document.getElementById('aboutQuit');
  if(ab)ab.textContent=d.a;if(qb)qb.textContent=d.q;
  var fl=document.getElementById('aboutLangFlag'),lc=document.getElementById('aboutLangCode');
  if(fl)fl.textContent=activeLang.flag;if(lc)lc.textContent=activeLang.btnShort||activeLang.short;
}
function agreeDisclaimer(){try{localStorage.setItem('ssAgreed','1');}catch(e){}document.getElementById('aboutPopup').classList.remove('open');}
function quitApp(){
  try{localStorage.removeItem('ssAgreed');}catch(e){}
  try{window.close();}catch(e){}
  setTimeout(function(){document.documentElement.innerHTML='<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#05080f;color:#7f97b5;font:16px sans-serif;text-align:center;padding:24px">'+((discData().q)||'')+' – '+( ((activeLang&&activeLang.code)||'cs')==='cs'?'Aplikaci můžete zavřít.':'You can now close the app.')+'</body>';},120);
}
function openAbout(){renderDisclaimer();document.getElementById('aboutPopup').classList.add('open');}
function closeAbout(e){if(e&&e.target&&e.target.closest&&e.target.closest('.about-box'))return;document.getElementById('aboutPopup').classList.remove('open');}

var layerState=(function(){
  try{return JSON.parse(localStorage.getItem('layerState'))||{};}catch(e){return {};}
})();
function layerOn(tab,key){
  if(tab==='aqi'&&key==='eaqi')return true; // EAQI/US AQI se zobrazuje vždy, nelze vypnout
  if(!layerState[tab])return (_layerDefaults[tab]&&_layerDefaults[tab][key]!==undefined)?_layerDefaults[tab][key]:true;
  if(layerState[tab][key]===undefined)return (_layerDefaults[tab]&&_layerDefaults[tab][key]!==undefined)?_layerDefaults[tab][key]:true;
  return layerState[tab][key];
}
function toggleLayer(tab,key){
  if(!layerState[tab])layerState[tab]={};
  layerState[tab][key]=!layerOn(tab,key);
  try{localStorage.setItem('layerState',JSON.stringify(layerState));}catch(e){}
  renderLayerBar();
  if(WD)draw();
}

  return false;
}

function getRecent(){try{return JSON.parse(localStorage.getItem('recentLocations')||'[]');}catch(e){return[];}}

function escQ(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
var _chipList=[];
function renderRecentChips(){
  var rc=document.getElementById('recentChips');

  _chipList=sorted;

function togglePin(e,name){

  if(!loc.pinned&&arr.filter(function(l){return l.pinned&&l.name!==name;}).length>=10){alert('Max. 10!');return;}

}
// Přišpendli lokalitu a zařaď ji na pozici pos (1..N) mezi přišpendlené; pos==null → nakonec.
function setPinOrder(name,pos){
  var arr=getRecent();
  var loc=arr.filter(function(l){return l.name===name;})[0];if(!loc)return;
  var pinned=arr.filter(function(l){return l.pinned&&l.name!==name;});
  var un=arr.filter(function(l){return !l.pinned&&l.name!==name;});
  if(!loc.pinned&&pinned.length>=10){alert('Max. 10!');return;}
  loc.pinned=true;
  var p=(pos==null)?pinned.length:Math.max(0,Math.min(pinned.length,pos-1));
  pinned.splice(p,0,loc);
  saveRecent(pinned.concat(un));renderRecentChips();
}
function removeRecent(e,name){e.stopPropagation();saveRecent(getRecent().filter(function(l){return l.name!==name;}));renderRecentChips();}
// ===== Dotyková lupa pro historii =====
// Podržení prstu na historii → 2× zvětšené oválné okénko; tažením nad špendlík/název/křížek
// se cíl zvýrazní (špendlík a křížek červeně) a po puštění se provede daná akce.
// Krátké ťuknutí funguje beze změny (špendlík=přišpendlit, název=vybrat, křížek=smazat).
var _loupe={active:false,timer:null,sx:0,sy:0,hot:null};
function chipsTouchStart(e){
  if(_loupe.active){closeLoupe();return;} // pojistka: zaseknutá lupa → další dotyk ji zavře
  if(e.touches.length!==1){clearTimeout(_loupe.timer);return;}
  var t=e.touches[0];_loupe.sx=t.clientX;_loupe.sy=t.clientY;
  clearTimeout(_loupe.timer);
  _loupe.timer=setTimeout(function(){openLoupe(_loupe.sx,_loupe.sy);},380);
}
function chipsTouchMove(e){
  var t=e.touches[0];if(!t)return;
  if(!_loupe.active){ // ještě nezvětšeno: pohyb = posun/scroll → zrušit lupu
    if(Math.abs(t.clientX-_loupe.sx)>10||Math.abs(t.clientY-_loupe.sy)>10)clearTimeout(_loupe.timer);
    return;
  }
  e.preventDefault();
  loupeUpdate(t.clientX,t.clientY);
}
function chipsTouchEnd(e){
  clearTimeout(_loupe.timer);
  if(_loupe.active){e.preventDefault();loupeRelease();}

function openLoupe(px,py){

  win.appendChild(cur);

  _loupe.win=win;_loupe.clone=clone;_loupe.cursor=cur;_loupe.rcRect=rcRect;
  _loupe.LW=LW;_loupe.LH=LH;_loupe.padTop=padTop;_loupe.fullW=rc.scrollWidth;
  // L.scroll = vodorovný výřez (reálné px obsahu u levého okraje okna); vycentruj na dotknutou dlaždici
  var maxS=Math.max(0,rc.scrollWidth-LW/2+24); // +24: rezerva, aby šel označit i křížek poslední lokality
  var focus=Math.max(0,Math.min(rc.scrollWidth,(px-rcRect.left)+rc.scrollLeft));
  _loupe.scroll=Math.max(0,Math.min(maxS,focus-LW/4));
  _loupe.ax=null;
  _loupe.scrollRAF=requestAnimationFrame(loupeAutoScroll);

}
function loupeUpdate(fx,fy){
  var L=_loupe,win=L.win,clone=L.clone;if(!win)return;
  L.lastFx=fx;L.lastFy=fy;
  var winRect=win.getBoundingClientRect();
  // 2× zvětšený klon; vodorovný výřez řídí L.scroll (mění ho jen auto-posun u kraje)
  clone.style.transform='translate('+(-2*L.scroll)+'px,'+L.padTop+'px) scale(2)';
  // ŠIPKA: od dotyku prstu o 50 px vlevo a 50 px nahoru, plynule po celém okně (držena uvnitř okna)
  var ax=Math.max(winRect.left+2,Math.min(winRect.right-2,fx-50));
  var ay=Math.max(winRect.top+2,Math.min(winRect.bottom-2,fy-50));
  L.ax=ax;
  // ZVÝRAZNĚNÍ A VÝBĚR podle pozice ŠPIČKY ŠIPKY (ne prstu) – plynule v obou osách
  var el=document.elementFromPoint(ax,ay);
  var target=(el&&win.contains(el))?el.closest('[data-act]'):null;
  if(target!==L.hot){
    if(L.hot)L.hot.classList.remove('loupe-sel');
    L.hot=target;
    if(target)target.classList.add('loupe-sel');
  }
  var tAct=target?target.getAttribute('data-act'):null;
  // Edit tlačítko: zobraz nad chip-name, schovej jinak
  if(tAct==='select'){
    loupePosEditBtn(target,winRect);
  } else if(tAct!=='edit'){
    if(L.editBtn)L.editBtn.style.display='none';
  }
  // Pořadová čísla přišpendlení: zobraz nad špendlíkem, schovej jinak
  if(tAct==='pin'&&target.classList.contains('chip-pin')){
    loupePosPinStrip(target,winRect);
  } else if(tAct!=='pin'&&tAct!=='pinord'){
    if(L.pinStrip)L.pinStrip.style.display='none';
  }
  if(target){
    var chip=target.closest('.chip');
    L.hotAct=tAct;
    if(tAct==='pinord'){L.hotPos=parseInt(target.getAttribute('data-pos'),10);L.hotIdx=(L.pinStripChipIdx!=null&&L.pinStripChipIdx>=0)?L.pinStripChipIdx:-1;}
    else if(chip){L.hotIdx=parseInt(chip.getAttribute('data-i'),10);}
    else if(tAct==='edit'){L.hotIdx=L.editBtnChipIdx>=0?L.editBtnChipIdx:-1;}
    else if(tAct==='pin'){L.hotIdx=(L.pinStripChipIdx!=null&&L.pinStripChipIdx>=0)?L.pinStripChipIdx:-1;}
    else{L.hotIdx=-1;}
  } else{L.hotIdx=-1;L.hotAct=null;}
  L.cursor.style.left=Math.round(ax-winRect.left-2)+'px';
  L.cursor.style.top=Math.round(ay-winRect.top-2)+'px';
}

function loupePosPinStrip(pinEl,winRect){

function loupeAutoScroll(){
  var L=_loupe;if(!L.active){L.scrollRAF=null;return;}
  var win=L.win;
  if(win&&L.ax!=null){
    var winRect=win.getBoundingClientRect();
    var maxS=Math.max(0,L.fullW-L.LW/2+24);
    if(maxS>0){
      var dL=L.ax-winRect.left, dR=winRect.right-L.ax; // vzdálenost špičky šipky od okraje okna
      var fast=8, slow=3, zFast=18, zSlow=48;           // 2 rychlosti: u kraje rychle, dál pomalu
      var step=0;
      if(dL<zFast)step=-fast; else if(dL<zSlow)step=-slow;
      else if(dR<zFast)step=fast; else if(dR<zSlow)step=slow;
      if(step!==0){
        var ns=Math.max(0,Math.min(maxS,L.scroll+step));
        if(ns!==L.scroll){L.scroll=ns;loupeUpdate(L.lastFx,L.lastFy);}
      }
    }
  }
  L.scrollRAF=requestAnimationFrame(loupeAutoScroll);
}
function loupeRelease(){
  var act=_loupe.hotAct,idx=_loupe.hotIdx,pos=_loupe.hotPos;
  if(act==='edit')idx=(_loupe.editBtnChipIdx>=0)?_loupe.editBtnChipIdx:-1;
  closeLoupe();
  if(act&&idx>=0&&_chipList[idx]){
    var name=_chipList[idx].name,noop={stopPropagation:function(){}};
    if(act==='pin'){if(_chipList[idx].pinned)togglePin(noop,name);else setPinOrder(name,null);}
    else if(act==='pinord')setPinOrder(name,pos);
    else if(act==='del')removeRecent(noop,name);
    else if(act==='select')chipLoad(name);
    else if(act==='edit')startChipRename(idx);
  }
}

  inp.className='chip-rename-inp';
  nameEl.style.visibility='hidden';nameEl.style.width='0';nameEl.style.minWidth='0';
  chipEl.insertBefore(inp,nameEl);
  setTimeout(function(){inp.focus();inp.select();},30);
  function commit(){
    var newName=inp.value.trim();
    if(newName&&newName!==currentDisplay){
      var arr2=getRecent();
      var item=arr2.filter(function(l){return l.name===loc.name;})[0];
      if(item){item.customName=newName;saveRecent(arr2);}
    }
    renderRecentChips();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='Escape'){inp.value=currentDisplay;inp.removeEventListener('blur',commit);inp.blur();renderRecentChips();}
  });
}
function addToRecent(lat,lon,name){
  var arr=getRecent();
  var existing=arr.filter(function(i){return i.name===name;})[0];
  if(existing&&existing.pinned){ // přišpendlená: aktualizuj na místě, pořadí se nemění
    existing.lat=lat;existing.lon=lon;existing.time=Date.now();
    saveRecent(arr);renderRecentChips();return;
  }
  var wasCustomName=existing?existing.customName:undefined;
  arr=arr.filter(function(i){return i.name!==name;});
  arr.unshift({name:name,lat:lat,lon:lon,pinned:false,customName:wasCustomName,time:Date.now()});
  var p=arr.filter(function(i){return i.pinned;}),u=arr.filter(function(i){return !i.pinned;}).slice(0,20);
  saveRecent(p.concat(u));renderRecentChips();
}
// Ruční souřadnice → nalezená obec: výsledek geokódu (kvůli race mezi odpovědí počasí a Nominatim).
var _coordGeo=null;
// Přejmenuj položku historie podle souřadnic (souřadnice → obec). Když položka ještě není (počasí nedoběhlo),
// nic neudělá – obec pak při uložení použije loadWeather přes _coordGeo.
function renameRecentByCoord(lat,lon,newName){
  var arr=getRecent(),hit=null;
  arr=arr.filter(function(i){
    if(i.lat!=null&&Math.abs(i.lat-lat)<1e-9&&Math.abs(i.lon-lon)<1e-9){if(!hit)hit=i;return false;}
    return i.name!==newName; // odstraň i případný duplikát se stejným názvem
  });
  if(!hit)return false;
  arr.unshift({name:newName,lat:lat,lon:lon,pinned:hit.pinned,customName:hit.customName,time:hit.time||Date.now()});
  var p=arr.filter(function(i){return i.pinned;}),u=arr.filter(function(i){return !i.pinned;}).slice(0,20);
  saveRecent(p.concat(u));renderRecentChips();return true;
}

var cityQ=document.getElementById('cityQ'),sugBox=document.getElementById('sugBox');
cityQ.addEventListener('focus',function(){

function showRecentInSug(){

function rRI(loc){

function doSearch(q){

function openSug(h){sugBox.innerHTML=h;sugBox.className='sug-box open';}
function closeSug(){sugBox.className='sug-box';sugBox.innerHTML='';}
// Souřadnicové pole: ZOBRAZÍ 2 desetiny + °, ale ULOŽÍ plnou přesnost do data-full (s ní pak pracuje GO)
function setCoordField(id,val){
  var el=document.getElementById(id);if(!el)return;

// ══ GPS ════════════════════════════════════════════════
function useGPS(){
  closeSug();_coordGeo=null;
  if(!navigator.geolocation){setState('🚫','GPS není dostupná');return;}
  setState('📡','…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    setCoordField('latIn',lat);
    setCoordField('lonIn',lon);
    var coords=lat.toFixed(1)+', '+lon.toFixed(1);
    cityQ.value=coords; // dočasně, než dorazí reverse geocoding
    // GPS: nejdřív zjisti lokalitu (obec/ulice/stát), pak načti počasí → do historie půjde lokalita, ne souřadnice.
    // Pojistka: kdyby Nominatim neodpověděl do 6 s, načti počasí pod souřadnicemi.
    var geo=fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json&zoom=18&accept-language='+activeLang.code.split('-')[0]+',en')
      .then(function(r){return r.json();}).then(function(d){return parseGeoLabel(d);});
    var timeout=new Promise(function(res){setTimeout(function(){res('');},6000);});
    Promise.race([geo,timeout]).then(function(label){
      var name=label||coords;cityQ.value=name;loadWeather(lat,lon,name);
    }).catch(function(){cityQ.value=coords;loadWeather(lat,lon,coords);});
  },function(err){setState('❌',{1:'Zamítnuto.',2:'Nedostupné.',3:'Vypršel.'}[err.code]||'Chyba GPS');},{enableHighAccuracy:true,timeout:15000});
}
function useCoords(){
  closeSug();_coordGeo=null;
  var latEl=document.getElementById('latIn'),lonEl=document.getElementById('lonIn');
  // přednost má uložená plná přesnost (data-full); když uživatel zadal ručně, čteme z pole
  var lat=(latEl.dataset.full!=null&&latEl.dataset.full!=='')?parseFloat(latEl.dataset.full):parseFloat(latEl.value);
  var lon=(lonEl.dataset.full!=null&&lonEl.dataset.full!=='')?parseFloat(lonEl.dataset.full):parseFloat(lonEl.value);
  if(isNaN(lat)||isNaN(lon)){setState('⚠️','Chybné souřadnice');return;}
  cityQ.value=lat.toFixed(1)+', '+lon.toFixed(1);loadWeather(lat,lon,lat.toFixed(1)+', '+lon.toFixed(1));
  reverseGeocodeCoords(lat,lon); // asynchronně doplní obec + ulici do pole lokality
}
// Z ručně zadaných souřadnic zjisti obec + ulici (bez č. popisného) a zapiš do pole lokality.
// Sestaví popisek "obec, ulice, stát" z Nominatim odpovědi; bez aspoň obce/ulice vrátí '' (necháme souřadnice).
function parseGeoLabel(d){
  var a=d.address||{};
  var obec=a.city||a.town||a.village||a.municipality||a.hamlet||a.suburb||'';
  var ulice=a.road||a.pedestrian||a.footway||a.path||'';
  var stat=a.country||'';
  var parts=[];
  if(obec)parts.push(obec);
  if(ulice)parts.push(ulice);
  if(stat)parts.push(stat);
  return (obec||ulice)?parts.join(', '):'';
}
// Ruční souřadnice: počasí běží hned, tady jen asynchronně doplníme obec/ulici/stát do pole lokality.
function reverseGeocodeCoords(lat,lon){
  fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json&zoom=18&accept-language='+activeLang.code.split('-')[0]+',en')
    .then(function(r){return r.json();})
    .then(function(d){
      var label=parseGeoLabel(d);
      if(label){
        cityQ.value=label;
        if(lastLoad&&Math.abs(lastLoad.lat-lat)<1e-9&&Math.abs(lastLoad.lon-lon)<1e-9)lastLoad.name=label;
        _coordGeo={lat:lat,lon:lon,name:label};            // pro případ, že počasí (a tím zápis do historie) doběhne až teď
        renameRecentByCoord(lat,lon,label);                // pokud už souřadnice v historii jsou, přepiš je na obec
        localStorage.setItem('lastLocation',JSON.stringify({lat:lat,lon:lon,name:label}));
      }
    }).catch(function(){});
}

// ══ LOAD ═══════════════════════════════════════════════
var lastLoad=null;
function refreshWeather(){
  closeSug();
  if(lastLoad&&lastLoad.lat!=null){
    // do polí zobraz lokalitu/souřadnice, pro které se refresh dělá
    cityQ.value=lastLoad.name;
    setCoordField('latIn',lastLoad.lat);
    setCoordField('lonIn',lastLoad.lon);
    // znovu načti aktuální lokalitu (souřadnice v plné přesnosti, jak byly původně zadané)
    loadWeather(lastLoad.lat,lastLoad.lon,lastLoad.name);
  } else {
    // nic dříve načteno – zkus podle vyplněných souřadnic
    useCoords();
  }
}
function loadWeather(lat,lon,name){
  lastLoad={lat:lat,lon:lon,name:name};
  setState('⏳','…');
  var extraFields=[];
  if(enabledExtras.indexOf('vis')>=0)extraFields.push('visibility');
  if(enabledExtras.indexOf('wetbulb')>=0)extraFields.push('wet_bulb_temperature_2m');
  if(enabledExtras.indexOf('solar')>=0)extraFields.push('shortwave_radiation');
  var hourlyBase='temperature_2m,apparent_temperature,relative_humidity_2m,dewpoint_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,snowfall,'
    +'cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,weathercode,is_day,uv_index,'
    +'snow_depth,soil_moisture_0_to_1cm';
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&hourly='+hourlyBase+(extraFields.length?','+extraFields.join(','):'')
    +'&daily=sunrise,sunset'
    +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation,weathercode,is_day'
    +'&forecast_days=10&past_days=1&timezone=auto';
  fetch(url)
    .then(function(r){
      if(r.status===429){
        // Nezkoušíme znovu automaticky — každý retry prodlužuje blokaci.
        // Počkejte 2–3 minuty, pak znovu klikněte na lokalitu.
        throw new Error('Příliš mnoho dotazů (429) · počkejte 2 min a zkuste znovu');
      }
      if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
    })
    .then(function(data){
      try{
      WD=data;
      // Sanity-check snow_depth: max realistic change ≈ 20cm/hour (0.20m)
      if(WD.hourly&&WD.hourly.snow_depth){
        var sd=WD.hourly.snow_depth;
        var maxStep=0.20; // metres per hour
        for(var si=1;si<sd.length;si++){
          if(sd[si]!==null&&sd[si-1]!==null){
            var delta=sd[si]-sd[si-1];
            if(delta>maxStep){sd[si]=sd[si-1]+maxStep;}
            else if(delta<-maxStep){sd[si]=sd[si-1]-maxStep;}
          }
        }
      }
      scrollOffset=0;hoverIdx=null;
      buildMetricTiles();
      updateMetrics(null);
      document.getElementById('metricsWrap').style.display='block';
      document.getElementById('cubeWrap').style.display='block';
      document.getElementById('stateDiv').style.display='none';
      document.getElementById('dataSrc').textContent=T('data')+' · '+lat.toFixed(3)+', '+lon.toFixed(3);
      initCanvas();draw();
      setStatus('✓ '+name+' · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
      var _recName=name;
      if(_coordGeo&&_coordGeo.lat!=null&&Math.abs(_coordGeo.lat-lat)<1e-9&&Math.abs(_coordGeo.lon-lon)<1e-9)_recName=_coordGeo.name; // ruční souřadnice s nalezenou obcí → do historie obec
      addToRecent(lat,lon,_recName);
      localStorage.setItem('lastLocation',JSON.stringify({lat:lat,lon:lon,name:_recName}));
      updateCloudModeBtn();
      scrollTileToActive();
      // Fetch Air Quality data (Open-Meteo AQI)
      var aqUrl='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon
        +'&hourly=pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,european_aqi,us_aqi'
        +'&past_days=1&forecast_days=4&timezone=auto';
      fetch(aqUrl).then(function(r){return r.json();}).then(function(aqd){WD.aq=aqd.hourly;updateMetrics(null);if(currentTab==='aqi'){draw();updateAqiPanel(-1);}}).catch(function(){WD.aq=null;if(currentTab==='aqi')draw();});
      // Fetch Pollen data (Open-Meteo)
      var polUrl='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon
        +'&hourly=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen'
        +'&past_days=1&forecast_days=4&timezone=auto';
      fetch(polUrl).then(function(r){return r.json();}).then(function(pd){WD.pol=pd.hourly;updateMetrics(null);updatePollenTileState();if(!pollenAvailable()&&currentTab==='pollen'){switchTabByName(TABS[0]);}else if(currentTab==='pollen'){draw();updatePollenPanel(-1);}}).catch(function(){WD.pol=null;updatePollenTileState();if(currentTab==='pollen')switchTabByName(TABS[0]);});
      }catch(err){console.error('loadWeather error:',err);setState('⚠️','Chyba: '+err.message+' @ '+err.stack.split('\n')[1]);}
    })
    .catch(function(e){setState('⚠️','Chyba: '+e.message);WD=null;});
}

function scrollTileToActive(){
