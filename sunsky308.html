  '<b>Malý srážkový graf</b> – pro lepší přehled je uváděn nad většinou ostatních grafů a schematicky ukazuje množství srážek.':'<b>Biểu đồ lượng mưa nhỏ</b> – để dễ theo dõi hơn, nó được hiển thị phía trên hầu hết các biểu đồ khác và biểu thị lượng mưa một cách sơ đồ.',
  '<b>GO</b> načte počasí pro zadanou obec nebo souřadnice. Tlačítko <b>↻</b> znovu zaktualizuje naposledy načtenou obec nebo souřadnice.':'<b>GO</b> tải thời tiết cho địa điểm hoặc tọa độ đã nhập. Nút <b>↻</b> tải lại địa điểm hoặc tọa độ đã tải gần nhất.',
  '<b>GPS</b> zjistí tvoji polohu a načte počasí pro ni. <b>Stát / jazyk</b> vybere zemi a jazyk – podle toho se zobrazují jednotky a názvy.':'<b>GPS</b> xác định vị trí của bạn và tải thời tiết của vị trí đó. <b>Quốc gia / ngôn ngữ</b> chọn quốc gia và ngôn ngữ – đơn vị và tên gọi theo đó mà thay đổi.',
  '<b>+ GRAF</b> přidá nebo ubere další grafy (dohlednost, UV, kvalita ovzduší, pyl…). <b>AAAA</b> mění velikost písma v aplikaci.':'<b>+ BIỂU ĐỒ</b> thêm hoặc bớt các biểu đồ phụ (tầm nhìn, UV, chất lượng không khí, phấn hoa…). <b>AAAA</b> thay đổi cỡ chữ trong ứng dụng.',
  'Nápověda – ťukni na žluté <b>?</b> nebo na ikonky pro popis. Zavřeš tlačítkem vpravo dole.':'Trợ giúp – chạm vào dấu <b>?</b> màu vàng hoặc các biểu tượng để xem mô tả. Đóng bằng nút ở góc dưới bên phải.',
  '<b>Zadání místa</b> – do pole napiš název obce a vyber ho z <b>našeptávače</b>, nebo zadej <b>souřadnice</b> (zeměpisnou šířku a délku) do políček vpravo. Pak ťukni na <b>GO</b>.':'<b>Nhập địa điểm</b> – gõ tên một địa phương và chọn nó từ <b>gợi ý</b>, hoặc nhập <b>tọa độ</b> (vĩ độ và kinh độ) vào các ô bên phải. Sau đó chạm <b>GO</b>.',
  '<b>Dlaždice</b> – ťuknutím přepneš, který graf se zobrazí. Dají se posouvat do stran, <b>přidržením</b> změníš jejich pořadí a tlačítkem <b>+ GRAF</b> je přidáš nebo ubereš.':'<b>Ô xếp</b> – chạm để chuyển biểu đồ nào được hiển thị. Có thể vuốt sang hai bên, <b>nhấn giữ</b> để sắp xếp lại thứ tự, và nút <b>+ BIỂU ĐỒ</b> thêm hoặc bớt chúng.',
  '<b>Historie míst</b> – ťuknutím vybereš dříve načtené místo. Lokalitu si můžeš <b>připíchnout špendlíkem 📌</b>, aby v historii zůstala. <b>Podržením prstu</b> se tato část <b>zvětší (lupa)</b> pro pohodlnější výběr.':'<b>Địa điểm đã lưu</b> – chạm để chọn một địa điểm đã tải trước đó. Bạn có thể <b>ghim một địa điểm 📌</b> để giữ nó trong lịch sử. <b>Nhấn giữ</b> để <b>phóng to (kính lúp)</b> khu vực này nhằm chọn dễ hơn.',
  'MALÝ SRÁŽKOVÝ GRAF':'BIỂU ĐỒ LƯỢNG MƯA NHỎ',
  'HLAVNÍ GRAF':'BIỂU ĐỒ CHÍNH',
  'zoom':'thu phóng',
  '<b>Zoom</b> – dvěma prsty graf <b>roztáhni/stáhni</b> (pinch). Roztažením si detailněji prohlédneš třeba jeden den, stažením zobrazíš výhled až na 10 dní.':'<b>Thu phóng</b> – <b>chụm</b> biểu đồ bằng hai ngón tay. Tách ra để phóng to (xem chi tiết một ngày), chụm lại để thu nhỏ (xem dự báo tới 10 ngày).',
  'další graf':'biểu đồ tiếp theo',
  '<b>Další graf</b> – <b>rychlým</b> vodorovným švihnutím (swipe) <b>v ploše horní poloviny grafu</b> přepneš na další/předchozí graf. Posun po časové ose uděláš <b>pomalým tažením v oblasti poblíž časové osy</b> (dole).':'<b>Biểu đồ tiếp theo</b> – <b>vuốt</b> ngang <b>nhanh</b> ở nửa trên của biểu đồ để chuyển sang biểu đồ tiếp theo/trước đó. Để di chuyển theo trục thời gian, kéo <b>chậm gần trục thời gian</b> (phía dưới).',
  'podrž = hodnoty':'giữ = giá trị',
  '<b>Hodnoty v čase</b> – <b>podrž prst</b> na grafu a posouvej; u všech křivek se ukáže hodnota pro daný čas.':'<b>Giá trị theo thời gian</b> – <b>nhấn giữ</b> trên biểu đồ và di chuyển; mỗi đường cong hiển thị giá trị của nó tại thời điểm đó.',
  'posun času':'di chuyển theo thời gian',
  '<b>Posun po čase</b> – <b>pomalým</b> tažením do strany <b>v oblasti poblíž časové osy (dole)</b> posouváš graf v čase (do minulosti/budoucnosti). Rychlý švih v horní polovině grafu naopak přepne graf.':'<b>Di chuyển theo thời gian</b> – kéo <b>chậm</b> sang ngang <b>gần trục thời gian (phía dưới)</b> để di chuyển biểu đồ theo thời gian (quá khứ/tương lai). Một cú vuốt nhanh ở nửa trên thì lại chuyển biểu đồ.',
  'Jednotlivé křivky zapneš/vypneš štítky nad grafem.':'Bạn có thể bật/tắt từng đường cong bằng các nhãn phía trên biểu đồ.',
  'zapni/vypni křivku':'bật/tắt đường cong',
  '<b>Křivky</b> – štítky nad grafem zapínáš nebo vypínáš jednotlivé křivky.':'<b>Đường cong</b> – dùng các nhãn phía trên biểu đồ để bật hoặc tắt từng đường cong.',
  'Nejdřív zadej obec, GPS nebo souřadnice a stiskni GO. Pak se tu zobrazí grafy a další nápověda.':'Trước tiên hãy nhập một thành phố, dùng GPS hoặc tọa độ và nhấn GO. Sau đó các biểu đồ và trợ giúp thêm sẽ xuất hiện ở đây.',
  },
  'tl':{
  'zavři help mód':'isara ang tulong',
  '<b>Malý srážkový graf</b> – pro lepší přehled je uváděn nad většinou ostatních grafů a schematicky ukazuje množství srážek.':'<b>Maliit na graph ng ulan</b> – para sa mas malinaw na pangkalahatang tanaw, ipinapakita ito sa itaas ng karamihan sa ibang mga graph at eskematikong ipinapakita ang dami ng ulan.',
  '<b>GO</b> načte počasí pro zadanou obec nebo souřadnice. Tlačítko <b>↻</b> znovu zaktualizuje naposledy načtenou obec nebo souřadnice.':'Niloload ng <b>GO</b> ang panahon para sa inilagay na lugar o koordinata. Muling niloload ng button na <b>↻</b> ang huling lugar o koordinatang niload.',
  '<b>GPS</b> zjistí tvoji polohu a načte počasí pro ni. <b>Stát / jazyk</b> vybere zemi a jazyk – podle toho se zobrazují jednotky a názvy.':'Hinahanap ng <b>GPS</b> ang iyong lokasyon at niloload ang panahon nito. Pinipili ng <b>Bansa / wika</b> ang bansa at wika – ang mga yunit at pangalan ay sumusunod dito.',
  '<b>+ GRAF</b> přidá nebo ubere další grafy (dohlednost, UV, kvalita ovzduší, pyl…). <b>AAAA</b> mění velikost písma v aplikaci.':'Nagdadagdag o nag-aalis ang <b>+ GRAPH</b> ng karagdagang graph (visibility, UV, kalidad ng hangin, pollen…). Binabago ng <b>AAAA</b> ang laki ng teksto sa app.',
  'Nápověda – ťukni na žluté <b>?</b> nebo na ikonky pro popis. Zavřeš tlačítkem vpravo dole.':'Tulong – i-tap ang dilaw na <b>?</b> o ang mga icon para sa paglalarawan. Isara gamit ang button sa kanan sa ibaba.',
  '<b>Zadání místa</b> – do pole napiš název obce a vyber ho z <b>našeptávače</b>, nebo zadej <b>souřadnice</b> (zeměpisnou šířku a délku) do políček vpravo. Pak ťukni na <b>GO</b>.':'<b>Paglalagay ng lugar</b> – i-type ang pangalan ng bayan at piliin ito mula sa mga <b>mungkahi</b>, o ilagay ang <b>koordinata</b> (latitude at longitude) sa mga field sa kanan. Pagkatapos ay i-tap ang <b>GO</b>.',
  '<b>Dlaždice</b> – ťuknutím přepneš, který graf se zobrazí. Dají se posouvat do stran, <b>přidržením</b> změníš jejich pořadí a tlačítkem <b>+ GRAF</b> je přidáš nebo ubereš.':'<b>Mga tile</b> – i-tap para palitan kung aling graph ang ipinapakita. Maaari itong i-scroll patagilid, <b>pindutin nang matagal</b> para baguhin ang pagkakasunod-sunod, at ang button na <b>+ GRAPH</b> ang nagdadagdag o nag-aalis nito.',
  '<b>Historie míst</b> – ťuknutím vybereš dříve načtené místo. Lokalitu si můžeš <b>připíchnout špendlíkem 📌</b>, aby v historii zůstala. <b>Podržením prstu</b> se tato část <b>zvětší (lupa)</b> pro pohodlnější výběr.':'<b>Mga naka-save na lugar</b> – i-tap para pumili ng dating niload na lugar. Maaari mong <b>i-pin ang isang lugar 📌</b> para manatili ito sa kasaysayan. <b>Pindutin nang matagal</b> para <b>palakihin (lente)</b> ang bahaging ito para mas madaling pumili.',
  'MALÝ SRÁŽKOVÝ GRAF':'MALIIT NA GRAPH NG ULAN',
  'HLAVNÍ GRAF':'PANGUNAHING GRAPH',
  'zoom':'zoom',
  '<b>Zoom</b> – dvěma prsty graf <b>roztáhni/stáhni</b> (pinch). Roztažením si detailněji prohlédneš třeba jeden den, stažením zobrazíš výhled až na 10 dní.':'<b>Zoom</b> – <b>kurutin</b> ang graph gamit ang dalawang daliri. Ibukaka para mag-zoom in (makita nang detalyado ang isang araw), pagdikitin para mag-zoom out (makita ang forecast hanggang 10 araw).',
  'další graf':'susunod na graph',
  '<b>Další graf</b> – <b>rychlým</b> vodorovným švihnutím (swipe) <b>v ploše horní poloviny grafu</b> přepneš na další/předchozí graf. Posun po časové ose uděláš <b>pomalým tažením v oblasti poblíž časové osy</b> (dole).':'<b>Susunod na graph</b> – isang <b>mabilis</b> na pahalang na <b>swipe</b> sa itaas na kalahati ng graph ang lumilipat sa susunod/nakaraang graph. Para gumalaw sa time axis, mag-drag <b>nang dahan-dahan malapit sa time axis</b> (ibaba).',
  'podrž = hodnoty':'pindutin = mga halaga',
  '<b>Hodnoty v čase</b> – <b>podrž prst</b> na grafu a posouvej; u všech křivek se ukáže hodnota pro daný čas.':'<b>Mga halaga sa panahon</b> – <b>pindutin nang matagal</b> sa graph at igalaw; ipinapakita ng bawat curve ang halaga nito para sa oras na iyon.',
  'posun času':'gumalaw sa panahon',
  '<b>Posun po čase</b> – <b>pomalým</b> tažením do strany <b>v oblasti poblíž časové osy (dole)</b> posouváš graf v čase (do minulosti/budoucnosti). Rychlý švih v horní polovině grafu naopak přepne graf.':'<b>Gumalaw sa panahon</b> – mag-drag <b>nang dahan-dahan</b> patagilid <b>malapit sa time axis (ibaba)</b> para igalaw ang graph sa panahon (nakaraan/hinaharap). Ang mabilis na swipe sa itaas na kalahati ay lumilipat naman ng graph.',
  'Jednotlivé křivky zapneš/vypneš štítky nad grafem.':'Maaari mong i-on/i-off ang bawat curve gamit ang mga label sa itaas ng graph.',
  'zapni/vypni křivku':'i-on/i-off ang curve',
  '<b>Křivky</b> – štítky nad grafem zapínáš nebo vypínáš jednotlivé křivky.':'<b>Mga curve</b> – gamitin ang mga label sa itaas ng graph para i-on o i-off ang bawat curve.',
  'Nejdřív zadej obec, GPS nebo souřadnice a stiskni GO. Pak se tu zobrazí grafy a další nápověda.':'Maglagay muna ng bayan, gumamit ng GPS o koordinata at pindutin ang GO. Pagkatapos ay lilitaw rito ang mga graph at iba pang tulong.',
  },

  'zapni/vypni křivku':'বক্ররেখা চালু/বন্ধ করুন',
  '<b>Křivky</b> – štítky nad grafem zapínáš nebo vypínáš jednotlivé křivky.':'<b>বক্ররেখা</b> – প্রতিটি বক্ররেখা আলাদাভাবে চালু বা বন্ধ করতে গ্রাফের উপরের বোতামগুলি ব্যবহার করুন।',
  'Nejdřív zadej obec, GPS nebo souřadnice a stiskni GO. Pak se tu zobrazí grafy a další nápověda.':'প্রথমে একটি শহর লিখুন, GPS বা স্থানাঙ্ক ব্যবহার করুন এবং GO চাপুন। তারপর গ্রাফ ও আরও সাহায্য এখানে প্রদর্শিত হবে।',
  },
  'mr':{
  'zavři help mód':'मदत मोड बंद करा',
  '<b>Malý srážkový graf</b> – pro lepší přehled je uváděn nad většinou ostatních grafů a schematicky ukazuje množství srážek.':'<b>लहान पर्जन्य आलेख</b> – चांगल्या आढाव्यासाठी तो बहुतेक इतर आलेखांच्या वर दाखवला जातो आणि पर्जन्याचे प्रमाण रेखाटनाने दर्शवतो.',
  '<b>GO</b> načte počasí pro zadanou obec nebo souřadnice. Tlačítko <b>↻</b> znovu zaktualizuje naposledy načtenou obec nebo souřadnice.':'<b>GO</b> प्रविष्ट केलेल्या ठिकाणाचे किंवा निर्देशांकांचे हवामान लोड करते. <b>↻</b> बटण अलीकडे लोड केलेले ठिकाण किंवा निर्देशांक पुन्हा लोड करते.',
  '<b>GPS</b> zjistí tvoji polohu a načte počasí pro ni. <b>Stát / jazyk</b> vybere zemi a jazyk – podle toho se zobrazují jednotky a názvy.':'<b>GPS</b> तुमचे स्थान शोधून त्याचे हवामान लोड करते. <b>देश / भाषा</b> देश व भाषा निवडते – एकके व नावे त्यानुसार असतात.',
  '<b>+ GRAF</b> přidá nebo ubere další grafy (dohlednost, UV, kvalita ovzduší, pyl…). <b>AAAA</b> mění velikost písma v aplikaci.':'<b>+ आलेख</b> अतिरिक्त आलेख जोडते किंवा काढते (दृश्यमानता, UV, हवेची गुणवत्ता, परागकण…). <b>AAAA</b> अॅपमधील मजकुराचा आकार बदलते.',
  'Nápověda – ťukni na žluté <b>?</b> nebo na ikonky pro popis. Zavřeš tlačítkem vpravo dole.':'मदत – वर्णनासाठी पिवळ्या <b>?</b> खुणांवर किंवा चिन्हांवर टॅप करा. खाली उजवीकडील बटणाने बंद करा.',
  '<b>Zadání místa</b> – do pole napiš název obce a vyber ho z <b>našeptávače</b>, nebo zadej <b>souřadnice</b> (zeměpisnou šířku a délku) do políček vpravo. Pak ťukni na <b>GO</b>.':'<b>ठिकाण प्रविष्ट करणे</b> – शहराचे नाव टाइप करा आणि <b>सूचनांमधून</b> निवडा, किंवा उजवीकडील क्षेत्रांत <b>निर्देशांक</b> (अक्षांश व रेखांश) प्रविष्ट करा. नंतर <b>GO</b> टॅप करा.',
  '<b>Dlaždice</b> – ťuknutím přepneš, který graf se zobrazí. Dají se posouvat do stran, <b>přidržením</b> změníš jejich pořadí a tlačítkem <b>+ GRAF</b> je přidáš nebo ubereš.':'<b>टाइल्स</b> – कोणता आलेख दाखवायचा हे बदलण्यासाठी टॅप करा. त्या बाजूला स्क्रोल होतात, क्रम बदलण्यासाठी <b>दाबून धरा</b>, आणि <b>+ आलेख</b> बटण त्या जोडते किंवा काढते.',
  '<b>Historie míst</b> – ťuknutím vybereš dříve načtené místo. Lokalitu si můžeš <b>připíchnout špendlíkem 📌</b>, aby v historii zůstala. <b>Podržením prstu</b> se tato část <b>zvětší (lupa)</b> pro pohodlnější výběr.':'<b>जतन केलेली ठिकाणे</b> – पूर्वी लोड केलेले ठिकाण निवडण्यासाठी टॅप करा. तुम्ही एखादे <b>ठिकाण पिन 📌</b> करून इतिहासात ठेवू शकता. सोप्या निवडीसाठी हा भाग <b>मोठा (भिंग)</b> करण्यासाठी <b>दाबून धरा</b>.',
  'MALÝ SRÁŽKOVÝ GRAF':'लहान पर्जन्य आलेख',
  'HLAVNÍ GRAF':'मुख्य आलेख',
  'zoom':'झूम',
  '<b>Zoom</b> – dvěma prsty graf <b>roztáhni/stáhni</b> (pinch). Roztažením si detailněji prohlédneš třeba jeden den, stažením zobrazíš výhled až na 10 dní.':'<b>झूम</b> – आलेख दोन बोटांनी <b>पिंच</b> करा. मोठे करण्यासाठी पसरवा (एक दिवस तपशीलवार पाहा), लहान करण्यासाठी आवळा (10 दिवसांपर्यंतचा अंदाज पाहा).',
  'další graf':'पुढील आलेख',
  '<b>Další graf</b> – <b>rychlým</b> vodorovným švihnutím (swipe) <b>v ploše horní poloviny grafu</b> přepneš na další/předchozí graf. Posun po časové ose uděláš <b>pomalým tažením v oblasti poblíž časové osy</b> (dole).':'<b>पुढील आलेख</b> – आलेखाच्या वरच्या अर्ध्या भागात <b>जलद</b> आडवा <b>स्वाइप</b> पुढील/मागील आलेखावर नेतो. वेळ-अक्षावर हलण्यासाठी <b>वेळ-अक्षाजवळ हळू</b> (खाली) ओढा.',
  'podrž = hodnoty':'दाबून धरा = मूल्ये',
  '<b>Hodnoty v čase</b> – <b>podrž prst</b> na grafu a posouvej; u všech křivek se ukáže hodnota pro daný čas.':'<b>वेळेतील मूल्ये</b> – आलेखावर <b>दाबून धरा</b> आणि हलवा; प्रत्येक वक्र त्या वेळेचे आपले मूल्य दाखवतो.',
  'posun času':'वेळेत हलवा',
  '<b>Posun po čase</b> – <b>pomalým</b> tažením do strany <b>v oblasti poblíž časové osy (dole)</b> posouváš graf v čase (do minulosti/budoucnosti). Rychlý švih v horní polovině grafu naopak přepne graf.':'<b>वेळेत हलवा</b> – आलेख वेळेत (भूतकाळ/भविष्य) हलवण्यासाठी <b>वेळ-अक्षाजवळ (खाली)</b> बाजूला <b>हळू</b> ओढा. वरच्या अर्ध्या भागात जलद स्वाइप त्याऐवजी आलेख बदलतो.',
  'Jednotlivé křivky zapneš/vypneš štítky nad grafem.':'आलेखावरील बटणांनी तुम्ही प्रत्येक वक्र वेगवेगळा चालू/बंद करू शकता.',
  'zapni/vypni křivku':'वक्र चालू/बंद करा',
  '<b>Křivky</b> – štítky nad grafem zapínáš nebo vypínáš jednotlivé křivky.':'<b>वक्र</b> – प्रत्येक वक्र वेगवेगळा चालू किंवा बंद करण्यासाठी आलेखावरील बटणे वापरा.',
  'Nejdřív zadej obec, GPS nebo souřadnice a stiskni GO. Pak se tu zobrazí grafy a další nápověda.':'प्रथम एखादे शहर प्रविष्ट करा, GPS किंवा निर्देशांक वापरा आणि GO दाबा. नंतर आलेख व अधिक मदत येथे दिसेल.',
  },
  'ta':{
  'zavři help mód':'உதவி பயன்முறையை மூடு',
  '<b>Malý srážkový graf</b> – pro lepší přehled je uváděn nad většinou ostatních grafů a schematicky ukazuje množství srážek.':'<b>சிறிய மழைப்பொழிவு வரைபடம்</b> – சிறந்த பார்வைக்காக இது பெரும்பாலான பிற வரைபடங்களுக்கு மேலே காட்டப்படுகிறது, மழையின் அளவை வரைபடமாக சுட்டிக்காட்டுகிறது.',
  '<b>GO</b> načte počasí pro zadanou obec nebo souřadnice. Tlačítko <b>↻</b> znovu zaktualizuje naposledy načtenou obec nebo souřadnice.':'<b>GO</b> உள்ளிட்ட இடம் அல்லது ஆயத்தொலைவுகளின் வானிலையை ஏற்றுகிறது. <b>↻</b> பொத்தான் சமீபத்தில் ஏற்றப்பட்ட இடம் அல்லது ஆயத்தொலைவுகளை மீண்டும் ஏற்றுகிறது.',
  '<b>GPS</b> zjistí tvoji polohu a načte počasí pro ni. <b>Stát / jazyk</b> vybere zemi a jazyk – podle toho se zobrazují jednotky a názvy.':'<b>GPS</b> உங்கள் இருப்பிடத்தைக் கண்டறிந்து அதன் வானிலையை ஏற்றுகிறது. <b>நாடு / மொழி</b> நாட்டையும் மொழியையும் தேர்வு செய்கிறது – அலகுகளும் பெயர்களும் அதைப் பின்பற்றும்.',
  '<b>+ GRAF</b> přidá nebo ubere další grafy (dohlednost, UV, kvalita ovzduší, pyl…). <b>AAAA</b> mění velikost písma v aplikaci.':'<b>+ வரைபடம்</b> கூடுதல் வரைபடங்களைச் சேர்க்கிறது அல்லது நீக்குகிறது (தெரிவுநிலை, UV, காற்றுத் தரம், மகரந்தம்…). <b>AAAA</b> செயலியில் உரை அளவை மாற்றுகிறது.',
  'Nápověda – ťukni na žluté <b>?</b> nebo na ikonky pro popis. Zavřeš tlačítkem vpravo dole.':'உதவி – விளக்கத்திற்கு மஞ்சள் <b>?</b> குறிகள் அல்லது சின்னங்களைத் தட்டவும். கீழ் வலதிலுள்ள பொத்தானால் மூடவும்.',
  '<b>Zadání místa</b> – do pole napiš název obce a vyber ho z <b>našeptávače</b>, nebo zadej <b>souřadnice</b> (zeměpisnou šířku a délku) do políček vpravo. Pak ťukni na <b>GO</b>.':'<b>இடத்தை உள்ளிடுதல்</b> – ஒரு நகரத்தின் பெயரைத் தட்டச்சு செய்து <b>பரிந்துரைகளில்</b> இருந்து தேர்வு செய்யவும், அல்லது வலதுபுற புலங்களில் <b>ஆயத்தொலைவுகளை</b> (அட்சரேகை, தீர்க்கரேகை) உள்ளிடவும். பிறகு <b>GO</b> தட்டவும்.',
  '<b>Dlaždice</b> – ťuknutím přepneš, který graf se zobrazí. Dají se posouvat do stran, <b>přidržením</b> změníš jejich pořadí a tlačítkem <b>+ GRAF</b> je přidáš nebo ubereš.':'<b>டைல்கள்</b> – எந்த வரைபடம் காட்டப்படுகிறது என்பதை மாற்றத் தட்டவும். அவை பக்கவாட்டில் உருளும், வரிசையை மாற்ற <b>அழுத்திப் பிடிக்கவும்</b>, மேலும் <b>+ வரைபடம்</b> பொத்தான் அவற்றைச் சேர்க்கிறது அல்லது நீக்குகிறது.',
  '<b>Historie míst</b> – ťuknutím vybereš dříve načtené místo. Lokalitu si můžeš <b>připíchnout špendlíkem 📌</b>, aby v historii zůstala. <b>Podržením prstu</b> se tato část <b>zvětší (lupa)</b> pro pohodlnější výběr.':'<b>சேமித்த இடங்கள்</b> – முன்பு ஏற்றப்பட்ட இடத்தைத் தேர்வு செய்யத் தட்டவும். ஒரு <b>இடத்தைப் பின் 📌</b> செய்து வரலாற்றில் வைத்திருக்கலாம். எளிதாகத் தேர்வு செய்ய இப்பகுதியை <b>பெரிதாக்க (உருப்பெருக்கி)</b> <b>அழுத்திப் பிடிக்கவும்</b>.',
  'MALÝ SRÁŽKOVÝ GRAF':'சிறிய மழைப்பொழிவு வரைபடம்',
  'HLAVNÍ GRAF':'முதன்மை வரைபடம்',
  'zoom':'பெரிதாக்கம்',
  '<b>Zoom</b> – dvěma prsty graf <b>roztáhni/stáhni</b> (pinch). Roztažením si detailněji prohlédneš třeba jeden den, stažením zobrazíš výhled až na 10 dní.':'<b>பெரிதாக்கம்</b> – வரைபடத்தை இரு விரல்களால் <b>கிள்ளவும்</b>. பெரிதாக்க விரிக்கவும் (ஒரு நாளை விரிவாகப் பார்க்க), சிறிதாக்க நெருக்கவும் (10 நாட்கள் வரையிலான முன்னறிவிப்பைப் பார்க்க).',
  'další graf':'அடுத்த வரைபடம்',
  '<b>Další graf</b> – <b>rychlým</b> vodorovným švihnutím (swipe) <b>v ploše horní poloviny grafu</b> přepneš na další/předchozí graf. Posun po časové ose uděláš <b>pomalým tažením v oblasti poblíž časové osy</b> (dole).':'<b>அடுத்த வரைபடம்</b> – வரைபடத்தின் மேற்பாதியில் ஒரு <b>விரைவான</b> கிடைமட்ட <b>ஸ்வைப்</b> அடுத்த/முந்தைய வரைபடத்திற்கு மாற்றுகிறது. நேர அச்சில் நகர <b>நேர அச்சுக்கு அருகில் மெதுவாக</b> (கீழே) இழுக்கவும்.',
  'podrž = hodnoty':'அழுத்திப் பிடி = மதிப்புகள்',
  '<b>Hodnoty v čase</b> – <b>podrž prst</b> na grafu a posouvej; u všech křivek se ukáže hodnota pro daný čas.':'<b>நேரத்தில் மதிப்புகள்</b> – வரைபடத்தின் மீது <b>அழுத்திப் பிடித்து</b> நகர்த்தவும்; ஒவ்வொரு வளைவும் அந்த நேரத்திற்கான மதிப்பைக் காட்டுகிறது.',

  aqi:'Grafikas rodo <b>oro kokybę</b>. Spalvota sritis yra <b>oro kokybės indeksas</b> (bendras taršos vertinimas – kuo didesnis, tuo blogiau). Linijos yra atskiros medžiagos: <b>PM2.5</b> ir <b>PM10</b> (kietosios dalelės), <b>O₃</b> (pažemio ozonas), <b>NO₂</b>, <b>SO₂</b> ir <b>CO</b>.',
  pollen:'Grafikas rodo atskirų augalų <b>žiedadulkių koncentraciją</b> (grūdeliai/m³) laike – žolės, beržas, alksnis, alyvmedis, kietis ir ambrozija. Lentelė virš grafiko rodo dabartines reikšmes, vertinimą ir žiedadulkių sezoną.',
  },
  'lv':{
  temp:'Grafiks rāda izvēlētās vietas <b>gaisa temperatūru</b>. Nepārtrauktā līnija ir temperatūra, pārtrauktā ir <b>sajustā temperatūra</b> (cik silti vai auksti to izjūt cilvēka ķermenis – ņem vērā vēju, mitrumu un saules starojumu).',
  cloud:'Grafiks rāda <b>mākoņainību</b> – cik liela daļa debesu ir apmākusies, %. Var pārslēgt zemos / vidējos / augstos mākoņus (poga var. A/B). 0 % = skaidrs, 100 % = apmācies.',
  snow:'Grafiks rāda <b>nokrišņus</b>: sniegu <b>baltā</b> un lietu <b>zilā</b>; staba kopējais augstums ir summa mm/h. Līkne papildus rāda <b>augsnes mitrumu</b> (ūdens īpatsvars virskārtā 0–1 cm, tilpuma %).',
  wind:'Grafiks rāda <b>vēja ātrumu</b> (nepārtraukta līnija) un <b>brāzmas</b> (otra līkne – īsi maksimumi). Virziens/bultas rāda, no kurienes pūš vējš.',
  hum:'Grafiks rāda gaisa <b>relatīvo mitrumu</b> (%) un <b>rasas punktu</b> (temperatūra, pie kuras gaiss sasniegtu 100% mitrumu un sāktos kondensācija – jo tuvāk gaisa temperatūrai, jo mitrāks).',
  pressure:'Grafiks rāda <b>atmosfēras spiedienu</b>, pārrēķinātu uz jūras līmeni (hPa). Krītošs spiediens bieži vēsta laika pasliktināšanos, augošs – uzlabošanos.',
  vis:'Grafiks rāda <b>redzamību</b> – cik tālu var saskatīt (km). Zema redzamība nozīmē miglu, stipru lietu vai sniegu.',
  wetbulb:'Grafiks rāda <b>mitrā termometra temperatūru</b> (zemākā temperatūra, ko var sasniegt, ūdenim iztvaikojot; rāda patieso siltuma slodzi mitrumā – pie augstām vērtībām svīšana vairs neatvēsina ķermeni).',
  solar:'Grafiks rāda <b>saules starojumu</b> – uz horizontālu virsmu krītošo saules jaudu (W/m²). Rozā līkne ir <b>UV indekss</b> (ultravioletā starojuma intensitāte; jo augstāks, jo ātrāk draud apdegums).',
  aqi:'Grafiks rāda <b>gaisa kvalitāti</b>. Krāsainais laukums ir <b>gaisa kvalitātes indekss</b> (kopējais piesārņojuma novērtējums – jo augstāks, jo sliktāk). Līnijas ir atsevišķas vielas: <b>PM2.5</b> un <b>PM10</b> (daļiņas), <b>O₃</b> (piezemes ozons), <b>NO₂</b>, <b>SO₂</b> un <b>CO</b>.',
  pollen:'Grafiks rāda atsevišķu augu <b>putekšņu koncentrāciju</b> (graudi/m³) laikā – zāles, bērzs, alksnis, olīvkoks, vērmele un ambrozija. Tabula virs grafika rāda pašreizējās vērtības, novērtējumu un putekšņu sezonu.',
  },
  'et':{
  temp:'Graafik näitab valitud koha <b>õhutemperatuuri</b>. Pidev joon on temperatuur, katkendlik on <b>tuntav temperatuur</b> (kui soojaks või külmaks inimkeha seda tajub – arvestab tuule, niiskuse ja päikesekiirgusega).',
  cloud:'Graafik näitab <b>pilvisust</b> – kui suur osa taevast on kaetud, %. Saad vahetada madalate / keskmiste / kõrgete pilvede vahel (nupp var. A/B). 0 % = selge, 100 % = pilves.',
  snow:'Graafik näitab <b>sademeid</b>: lumi <b>valgena</b> ja vihm <b>sinisena</b>; samba kogukõrgus on summa mm/h. Kõver näitab lisaks <b>mullaniiskust</b> (vee osakaal pinnakihis 0–1 cm, mahu-%).',
  wind:'Graafik näitab <b>tuule kiirust</b> (pidev joon) ja <b>iile</b> (teine kõver – lühikesed tipud). Suund/nooled näitavad, kust tuul puhub.',
  hum:'Graafik näitab õhu <b>suhtelist niiskust</b> (%) ja <b>kastepunkti</b> (temperatuur, mille juures õhk saavutaks 100% niiskuse ja algaks kondenseerumine – mida lähemal õhutemperatuurile, seda niiskem).',
  pressure:'Graafik näitab merepinnale taandatud <b>õhurõhku</b> (hPa). Langev rõhk ennustab sageli ilma halvenemist, tõusev paranemist.',
  vis:'Graafik näitab <b>nähtavust</b> – kui kaugele on näha (km). Madal nähtavus tähendab udu, tugevat vihma või lund.',
  wetbulb:'Graafik näitab <b>märja termomeetri temperatuuri</b> (madalaim temperatuur, mis on saavutatav vee aurustumisel; näitab tegelikku soojuskoormust niiskuses – kõrgete väärtuste korral higistamine enam keha ei jahuta).',
  solar:'Graafik näitab <b>päikesekiirgust</b> – horisontaalpinnale langevat päikesevõimsust (W/m²). Roosa kõver on <b>UV-indeks</b> (ultraviolettkiirguse tugevus; mida kõrgem, seda kiiremini ähvardab põletus).',
  aqi:'Graafik näitab <b>õhukvaliteeti</b>. Värviline ala on <b>õhukvaliteedi indeks</b> (saaste koondhinnang – mida kõrgem, seda halvem). Jooned on üksikud ained: <b>PM2.5</b> ja <b>PM10</b> (peenosakesed), <b>O₃</b> (maapinnalähedane osoon), <b>NO₂</b>, <b>SO₂</b> ja <b>CO</b>.',
  pollen:'Graafik näitab üksikute taimede <b>õietolmu kontsentratsiooni</b> (tera/m³) ajas – kõrrelised, kask, lepp, oliivipuu, puju ja ambroosia. Graafiku kohal olev tabel näitab praeguseid väärtusi, hinnangut ja õietolmuhooaega.',
  },
  'fi':{
  temp:'Kuvaaja näyttää valitun paikan <b>ilman lämpötilan</b>. Yhtenäinen viiva on lämpötila, katkoviiva on <b>tuntuu kuin -lämpötila</b> (kuinka lämpimältä tai kylmältä ihmiskeho sen tuntee – ottaa huomioon tuulen, kosteuden ja auringonsäteilyn).',
  cloud:'Kuvaaja näyttää <b>pilvisyyden</b> – kuinka suuri osa taivaasta on peitossa, %. Voit vaihtaa matalien / keskikorkeiden / korkeiden pilvien välillä (painike var. A/B). 0 % = selkeää, 100 % = pilvistä.',
  snow:'Kuvaaja näyttää <b>sateen</b>: lumi <b>valkoisella</b> ja vesisade <b>sinisellä</b>; palkin kokonaiskorkeus on summa mm/h. Käyrä näyttää lisäksi <b>maaperän kosteuden</b> (veden osuus pintakerroksessa 0–1 cm, tilavuus-%).',
  wind:'Kuvaaja näyttää <b>tuulen nopeuden</b> (yhtenäinen viiva) ja <b>puuskat</b> (toinen käyrä – lyhyet huiput). Suunta/nuolet näyttävät, mistä tuuli puhaltaa.',
  hum:'Kuvaaja näyttää ilman <b>suhteellisen kosteuden</b> (%) ja <b>kastepisteen</b> (lämpötila, jossa ilma saavuttaisi 100 % kosteuden ja tiivistyminen alkaa – mitä lähempänä ilman lämpötilaa, sitä kosteampaa).',
  pressure:'Kuvaaja näyttää <b>ilmanpaineen</b> merenpinnan tasolle muunnettuna (hPa). Laskeva paine ennakoi usein sään huononemista, nouseva paranemista.',
  vis:'Kuvaaja näyttää <b>näkyvyyden</b> – kuinka kauas näkee (km). Heikko näkyvyys tarkoittaa sumua, rankkasadetta tai lumisadetta.',
  wetbulb:'Kuvaaja näyttää <b>märkälämpötilan</b> (alin lämpötila, joka saavutetaan veden haihtumalla; kuvaa todellista lämpökuormaa kosteassa – korkeilla arvoilla hikoilu ei enää viilennä kehoa).',
  solar:'Kuvaaja näyttää <b>auringon säteilyn</b> – vaakatasolle saapuvan aurinkotehon (W/m²). Vaaleanpunainen käyrä on <b>UV-indeksi</b> (ultraviolettisäteilyn voimakkuus; mitä korkeampi, sitä nopeammin uhkaa palaminen).',
  aqi:'Kuvaaja näyttää <b>ilmanlaadun</b>. Värillinen alue on <b>ilmanlaatuindeksi</b> (saasteiden kokonaisarvio – mitä korkeampi, sitä huonompi). Viivat ovat yksittäisiä aineita: <b>PM2.5</b> ja <b>PM10</b> (hiukkaset), <b>O₃</b> (alailmakehän otsoni), <b>NO₂</b>, <b>SO₂</b> ja <b>CO</b>.',
  pollen:'Kuvaaja näyttää yksittäisten kasvien <b>siitepölypitoisuuden</b> (jyvää/m³) ajan kuluessa – heinät, koivu, leppä, oliivi, pujo ja ambrosia. Kuvaajan yläpuolella oleva taulukko näyttää nykyiset arvot, arvion ja siitepölykauden.',
  },
  'da':{
  temp:'Grafen viser <b>lufttemperaturen</b> for det valgte sted. Den fuldt optrukne linje er temperaturen, den stiplede er <b>følt temperatur</b> (hvor varmt eller koldt menneskekroppen oplever det – tager højde for vind, fugtighed og solstråling).',
  cloud:'Grafen viser <b>skydække</b> – hvor stor en del af himlen der er dækket, i %. Du kan skifte mellem lave / mellemhøje / høje skyer (knap var. A/B). 0 % = klart, 100 % = overskyet.',
  snow:'Grafen viser <b>nedbør</b>: sne i <b>hvid</b> og regn i <b>blå</b>; søjlens samlede højde er summen i mm/t. Kurven viser desuden <b>jordfugtigheden</b> (andel vand i det øverste lag 0–1 cm, i volumen-%).',
  wind:'Grafen viser <b>vindhastigheden</b> (fuldt optrukken linje) og <b>vindstød</b> (anden kurve – korte spidser). Retning/pile viser, hvor vinden kommer fra.',
  hum:'Grafen viser <b>relativ luftfugtighed</b> i % og <b>dugpunktet</b> (den temperatur, hvor luften ville nå 100 % fugtighed og kondens begynder – jo tættere på lufttemperaturen, desto mere fugtigt).',
  pressure:'Grafen viser <b>lufttrykket</b> reduceret til havniveau (hPa). Faldende tryk varsler ofte dårligere vejr, stigende bedre.',
  vis:'Grafen viser <b>sigtbarheden</b> – hvor langt man kan se (km). Lav sigtbarhed betyder tåge, kraftig regn eller sne.',
  wetbulb:'Grafen viser <b>vådtemperaturen</b> (den laveste temperatur, der kan nås ved fordampning af vand; viser den reelle varmebelastning ved fugt – ved høje værdier køler sved ikke længere kroppen).',
  solar:'Grafen viser <b>solstråling</b> – den indfaldende soleffekt på en vandret flade (W/m²). Den lyserøde kurve er <b>UV-indekset</b> (styrken af den ultraviolette stråling; jo højere, desto hurtigere risiko for solskoldning).',
  aqi:'Grafen viser <b>luftkvaliteten</b>. Det farvede område er <b>luftkvalitetsindekset</b> (samlet vurdering af forureningen – jo højere, desto værre). Linjerne er enkelte stoffer: <b>PM2.5</b> og <b>PM10</b> (partikler), <b>O₃</b> (jordnær ozon), <b>NO₂</b>, <b>SO₂</b> og <b>CO</b>.',
  pollen:'Grafen viser <b>pollenkoncentrationen</b> for enkelte planter (korn/m³) over tid – græs, birk, el, oliven, bynke og ambrosie. Tabellen over grafen viser aktuelle værdier, vurdering og pollensæson.',
  },
  'no':{
  temp:'Grafen viser <b>lufttemperaturen</b> for det valgte stedet. Den heltrukne linjen er temperaturen, den stiplede er <b>følt temperatur</b> (hvor varmt eller kaldt menneskekroppen opplever det – tar hensyn til vind, fuktighet og solstråling).',
  cloud:'Grafen viser <b>skydekke</b> – hvor mye av himmelen som er dekket, i %. Du kan veksle mellom lave / mellomhøye / høye skyer (knapp var. A/B). 0 % = klart, 100 % = overskyet.',
  snow:'Grafen viser <b>nedbør</b>: snø i <b>hvitt</b> og regn i <b>blått</b>; søylens totale høyde er summen i mm/t. Kurven viser i tillegg <b>jordfuktighet</b> (andel vann i det øverste laget 0–1 cm, i volum-%).',
  wind:'Grafen viser <b>vindhastigheten</b> (heltrukken linje) og <b>kast</b> (andre kurve – korte topper). Retning/piler viser hvor vinden kommer fra.',
  hum:'Grafen viser <b>relativ luftfuktighet</b> i % og <b>duggpunktet</b> (temperaturen der lufta ville nå 100 % fuktighet og kondens begynner – jo nærmere lufttemperaturen, desto fuktigere).',
  pressure:'Grafen viser <b>lufttrykket</b> redusert til havnivå (hPa). Fallende trykk varsler ofte dårligere vær, stigende bedre.',
  vis:'Grafen viser <b>sikten</b> – hvor langt man kan se (km). Lav sikt betyr tåke, kraftig regn eller snø.',
  wetbulb:'Grafen viser <b>våtkuletemperaturen</b> (den laveste temperaturen som kan nås ved fordamping av vann; viser den faktiske varmebelastningen ved fuktighet – ved høye verdier kjøler ikke svette kroppen lenger).',
  solar:'Grafen viser <b>solstråling</b> – den innkommende soleffekten på en vannrett flate (W/m²). Den rosa kurven er <b>UV-indeksen</b> (styrken på den ultrafiolette strålingen; jo høyere, desto raskere fare for solbrenthet).',
  aqi:'Grafen viser <b>luftkvaliteten</b>. Det fargede området er <b>luftkvalitetsindeksen</b> (samlet vurdering av forurensningen – jo høyere, desto verre). Linjene er enkeltstoffer: <b>PM2.5</b> og <b>PM10</b> (partikler), <b>O₃</b> (bakkenært ozon), <b>NO₂</b>, <b>SO₂</b> og <b>CO</b>.',
  pollen:'Grafen viser <b>pollenkonsentrasjonen</b> for enkeltplanter (korn/m³) over tid – gress, bjørk, or, oliven, burot og ambrosia. Tabellen over grafen viser aktuelle verdier, vurdering og pollensesong.',
  },
  'sv':{
  temp:'Grafen visar <b>lufttemperaturen</b> för den valda platsen. Den heldragna linjen är temperaturen, den streckade är <b>upplevd temperatur</b> (hur varmt eller kallt människokroppen känner det – tar hänsyn till vind, fuktighet och solstrålning).',
  cloud:'Grafen visar <b>molnighet</b> – hur stor del av himlen som är täckt, i %. Du kan växla mellan låga / medelhöga / höga moln (knapp var. A/B). 0 % = klart, 100 % = mulet.',
  snow:'Grafen visar <b>nederbörd</b>: snö i <b>vitt</b> och regn i <b>blått</b>; stapelns totala höjd är summan i mm/h. Kurvan visar dessutom <b>markfuktigheten</b> (andel vatten i det översta lagret 0–1 cm, i volym-%).',
  wind:'Grafen visar <b>vindhastigheten</b> (heldragen linje) och <b>byar</b> (andra kurvan – korta toppar). Riktning/pilar visar varifrån vinden blåser.',
  hum:'Grafen visar <b>relativ luftfuktighet</b> i % och <b>daggpunkten</b> (den temperatur då luften skulle nå 100 % fuktighet och kondens börjar – ju närmare lufttemperaturen, desto fuktigare).',
  pressure:'Grafen visar <b>lufttrycket</b> reducerat till havsnivå (hPa). Fallande tryck förebådar ofta sämre väder, stigande bättre.',
  vis:'Grafen visar <b>sikten</b> – hur långt man kan se (km). Låg sikt betyder dimma, kraftigt regn eller snöfall.',
  wetbulb:'Grafen visar <b>våttemperaturen</b> (den lägsta temperatur som kan nås genom avdunstning av vatten; visar den verkliga värmebelastningen vid fukt – vid höga värden svalkar svettning inte längre kroppen).',
  solar:'Grafen visar <b>solstrålning</b> – den infallande soleffekten på en vågrät yta (W/m²). Den rosa kurvan är <b>UV-index</b> (den ultravioletta strålningens styrka; ju högre, desto snabbare risk för bränna).',
  aqi:'Grafen visar <b>luftkvaliteten</b>. Det färgade området är <b>luftkvalitetsindex</b> (samlad bedömning av föroreningarna – ju högre, desto sämre). Linjerna är enskilda ämnen: <b>PM2.5</b> och <b>PM10</b> (partiklar), <b>O₃</b> (marknära ozon), <b>NO₂</b>, <b>SO₂</b> och <b>CO</b>.',
  pollen:'Grafen visar <b>pollenhalten</b> för enskilda växter (korn/m³) över tid – gräs, björk, al, oliv, gråbo och ambrosia. Tabellen ovanför grafen visar aktuella värden, bedömning och pollensäsong.',
  },
  'sq':{
  temp:'Grafiku tregon <b>temperaturën e ajrit</b> për vendndodhjen e zgjedhur. Vija e plotë është temperatura, ajo me vija është <b>temperatura e ndjerë</b> (sa nxehtë ose ftohtë e ndien trupi i njeriut – merr parasysh erën, lagështinë dhe rrezatimin diellor).',
  cloud:'Grafiku tregon <b>vranësirën</b> – sa pjesë e qiellit është e mbuluar, në %. Mund të ndërrosh re të ulëta / të mesme / të larta (butoni var. A/B). 0 % = kthjellët, 100 % = vranët plotësisht.',
  snow:'Grafiku tregon <b>reshjet</b>: bora me <b>të bardhë</b> dhe shiu me <b>blu</b>; lartësia e plotë e shtyllës është shuma në mm/h. Kurba tregon gjithashtu <b>lagështinë e tokës</b> (përpjesëtimi i ujit në shtresën sipërfaqësore 0–1 cm, në % të vëllimit).',
  wind:'Grafiku tregon <b>shpejtësinë e erës</b> (vija e plotë) dhe <b>shpërthimet</b> (kurba e dytë – maja të shkurtra). Drejtimi/shigjetat tregojnë nga fryn era.',
  hum:'Grafiku tregon <b>lagështinë relative</b> të ajrit në % dhe <b>pikën e vesës</b> (temperatura në të cilën ajri do të arrinte 100% lagështi dhe do të fillonte kondensimi – sa më afër temperaturës së ajrit, aq më e lagësht).',
  pressure:'Grafiku tregon <b>presionin atmosferik</b> të reduktuar në nivelin e detit (hPa). Presioni në rënie shpesh paralajmëron përkeqësim të motit, ndërsa në rritje përmirësim.',
  vis:'Grafiku tregon <b>dukshmërinë</b> – sa larg shihet (km). Dukshmëria e ulët do të thotë mjegull, shi i dendur ose borë.',
  wetbulb:'Grafiku tregon <b>temperaturën e termometrit të lagësht</b> (temperatura më e ulët e arritshme me avullimin e ujit; tregon ngarkesën e vërtetë termike në lagështi – me vlera të larta djersitja nuk e ftoh më trupin).',
  solar:'Grafiku tregon <b>rrezatimin diellor</b> – fuqinë diellore që bie mbi një sipërfaqe horizontale (W/m²). Kurba rozë është <b>indeksi UV</b> (intensiteti i rrezatimit ultravjollcë; sa më i lartë, aq më shpejt rrezikon djegie).',
  aqi:'Grafiku tregon <b>cilësinë e ajrit</b>. Zona me ngjyrë është <b>indeksi i cilësisë së ajrit</b> (vlerësim i përgjithshëm i ndotjes – sa më i lartë, aq më keq). Vijat janë substancat e veçanta: <b>PM2.5</b> dhe <b>PM10</b> (grimca pluhuri), <b>O₃</b> (ozoni pranë tokës), <b>NO₂</b>, <b>SO₂</b> dhe <b>CO</b>.',
  pollen:'Grafiku tregon <b>përqendrimin e polenit</b> të bimëve të veçanta (kokrra/m³) me kalimin e kohës – barishte, mështekna, verri, ulliri, pelini dhe ambrozia. Tabela mbi grafik tregon vlerat aktuale, vlerësimin dhe sezonin e polenit.',
  },
  'mk':{
  temp:'Графиката ја прикажува <b>температурата на воздухот</b> за избраната локација. Полната линија е температурата, испрекинатата е <b>почувствуваната температура</b> (колку топло или студено чувствува човечкото тело – ги зема предвид ветерот, влажноста и сончевото зрачење).',
  cloud:'Графиката ја прикажува <b>облачноста</b> – колку од небото е покриено, во %. Може да префрлаш ниски / средни / високи облаци (копче вар. A/B). 0 % = ведро, 100 % = целосно облачно.',

  wetbulb:'A diagram a <b>nedves hőmérőjű hőmérsékletet</b> mutatja (a víz párolgásával elérhető legalacsonyabb hőmérséklet; a párás körülmények valódi hőterhelését jelzi – magas értékeknél az izzadás már nem hűti a testet).',
  solar:'A diagram a <b>napsugárzást</b> mutatja – a vízszintes felületre érkező napteljesítményt (W/m²). A rózsaszín görbe az <b>UV-index</b> (az ultraibolya sugárzás erőssége; minél magasabb, annál gyorsabb a leégés veszélye).',
  aqi:'A diagram a <b>levegőminőséget</b> mutatja. A színes terület a <b>levegőminőségi index</b> (a szennyezettség összesített értékelése – minél magasabb, annál rosszabb). A vonalak az egyes anyagok: <b>PM2.5</b> és <b>PM10</b> (szálló por), <b>O₃</b> (talajközeli ózon), <b>NO₂</b>, <b>SO₂</b> és <b>CO</b>.',
  pollen:'A diagram az egyes növények <b>pollenkoncentrációját</b> mutatja (szem/m³) az időben – fűfélék, nyír, éger, olajfa, üröm és parlagfű. A diagram fölötti táblázat az aktuális értékeket, az értékelést és a pollenszezont mutatja.',
  },
  'sk':{
  temp:'Graf zobrazuje <b>teplotu vzduchu</b> pre vybranú lokalitu. Plná čiara je teplota, čiarkovaná je <b>pocitová teplota</b> (ako teplo alebo zimu vníma ľudské telo – zohľadňuje vietor, vlhkosť a slnečné žiarenie).',
  cloud:'Graf zobrazuje <b>oblačnosť</b> – pokrytie oblohy mrakmi v %. Dá sa prepínať oblačnosť nízka / stredná / vysoká (tlačidlo var. A/B). 0 % = jasno, 100 % = zamračené.',
  snow:'Graf zobrazuje <b>zrážky</b>: snehové <b>bielo</b> a dažďové <b>modro</b>; celková výška stĺpca je úhrn zrážok v mm/h. Krivka navyše ukazuje <b>pôdnu vlhkosť</b> (podiel vody v povrchovej vrstve 0–1 cm, v % objemu).',
  wind:'Graf zobrazuje <b>rýchlosť vetra</b> (plná čiara) a <b>nárazy/poryvy</b> (druhá krivka – krátke najvyššie rýchlosti). Smer/šípky ukazujú, odkiaľ vietor fúka.',
  hum:'Graf zobrazuje <b>relatívnu vlhkosť</b> vzduchu v % a <b>rosný bod</b> (teplota, pri ktorej by vzduch dosiahol 100% vlhkosť a začala kondenzácia – čím bližšie k teplote vzduchu, tým vlhkejšie).',
  pressure:'Graf zobrazuje <b>atmosférický tlak</b> prepočítaný na hladinu mora (hPa). Klesajúci tlak často predznamenáva zhoršenie počasia, rastúci zlepšenie.',
  vis:'Graf zobrazuje <b>dohľadnosť</b> – ako ďaleko je vidieť (km). Nízka dohľadnosť znamená hmlu, hustý dážď alebo sneženie.',
  wetbulb:'Graf zobrazuje <b>teplotu vlhkého teplomera</b> (najnižšia teplota dosiahnuteľná odparovaním vody; udáva skutočnú tepelnú záťaž pri vlhku – pri vysokých hodnotách už potenie telo neochladí).',
  solar:'Graf zobrazuje <b>slnečnú radiáciu</b> – príkon slnečného žiarenia na vodorovnú plochu (W/m²). Ružová krivka je <b>UV index</b> (intenzita ultrafialového žiarenia; čím vyšší, tým rýchlejšie hrozí spálenie).',
  aqi:'Graf zobrazuje <b>kvalitu ovzdušia</b>. Farebná plocha je <b>index kvality ovzdušia</b> (súhrnné hodnotenie znečistenia – čím vyšší, tým horšie). Čiary sú jednotlivé látky: <b>PM2.5</b> a <b>PM10</b> (prachové častice), <b>O₃</b> (prízemný ozón), <b>NO₂</b>, <b>SO₂</b> a <b>CO</b>.',
  pollen:'Graf zobrazuje <b>koncentráciu peľu</b> jednotlivých rastlín (zrná/m³) v čase – trávy, breza, jelša, oliva, palina a ambrózia. Tabuľka nad grafom ukazuje aktuálne hodnoty, hodnotenie a peľovú sezónu.',
  },
  'pl':{
  temp:'Wykres pokazuje <b>temperaturę powietrza</b> dla wybranej lokalizacji. Linia ciągła to temperatura, przerywana to <b>temperatura odczuwalna</b> (jak ciepło lub zimno odczuwa ludzkie ciało – uwzględnia wiatr, wilgotność i promieniowanie słoneczne).',
  cloud:'Wykres pokazuje <b>zachmurzenie</b> – pokrycie nieba chmurami w %. Można przełączać chmury niskie / średnie / wysokie (przycisk war. A/B). 0 % = bezchmurnie, 100 % = całkowite zachmurzenie.',
  snow:'Wykres pokazuje <b>opady</b>: śnieg na <b>biało</b>, deszcz na <b>niebiesko</b>; całkowita wysokość słupka to suma opadów w mm/h. Krzywa pokazuje dodatkowo <b>wilgotność gleby</b> (udział wody w warstwie powierzchniowej 0–1 cm, w % objętości).',
  wind:'Wykres pokazuje <b>prędkość wiatru</b> (linia ciągła) i <b>porywy</b> (druga krzywa – krótkie maksima). Kierunek/strzałki pokazują, skąd wieje wiatr.',
  hum:'Wykres pokazuje <b>wilgotność względną</b> powietrza w % i <b>punkt rosy</b> (temperatura, przy której powietrze osiągnęłoby 100% wilgotności i zaczęłaby się kondensacja – im bliżej temperatury powietrza, tym wilgotniej).',
  pressure:'Wykres pokazuje <b>ciśnienie atmosferyczne</b> sprowadzone do poziomu morza (hPa). Spadek ciśnienia często zapowiada pogorszenie pogody, wzrost – poprawę.',
  vis:'Wykres pokazuje <b>widzialność</b> – jak daleko widać (km). Niska widzialność oznacza mgłę, gęsty deszcz lub śnieg.',
  wetbulb:'Wykres pokazuje <b>temperaturę termometru mokrego</b> (najniższa temperatura osiągalna przez parowanie wody; pokazuje rzeczywiste obciążenie cieplne przy wilgoci – przy wysokich wartościach pocenie już nie chłodzi ciała).',
  solar:'Wykres pokazuje <b>promieniowanie słoneczne</b> – moc promieniowania słonecznego padającego na powierzchnię poziomą (W/m²). Różowa krzywa to <b>indeks UV</b> (intensywność promieniowania ultrafioletowego; im wyższy, tym szybciej grozi oparzenie).',
  aqi:'Wykres pokazuje <b>jakość powietrza</b>. Kolorowy obszar to <b>indeks jakości powietrza</b> (łączna ocena zanieczyszczenia – im wyższy, tym gorzej). Linie to poszczególne substancje: <b>PM2.5</b> i <b>PM10</b> (pyły), <b>O₃</b> (ozon przy powierzchni), <b>NO₂</b>, <b>SO₂</b> i <b>CO</b>.',
  pollen:'Wykres pokazuje <b>stężenie pyłków</b> poszczególnych roślin (ziarna/m³) w czasie – trawy, brzoza, olcha, oliwka, bylica i ambrozja. Tabela nad wykresem pokazuje aktualne wartości, ocenę i sezon pyłkowy.',
  },
  'nl':{
  temp:'De grafiek toont de <b>luchttemperatuur</b> voor de gekozen locatie. De doorgetrokken lijn is de temperatuur, de stippellijn is de <b>gevoelstemperatuur</b> (hoe warm of koud het menselijk lichaam het ervaart – houdt rekening met wind, vochtigheid en zonnestraling).',
  cloud:'De grafiek toont de <b>bewolking</b> – hoeveel van de hemel bedekt is, in %. Je kunt wisselen tussen lage / middelhoge / hoge bewolking (knop var. A/B). 0 % = onbewolkt, 100 % = volledig bewolkt.',
  snow:'De grafiek toont de <b>neerslag</b>: sneeuw in <b>wit</b> en regen in <b>blauw</b>; de totale staafhoogte is de som in mm/u. De curve toont ook de <b>bodemvochtigheid</b> (aandeel water in de toplaag 0–1 cm, in volume-%).',
  wind:'De grafiek toont de <b>windsnelheid</b> (doorgetrokken lijn) en <b>windstoten</b> (tweede curve – korte pieken). Richting/pijlen tonen waar de wind vandaan komt.',
  hum:'De grafiek toont de <b>relatieve luchtvochtigheid</b> in % en het <b>dauwpunt</b> (de temperatuur waarbij de lucht 100% vochtigheid bereikt en condensatie begint – hoe dichter bij de luchttemperatuur, hoe vochtiger).',
  pressure:'De grafiek toont de <b>luchtdruk</b> herleid tot zeeniveau (hPa). Dalende druk kondigt vaak slechter weer aan, stijgende beter weer.',
  vis:'De grafiek toont het <b>zicht</b> – hoe ver je kunt zien (km). Slecht zicht betekent mist, zware regen of sneeuw.',
  wetbulb:'De grafiek toont de <b>natteboltemperatuur</b> (de laagste temperatuur die door verdamping van water haalbaar is; geeft de werkelijke warmtebelasting bij vocht aan – bij hoge waarden koelt zweten het lichaam niet meer af).',
  solar:'De grafiek toont de <b>zonnestraling</b> – het invallende zonvermogen op een horizontaal vlak (W/m²). De roze curve is de <b>UV-index</b> (intensiteit van uv-straling; hoe hoger, hoe sneller verbrandingsgevaar).',
  aqi:'De grafiek toont de <b>luchtkwaliteit</b>. Het gekleurde vlak is de <b>luchtkwaliteitsindex</b> (totale beoordeling van vervuiling – hoe hoger, hoe slechter). De lijnen zijn afzonderlijke stoffen: <b>PM2.5</b> en <b>PM10</b> (fijnstof), <b>O₃</b> (ozon op grondniveau), <b>NO₂</b>, <b>SO₂</b> en <b>CO</b>.',
  pollen:'De grafiek toont de <b>pollenconcentratie</b> van afzonderlijke planten (korrels/m³) in de tijd – grassen, berk, els, olijf, alsem en ambrosia. De tabel boven de grafiek toont de actuele waarden, beoordeling en het pollenseizoen.',
  },
  'pt':{
  temp:'O gráfico mostra a <b>temperatura do ar</b> para o local selecionado. A linha sólida é a temperatura, a tracejada é a <b>temperatura aparente</b> (como o corpo humano sente o calor ou o frio – tem em conta o vento, a humidade e a radiação solar).',
  cloud:'O gráfico mostra a <b>nebulosidade</b> – quanto do céu está coberto, em %. Podes alternar nuvens baixas / médias / altas (botão var. A/B). 0 % = céu limpo, 100 % = encoberto.',
  snow:'O gráfico mostra a <b>precipitação</b>: neve a <b>branco</b> e chuva a <b>azul</b>; a altura total da barra é o total em mm/h. A curva mostra ainda a <b>humidade do solo</b> (proporção de água na camada superficial 0–1 cm, em % de volume).',
  wind:'O gráfico mostra a <b>velocidade do vento</b> (linha sólida) e as <b>rajadas</b> (segunda curva – picos curtos). A direção/setas mostram de onde sopra o vento.',
  hum:'O gráfico mostra a <b>humidade relativa</b> do ar em % e o <b>ponto de orvalho</b> (a temperatura à qual o ar atingiria 100% de humidade e começaria a condensação – quanto mais perto da temperatura do ar, mais húmido).',
  pressure:'O gráfico mostra a <b>pressão atmosférica</b> reduzida ao nível do mar (hPa). Pressão a descer costuma anunciar piora do tempo, a subir melhoria.',
  vis:'O gráfico mostra a <b>visibilidade</b> – até onde se consegue ver (km). Visibilidade baixa significa nevoeiro, chuva forte ou neve.',
  wetbulb:'O gráfico mostra a <b>temperatura de bolbo húmido</b> (a temperatura mais baixa atingível por evaporação da água; indica a carga térmica real com humidade – com valores altos, transpirar já não arrefece o corpo).',
  solar:'O gráfico mostra a <b>radiação solar</b> – a potência solar incidente numa superfície horizontal (W/m²). A curva rosa é o <b>índice UV</b> (intensidade da radiação ultravioleta; quanto maior, mais rápido o risco de queimadura).',
  aqi:'O gráfico mostra a <b>qualidade do ar</b>. A área colorida é o <b>índice de qualidade do ar</b> (avaliação global da poluição – quanto maior, pior). As linhas são as substâncias: <b>PM2.5</b> e <b>PM10</b> (partículas), <b>O₃</b> (ozono ao nível do solo), <b>NO₂</b>, <b>SO₂</b> e <b>CO</b>.',
  pollen:'O gráfico mostra a <b>concentração de pólen</b> de cada planta (grãos/m³) ao longo do tempo – gramíneas, bétula, amieiro, oliveira, artemísia e ambrósia. A tabela acima mostra os valores atuais, a avaliação e a época de pólen.',
  },
  'sq':{
  temp:'Grafiku tregon <b>temperaturën e ajrit</b> për vendndodhjen e zgjedhur. Vija e plotë është temperatura, e ndërprera është <b>temperatura e ndier</b> (sa nxehtë ose ftohtë e ndien trupi i njeriut – merr parasysh erën, lagështinë dhe rrezatimin diellor).',
  cloud:'Grafiku tregon <b>vranësirën</b> – sa pjesë e qiellit është e mbuluar, në %. Mund të ndërrosh re të ulëta / të mesme / të larta (butoni var. A/B). 0 % = kthjellët, 100 % = i vranët.',
  snow:'Grafiku tregon <b>reshjet</b>: bora <b>bardhë</b>, shiu <b>kaltër</b>; lartësia e plotë e shtyllës është shuma në mm/h. Kurba tregon gjithashtu <b>lagështinë e tokës</b> (pjesa e ujit në shtresën sipërfaqësore 0–1 cm, në % të vëllimit).',
  wind:'Grafiku tregon <b>shpejtësinë e erës</b> (vija e plotë) dhe <b>shfryrjet</b> (kurba e dytë – maja të shkurtra). Drejtimi/shigjetat tregojnë nga fryn era.',
  hum:'Grafiku tregon <b>lagështinë relative</b> të ajrit në % dhe <b>pikën e vesës</b> (temperatura në të cilën ajri do të arrinte 100% lagështi dhe do të niste kondensimi – sa më afër temperaturës së ajrit, aq më e lagësht).',
  pressure:'Grafiku tregon <b>presionin atmosferik</b> të kthyer në nivelin e detit (hPa). Presioni në rënie shpesh paralajmëron përkeqësim të motit, në rritje përmirësim.',
  vis:'Grafiku tregon <b>dukshmërinë</b> – sa larg shihet (km). Dukshmëria e ulët do të thotë mjegull, shi i dendur ose dëborë.',
  wetbulb:'Grafiku tregon <b>temperaturën e termometrit të lagësht</b> (temperatura më e ulët e arritshme nga avullimi i ujit; tregon ngarkesën reale termike në lagështi – te vlerat e larta djersitja nuk e ftoh më trupin).',
  solar:'Grafiku tregon <b>rrezatimin diellor</b> – fuqinë diellore mbi një sipërfaqe horizontale (W/m²). Kurba rozë është <b>indeksi UV</b> (intensiteti i rrezatimit ultravjollcë; sa më i lartë, aq më shpejt rrezikon djegia).',
  aqi:'Grafiku tregon <b>cilësinë e ajrit</b>. Zona me ngjyrë është <b>indeksi i cilësisë së ajrit</b> (vlerësim i përgjithshëm i ndotjes – sa më i lartë, aq më keq). Vijat janë lëndët e veçanta: <b>PM2.5</b> dhe <b>PM10</b> (grimca), <b>O₃</b> (ozoni pranë tokës), <b>NO₂</b>, <b>SO₂</b> dhe <b>CO</b>.',
  pollen:'Grafiku tregon <b>përqendrimin e polenit</b> të bimëve të veçanta (kokrra/m³) me kalimin e kohës – barishtet, mështekna, vërrija, ulliri, pelini dhe ambrozia. Tabela mbi grafik tregon vlerat aktuale, vlerësimin dhe sezonin e polenit.',
  },
  'mk':{
  temp:'Графиконот ја прикажува <b>температурата на воздухот</b> за избраната локација. Полната линија е температурата, испрекинатата е <b>чувството за температура</b> (колку топло или студено чувствува човечкото тело – ги зема предвид ветерот, влагата и сончевото зрачење).',
  cloud:'Графиконот ја прикажува <b>облачноста</b> – колку од небото е покриено, во %. Можеш да префрлаш ниски / средни / високи облаци (копче вар. A/B). 0 % = ведро, 100 % = целосно облачно.',
  snow:'Графиконот ги прикажува <b>врнежите</b>: снег <b>бело</b>, дожд <b>сино</b>; вкупната висина на столбот е збирот во mm/h. Кривата дополнително ја прикажува <b>влажноста на почвата</b> (удел на вода во површинскиот слој 0–1 cm, во % од волуменот).',
  wind:'Графиконот ја прикажува <b>брзината на ветерот</b> (полна линија) и <b>налетите</b> (втора крива – кратки врвови). Насоката/стрелките покажуваат од каде дува ветерот.',
  hum:'Графиконот ја прикажува <b>релативната влажност</b> на воздухот во % и <b>точката на роса</b> (температурата при која воздухот би достигнал 100% влажност и би почнала кондензација – колку е поблиску до температурата на воздухот, толку е повлажно).',
  pressure:'Графиконот го прикажува <b>атмосферскиот притисок</b> сведен на морско ниво (hPa). Притисокот во опаѓање често најавува влошување на времето, во пораст – подобрување.',
  vis:'Графиконот ја прикажува <b>видливоста</b> – колку далеку се гледа (km). Ниската видливост значи магла, силен дожд или снег.',
  wetbulb:'Графиконот ја прикажува <b>температурата на влажен термометар</b> (најниската температура достижна со испарување на вода; го покажува реалното топлотно оптоварување при влага – при високи вредности потењето веќе не го лади телото).',
  solar:'Графиконот го прикажува <b>сончевото зрачење</b> – моќноста на сончевото зрачење врз хоризонтална површина (W/m²). Розовата крива е <b>UV индексот</b> (јачина на ултравиолетовото зрачење; колку е повисок, толку побрзо се заканува изгореница).',
  aqi:'Графиконот го прикажува <b>квалитетот на воздухот</b>. Обоената површина е <b>индексот на квалитет на воздухот</b> (вкупна оцена на загадувањето – колку е повисок, толку е полошо). Линиите се поединечните материи: <b>PM2.5</b> и <b>PM10</b> (честички), <b>O₃</b> (приземен озон), <b>NO₂</b>, <b>SO₂</b> и <b>CO</b>.',
  pollen:'Графиконот ја прикажува <b>концентрацијата на полен</b> на поединечните растенија (зрна/m³) низ времето – треви, бреза, елша, маслина, пелин и амброзија. Табелата над графиконот ги прикажува тековните вредности, оцената и поленовата сезона.',
  },
  'bg':{
  temp:'Графиката показва <b>температурата на въздуха</b> за избраното място. Плътната линия е температурата, прекъснатата е <b>усещаната температура</b> (колко топло или студено усеща човешкото тяло – отчита вятъра, влажността и слънчевото греене).',
  cloud:'Графиката показва <b>облачността</b> – каква част от небето е покрита, в %. Можеш да превключваш ниски / средни / високи облаци (бутон вар. A/B). 0 % = ясно, 100 % = плътна облачност.',
  snow:'Графиката показва <b>валежите</b>: сняг в <b>бяло</b>, дъжд в <b>синьо</b>; общата височина на стълба е сумата в mm/h. Кривата показва допълнително <b>почвената влажност</b> (дял на водата в повърхностния слой 0–1 cm, в % от обема).',
  wind:'Графиката показва <b>скоростта на вятъра</b> (плътна линия) и <b>поривите</b> (втора крива – кратки пикове). Посоката/стрелките показват откъде духа вятърът.',
  hum:'Графиката показва <b>относителната влажност</b> на въздуха в % и <b>точката на оросяване</b> (температурата, при която въздухът би достигнал 100% влажност и би започнала кондензация – колкото по-близо до температурата на въздуха, толкова по-влажно).',
  pressure:'Графиката показва <b>атмосферното налягане</b>, приведено към морското равнище (hPa). Падащото налягане често предвещава влошаване на времето, растящото – подобрение.',
  vis:'Графиката показва <b>видимостта</b> – докъде се вижда (km). Ниската видимост означава мъгла, силен дъжд или сняг.',
  wetbulb:'Графиката показва <b>температурата по мокър термометър</b> (най-ниската температура, постижима чрез изпарение на вода; показва реалното топлинно натоварване при влага – при високи стойности потенето вече не охлажда тялото).',
  solar:'Графиката показва <b>слънчевата радиация</b> – мощността на слънчевото греене върху хоризонтална повърхност (W/m²). Розовата крива е <b>UV индексът</b> (интензитет на ултравиолетовото лъчение; колкото е по-висок, толкова по-бързо застрашава изгаряне).',
  aqi:'Графиката показва <b>качеството на въздуха</b>. Оцветената площ е <b>индексът за качество на въздуха</b> (обобщена оценка на замърсяването – колкото е по-висок, толкова по-зле). Линиите са отделните вещества: <b>PM2.5</b> и <b>PM10</b> (прахови частици), <b>O₃</b> (приземен озон), <b>NO₂</b>, <b>SO₂</b> и <b>CO</b>.',
  pollen:'Графиката показва <b>концентрацията на полен</b> от отделните растения (зърна/m³) във времето – треви, бреза, елша, маслина, пелин и амброзия. Таблицата над графиката показва текущите стойности, оценката и поленовия сезон.',
  },
  'sl':{
  temp:'Graf prikazuje <b>temperaturo zraka</b> za izbrano lokacijo. Polna črta je temperatura, črtkana je <b>občutek temperature</b> (kako toplo ali hladno občuti človeško telo – upošteva veter, vlago in sončno sevanje).',
  cloud:'Graf prikazuje <b>oblačnost</b> – kolikšen del neba je pokrit, v %. Lahko preklapljaš nizke / srednje / visoke oblake (gumb var. A/B). 0 % = jasno, 100 % = oblačno.',
  snow:'Graf prikazuje <b>padavine</b>: sneg <b>belo</b>, dež <b>modro</b>; skupna višina stolpca je vsota v mm/h. Krivulja dodatno prikazuje <b>vlažnost tal</b> (delež vode v površinski plasti 0–1 cm, v % prostornine).',
  wind:'Graf prikazuje <b>hitrost vetra</b> (polna črta) in <b>sunke</b> (druga krivulja – kratki vrhovi). Smer/puščice kažejo, od kod piha veter.',
  hum:'Graf prikazuje <b>relativno vlažnost</b> zraka v % in <b>rosišče</b> (temperatura, pri kateri bi zrak dosegel 100% vlažnosti in bi se začela kondenzacija – bližje kot je temperaturi zraka, bolj je vlažno).',
  pressure:'Graf prikazuje <b>zračni tlak</b> preračunan na morsko gladino (hPa). Padajoč tlak pogosto napoveduje poslabšanje vremena, naraščajoč izboljšanje.',
  vis:'Graf prikazuje <b>vidljivost</b> – kako daleč se vidi (km). Nizka vidljivost pomeni meglo, gost dež ali sneg.',
  wetbulb:'Graf prikazuje <b>temperaturo mokrega termometra</b> (najnižja temperatura, dosegljiva z izparevanjem vode; kaže dejansko toplotno obremenitev pri vlagi – pri visokih vrednostih znojenje telesa več ne ohlaja).',
  solar:'Graf prikazuje <b>sončno sevanje</b> – moč sončnega sevanja na vodoravno površino (W/m²). Rožnata krivulja je <b>UV indeks</b> (jakost ultravijoličnega sevanja; višji kot je, hitreje grozi opeklina).',
  aqi:'Graf prikazuje <b>kakovost zraka</b>. Obarvano območje je <b>indeks kakovosti zraka</b> (skupna ocena onesnaženosti – višji kot je, slabše). Črte so posamezne snovi: <b>PM2.5</b> in <b>PM10</b> (delci), <b>O₃</b> (prizemni ozon), <b>NO₂</b>, <b>SO₂</b> in <b>CO</b>.',
  pollen:'Graf prikazuje <b>koncentracijo cvetnega prahu</b> posameznih rastlin (zrna/m³) skozi čas – trave, breza, jelša, oljka, pelin in ambrozija. Tabela nad grafom prikazuje trenutne vrednosti, oceno in sezono cvetnega prahu.',
  },
  'sr':{
  temp:'Графикон приказује <b>температуру ваздуха</b> за изабрану локацију. Пуна линија је температура, испрекидана је <b>осећај температуре</b> (колико топло или хладно осећа људско тело – узима у обзир ветар, влагу и сунчево зрачење).',
  cloud:'Графикон приказује <b>облачност</b> – колико је неба прекривено, у %. Можеш пребацивати ниске / средње / високе облаке (дугме вар. A/B). 0 % = ведро, 100 % = потпуно облачно.',
  snow:'Графикон приказује <b>падавине</b>: снег <b>бело</b>, киша <b>плаво</b>; укупна висина ступца је збир у mm/h. Крива додатно приказује <b>влажност тла</b> (удео воде у површинском слоју 0–1 cm, у % запремине).',
  wind:'Графикон приказује <b>брзину ветра</b> (пуна линија) и <b>ударе</b> (друга крива – кратки врхови). Смер/стрелице показују одакле ветар дува.',
  hum:'Графикон приказује <b>релативну влажност</b> ваздуха у % и <b>тачку росе</b> (температура при којој би ваздух достигао 100% влажности и почела кондензација – што је ближе температури ваздуха, то је влажније).',
  pressure:'Графикон приказује <b>атмосферски притисак</b> сведен на ниво мора (hPa). Притисак у паду често најављује погоршање времена, у порасту побољшање.',
  vis:'Графикон приказује <b>видљивост</b> – колико се далеко види (km). Ниска видљивост значи маглу, јаку кишу или снег.',
  wetbulb:'Графикон приказује <b>температуру влажног термометра</b> (најнижа температура достижна испаравањем воде; показује стварно топлотно оптерећење при влази – код високих вредности знојење више не хлади тело).',
  solar:'Графикон приказује <b>сунчево зрачење</b> – снагу сунчевог зрачења на водоравну површину (W/m²). Розе крива је <b>UV индекс</b> (јачина ултраљубичастог зрачења; што је већи, то брже прети опекотина).',
  aqi:'Графикон приказује <b>квалитет ваздуха</b>. Обојена област је <b>индекс квалитета ваздуха</b> (укупна оцена загађења – што је већи, то горе). Линије су поједине материје: <b>PM2.5</b> и <b>PM10</b> (честице), <b>O₃</b> (приземни озон), <b>NO₂</b>, <b>SO₂</b> и <b>CO</b>.',
  pollen:'Графикон приказује <b>концентрацију полена</b> појединих биљака (зрна/m³) у времену – траве, бреза, јова, маслина, пелин и амброзија. Табела изнад графикона приказује тренутне вредности, оцену и сезону полена.',
  },
  'hr':{
  temp:'Graf prikazuje <b>temperaturu zraka</b> za odabranu lokaciju. Puna linija je temperatura, crtkana je <b>osjet temperature</b> (koliko toplo ili hladno osjeća ljudsko tijelo – uzima u obzir vjetar, vlagu i sunčevo zračenje).',
  cloud:'Graf prikazuje <b>naoblaku</b> – koliko je neba prekriveno, u %. Možeš prebacivati niske / srednje / visoke oblake (gumb var. A/B). 0 % = vedro, 100 % = potpuno oblačno.',
  snow:'Graf prikazuje <b>oborine</b>: snijeg <b>bijelo</b>, kiša <b>plavo</b>; ukupna visina stupca je zbroj u mm/h. Krivulja dodatno prikazuje <b>vlažnost tla</b> (udio vode u površinskom sloju 0–1 cm, u % volumena).',
  wind:'Graf prikazuje <b>brzinu vjetra</b> (puna linija) i <b>udare</b> (druga krivulja – kratki vrhovi). Smjer/strelice pokazuju odakle vjetar puše.',
  hum:'Graf prikazuje <b>relativnu vlažnost</b> zraka u % i <b>rosište</b> (temperatura pri kojoj bi zrak dosegnuo 100% vlažnosti i počela kondenzacija – što je bliže temperaturi zraka, to je vlažnije).',
  pressure:'Graf prikazuje <b>atmosferski tlak</b> sveden na razinu mora (hPa). Tlak u padu često najavljuje pogoršanje vremena, u porastu poboljšanje.',
  vis:'Graf prikazuje <b>vidljivost</b> – koliko se daleko vidi (km). Niska vidljivost znači maglu, jaku kišu ili snijeg.',
  wetbulb:'Graf prikazuje <b>temperaturu vlažnog termometra</b> (najniža temperatura dostižna isparavanjem vode; pokazuje stvarno toplinsko opterećenje pri vlazi – kod visokih vrijednosti znojenje više ne hladi tijelo).',
  solar:'Graf prikazuje <b>sunčevo zračenje</b> – snagu sunčevog zračenja na vodoravnu plohu (W/m²). Ružičasta krivulja je <b>UV indeks</b> (jakost ultraljubičastog zračenja; što je veći, to brže prijeti opeklina).',
  aqi:'Graf prikazuje <b>kvalitetu zraka</b>. Obojeno područje je <b>indeks kvalitete zraka</b> (ukupna ocjena onečišćenja – što je veći, to gore). Linije su pojedine tvari: <b>PM2.5</b> i <b>PM10</b> (čestice), <b>O₃</b> (prizemni ozon), <b>NO₂</b>, <b>SO₂</b> i <b>CO</b>.',
  pollen:'Graf prikazuje <b>koncentraciju peludi</b> pojedinih biljaka (zrna/m³) u vremenu – trave, breza, joha, maslina, pelin i ambrozija. Tablica iznad grafa prikazuje trenutne vrijednosti, ocjenu i sezonu peludi.',
  },
  'ro':{
  temp:'Graficul arată <b>temperatura aerului</b> pentru locul selectat. Linia continuă este temperatura, cea punctată este <b>temperatura resimțită</b> (cât de cald sau de frig simte corpul uman – ține cont de vânt, umiditate și radiația solară).',
  cloud:'Graficul arată <b>nebulozitatea</b> – cât din cer este acoperit, în %. Poți comuta între nori josi / medii / înalți (buton var. A/B). 0 % = senin, 100 % = acoperit.',
  snow:'Graficul arată <b>precipitațiile</b>: zăpada cu <b>alb</b> și ploaia cu <b>albastru</b>; înălțimea totală a barei este suma în mm/h. Curba arată în plus <b>umiditatea solului</b> (proporția de apă în stratul de suprafață 0–1 cm, în % din volum).',
  wind:'Graficul arată <b>viteza vântului</b> (linia continuă) și <b>rafalele</b> (a doua curbă – vârfuri scurte). Direcția/săgețile arată dinspre unde bate vântul.',
  hum:'Graficul arată <b>umiditatea relativă</b> a aerului în % și <b>punctul de rouă</b> (temperatura la care aerul ar atinge 100% umiditate și ar începe condensarea – cu cât este mai aproape de temperatura aerului, cu atât e mai umed).',
  pressure:'Graficul arată <b>presiunea atmosferică</b> redusă la nivelul mării (hPa). Presiunea în scădere anunță adesea înrăutățirea vremii, cea în creștere îmbunătățirea.',
  vis:'Graficul arată <b>vizibilitatea</b> – cât de departe se vede (km). Vizibilitatea redusă înseamnă ceață, ploaie deasă sau ninsoare.',
  wetbulb:'Graficul arată <b>temperatura termometrului umed</b> (cea mai joasă temperatură care poate fi atinsă prin evaporarea apei; indică sarcina termică reală pe umezeală – la valori mari, transpirația nu mai răcește corpul).',
  solar:'Graficul arată <b>radiația solară</b> – puterea solară incidentă pe o suprafață orizontală (W/m²). Curba roz este <b>indicele UV</b> (intensitatea radiației ultraviolete; cu cât mai mare, cu atât mai repede există riscul de arsuri).',
  aqi:'Graficul arată <b>calitatea aerului</b>. Zona colorată este <b>indicele de calitate a aerului</b> (evaluarea globală a poluării – cu cât mai mare, cu atât mai rău). Liniile sunt substanțele individuale: <b>PM2.5</b> și <b>PM10</b> (pulberi), <b>O₃</b> (ozon la sol), <b>NO₂</b>, <b>SO₂</b> și <b>CO</b>.',
  pollen:'Graficul arată <b>concentrația de polen</b> a fiecărei plante (grăunțe/m³) în timp – graminee, mesteacăn, arin, măslin, pelin și ambrozie. Tabelul de deasupra graficului arată valorile actuale, evaluarea și sezonul polenului.',
  },
  'hu':{
