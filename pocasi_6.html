<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080c14">
<title>Počasí CZ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080c14;color:#d8eaff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;border-bottom:1px solid #1e3050}
.hdr-title{font-size:15px;font-weight:700;color:#f0f6ff;letter-spacing:.04em;flex:1}
.hdr-time{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums}
.loc-bar{padding:8px 12px;border-bottom:1px solid #1e3050;display:flex;flex-direction:column;gap:6px}
.loc-row{display:flex;gap:6px}
.loc-input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:7px 10px;font-size:13px;outline:none}
.loc-input::placeholder{color:#3a5a7a}
.loc-input:focus{border-color:#3a6aaa}
.loc-btn{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:7px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.loc-btn:active{background:#1a2840}
.gps-row{display:flex;gap:6px}
.gps-row input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:7px 10px;font-size:13px;outline:none}
.gps-row input::placeholder{color:#3a5a7a}
.gps-row input:focus{border-color:#3a6aaa}
.gps-go{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:700}
.gps-go:active{background:#12295a}
.sug-box{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;overflow:hidden;display:none;max-height:200px;overflow-y:auto}
.sug-box.open{display:block}
.sug-item{padding:10px 12px;font-size:13px;color:#b0cce8;cursor:pointer;border-bottom:1px solid #142030;display:flex;align-items:baseline;gap:6px}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item:hover{background:#142030}
.sug-item b{color:#60b8ff}
.sug-sub{font-size:11px;color:#486080;flex:1}
.sug-coords{font-size:10px;color:#2a4060;margin-left:auto}
/* METRICS – 8 values in 4 columns */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#1e3050;border-bottom:1px solid #1e3050}
.metric{background:#090f1c;padding:6px 4px;text-align:center}
.metric-icon{font-size:14px;margin-bottom:1px}
.metric-val{font-size:15px;font-weight:700;color:#f0f8ff;line-height:1;font-variant-numeric:tabular-nums}
.metric-sub{font-size:11px;color:#90b8d8;margin-top:1px;font-variant-numeric:tabular-nums}
.metric-unit{font-size:8px;color:#3a5a80;margin-top:1px}
.metric-time{grid-column:1/-1;text-align:center;font-size:10px;color:#507090;padding:2px 0 3px;background:#090f1c;border-top:1px solid #1e3050}
/* TABS */
.tabs{display:flex;border-bottom:2px solid #1e3050;background:#080c14;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:12px;font-weight:600;color:#507090;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s}
.tab.active{color:#5ab0ff;border-bottom-color:#5ab0ff}
/* CHART */
#chartCanvas{display:block;width:100%;touch-action:none}
.legend-bar{display:flex;gap:10px;flex-wrap:wrap;padding:3px 10px 5px;background:#080c14}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#607090}
.leg-swatch{width:16px;height:2px;flex-shrink:0}
.state{text-align:center;padding:50px 20px;color:#507090;font-size:13px;line-height:1.8}
.state-ico{font-size:36px;margin-bottom:10px}
.status{font-size:10px;color:#1e3050;padding:3px 10px 5px;text-align:right}
.pf-logo{position:fixed;bottom:8px;left:10px;z-index:100;opacity:.5;pointer-events:none}
.pf-cloud{background:#2a3a50;border-radius:8px;padding:2px 5px 2px 3px;font-size:11px;font-weight:700;color:#d4b820;display:flex;align-items:center;gap:2px}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;position:relative">
  <div class="hdr">
    <span style="font-size:20px">🌤</span>
    <span class="hdr-title">Počasí CZ <span style="color:#7090b0;font-weight:400;font-size:12px">(by PF)</span></span>
    <span class="hdr-time" id="clock">--:--</span>
  </div>
  <div class="loc-bar">
    <div class="loc-row">
      <input class="loc-input" id="cityQ" placeholder="Název obce nebo města…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="loc-btn" onclick="useGPS()">📍 GPS</button>
    </div>
    <div class="sug-box" id="sugBox"></div>
    <div class="gps-row">
      <input class="loc-input" id="latIn" placeholder="Zeměšířka (49.8209)" type="number" step="0.0001">
      <input class="loc-input" id="lonIn" placeholder="Zemědelšířka (18.2625)" type="number" step="0.0001">
      <button class="gps-go" onclick="useCoords()">GO</button>
    </div>
  </div>

  <!-- 8 metric values + time row -->
  <div class="metrics" id="metrics" style="display:none">
    <div class="metric"><div class="metric-icon">🌡</div><div class="metric-val" id="mTemp">–</div><div class="metric-sub" id="mFeel">–</div><div class="metric-unit">°C / pocit</div></div>
    <div class="metric"><div class="metric-icon">💨</div><div class="metric-val" id="mWind">–</div><div class="metric-sub" id="mGust">–</div><div class="metric-unit">km/h / nárazy</div></div>
    <div class="metric"><div class="metric-icon">💧</div><div class="metric-val" id="mHum">–</div><div class="metric-sub" id="mDew">–</div><div class="metric-unit">% / rosný bod</div></div>
    <div class="metric"><div class="metric-icon">🌫</div><div class="metric-val" id="mPres">–</div><div class="metric-sub" id="mCloud">–</div><div class="metric-unit">hPa / oblač%</div></div>
    <div class="metric-time" id="mTime">teď</div>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab active" data-tab="temp"  onclick="setTab(this)">🌡 Teplota</div>
    <div class="tab"        data-tab="wind"  onclick="setTab(this)">💨 Vítr</div>
    <div class="tab"        data-tab="cloud" onclick="setTab(this)">☁ Oblačnost</div>
    <div class="tab"        data-tab="hum"   onclick="setTab(this)">💧 Vlhkost</div>
  </div>

  <div id="chartSection" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <canvas id="chartCanvas"></canvas>
    <div class="legend-bar" id="legendBar"></div>
  </div>

  <div class="state" id="stateDiv">
    <div class="state-ico">🔍</div>
    Zadej název obce, použij GPS<br>nebo zadej souřadnice
  </div>
  <div class="status" id="statusBar"></div>
</div>
<div class="pf-logo">
  <div class="pf-cloud"><span style="color:#f0c010">⚡</span>PF<span style="color:#f0a010;font-size:10px">☀</span></div>
</div>

<script>
// ═══ CLOCK ═══
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
tickClock();setInterval(tickClock,1000);

// ═══ GLOBALS ═══
let WD=null, currentTab='temp', searchTimer=null;
let CV=null, CX=null;
const DAYS=['Ne','Po','Út','St','Čt','Pá','So'];
const TABS=['temp','wind','cloud','hum'];

// zoom: hoursVisible controls how many hours shown (default 77 = 5h back + 72h forward)
let hoursVisible=77;
const HOURS_MIN=24, HOURS_MAX=120;

// swipe state
let swipeStartX=null, swipeStartY=null;
// pinch state
let pinchStartDist=null, pinchStartHours=null;
// hover
let hoverIdx=null;

// ═══ SEARCH ═══
const cityQ=document.getElementById('cityQ');
const sugBox=document.getElementById('sugBox');
cityQ.addEventListener('input',()=>{clearTimeout(searchTimer);const q=cityQ.value.trim();if(q.length<2){closeSug();return;}searchTimer=setTimeout(()=>doSearch(q),380);});
cityQ.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);doSearch(cityQ.value.trim());}});
async function doSearch(q){
  if(q.length<2)return;
  openSug('<div class="sug-item"><span style="color:#507090">Hledám…</span></div>');
  try{
    const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=cs&format=json`);
    const data=await res.json();
    const hits=(data.results||[]).filter(d=>d.country_code==='CZ');
    if(!hits.length){openSug('<div class="sug-item"><span style="color:#507090">Nenalezeno</span></div>');return;}
    openSug(hits.map(d=>{
      const district=d.admin2||'',region=d.admin1||'';
      const sub=district&&district!==d.name?district+(region?', '+region:''):region;
      return `<div class="sug-item" data-lat="${d.latitude}" data-lon="${d.longitude}" data-name="${d.name}${sub?', '+sub:''}" onclick="pickSug(this)"><b>${d.name}</b><span class="sug-sub">${sub}</span><span class="sug-coords">${d.latitude.toFixed(3)}, ${d.longitude.toFixed(3)}</span></div>`;
    }).join(''));
  }catch(e){openSug('<div class="sug-item"><span style="color:#ff6060">Chyba připojení</span></div>');}
}
function openSug(html){sugBox.innerHTML=html;sugBox.className='sug-box open';}
function closeSug(){sugBox.className='sug-box';sugBox.innerHTML='';}
function pickSug(el){cityQ.value=el.dataset.name;document.getElementById('latIn').value=parseFloat(el.dataset.lat).toFixed(5);document.getElementById('lonIn').value=parseFloat(el.dataset.lon).toFixed(5);closeSug();loadWeather(parseFloat(el.dataset.lat),parseFloat(el.dataset.lon),el.dataset.name);}
document.addEventListener('click',e=>{if(!e.target.closest('.loc-bar'))closeSug();});

// ═══ GPS ═══
function useGPS(){
  if(!navigator.geolocation){setState('🚫','Geolokace není dostupná');return;}
  setState('📡','Zjišťuji GPS polohu…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    document.getElementById('latIn').value=lat.toFixed(5);document.getElementById('lonIn').value=lon.toFixed(5);
    reverseGeocode(lat,lon);
  },err=>{const m={1:'GPS zamítnuto.',2:'GPS signál nedostupný.',3:'GPS – vypršel čas.'};setState('❌',m[err.code]||'Chyba GPS');},{enableHighAccuracy:true,timeout:15000});
}
async function reverseGeocode(lat,lon){
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=cs`);const d=await r.json();const name=d.locality||d.city||d.principalSubdivision||`${lat.toFixed(4)},${lon.toFixed(4)}`;cityQ.value=name;loadWeather(lat,lon,name+' (GPS)');}
  catch(e){loadWeather(lat,lon,`GPS ${lat.toFixed(4)},${lon.toFixed(4)}`);}
}
function useCoords(){
  const lat=parseFloat(document.getElementById('latIn').value),lon=parseFloat(document.getElementById('lonIn').value);
  if(isNaN(lat)||isNaN(lon)){setState('⚠️','Zadej platné souřadnice');return;}
  cityQ.value=`${lat.toFixed(4)}, ${lon.toFixed(4)}`;loadWeather(lat,lon,`${lat.toFixed(4)}, ${lon.toFixed(4)}`);
}

// ═══ LOAD WEATHER ═══
async function loadWeather(lat,lon,name){
  setState('⏳',`Načítám data pro <b>${name}</b>…`);
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      +`&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,dewpoint_2m,`
      +`wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,snowfall,`
      +`cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,weathercode,is_day`
      +`&current=temperature_2m,apparent_temperature,relative_humidity_2m,`
      +`wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation,weathercode,is_day`
      +`&forecast_days=4&past_days=1&timezone=Europe%2FPrague`;
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    WD=await res.json();
    updateMetrics(null);
    document.getElementById('metrics').style.display='grid';
    document.getElementById('tabs').style.display='flex';
    const cs=document.getElementById('chartSection');cs.style.display='flex';cs.style.flexDirection='column';
    document.getElementById('stateDiv').style.display='none';
    initCanvas();draw();
    setStatus(`✓ ${name} · ${new Date().toLocaleTimeString('cs-CZ')}`);
  }catch(e){setState('⚠️','Nepodařilo se načíst data.<br>Zkontroluj připojení.');setStatus('Chyba: '+e.message);}
}

// Update 8 metric values from hover index or current
function updateMetrics(idx){
  const h=WD.hourly;
  let t,feel,ws,wg,hum,dew,pres,cloud,timeStr;
  if(idx===null){
    const c=WD.current;
    const ci=Math.max(0,h.time.findIndex(t=>new Date(t)>Date.now())-1);
    t=c.temperature_2m; feel=c.apparent_temperature; ws=c.wind_speed_10m; wg=c.wind_gusts_10m;
    hum=c.relative_humidity_2m; dew=h.dewpoint_2m[ci]; pres=c.surface_pressure; cloud=c.cloud_cover;
    timeStr='teď';
  } else {
    const {s}=getSlice(); const i=s+idx;
    t=h.temperature_2m[i]; feel=h.apparent_temperature[i]; ws=h.wind_speed_10m[i]; wg=h.wind_gusts_10m[i];
    hum=h.relative_humidity_2m[i]; dew=h.dewpoint_2m[i]; pres=h.surface_pressure[i]; cloud=h.cloud_cover[i];
    timeStr=new Date(h.time[i]).toLocaleString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  document.getElementById('mTemp').textContent=Math.round(t);
  document.getElementById('mFeel').textContent=(feel>=0?'+':'')+Math.round(feel)+'°';
  document.getElementById('mWind').textContent=Math.round(ws);
  document.getElementById('mGust').textContent='▲'+Math.round(wg);
  document.getElementById('mHum').textContent=Math.round(hum)+'%';
  document.getElementById('mDew').textContent='ros.'+Math.round(dew)+'°';
  document.getElementById('mPres').textContent=Math.round(pres);
  document.getElementById('mCloud').textContent=Math.round(cloud)+'%';
  document.getElementById('mTime').textContent=timeStr;
}

function setState(ico,msg){
  document.getElementById('metrics').style.display='none';document.getElementById('tabs').style.display='none';document.getElementById('chartSection').style.display='none';
  const el=document.getElementById('stateDiv');el.style.display='block';el.innerHTML=`<div class="state-ico">${ico}</div><span>${msg}</span>`;
}
function setStatus(msg){document.getElementById('statusBar').textContent=msg;}
function setTab(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');currentTab=el.dataset.tab;if(WD)draw();}

// ═══ SLICE (respects hoursVisible zoom) ═══
function getSlice(){
  const times=WD.hourly.time;
  const nowMs=Date.now();
  let cur=times.findIndex(t=>new Date(t).getTime()>nowMs)-1;
  if(cur<0)cur=0;
  const backH=5; // hours back
  const fwdH=hoursVisible-backH;
  const s=Math.max(0,cur-backH);
  const e=Math.min(times.length-1,cur+fwdH);
  return{s,e,cur,split:cur-s};
}

// ═══ CANVAS INIT ═══
function initCanvas(){
  if(CV)return; // already init
  CV=document.getElementById('chartCanvas');
  CX=CV.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',()=>{resizeCanvas();if(WD)draw();});

  // mouse
  CV.addEventListener('mousemove',onPointerMove);
  CV.addEventListener('mouseleave',()=>{hoverIdx=null;if(WD)draw();updateMetrics(null);});

  // touch – handle swipe, pinch and hover
  CV.addEventListener('touchstart',onTouchStart,{passive:false});
  CV.addEventListener('touchmove',onTouchMove,{passive:false});
  CV.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  const sec=document.getElementById('chartSection');
  const lb=document.getElementById('legendBar');
  const availH=sec.offsetHeight-lb.offsetHeight-2;
  CV.width=sec.offsetWidth;
  CV.height=Math.max(availH,180);
  CV.style.width='100%';CV.style.height=CV.height+'px';
}

// ── pointer move (mouse) ──
function onPointerMove(e){
  if(!WD||!CV)return;
  const rect=CV.getBoundingClientRect();
  setHoverFromX(e.clientX-rect.left);
}

// ── touch handlers ──
function onTouchStart(e){
  if(e.touches.length===1){
    swipeStartX=e.touches[0].clientX;
    swipeStartY=e.touches[0].clientY;
    pinchStartDist=null;
  } else if(e.touches.length===2){
    pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchStartHours=hoursVisible;
    swipeStartX=null;
  }
}
function onTouchMove(e){
  e.preventDefault();
  if(!WD)return;
  if(e.touches.length===2&&pinchStartDist!==null){
    // PINCH ZOOM
    const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const ratio=pinchStartDist/dist; // pinch in → ratio>1 → zoom out (more hours)
    hoursVisible=Math.round(Math.max(HOURS_MIN,Math.min(HOURS_MAX,pinchStartHours*ratio)));
    hoverIdx=null;draw();
  } else if(e.touches.length===1&&swipeStartX!==null){
    const dx=e.touches[0].clientX-swipeStartX;
    const dy=e.touches[0].clientY-swipeStartY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)<12){
      // still deciding – treat as hover
      const rect=CV.getBoundingClientRect();
      setHoverFromX(e.touches[0].clientX-rect.left);
    } else if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>=12){
      // horizontal swipe – do nothing here, handled on end
    } else {
      // vertical – treat as hover
      const rect=CV.getBoundingClientRect();
      setHoverFromX(e.touches[0].clientX-rect.left);
    }
  }
}
function onTouchEnd(e){
  if(e.changedTouches.length===1&&swipeStartX!==null&&pinchStartDist===null){
    const dx=e.changedTouches[0].clientX-swipeStartX;
    const dy=e.changedTouches[0].clientY-swipeStartY;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){
      // SWIPE between tabs
      const ti=TABS.indexOf(currentTab);
      if(dx<0&&ti<TABS.length-1) switchTab(TABS[ti+1]);
      if(dx>0&&ti>0)             switchTab(TABS[ti-1]);
    }
  }
  hoverIdx=null;swipeStartX=null;pinchStartDist=null;
  if(WD){draw();updateMetrics(null);}
}
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.dataset.tab===tab);});
  draw();
}

function setHoverFromX(mx){
  const L=getLayout();
  const chartW=CV.width-L.pL-L.pR;
  const total=getSlice().e-getSlice().s+1;
  let idx=Math.round((mx-L.pL)/chartW*(total-1));
  idx=Math.max(0,Math.min(total-1,idx));
  if(idx!==hoverIdx){hoverIdx=idx;draw();updateMetrics(idx);}
}

// ═══ LAYOUT ═══
function getLayout(){
  const W=CV.width,H=CV.height;
  const pL=40,pR=42;
  const TIME_H=28;
  const ICON_H=18;
  const ARROW_H=currentTab==='wind'?14:0;
  const PRECIP_H=currentTab==='cloud'?0:32;
  const topPad=ICON_H+ARROW_H+3;
  const chartH=H-topPad-PRECIP_H-TIME_H;
  const {s,e}=getSlice();
  const total=e-s+1;
  return{W,H,pL,pR,TIME_H,ICON_H,ARROW_H,PRECIP_H,topPad,chartH,total,s,e};
}
let L_PAD=40,R_PAD=42;

// ═══ MASTER DRAW ═══
function draw(){
  if(!CV||!WD)return;
  CX.clearRect(0,0,CV.width,CV.height);
  const L=getLayout();
  const {s,e,split}=getSlice();
  const h=WD.hourly;
  const idxs=Array.from({length:L.total},(_,i)=>s+i);
  function xOf(i){return L.pL+i*(CV.width-L.pL-L.pR)/(L.total-1);}

  drawIconRow(L,idxs,h,xOf);
  if(currentTab==='wind') drawWindArrows(L,idxs,h,xOf);

  const cTop=L.topPad, cBot=L.topPad+L.chartH;
  drawMidnightLines(idxs,cTop,cBot,xOf);
  drawNowLine(split,cTop,cBot,xOf);

  if(currentTab==='temp')        drawTemp(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='wind')   drawWind(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='cloud')  drawCloud(L,idxs,h,xOf,cTop,cBot,split);
  else if(currentTab==='hum')    drawHum(L,idxs,h,xOf,cTop,cBot,split);

  if(currentTab!=='cloud') drawPrecipOverlay(L,idxs,h,xOf,cBot);
  drawTimeAxis(L,idxs,xOf);
  if(hoverIdx!==null) drawCrosshair(hoverIdx,cTop,cBot,xOf);

  // PF watermark
  CX.save();CX.font=`bold ${Math.min(CV.width/5,50)}px sans-serif`;CX.fillStyle='rgba(120,160,200,0.04)';
  CX.textAlign='center';CX.textBaseline='middle';CX.fillText('PF',CV.width/2,cTop+(cBot-cTop)/2);CX.restore();
}

// ═══ ICON ROW ═══
function wmoIcon(code,isDay){
  if(code===0)return isDay?'☀️':'🌙';
  if(code===1)return isDay?'🌤':'🌤';
  if(code===2)return '⛅';if(code===3)return '☁️';
  if(code<=49)return '🌫';if(code<=57)return '🌦';if(code<=67)return '🌧';
  if(code<=77)return '🌨';if(code<=82)return '🌧';if(code<=86)return '❄️';return '⛈';
}
function cloudFracIcon(pct,isDay){
  if(pct<15)return isDay?'☀️':'🌙';
  if(pct<40)return '🌤';if(pct<70)return '⛅';if(pct<95)return '🌥';return '☁️';
}
function drawIconRow(L,idxs,h,xOf){
  const y=L.ICON_H/2+1;
  const step=(CV.width-L.pL-L.pR)/(L.total-1);
  const every=step<14?6:step<20?3:1;
  CX.save();CX.font='13px serif';CX.textAlign='center';CX.textBaseline='middle';
  for(let i=0;i<L.total;i+=every){
    const idx=idxs[i];
    const code=h.weathercode[idx],isDay=h.is_day[idx];
    let icon=wmoIcon(code,isDay);
    if(code<=1) icon=cloudFracIcon(h.cloud_cover[idx],isDay);
    CX.fillText(icon,xOf(i),y);
  }
  CX.restore();
}

// ═══ WIND ARROWS ROW (thickness/opacity by wind speed) ═══
const DIR_ARROWS=['↑','↗','→','↘','↓','↙','←','↖'];
function dirArrow(deg){return DIR_ARROWS[Math.round(((deg+180)%360)/45)%8];}
function drawWindArrows(L,idxs,h,xOf){
  const y=L.ICON_H+L.ARROW_H/2+1;
  const wsAll=idxs.map(i=>h.wind_speed_10m[i]);
  const maxWs=Math.max(...wsAll,1);
  const step=(CV.width-L.pL-L.pR)/(L.total-1);
  const every=step<9?2:1;
  CX.save();CX.textAlign='center';CX.textBaseline='middle';
  for(let i=0;i<L.total;i+=every){
    const idx=idxs[i];
    const ws=h.wind_speed_10m[idx];
    const frac=ws/maxWs; // 0..1
    const alpha=0.35+0.65*frac;
    const size=8+Math.round(frac*5); // 8-13px
    CX.font=`${size}px sans-serif`;
    CX.fillStyle=`rgba(112,160,200,${alpha})`;
    CX.fillText(dirArrow(h.wind_direction_10m[idx]),xOf(i),y);
  }
  CX.restore();
}

// ═══ MIDNIGHT LINES ═══
function drawMidnightLines(idxs,cTop,cBot,xOf){
  CX.save();CX.setLineDash([5,5]);CX.strokeStyle='rgba(80,140,220,0.4)';CX.lineWidth=1.5;
  for(let i=1;i<idxs.length;i++){
    if(new Date(WD.hourly.time[idxs[i]]).getHours()===0){

}

// ═══ NOW LINE ═══
function drawNowLine(split,cTop,cBot,xOf){

// ═══ CROSSHAIR ═══
function drawCrosshair(idx,cTop,cBot,xOf){

// ═══ TIME AXIS ═══
function drawTimeAxis(L,idxs,xOf){
  const precipH=(currentTab==='cloud')?30:0; // cloud has integrated precip
  const axisTop=L.topPad+L.chartH+(currentTab!=='cloud'?L.PRECIP_H:precipH);
  const row1=axisTop+10;
  const row2=axisTop+21;
  CX.save();CX.textAlign='center';
  let lastDay=-1;
  for(let i=0;i<L.total;i++){
    const d=new Date(WD.hourly.time[idxs[i]]);
    const hr=d.getHours(),x=xOf(i);
    // tiny tick every hour
    CX.strokeStyle='rgba(30,55,90,0.8)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(x,axisTop);CX.lineTo(x,axisTop+2);CX.stroke();
    if(hr%6===0){
      CX.strokeStyle='rgba(60,100,160,0.8)';CX.lineWidth=1;
      CX.beginPath();CX.moveTo(x,axisTop);CX.lineTo(x,axisTop+5);CX.stroke();
      CX.fillStyle='#6090b8';CX.font='9px sans-serif';
      CX.fillText(String(hr).padStart(2,'0'),x,row1);
    }
    const day=d.getDay();
    if((hr===0||i===0)&&day!==lastDay){
      lastDay=day;CX.fillStyle='#7090b8';CX.font='bold 9px sans-serif';CX.fillText(DAYS[day],x,row2);
    }
  }
  CX.restore();
}

// ═══ HELPERS ═══
function valToY(v,min,max,cTop,cBot){return cBot-(v-min)/(max-min)*(cBot-cTop);}

function drawFilledLine(vals,xOf,cTop,cBot,min,max,strokeColor,fillColor,dash){
  CX.save();
  if(fillColor){
    CX.beginPath();let started=false;
    for(let i=0;i<vals.length;i++){
      if(vals[i]===null)continue;
      const x=xOf(i),y=valToY(vals[i],min,max,cTop,cBot);
      if(!started){CX.moveTo(x,cBot);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);
    }
    for(let i=vals.length-1;i>=0;i--){if(vals[i]!==null){CX.lineTo(xOf(i),cBot);break;}}
    CX.closePath();CX.fillStyle=fillColor;CX.fill();
  }
  CX.beginPath();if(dash)CX.setLineDash(dash);CX.strokeStyle=strokeColor;CX.lineWidth=2;
  let first=true;
  for(let i=0;i<vals.length;i++){
    if(vals[i]===null){first=true;continue;}
    const x=xOf(i),y=valToY(vals[i],min,max,cTop,cBot);
    if(first){CX.moveTo(x,y);first=false;}else CX.lineTo(x,y);
  }
  CX.stroke();CX.setLineDash([]);CX.restore();
}

// Data labels at ALL local extrema (not just global)
function drawDataLabels(vals,xOf,cTop,cBot,min,max,unit,color){
  CX.save();CX.font='bold 9px sans-serif';CX.fillStyle=color||'rgba(220,240,255,0.9)';CX.textAlign='center';
  // find all local maxima and minima with minimal prominence
  const prom=0.3; // must differ by at least this from neighbors
  for(let i=1;i<vals.length-1;i++){
    const v=vals[i],p=vals[i-1],n=vals[i+1];
    if(v===null||p===null||n===null)continue;
    const isMax=v>=p&&v>=n&&v>p+prom&&v>n+prom;
    const isMin=v<=p&&v<=n&&v<p-prom&&v<n-prom;
    if(!isMax&&!isMin)continue;
    const x=xOf(i),y=valToY(v,min,max,cTop,cBot);
    const label=Number.isInteger(v)?v+(unit||''):(Math.round(v*10)/10)+(unit||'');
    CX.fillText(label,x,isMax?y-5:y+12);
  }
  CX.restore();
}

// Left axis with steps every `step` units, grid lines at each step
function drawLeftAxisStep(mn,mx,cTop,cBot,stepSize,unit,color,minorStep){
  CX.save();CX.textAlign='right';CX.font='9px sans-serif';CX.fillStyle=color||'#507090';
  const low=Math.ceil(mn/stepSize)*stepSize;
  const high=Math.floor(mx/stepSize)*stepSize;
  for(let v=low;v<=high+0.001;v+=stepSize){
    const y=valToY(v,mn,mx,cTop,cBot);
    CX.fillText(Math.round(v)+(unit||''),L_PAD-3,y+3);
    CX.strokeStyle='rgba(30,60,100,0.22)';CX.lineWidth=1;CX.setLineDash([2,4]);
    CX.beginPath();CX.moveTo(L_PAD,y);CX.lineTo(CV.width-R_PAD,y);CX.stroke();CX.setLineDash([]);
  }
  // minor ticks
  if(minorStep){
    const mLow=Math.ceil(mn/minorStep)*minorStep;
    for(let v=mLow;v<=mx+0.001;v+=minorStep){
      if(Math.abs(v%stepSize)<0.01)continue; // skip major
      const y=valToY(v,mn,mx,cTop,cBot);
      CX.strokeStyle='rgba(30,60,100,0.1)';CX.lineWidth=1;
      CX.beginPath();CX.moveTo(L_PAD,y);CX.lineTo(L_PAD+4,y);CX.stroke();
    }
  }
  CX.restore();
}
function drawLeftAxisFull(mn,mx,cTop,cBot,unit,color){
  drawLeftAxisStep(mn,mx,cTop,cBot,(mx-mn)/4,unit,color,null);
}
function drawRightAxisFull(mn,mx,cTop,cBot,unit,color){
  const steps=4;
  CX.save();CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle=color||'#507090';
  for(let i=0;i<=steps;i++){
    const v=mn+(mx-mn)*i/steps;
    const y=valToY(v,mn,mx,cTop,cBot);
    CX.fillText((Math.round(v*10)/10)+(unit||''),CV.width-R_PAD+2,y+3);
  }
  CX.restore();
}

// ═══ PRECIP OVERLAY ═══
function drawPrecipOverlay(L,idxs,h,xOf,cBot){
  const pr=idxs.map(i=>h.precipitation[i]);
  const sn=idxs.map(i=>h.snowfall[i]);
  const maxPr=Math.max(...pr,...sn,0.5);
  const pTop=cBot,pBot=cBot+L.PRECIP_H-2;
  const barW=Math.max(1,(CV.width-L.pL-L.pR)/(L.total)-0.5);
  CX.save();
  for(let i=0;i<L.total;i++){
    const x=xOf(i)-barW/2;
    const rainH=(pr[i]||0)/maxPr*(pBot-pTop);
    const snowH=(sn[i]||0)/maxPr*(pBot-pTop);
    if(rainH>0.2){CX.fillStyle='rgba(60,140,255,0.72)';CX.fillRect(x,pBot-rainH,barW,rainH);}
    if(snowH>0.2){CX.fillStyle='rgba(180,220,255,0.62)';CX.fillRect(x,pBot-rainH-snowH,barW,snowH);}
  }
  CX.strokeStyle='rgba(30,60,100,0.45)';CX.lineWidth=1;
  CX.beginPath();CX.moveTo(L.pL,pTop);CX.lineTo(CV.width-L.pR,pTop);CX.stroke();
  CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle='#3c7aaa';
  CX.fillText(maxPr.toFixed(1)+'mm',CV.width-L.pR+2,pTop+8);
  CX.fillText('0',CV.width-L.pR+2,pBot+3);
  CX.restore();
}

// ═══ TEMP CHART ═══
function drawTemp(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const temps=idxs.map(i=>h.temperature_2m[i]);
  const feels=idxs.map(i=>h.apparent_temperature[i]);
  const allVals=[...temps,...feels].filter(v=>v!==null);
  const rawMn=Math.min(...allVals),rawMx=Math.max(...allVals);
  // round to nearest 5 for nice axis
  const mn=Math.floor((rawMn-2)/5)*5, mx=Math.ceil((rawMx+2)/5)*5;

  // zero line
  if(mn<0&&mx>0){
    const y0=valToY(0,mn,mx,cTop,cBot);
    CX.save();CX.strokeStyle='rgba(100,150,220,0.35)';CX.lineWidth=1;CX.setLineDash([4,4]);
    CX.beginPath();CX.moveTo(L.pL,y0);CX.lineTo(CV.width-L.pR,y0);CX.stroke();CX.setLineDash([]);CX.restore();
  }

  // gradient: orange→blue at zero crossover
  function makeTempGrad(alpha){
    const grad=CX.createLinearGradient(0,cTop,0,cBot);
    if(mn>=0){
      grad.addColorStop(0,`rgba(255,130,30,${alpha})`);grad.addColorStop(1,`rgba(255,130,30,0.02)`);
    } else if(mx<=0){
      grad.addColorStop(0,`rgba(100,180,255,${alpha})`);grad.addColorStop(1,`rgba(100,180,255,0.02)`);
    } else {
      const zf=(mx)/(mx-mn);
      grad.addColorStop(0,`rgba(255,130,30,${alpha})`);
      grad.addColorStop(Math.min(0.99,zf-0.01),`rgba(255,130,30,${alpha*0.25})`);
      grad.addColorStop(Math.min(0.99,zf+0.01),`rgba(100,180,255,${alpha*0.25})`);
      grad.addColorStop(1,`rgba(100,180,255,0.02)`);
    }
    return grad;
  }

  // full fill
  drawFilledLine(temps,xOf,cTop,cBot,mn,mx,'#ff8c28',makeTempGrad(0.6),null);
  // hist solid / fore dashed strokes
  drawFilledLine(temps.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#ff8c28',null,null);
  drawFilledLine(temps.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#ff8c28',null,[6,4]);
  // feels
  drawFilledLine(feels.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#5ab0ff',null,null);
  drawFilledLine(feels.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#5ab0ff',null,[4,4]);

  // data labels on BOTH series
  drawDataLabels(temps,xOf,cTop,cBot,mn,mx,'°','rgba(255,200,120,0.95)');
  drawDataLabels(feels,xOf,cTop,cBot,mn,mx,'°','rgba(140,200,255,0.88)');

  // axis: every 5°C with minor ticks every 1°C
  drawLeftAxisStep(mn,mx,cTop,cBot,5,'°C','#7090b0',1);

  setLegend([{color:'#ff8c28',label:'Teplota °C',dash:false},{color:'#ff8c28',label:'předpověď',dash:true},{color:'#5ab0ff',label:'Pocitová °C',dash:false}]);
}

// ═══ WIND CHART ═══
function drawWind(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const ws=idxs.map(i=>h.wind_speed_10m[i]);
  const wg=idxs.map(i=>h.wind_gusts_10m[i]);
  const mx=Math.ceil((Math.max(...ws,...wg)+3)/5)*5, mn=0;

  const grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(40,220,120,0.55)');grad.addColorStop(1,'rgba(40,220,120,0.02)');
  drawFilledLine(ws,xOf,cTop,cBot,mn,mx,'#28dc78',grad,null);
  drawFilledLine(ws.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#28dc78',null,null);
  drawFilledLine(ws.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#28dc78',null,[6,4]);
  drawFilledLine(wg.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#ff5050',null,null);
  drawFilledLine(wg.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#ff5050',null,[3,3]);

  drawDataLabels(ws,xOf,cTop,cBot,mn,mx,'','rgba(100,255,160,0.9)');
  drawDataLabels(wg,xOf,cTop,cBot,mn,mx,'','rgba(255,140,140,0.88)');

  drawLeftAxisFull(mn,mx,cTop,cBot,' km/h','#5a9a70');
  drawRightAxisFull(mn/3.6,mx/3.6,cTop,cBot,' m/s','#4a8060');

  setLegend([{color:'#28dc78',label:'Vítr km/h / m/s →',dash:false},{color:'#ff5050',label:'Nárazy km/h',dash:false}]);
}

// ═══ CLOUD CHART ═══
function drawCloud(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const KM=[0,2,6.5,10];
  function kmToY(km){return cBot-(km/10)*(cBot-cTop);}

  // horizontal km lines
  CX.save();
  KM.forEach(km=>{
    const y=kmToY(km);
    CX.strokeStyle='rgba(40,80,140,0.4)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(CV.width-L.pR,y);CX.stroke();
    CX.fillStyle='#507090';CX.font='9px sans-serif';CX.textAlign='right';
    CX.fillText(km===0?'0km':km+'km',L.pL-2,y+3);
  });

  function drawBand(data,yTop,yBot,color){
    CX.save();CX.beginPath();let started=false;
    for(let i=0;i<L.total;i++){
      const pct=Math.min(100,Math.max(0,data[i]||0))/100;
      const y=yBot-pct*(yBot-yTop),x=xOf(i);
      if(!started){CX.moveTo(x,yBot);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);
    }
    CX.lineTo(xOf(L.total-1),yBot);CX.lineTo(xOf(0),yBot);CX.closePath();
    CX.fillStyle=color;CX.fill();CX.restore();
  }
  const clH=idxs.map(i=>h.cloud_cover_high[i]);
  const clM=idxs.map(i=>h.cloud_cover_mid[i]);
  const clL=idxs.map(i=>h.cloud_cover_low[i]);
  const clT=idxs.map(i=>h.cloud_cover[i]);
  drawBand(clH,kmToY(10),kmToY(6.5),'rgba(200,220,255,0.2)');
  drawBand(clM,kmToY(6.5),kmToY(2),'rgba(128,148,196,0.3)');
  drawBand(clL,kmToY(2),kmToY(0),'rgba(80,100,164,0.4)');

  // Cloud % labels at local extrema per band
  function cloudLabels(data,yTop,yBot,color){
    CX.save();CX.font='bold 8px sans-serif';CX.fillStyle=color;CX.textAlign='center';
    const prom=8;
    for(let i=1;i<data.length-1;i++){
      const v=data[i],p=data[i-1],n=data[i+1];
      if(v===null||p===null||n===null)continue;
      const isMax=v>=p&&v>=n&&v>p+prom;
      const isMin=v<=p&&v<=n&&v<p-prom;
      if(!isMax&&!isMin)continue;
      const bandH=yBot-yTop;
      const pct=Math.min(100,Math.max(0,v))/100;
      const y=yBot-pct*bandH;
      CX.fillText(Math.round(v)+'%',xOf(i),isMax?y-4:y+10);
    }
    // also show current hover or midpoint summary
    CX.restore();
  }
  cloudLabels(clH,kmToY(10),kmToY(6.5),'rgba(200,225,255,0.9)');
  cloudLabels(clM,kmToY(6.5),kmToY(2),'rgba(170,190,230,0.9)');
  cloudLabels(clL,kmToY(2),kmToY(0),'rgba(130,155,210,0.9)');

  // current hover percentage labels on right side
  const hi=hoverIdx!==null?hoverIdx:getSlice().split;
  CX.save();CX.textAlign='right';CX.font='bold 8px sans-serif';
  const labX=CV.width-L.pR-2;
  CX.fillStyle='rgba(200,225,255,0.8)';CX.fillText('H:'+Math.round(clH[hi])+'%',labX,kmToY(8)+3);
  CX.fillStyle='rgba(170,190,230,0.8)';CX.fillText('M:'+Math.round(clM[hi])+'%',labX,kmToY(4.2)+3);
  CX.fillStyle='rgba(130,155,210,0.8)';CX.fillText('L:'+Math.round(clL[hi])+'%',labX,kmToY(1)+3);
  CX.fillStyle='rgba(220,235,255,0.9)';CX.fillText('∑:'+Math.round(clT[hi])+'%',labX,kmToY(0)-8);
  CX.restore();

  // precip bars integrated below cloud
  const pr=idxs.map(i=>h.precipitation[i]);
  const sn=idxs.map(i=>h.snowfall[i]);
  const maxPr=Math.max(...pr,...sn,0.5);
  const PRECIP_H_C=28;
  const pTop2=cBot,pBot2=cBot+PRECIP_H_C;
  const barW=Math.max(1,(CV.width-L.pL-L.pR)/(L.total)-0.5);
  CX.save();
  for(let i=0;i<L.total;i++){
    const x=xOf(i)-barW/2;
    const rainH=(pr[i]||0)/maxPr*(pBot2-pTop2);
    const snowH=(sn[i]||0)/maxPr*(pBot2-pTop2);
    if(rainH>0.2){CX.fillStyle='rgba(60,140,255,0.75)';CX.fillRect(x,pBot2-rainH,barW,rainH);}
    if(snowH>0.2){CX.fillStyle='rgba(180,220,255,0.65)';CX.fillRect(x,pBot2-rainH-snowH,barW,snowH);}
  }
  CX.strokeStyle='rgba(30,60,100,0.45)';CX.lineWidth=1;
  CX.beginPath();CX.moveTo(L.pL,pTop2);CX.lineTo(CV.width-L.pR,pTop2);CX.stroke();
  CX.textAlign='left';CX.font='9px sans-serif';CX.fillStyle='#3c7aaa';
  CX.fillText(maxPr.toFixed(1)+'mm',CV.width-L.pR+2,pTop2+8);
  CX.restore();

  setLegend([{color:'#c8deff',label:'Vysoká >6.5km',dash:false},{color:'#8090b8',label:'Střední 2–6.5km',dash:false},{color:'#506098',label:'Nízká 0–2km',dash:false},{color:'#3c8cff',label:'Srážky mm',dash:false}]);
}

// ═══ HUM CHART ═══
function drawHum(L,idxs,h,xOf,cTop,cBot,split){
  L_PAD=L.pL;R_PAD=L.pR;
  const hu=idxs.map(i=>h.relative_humidity_2m[i]);
  const dp=idxs.map(i=>h.dewpoint_2m[i]);
  const mn=0,mx=100;
  const dpMn=Math.min(...dp)-2,dpMx=Math.max(...dp)+2;

  const grad=CX.createLinearGradient(0,cTop,0,cBot);
  grad.addColorStop(0,'rgba(60,200,240,0.55)');grad.addColorStop(1,'rgba(60,200,240,0.02)');
  drawFilledLine(hu,xOf,cTop,cBot,mn,mx,'#3cc8f0',grad,null);
  drawFilledLine(hu.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,null);
  drawFilledLine(hu.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,[6,4]);
  drawFilledLine(dp.map((v,i)=>i<=split?v:null),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,null);
  drawFilledLine(dp.map((v,i)=>i>=split?v:null),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,[4,4]);

  drawDataLabels(hu,xOf,cTop,cBot,mn,mx,'%','rgba(100,220,250,0.9)');
  drawDataLabels(dp,xOf,cTop,cBot,dpMn,dpMx,'°','rgba(160,224,255,0.88)');
  drawLeftAxisFull(mn,mx,cTop,cBot,'%','#5090a0');

  setLegend([{color:'#3cc8f0',label:'Vlhkost %',dash:false},{color:'#a0e0ff',label:'Rosný bod °C',dash:false}]);
}

// ═══ LEGEND ═══
function setLegend(items){
  document.getElementById('legendBar').innerHTML=items.map(it=>`<div class="leg"><div class="leg-swatch" style="${it.dash?'background:repeating-linear-gradient(90deg,'+it.color+' 0,'+it.color+' 4px,transparent 4px,transparent 8px)':'background:'+it.color}"></div>${it.label}</div>`).join('');
}
</script>
