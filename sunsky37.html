<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUN-SKY (by PF)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080c14;color:#d8eaff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
.hdr{display:flex;align-items:center;gap:8px;padding:8px 10px 5px;border-bottom:1px solid #1e3050}
.hdr-title{font-size:15px;font-weight:700;color:#f0f6ff;flex:1}
.hdr-time{font-size:11px;color:#6a8ab0;font-variant-numeric:tabular-nums}
.loc-bar{padding:5px 8px;border-bottom:1px solid #1e3050;display:flex;flex-direction:column;gap:4px}
.loc-row{display:flex;gap:5px;align-items:center}
.loc-input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:6px 9px;font-size:13px;outline:none;min-width:0}
.loc-input::placeholder{color:#3a5a7a}
.loc-input:focus{border-color:#3a6aaa}
.loc-btn{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1;display:flex;align-items:center;gap:3px}
.loc-btn:active{background:#1a2840}
.gps-row{display:flex;gap:5px;align-items:center}
.gps-row input{flex:1;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;color:#d8eaff;padding:6px 9px;font-size:13px;outline:none;min-width:0}
.gps-go{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0}
.font-btn{background:#1a3a70;border:none;border-radius:8px;color:#90c8ff;padding:6px 8px;cursor:pointer;font-weight:700;flex-shrink:0;line-height:1}
.fl{display:inline-block;transition:color .15s}
.fl.active-letter{color:#ff4444}
.sug-box{background:#0e1a2e;border:1px solid #243a60;border-radius:8px;overflow:hidden;display:none;max-height:240px;overflow-y:auto;position:relative;z-index:50}
.sug-box.open{display:block}
.sug-section{font-size:10px;color:#3a5a7a;padding:3px 10px 2px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid #142030}
.sug-section:first-child{border-top:none}
.sug-item{padding:8px 10px;font-size:13px;color:#b0cce8;cursor:pointer;border-bottom:1px solid #0e1a2e;display:flex;align-items:center;gap:6px}
.sug-item:hover,.sug-item:active{background:#142030}
.sug-item b{color:#60b8ff}
.sug-sub{font-size:11px;color:#486080;flex:1}
.sug-coords{font-size:10px;color:#2a4060;margin-left:auto}
.pin-btn{width:16px;flex-shrink:0;cursor:pointer;font-size:12px;opacity:0.35;user-select:none}
.pin-btn.pinned{opacity:1}
.recent-chips{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.recent-chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:#0e1a2e;border:1px solid #243a60;border-radius:20px;padding:2px 7px 2px 4px;font-size:11px;color:#90b8d8;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip:hover{background:#142030}
.chip-pin{font-size:10px;opacity:.35}
.chip-pin.pinned{opacity:1}
.chip-del{font-size:9px;opacity:.35;margin-left:1px}
.chip-del:hover{opacity:.8;color:#ff6060}
.overlay-popup{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,10,20,.93);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
.overlay-popup.open{display:flex}
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:380px;width:100%}
.lang-item{background:#0e1a2e;border:1px solid #243a60;border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;font-size:12px;color:#b0cce8;display:flex;flex-direction:column;align-items:center;gap:3px}
.lang-item:hover,.lang-item.active{background:#1a3060;border-color:#3a6aaa}
.lang-flag{font-size:20px;line-height:1}
.popup-close{background:#1a2840;border:1px solid #243a60;border-radius:8px;color:#90b8e0;padding:7px 22px;font-size:13px;cursor:pointer;margin-top:6px}
/* METRIC TILES */
.metrics-outer{border-bottom:1px solid #1e3050;background:#090f1c;position:relative}
.metrics-scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.metrics-scroll::-webkit-scrollbar{display:none}
.metrics-inner{display:flex;padding:4px 4px 2px;gap:0;width:max-content}
.mtile{flex:0 0 auto;width:calc(20vw - 4px);max-width:98px;min-width:62px;border:2px solid transparent;border-radius:10px;margin:0 3px;padding:5px 4px;cursor:pointer;transition:border-color .18s;user-select:none;position:relative;overflow:hidden}
.mtile:active{filter:brightness(1.2)}
.mtile.active{border-color:#58b0ff;box-shadow:0 0 12px rgba(88,176,255,.28)}
.mtile-icon{font-size:11px;margin-bottom:1px;position:relative;z-index:1}
.mtile-label{font-size:9px;font-weight:600;color:#a0c0d8;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px;position:relative;z-index:1}
.mtile.active .mtile-label{color:#5ab0ff}
.mtile-val{font-size:14px;font-weight:700;color:#f0f8ff;font-variant-numeric:tabular-nums;line-height:1;position:relative;z-index:1}
.mtile-sub{font-size:9px;color:#90b8d8;margin-top:1px;font-variant-numeric:tabular-nums;position:relative;z-index:1;white-space:normal;overflow:visible;word-break:break-word;line-height:1.2;max-width:100%}
.mtile-unit{font-size:7px;color:#3a5a80;margin-top:1px;position:relative;z-index:1}
.metric-time-bar{display:flex;align-items:center;padding:2px 6px 3px;border-top:1px solid #1e3050;background:#090f1c;min-height:22px}
.metric-time-bar .mtime{flex:1;text-align:center;font-size:10px;color:#507090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-time-bar .bar-btns{display:flex;gap:4px;flex-shrink:0}
.bar-btn{background:#14243a;color:#9fd0ff;border:1px solid #345070;border-radius:6px;padding:1px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
#cubeWrap{flex:1;overflow:hidden;position:relative}
#chartCanvas{display:block;width:100%;touch-action:none;flex:1;min-height:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#chartSection{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform,opacity;user-select:none;-webkit-user-select:none;}
.legend-bar{display:flex;gap:6px;flex-wrap:wrap;padding:3px 8px 4px;background:#080c14;height:22px;min-height:22px;max-height:22px;flex-shrink:0;border-top:1px solid #111820;overflow:hidden}
.leg{display:flex;align-items:center;gap:3px;font-size:10px;color:#8090a8}
.leg-swatch{width:14px;height:2px;flex-shrink:0}
.state{text-align:center;padding:40px 20px;color:#507090;font-size:13px;line-height:1.8}
.state-ico{font-size:36px;margin-bottom:10px}
.status{font-size:10px;color:#1e3050;padding:2px 10px 3px;text-align:right}
.datasrc{text-align:center;font-size:10px;color:#4e6c90;padding-bottom:6px}
.pf-logo{position:fixed;bottom:6px;left:8px;z-index:100;opacity:.4;pointer-events:none}
.pf-cloud{background:#2a3a50;border-radius:8px;padding:2px 5px 2px 3px;font-size:10px;font-weight:700;color:#d4b820;display:flex;align-items:center;gap:2px}
.extra-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:320px;max-height:70vh;overflow-y:auto}
.extra-item{display:flex;align-items:center;gap:10px;background:#0e1a2e;border:1px solid #243a60;border-radius:8px;padding:8px 12px;cursor:pointer}
.extra-item input[type=checkbox]{width:16px;height:16px;accent-color:#5ab0ff;cursor:pointer;flex-shrink:0}
.extra-item label{font-size:13px;color:#b0cce8;cursor:pointer;flex:1}
</style>
</head>

      <button class="loc-btn" id="langBtn"><span id="langFlag">🇨🇿</span><span id="langCode" style="font-size:10px;margin-left:2px">CZ</span></button>

    <div class="sug-box" id="sugBox"></div>
    <div class="recent-chips" id="recentChips"></div>
    <div class="gps-row">

      <input class="loc-input" id="lonIn" placeholder="Zemědelšířka" type="number" step="0.0001">
      <button class="gps-go" id="goBtn">GO</button>
      <button class="font-btn" id="fontBtn"></button>
    </div>
  </div>
  <div class="metrics-outer" id="metricsWrap" style="display:none">
    <div class="metrics-scroll" id="metricsScroll"><div class="metrics-inner" id="metricsTiles"></div></div>
    <div class="metric-time-bar">

    </div>
  </div>
  <div id="cubeWrap" style="display:none">
    <div id="chartSection">
      <canvas id="chartCanvas"></canvas>
      <div class="legend-bar" id="legendBar"></div>
    </div>
  </div>
  <div class="state" id="stateDiv">
    <div class="state-ico">🔍</div>
    <span id="stateMsg">Zadej název obce, použij GPS nebo zadej souřadnice</span>
  </div>
  <div class="status" id="statusBar"></div>
  <div class="datasrc" id="dataSrc">Data: Open-Meteo / ECMWF / ICON / GFS</div>
  <div class="overlay-popup" id="langPopup">
    <div style="font-size:13px;color:#90b8d8;margin-bottom:4px">Vyberte jazyk / Select language</div>
    <div class="lang-grid" id="langGrid"></div>
    <button class="popup-close" id="langClose">✕</button>
  </div>
  <div class="overlay-popup" id="extraPopup">
    <div style="font-size:13px;color:#90b8d8;margin-bottom:4px" id="extraTitle">Volitelné grafy</div>
    <div class="extra-list" id="extraList"></div>
    <button class="popup-close" id="extraClose">✕ OK</button>
  </div>
</div>
<div class="pf-logo"><div class="pf-cloud"><span style="color:#f0c010">⚡</span>PF<span style="color:#f0a010;font-size:9px">☀</span></div></div>

function getRecent(){try{return JSON.parse(localStorage.getItem('recentLocations')||'[]');}catch(e){return[];}}
function saveRecent(arr){localStorage.setItem('recentLocations',JSON.stringify(arr));}
function escQ(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function renderRecentChips(){
  var rc=document.getElementById('recentChips');
  var arr=getRecent();if(!arr.length){rc.innerHTML='';return;}
  var sorted=arr.filter(function(i){return i.pinned;}).concat(arr.filter(function(i){return !i.pinned;}));
  rc.innerHTML=sorted.map(function(loc){
    var short=loc.name.split(',')[0].trim();
    return '<div class="chip"><span class="chip-pin'+(loc.pinned?' pinned':'')+'" onclick="togglePin(event,\''+escQ(loc.name)+'\')">📌</span>'
      +'<span onclick="chipLoad(\''+escQ(loc.name)+'\')">'+short+'</span>'
      +'<span class="chip-del" onclick="removeRecent(event,\''+escQ(loc.name)+'\')">✕</span></div>';
  }).join('');
}
function chipLoad(name){
  var loc=getRecent().filter(function(l){return l.name===name;})[0];if(!loc)return;
  document.getElementById('cityQ').value=loc.name;
  document.getElementById('latIn').value=loc.lat;
  document.getElementById('lonIn').value=loc.lon;
  closeSug();loadWeather(parseFloat(loc.lat),parseFloat(loc.lon),loc.name);
}
function togglePin(e,name){
  e.stopPropagation();
  var arr=getRecent();var loc=arr.filter(function(l){return l.name===name;})[0];if(!loc)return;
  if(!loc.pinned&&arr.filter(function(l){return l.pinned&&l.name!==name;}).length>=10){alert('Max. 10!');return;}
  loc.pinned=!loc.pinned;saveRecent(arr);renderRecentChips();
}
function removeRecent(e,name){e.stopPropagation();saveRecent(getRecent().filter(function(l){return l.name!==name;}));renderRecentChips();}
function addToRecent(lat,lon,name){
  var arr=getRecent();
  var existing=arr.filter(function(i){return i.name===name;})[0];
  var wasPinned=existing?existing.pinned:false;
  arr=arr.filter(function(i){return i.name!==name;});
  arr.unshift({name:name,lat:lat,lon:lon,pinned:wasPinned,time:Date.now()});
  var p=arr.filter(function(i){return i.pinned;}),u=arr.filter(function(i){return !i.pinned;}).slice(0,20);
  saveRecent(p.concat(u));renderRecentChips();
}

function showRecentInSug(){
  var arr=getRecent();if(!arr.length){closeSug();return;}
  var p=arr.filter(function(i){return i.pinned;}),u=arr.filter(function(i){return !i.pinned;});
  var h='';

function rRI(loc){
  return '<div class="sug-item" data-lat="'+loc.lat+'" data-lon="'+loc.lon+'" data-name="'+loc.name+'" onclick="pickSug(this)">'
    +'<span class="pin-btn'+(loc.pinned?' pinned':'')+'" onclick="tPS(event,\''+escQ(loc.name)+'\')">📌</span>'
    +'<b>'+loc.name.split(',')[0]+'</b><span class="sug-sub">'+loc.name.split(',').slice(1).join(',')+'</span>'

function doSearch(q){
  if(q.length<2)return;
  openSug('<div class="sug-item"><span style="color:#507090">…</span></div>');
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=10&language='+activeLang.code.split('-')[0]+'&format=json')
    .then(function(r){return r.json();})
    .then(function(data){
      var hits=data.results||[];if(!hits.length){openSug('<div class="sug-item"><span style="color:#507090">–</span></div>');return;}
      openSug(hits.map(function(d){
        var sub=[d.admin2&&d.admin2!==d.name?d.admin2:'',d.admin1||'',d.country||''].filter(Boolean).join(', ');

function useGPS(){
  if(!navigator.geolocation){setState('🚫','GPS není dostupná');return;}
  setState('📡','…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    document.getElementById('latIn').value=lat.toFixed(5);
    document.getElementById('lonIn').value=lon.toFixed(5);
    reverseGeocode(lat,lon);
  },function(err){setState('❌',{1:'Zamítnuto.',2:'Nedostupné.',3:'Vypršel.'}[err.code]||'Chyba GPS');},{enableHighAccuracy:true,timeout:15000});
}
function reverseGeocode(lat,lon){
  fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+activeLang.code.split('-')[0])
    .then(function(r){return r.json();})
    .then(function(d){var name=d.locality||d.city||d.principalSubdivision||(lat.toFixed(3)+','+lon.toFixed(3));cityQ.value=name;loadWeather(lat,lon,name+' (GPS)');})
    .catch(function(){loadWeather(lat,lon,'GPS '+lat.toFixed(3)+','+lon.toFixed(3));});

function useCoords(){

}

// ══ LOAD ═══════════════════════════════════════════════
function loadWeather(lat,lon,name){
  setState('⏳','…');
  var extraFields=[];
  if(enabledExtras.indexOf('vis')>=0)extraFields.push('visibility');
  if(enabledExtras.indexOf('wetbulb')>=0)extraFields.push('wet_bulb_temperature_2m');
  if(enabledExtras.indexOf('solar')>=0)extraFields.push('shortwave_radiation');
  if(enabledExtras.indexOf('snow')>=0)extraFields.push('snow_depth');
  if(enabledExtras.indexOf('soil')>=0)extraFields.push('soil_moisture_0_to_1cm');
  var hourlyBase='temperature_2m,apparent_temperature,relative_humidity_2m,dewpoint_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,snowfall,'
    +'cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,weathercode,is_day,uv_index';
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&hourly='+hourlyBase+(extraFields.length?','+extraFields.join(','):'')
    +'&daily=sunrise,sunset'
    +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,'
    +'wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation,weathercode,is_day'
    +'&forecast_days=4&past_days=1&timezone=auto';
  fetch(url)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      WD=data;scrollOffset=0;hoverIdx=null;
      buildMetricTiles();
      updateMetrics(null);
      document.getElementById('metricsWrap').style.display='block';
      document.getElementById('cubeWrap').style.display='block';
      document.getElementById('stateDiv').style.display='none';
      document.getElementById('dataSrc').textContent=T('data')+' · '+lat.toFixed(3)+', '+lon.toFixed(3);
      initCanvas();draw();
      setStatus('✓ '+name+' · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
      addToRecent(lat,lon,name);
      localStorage.setItem('lastLocation',JSON.stringify({lat:lat,lon:lon,name:name}));
      updateCloudModeBtn();
      scrollTileToActive();
    })
    .catch(function(e){setState('⚠️','Chyba: '+e.message);});
}

function updateMetrics(idx){
  if(!WD)return;
  var h=WD.hourly,c=WD.current,hi,timeStr;
  if(idx===null){
    hi=Math.max(0,h.time.findIndex(function(t){return new Date(t)>Date.now();})-1);
    timeStr=T('now');
  }else{
    hi=getSlice().s+idx;
    var d=new Date(h.time[hi]);
    timeStr=d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }
  var t=idx===null?c.temperature_2m:h.temperature_2m[hi];
  var feel=idx===null?c.apparent_temperature:h.apparent_temperature[hi];
  var ws=idx===null?c.wind_speed_10m:h.wind_speed_10m[hi];
  var wg=idx===null?c.wind_gusts_10m:h.wind_gusts_10m[hi];
  var hum=idx===null?c.relative_humidity_2m:h.relative_humidity_2m[hi];
  var dew=h.dewpoint_2m[hi],pres=idx===null?c.surface_pressure:h.surface_pressure[hi];
  var cloud=idx===null?c.cloud_cover:h.cloud_cover[hi];
  var precip=idx===null?c.precipitation:h.precipitation[hi];
  function st(tab,val,sub,unit){
    var v=document.getElementById('mv_'+tab),s=document.getElementById('ms_'+tab),u=document.getElementById('mu_'+tab);
    if(v)v.textContent=val;if(s)s.textContent=sub!==undefined?sub:' ';if(u)u.textContent=unit||'';
  }
  var fs=Math.round(convTemp(feel)),ts=Math.round(convTemp(t));
  st('temp',ts+'',T('feel')+': '+(fs>=0?'+':'')+fs+U('temp'),U('temp'));
  st('wind',fmtWind(ws)+'','▲ '+fmtWind(wg),U('wind'));
  st('cloud',Math.round(cloud)+'%',T('precip')+': '+(precip||0).toFixed(1)+'mm/h','');
  var ds=Math.round(convTemp(dew));
  st('hum',Math.round(hum)+'%',T('dew')+': '+(ds>=0?'+':'')+ds+U('temp'),U('temp'));
  st('pressure',fmtPress(pres)+'','',U('pres'));
  if(h.shortwave_radiation){var uvSub=h.uv_index?'UV '+(h.uv_index[hi]||0).toFixed(1):'';st('solar',Math.round(h.shortwave_radiation[hi]||0)+'',uvSub,'W/m²');}
  if(h.snow_depth)st('snow',((h.snow_depth[hi]||0)*100).toFixed(0)+'cm','','');
  if(h.soil_moisture_0_to_1cm)st('soil',((h.soil_moisture_0_to_1cm[hi]||0)*100).toFixed(0)+'%','','');
  document.getElementById('mTime').textContent=timeStr;
  updateCloudModeBtn();
}

function setState(ico,msg){
  document.getElementById('metricsWrap').style.display='none';
  document.getElementById('cubeWrap').style.display='none';
  var el=document.getElementById('stateDiv');el.style.display='block';
  el.innerHTML='<div class="state-ico">'+ico+'</div><span>'+msg+'</span>';
}
function setStatus(msg){document.getElementById('statusBar').textContent=msg;}

// ══ TAB + CUBE ANIMATION ═══════════════════════════════
function setTab(el){
  var prevTab=currentTab;
  document.querySelectorAll('.mtile').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  var prevIdx=TABS.indexOf(prevTab),newIdx=TABS.indexOf(el.dataset.tab);
  currentTab=el.dataset.tab;
  updateCloudModeBtn();scrollTileToActive();
  if(WD)animateTabChange(prevIdx,newIdx);
}
function switchTabByName(tab){
  if(TABS.indexOf(tab)<0)return;
  var prevIdx=TABS.indexOf(currentTab),newIdx=TABS.indexOf(tab);
  var savedScroll=scrollOffset;
  currentTab=tab;
  document.querySelectorAll('.mtile').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});
  updateCloudModeBtn();scrollTileToActive();
  scrollOffset=savedScroll; // keep position so red line stays fixed
  if(WD)animateTabChange(prevIdx,newIdx);
}
function animateTabChange(prevIdx,newIdx){
  var cs=document.getElementById('chartSection');
  var dir=newIdx>=prevIdx?1:-1;
  var dur=400;
  cs.style.transition='transform '+dur+'ms cubic-bezier(0.4,0,0.6,1),opacity '+dur+'ms ease';
  cs.style.transform=dir>0?'perspective(700px) rotateY(-90deg)':'perspective(700px) rotateY(90deg)';
  cs.style.opacity='0';
  setTimeout(function(){
    draw();
    cs.style.transition='none';
    cs.style.transform=dir>0?'perspective(700px) rotateY(90deg)':'perspective(700px) rotateY(-90deg)';
    cs.style.opacity='0';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      cs.style.transition='transform '+dur+'ms cubic-bezier(0.4,0,0.2,1),opacity '+dur+'ms ease';
      cs.style.transform='perspective(700px) rotateY(0deg)';
      cs.style.opacity='1';
    });});
  },dur+10);
}

// ══ SLICE ══════════════════════════════════════════════
function getSlice(){
  var times=WD.hourly.time,nowMs=Date.now();
  var cur=times.findIndex(function(t){return new Date(t).getTime()>nowMs;})-1;
  if(cur<0)cur=0;
  var total=times.length;
  var back=10+scrollOffset;if(back<0)back=0;
  var s=Math.max(0,cur-back);
  if(s+hoursVisible>total)s=Math.max(0,total-hoursVisible);
  var e=Math.min(total-1,s+hoursVisible-1);
  return{s:s,e:e,cur:cur,split:cur-s};
}

// ══ CANVAS ═════════════════════════════════════════════
function initCanvas(){
  if(CV)return;
  CV=document.getElementById('chartCanvas');CX=CV.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',function(){resizeCanvas();if(WD)draw();});
  CV.addEventListener('mousemove',function(e){if(!WD)return;var r=CV.getBoundingClientRect();setHoverX(e.clientX-r.left);});
  CV.addEventListener('mouseleave',function(){hoverIdx=null;if(WD)draw();updateMetrics(null);});
  CV.addEventListener('touchstart',onTS,{passive:false});
  CV.addEventListener('touchmove',onTM,{passive:false});
  CV.addEventListener('touchend',onTE,{passive:false});
  CV.addEventListener('touchcancel',onTE,{passive:false});
}
var _dpr=1;
function resizeCanvas(){
  var wrap=document.getElementById('cubeWrap');
  _dpr=window.devicePixelRatio||1;
  var cW=wrap.offsetWidth;
  var cH=Math.max(wrap.offsetHeight-22-4,140);
  CV.width=Math.round(cW*_dpr);
  CV.height=Math.round(cH*_dpr);
  CV.style.width=cW+'px';
  CV.style.height=cH+'px';
  CX.setTransform(_dpr,0,0,_dpr,0,0);
}

// ══ TOUCH ══════════════════════════════════════════════
// State
var txStart=null,tyStart=null,tTimeStart=0;
var pinchDist0=null,pinchHours0=null,pinchMidX0=null,pinchScrollOffset0=null;
var gestureResolved=false,gesturePan=false,gestureHover=false,gestureAxisPan=false;
var panOffset0=0,holdTimer=null;

function getTimeAxisY(){
  var fs=chartFS();
  var pL=Math.round(44+fs*0.8);
  var ICON_H=18,ARROW_H=(currentTab==='wind'?13:0),PRECIP_H=22;
  var topPad=ICON_H+ARROW_H+PRECIP_H+2;
  var H=cssH();
  var TIME_H=24;
  return topPad+Math.max(H-topPad-TIME_H,60);
}

function onTS(e){
  e.preventDefault();
  if(e.touches.length===2){
    // Pinch start — record midpoint and current scroll
    clearTimeout(holdTimer);
    var t0=e.touches[0],t1=e.touches[1];
    pinchDist0=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);
    pinchHours0=hoursVisible;
    var r=CV.getBoundingClientRect();
    pinchMidX0=((t0.clientX+t1.clientX)/2)-r.left; // CSS px midpoint
    pinchScrollOffset0=scrollOffset;
    txStart=null;gestureResolved=true;gesturePan=false;gestureHover=false;gestureAxisPan=false;
    return;
  }
  // Single touch start
  var t=e.touches[0];
  txStart=t.clientX;tyStart=t.clientY;tTimeStart=Date.now();
  gestureResolved=false;gesturePan=false;gestureHover=false;gestureAxisPan=false;
  pinchDist0=null;panOffset0=scrollOffset;
  clearTimeout(holdTimer);
  holdTimer=setTimeout(function(){
    if(!gesturePan&&!gestureAxisPan&&txStart!==null){
      gestureHover=true;gestureResolved=true;
      var r=CV.getBoundingClientRect();
      setHoverX(txStart-r.left);
    }
  },260);
}

function onTM(e){
  e.preventDefault();
  if(!WD)return;

  // ── Pinch zoom ─────────────────────────────────────────
  if(e.touches.length===2&&pinchDist0!==null){
    clearTimeout(holdTimer);
    var t0=e.touches[0],t1=e.touches[1];
    var d=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);
    var scale=pinchDist0/d;
    var newHours=Math.round(Math.max(HOURS_MIN,Math.min(HOURS_MAX,pinchHours0*scale)));
    var L=getLayout();
    var chartW=cssW()-L.pL-L.pR;
    var r=CV.getBoundingClientRect();
    var midX=((t0.clientX+t1.clientX)/2)-r.left;
    var frac=Math.max(0,Math.min(1,(midX-L.pL)/chartW));
    // absolute time index under pinch midpoint at start
    var sl0=getSliceFor(pinchHours0,pinchScrollOffset0);
    var midAbsIdx=sl0.s+frac*(sl0.e-sl0.s);
    // new s so that midAbsIdx is still at frac of new window
    var newS=Math.round(midAbsIdx-frac*newHours);
    // convert newS back to scrollOffset
    var times=WD.hourly.time,nowMs=Date.now();
    var cur=Math.max(0,times.findIndex(function(t){return new Date(t).getTime()>nowMs;})-1);
    scrollOffset=(cur-10)-newS; // back = 10+scrollOffset => newS = cur-(10+scrollOffset)
    hoursVisible=newHours;
    hoverIdx=null;draw();
    return;
  }

  if(e.touches.length!==1||txStart===null)return;
  var tx=e.touches[0].clientX,ty=e.touches[0].clientY;
  var dx=tx-txStart,dy=ty-tyStart,dt=Date.now()-tTimeStart;
  var r=CV.getBoundingClientRect();
  var touchY=ty-r.top;
  var axisY=getTimeAxisY();

  // ── Resolve gesture type ───────────────────────────────
  if(!gestureResolved&&(Math.abs(dx)>8||Math.abs(dy)>8)){
    clearTimeout(holdTimer);gestureResolved=true;
    var hori=Math.abs(dx)>Math.abs(dy)*1.2;
    if(hori&&Math.abs(touchY-axisY)<32){
      gestureAxisPan=true;
    } else if(hori){
      gesturePan=true; // always pan horizontally; swipe check in onTE overrides if fast+short
    } else {
      gestureHover=true;
    }
  }

  // ── Axis pan (finger on time axis) ────────────────────
  if(gestureAxisPan){
    var sl=getSlice(),chartW=cssW()-L_PAD-R_PAD;
    var pxPerHour=chartW/Math.max(1,sl.e-sl.s);
    scrollOffset=Math.max(-10,Math.min(WD.hourly.time.length-hoursVisible,
      panOffset0+Math.round(-(tx-txStart)/pxPerHour)));
    hoverIdx=null;draw();
    return;
  }

  // ── Chart pan (finger on chart area) ──────────────────
  if(gesturePan){
    var sl=getSlice(),chartW=cssW()-L_PAD-R_PAD;
    var pxPerHour=chartW/Math.max(1,sl.e-sl.s);
    scrollOffset=Math.max(-10,Math.min(WD.hourly.time.length-hoursVisible,
      panOffset0+Math.round(-(tx-txStart)/pxPerHour)));
    hoverIdx=null;draw();
    return;
  }

  // ── Hover / crosshair ─────────────────────────────────
  if(gestureHover){
    setHoverX(tx-r.left);
  }
}

function onTE(e){
  clearTimeout(holdTimer);
  if(e.changedTouches.length===1&&txStart!==null){
    var dx=e.changedTouches[0].clientX-txStart,dy=e.changedTouches[0].clientY-tyStart,dt=Date.now()-tTimeStart;
    // Swipe to change tab: fast (< 350ms), wide (> 55px), horizontal, not a pan that moved > 30% of screen
    var isSwipe=Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.8&&dt<350&&!gestureAxisPan;
    if(isSwipe&&!gestureHover){
      var savedScroll=scrollOffset; // preserve position across tab switch
      var ti=TABS.indexOf(currentTab);
      if(dx<0)switchTabByName(TABS[(ti+1)%TABS.length]);
      else switchTabByName(TABS[(ti-1+TABS.length)%TABS.length]);
      scrollOffset=savedScroll; // restore so red line stays in same position
      txStart=null;gestureResolved=false;gesturePan=false;gestureHover=false;gestureAxisPan=false;
      if(WD)updateMetrics(null);return;
    }
  }
  if(gesturePan||gestureAxisPan)panOffset0=scrollOffset;
  hoverIdx=null;txStart=null;pinchDist0=null;
  gestureResolved=false;gesturePan=false;gestureHover=false;gestureAxisPan=false;
  if(WD){draw();updateMetrics(null);}
}

// Helper: compute slice for arbitrary hours/offset (for pinch math)
function getSliceFor(hours,offset){
  var times=WD.hourly.time,nowMs=Date.now();
  var cur=Math.max(0,times.findIndex(function(t){return new Date(t).getTime()>nowMs;})-1);
  var total=times.length;
  var back=10+offset;if(back<0)back=0;
  var s=Math.max(0,cur-back);
  if(s+hours>total)s=Math.max(0,total-hours);
  var e=Math.min(total-1,s+hours-1);
  return{s:s,e:e,cur:cur,split:cur-s};
}

function setHoverX(mx){
  var L=getLayout(),sl=getSlice(),total=sl.e-sl.s+1;
  var idx=Math.round((mx-L.pL)/(cssW()-L.pL-L.pR)*(total-1));
  idx=Math.max(0,Math.min(total-1,idx));
  if(idx!==hoverIdx){hoverIdx=idx;draw();updateMetrics(idx);}
}
function cssW(){return parseInt(CV.style.width)||(CV.width/(window.devicePixelRatio||1));}
function cssH(){return parseInt(CV.style.height)||(CV.height/(window.devicePixelRatio||1));}

// ══ LAYOUT ═════════════════════════════════════════════
function getLayout(){
  var W=cssW(),H=cssH();
  var fs=chartFS();
  var cloudExtra=(currentTab==='cloud')?Math.max(10,fs):0;
  var pL=Math.round(44+fs*0.8+cloudExtra),pR=Math.round(38+fs*0.8);
  var TIME_H=Math.max(28,fs*3+6),ICON_H=18,ARROW_H=(currentTab==='wind'?13:0),PRECIP_H=22;
  var topPad=ICON_H+ARROW_H+PRECIP_H+2;
  var chartH=H-topPad-TIME_H;
  var sl=getSlice(),total=sl.e-sl.s+1;
  return{W:W,H:H,pL:pL,pR:pR,TIME_H:TIME_H,ICON_H:ICON_H,ARROW_H:ARROW_H,PRECIP_H:PRECIP_H,topPad:topPad,chartH:Math.max(chartH,60),total:total,s:sl.s,e:sl.e};
}

// ══ DRAW ═══════════════════════════════════════════════
function draw(){
  if(!CV||!WD)return;
  CX.setTransform(_dpr,0,0,_dpr,0,0);
  // Clear temp icon overlay when not on temp
  if(currentTab!=='temp'){var ov=document.getElementById('chartIconOverlay');if(ov)ov.innerHTML='';}
  var W=cssW(),H=cssH();
  CX.clearRect(0,0,W,H);
  var L=getLayout(),sl=getSlice(),h=WD.hourly;
  L_PAD=L.pL;R_PAD=L.pR;
  var idxs=[];for(var i=0;i<L.total;i++)idxs.push(L.s+i);
  function xOf(i){return L.pL+i*(W-L.pL-L.pR)/Math.max(1,L.total-1);}
  drawPrecipTop(L,idxs,h,xOf);
  drawIconRow(L,idxs,h,xOf);
  if(currentTab==='wind')drawWindArrows(L,idxs,h,xOf);
  var cTop=L.topPad,cBot=L.topPad+L.chartH;
  drawMidnightLines(idxs,cTop,cBot,xOf);
  if(currentTab==='temp')drawTemp(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='wind')drawWind(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='cloud'){if(cloudMode==='A')drawCloud(L,idxs,h,xOf,cTop,cBot,sl.split);else drawCloudB(L,idxs,h,xOf,cTop,cBot,sl.split);}
  else if(currentTab==='hum')drawHum(L,idxs,h,xOf,cTop,cBot,sl.split);
  else if(currentTab==='pressure')drawPressure(L,idxs,h,xOf,cTop,cBot,sl.split);
  else drawExtraGraph(currentTab,L,idxs,h,xOf,cTop,cBot,sl.split);
  drawNowLine(sl.split,cTop,cBot,xOf); // always on top of chart content
  drawTimeAxis(L,idxs,xOf);
  if(hoverIdx!==null)drawCrosshair(hoverIdx,cTop,cBot,xOf,h);
  CX.save();CX.font='bold '+Math.min(W/5,48)+'px sans-serif';CX.fillStyle='rgba(120,160,200,0.055)';
  CX.textAlign='center';CX.textBaseline='middle';CX.fillText('PF',cssW()/2,cTop+(cBot-cTop)/2);CX.restore();
}

// ══ PRECIP TOP ═════════════════════════════════════════
function drawPrecipTop(L,idxs,h,xOf){
  var pr=idxs.map(function(i){return h.precipitation[i]||0;});
  var sn=idxs.map(function(i){return h.snowfall[i]||0;});
  var maxPr=Math.max.apply(null,pr.concat(sn).concat([0.5]));
  var areaTop=L.ICON_H+(currentTab==='wind'?L.ARROW_H:0)+2;
  var barW=Math.max(1,(cssW()-L.pL-L.pR)/L.total-0.5);
  CX.save();
  for(var i=0;i<L.total;i++){
    var x=xOf(i)-barW/2,rH=(pr[i]||0)/maxPr*L.PRECIP_H,sH=(sn[i]||0)/maxPr*L.PRECIP_H;
    if(rH>0.3){CX.fillStyle='rgba(60,140,255,0.75)';CX.fillRect(x,areaTop,barW,rH);}
    if(sH>0.3){CX.fillStyle='rgba(210,235,255,0.7)';CX.fillRect(x,areaTop+rH,barW,sH);}
  }
  CX.strokeStyle='rgba(30,60,100,0.3)';CX.lineWidth=1;
  CX.beginPath();CX.moveTo(L.pL,areaTop);CX.lineTo(cssW()-R_PAD,areaTop);CX.stroke();
  CX.textAlign='left';CX.font='7px sans-serif';CX.fillStyle='#3c7aaa';
  CX.fillText(maxPr.toFixed(1)+'mm/h',cssW()-R_PAD+2,areaTop+8);
  CX.restore();
}

// ══ ICON ROW ═══════════════════════════════════════════
function cloudFracIcon(pct,isDay){if(pct<15)return isDay?'☀':'★';if(pct<50)return '⛅';if(pct<85)return '🌥';return '☁';}
function wmoIcon(code,isDay){
  if(code===0)return isDay?'☀':'★';if(code<=2)return isDay?'⛅':'🌥';if(code===3)return '☁';
  if(code<=49)return '🌫';if(code<=57)return '🌦';if(code<=67)return '🌧';
  if(code<=77)return '❄';if(code<=82)return '🌧';if(code<=86)return '❄';return '⛈';
}
function drawIconRow(L,idxs,h,xOf){
  var y=L.ICON_H/2+2,step=(cssW()-L.pL-L.pR)/(L.total-1);
  var every=step<12?6:step<18?3:step<30?2:1;
  CX.save();CX.font='11px sans-serif';CX.textAlign='center';CX.textBaseline='middle';CX.fillStyle='#a0c8e8';
  for(var i=0;i<L.total;i+=every){
    var idx=idxs[i],code=h.weathercode[idx],isDay=h.is_day[idx];
    CX.fillText(code<=1?cloudFracIcon(h.cloud_cover[idx],isDay):wmoIcon(code,isDay),xOf(i),y);
  }
  CX.restore();
}

// ══ WIND ARROWS ════════════════════════════════════════
function drawWindArrows(L,idxs,h,xOf){
  var y=L.ICON_H+L.PRECIP_H+L.ARROW_H/2+2;
  var fs=chartFS();
  var baseR=Math.max(5,fs*0.8); // arrow radius scales with font
  var maxWs=Math.max.apply(null,idxs.map(function(i){return h.wind_speed_10m[i];}).concat([1]));
  var step=(cssW()-L.pL-L.pR)/Math.max(1,L.total-1);
  // Skip arrows so they don't overlap: minimum gap = 2.5× max arrow diameter
  var maxDiam=(baseR+baseR*0.5)*1.2;
  var every=Math.max(1,Math.ceil(maxDiam/step));
  CX.save();
  for(var i=0;i<L.total;i+=every){
    var idx=idxs[i],ws=h.wind_speed_10m[idx],frac=ws/maxWs;
    var r=baseR*(0.7+frac*0.5);
    var x=xOf(i),deg=h.wind_direction_10m[idx];
    var goRad=((deg+180)%360)*Math.PI/180;
    CX.save();CX.translate(x,y);CX.rotate(goRad);
    CX.strokeStyle='rgba(140,190,220,'+(0.4+0.6*frac)+')';
    CX.lineWidth=0.8+frac*1.6;
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(0,r);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(-r*.45,r*.15);CX.stroke();
    CX.beginPath();CX.moveTo(0,-r);CX.lineTo(r*.45,r*.15);CX.stroke();
    CX.restore();
  }
  CX.restore();
}

// ══ MIDNIGHT / NOW ═════════════════════════════════════
function drawMidnightLines(idxs,cTop,cBot,xOf){
  CX.save();CX.setLineDash([4,4]);CX.strokeStyle='rgba(80,130,220,0.32)';CX.lineWidth=1.2;
  for(var i=1;i<idxs.length;i++){if(new Date(WD.hourly.time[idxs[i]]).getHours()===0){CX.beginPath();CX.moveTo(xOf(i),cTop);CX.lineTo(xOf(i),cBot);CX.stroke();}}
  CX.setLineDash([]);CX.restore();
}
function drawNowLine(split,cTop,cBot,xOf){
  if(split<0)return;
  var x=xOf(split);
  var nfs=Math.max(8,chartFS()-1);
  CX.save();
  // glow behind
  CX.strokeStyle='rgba(255,60,60,0.25)';CX.lineWidth=5;CX.setLineDash([]);
  CX.beginPath();CX.moveTo(x,cTop);CX.lineTo(x,cBot);CX.stroke();
  // solid line
  CX.strokeStyle='rgba(255,70,70,0.95)';CX.lineWidth=2;CX.setLineDash([4,3]);
  CX.beginPath();CX.moveTo(x,cTop);CX.lineTo(x,cBot);CX.stroke();CX.setLineDash([]);
  CX.fillStyle='rgba(255,100,100,1.0)';CX.font='bold '+nfs+'px sans-serif';CX.textAlign='left';CX.textBaseline='top';
  CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
  CX.fillText('▼'+T('now'),x+2,cTop);CX.shadowBlur=0;
  CX.restore();
}

// ══ CROSSHAIR – minimal ════════════════════════════════
function drawCrosshair(idx,cTop,cBot,xOf,h){
  var x=xOf(idx);
  CX.save();CX.setLineDash([2,3]);CX.strokeStyle='rgba(200,220,255,0.38)';CX.lineWidth=1;
  CX.beginPath();CX.moveTo(x,cTop);CX.lineTo(x,cBot);CX.stroke();CX.setLineDash([]);
  var hi=getSlice().s+idx;
  var d=new Date(WD.hourly.time[hi]);
  var dayStr=dayName(d.getDay())+' '+String(d.getHours()).padStart(2,'0')+':00';
  var pr=h.precipitation[hi]||0,sn=h.snowfall[hi]||0;
  var lines=[dayStr];
  if(currentTab==='temp'){lines.push(Math.round(convTemp(h.temperature_2m[hi]))+U('temp'),Math.round(convTemp(h.apparent_temperature[hi]))+U('temp'));}
  else if(currentTab==='wind'){lines.push(fmtWind(h.wind_speed_10m[hi])+U('wind'),'▲'+fmtWind(h.wind_gusts_10m[hi]));}
  else if(currentTab==='hum'){lines.push(Math.round(h.relative_humidity_2m[hi])+'%',Math.round(convTemp(h.dewpoint_2m[hi]))+U('temp'));}
  else if(currentTab==='pressure'){lines.push(fmtPress(h.surface_pressure[hi])+' '+U('pres'));}
  else if(currentTab==='cloud'){lines.push('H:'+Math.round(h.cloud_cover_high[hi])+'%','M:'+Math.round(h.cloud_cover_mid[hi])+'%','L:'+Math.round(h.cloud_cover_low[hi])+'%','∑:'+Math.round(h.cloud_cover[hi])+'%');}
  else if(currentTab==='vis'&&h.visibility){lines.push(T('vis')+': '+convDist((h.visibility[hi]||0)/1000).toFixed(0)+' '+U('dist'));}
  else if(currentTab==='wetbulb'&&h.wet_bulb_temperature_2m){lines.push(T('wetbulb')+': '+Math.round(convTemp(h.wet_bulb_temperature_2m[hi]))+U('temp'));}
  else if(currentTab==='solar'&&h.shortwave_radiation){lines.push(T('solar')+': '+Math.round(h.shortwave_radiation[hi])+' W/m²');if(h.uv_index)lines.push('UV: '+(h.uv_index[hi]||0).toFixed(1));}
  else if(currentTab==='snow'&&h.snow_depth){lines.push(T('snow')+': '+((h.snow_depth[hi]||0)*100).toFixed(0)+' cm');}
  else if(currentTab==='soil'&&h.soil_moisture_0_to_1cm){lines.push(T('soil')+': '+((h.soil_moisture_0_to_1cm[hi]||0)*100).toFixed(0)+'%');}
  if(pr>0.05)lines.push('🌧'+pr.toFixed(1)+'mm/h');
  if(sn>0.05)lines.push('❄'+sn.toFixed(1)+'cm');
  var fs=Math.max(10,chartFS());
  CX.font='bold '+fs+'px sans-serif';
  var alignRight=x>cssW()*0.58;
  var tx=alignRight?x-5:x+5;
  CX.textBaseline='top';
  CX.shadowColor='rgba(4,10,22,0.98)';CX.shadowBlur=5;

    CX.textAlign=alignRight?'right':'left';
    CX.fillText(l,tx,cTop+5+i*(fs+3));
  });
  CX.shadowBlur=0;
  CX.restore();
}

// ══ DRAW HELPERS ═══════════════════════════════════════
function valToY(v,mn,mx,cTop,cBot){return cBot-(v-mn)/(mx-mn+0.0001)*(cBot-cTop);}
function drawLine(vals,xOf,cTop,cBot,mn,mx,color,dash,lw){
  CX.save();CX.strokeStyle=color;CX.lineWidth=lw||2;if(dash)CX.setLineDash(dash);
  CX.beginPath();var first=true;
  for(var i=0;i<vals.length;i++){if(vals[i]==null){first=true;continue;}var x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);if(first){CX.moveTo(x,y);first=false;}else CX.lineTo(x,y);}
  CX.stroke();CX.setLineDash([]);CX.restore();
}
function drawFill(vals,xOf,cTop,cBot,mn,mx,fillColor,yBase){
  var base=yBase!==undefined?yBase:cBot;
  CX.save();CX.fillStyle=fillColor;CX.beginPath();var started=false;
  for(var i=0;i<vals.length;i++){if(vals[i]==null)continue;var x=xOf(i),y=valToY(vals[i],mn,mx,cTop,cBot);if(!started){CX.moveTo(x,base);CX.lineTo(x,y);started=true;}else CX.lineTo(x,y);}
  for(var i=vals.length-1;i>=0;i--){if(vals[i]!=null){CX.lineTo(xOf(i),base);break;}}
  CX.closePath();CX.fill();CX.restore();
}
function axisText(txt,x,y,color,bold,size){
  var fs=size||8;
  CX.save();
  CX.font=(bold?'bold ':'')+fs+'px sans-serif';
  CX.shadowColor='rgba(4,10,22,0.95)';CX.shadowBlur=3;
  CX.fillStyle=color||'#7090b0';CX.fillText(txt,x,y);
  CX.shadowBlur=0;
  CX.restore();
}
function drawDataLabels(vals,xOf,cTop,cBot,mn,mx,unit,color){
  var fs=Math.max(8,chartFS()-1);
  CX.save();CX.textAlign='center';
  var placed=[],minD=fs*2.2;
  for(var i=1;i<vals.length-1;i++){
    var v=vals[i],p=vals[i-1],n=vals[i+1];if(v==null||p==null||n==null)continue;
    var isMax=v>=p&&v>=n&&(v>p+0.3||v>n+0.3),isMin=v<=p&&v<=n&&(v<p-0.3||v<n-0.3);
    if(!isMax&&!isMin)continue;
    var x=xOf(i),y=valToY(v,mn,mx,cTop,cBot),ly=isMax?y-5:y+11;
    if(placed.some(function(q){return Math.hypot(q.x-x,q.y-ly)<minD;}))continue;
    placed.push({x:x,y:ly});
    CX.font='bold '+fs+'px sans-serif';
    CX.shadowColor='rgba(4,10,22,0.98)';CX.shadowBlur=4;
    CX.fillStyle=color||'rgba(240,252,255,1.0)';CX.fillText(Math.round(v)+(unit||''),x,ly);
    CX.shadowBlur=0;
  }
  CX.restore();
}
function drawLeftAxisStep(mn,mx,cTop,cBot,step,unit,color){
  CX.save();var lo=Math.ceil(mn/step)*step,hi=Math.floor(mx/step)*step;
  for(var v=lo;v<=hi+0.001;v+=step){
    var y=valToY(v,mn,mx,cTop,cBot);
    CX.strokeStyle='rgba(80,130,200,0.22)';CX.lineWidth=1;CX.setLineDash([2,3]);
    CX.beginPath();CX.moveTo(L_PAD,y);CX.lineTo(cssW()-R_PAD,y);CX.stroke();CX.setLineDash([]);
  }
  CX.textAlign='right';
  var afs=Math.max(7,chartFS()-1);
  for(var v=lo;v<=hi+0.001;v+=step){
    axisText(Math.round(v)+(unit||''),L_PAD-3,valToY(v,mn,mx,cTop,cBot)+afs/2,color||'#8090b8',true,afs);
  }

}
function drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color){
  var range=mx-mn;if(range<=0)range=1;
  var rawStep=range/4,mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
  var niceStep=[1,2,5,10].map(function(s){return s*mag;}).filter(function(s){return range/s<=6;})[0]||rawStep;
  drawLeftAxisStep(mn,mx,cTop,cBot,niceStep,unit,color);
}

// ══ TEMP ═══════════════════════════════════════════════
function drawTemp(L,idxs,h,xOf,cTop,cBot,split){
  var rawT=idxs.map(function(i){return convTemp(h.temperature_2m[i]);});
  var rawF=idxs.map(function(i){return convTemp(h.apparent_temperature[i]);});
  var allV=rawT.concat(rawF).filter(function(v){return v!=null;});
  var step=U('temp')==='°F'?10:5;
  var mn=Math.floor((Math.min.apply(null,allV)-3)/step)*step;
  var mx=Math.ceil((Math.max.apply(null,allV)+3)/step)*step;
  var zero=U('temp')==='°F'?32:0;
  var t20=U('temp')==='°F'?68:20,tM10=U('temp')==='°F'?14:-10;
  var y0=Math.max(cTop,Math.min(cBot,valToY(zero,mn,mx,cTop,cBot)));

  var yM10=valToY(tM10,mn,mx,cTop,cBot);
  drawLeftAxisStep(mn,mx,cTop,cBot,step,U('temp'),'#8090b8');
  // zero line
  if(mn<zero&&mx>zero){
    CX.save();CX.strokeStyle='rgba(130,170,240,0.6)';CX.lineWidth=1.2;CX.setLineDash([4,4]);
    CX.beginPath();CX.moveTo(L.pL,y0);CX.lineTo(cssW()-L.pR,y0);CX.stroke();CX.setLineDash([]);CX.restore();
  }
  // FILL above zero: red@20°C → blue@0°C (vertical gradient)
  if(mx>zero){
    var tPlus=rawT.map(function(v){return v>zero?v:zero;});
    var gP=CX.createLinearGradient(0,Math.max(cTop,y20),0,y0);
    gP.addColorStop(0,'rgba(220,40,20,0.62)');    // red at top (20°)
    gP.addColorStop(0.35,'rgba(200,80,30,0.50)');
    gP.addColorStop(0.7,'rgba(160,120,60,0.35)');
    gP.addColorStop(1,'rgba(80,140,230,0.12)');   // blue at 0°
    drawFill(tPlus,xOf,cTop,cBot,mn,mx,gP,y0);
  }
  // FILL below zero: blue@0°C → white@-10°C
  if(mn<zero){
    var tMinus=rawT.map(function(v){return v<zero?v:zero;});
    var gM=CX.createLinearGradient(0,y0,0,Math.min(cBot,yM10));
    gM.addColorStop(0,'rgba(80,140,230,0.12)');   // blue at 0°
    gM.addColorStop(0.4,'rgba(140,180,240,0.35)');

    drawFill(tMinus,xOf,cTop,cBot,mn,mx,gM,y0);
  }
  drawLine(rawT.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ff4030',null,2);
  drawLine(rawT.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#ff4030',[6,4],2);
  drawLine(rawF.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'rgba(130,195,255,0.85)',null,1.5);
  drawLine(rawF.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'rgba(130,195,255,0.7)',[4,4],1.5);
  // axis icons – colored HTML overlay (canvas emoji can be monochrome)
  var icoFS=Math.max(12,chartFS()+2);
  var icoX=L.pL-icoFS-1;
  var iconDefs=[{t:zero+0.5,i:'☀️'},{t:zero-0.5,i:'❄️'}];
  if(mx>=t20)iconDefs.push({t:t20,i:'😎'});
  if(mn<=tM10+5)iconDefs.push({t:tM10+5,i:'⛄'});
  var overlay=document.getElementById('chartIconOverlay');
  if(!overlay){
    overlay=document.createElement('div');overlay.id='chartIconOverlay';
    overlay.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:hidden;';
    document.getElementById('chartSection').appendChild(overlay);
  }
  var iconsHTML='';
  iconDefs.forEach(function(it){
    var y=valToY(it.t,mn,mx,cTop,cBot);
    if(y>cTop+4&&y<cBot-4){
      iconsHTML+='<span style="position:absolute;left:'+icoX+'px;top:'+(y-icoFS/2-2)+'px;font-size:'+icoFS+'px;line-height:1;text-shadow:0 0 3px rgba(0,0,0,0.8);">'+it.i+'</span>';
    }
  });
  overlay.innerHTML=iconsHTML;
  drawDataLabels(rawT,xOf,cTop,cBot,mn,mx,U('temp'),'rgba(255,210,170,1.0)');
  drawDataLabels(rawF,xOf,cTop,cBot,mn,mx,U('temp'),'rgba(170,215,255,0.95)');
  setLegend([{color:'#ff4030',label:T('temp')+' '+U('temp'),dash:false},{color:'#ff4030',label:'…',dash:true},{color:'rgba(130,195,255,0.85)',label:T('feel'),dash:false}]);
}

// ══ SKY + SUN/MOON CURVE ══════════════════════════════
function drawSkyAndSunMoon(L,idxs,xOf,cTop,cBot,bgAlpha){
  if(!WD)return;
  var daily=WD.daily||{};
  var W=cssW();
  var hasSunData=!!(daily.sunrise&&daily.sunrise.length);
  var opa=bgAlpha!==undefined?bgAlpha:1.0; // opacity multiplier for sky

  // Sun altitude: returns -1..1, properly continuous across days
  function getSunAlt(timeMs){
    if(!hasSunData)return -1;
    // Find bracketing rise/set
    for(var di=0;di<daily.sunrise.length;di++){
      var rise=new Date(daily.sunrise[di]).getTime();
      var set=new Date(daily.sunset[di]).getTime();
      var dayLen=set-rise;
      if(dayLen<=0)continue;
      var prevSet=di>0?new Date(daily.sunset[di-1]).getTime():rise-43200000;
      var nextRise=di<daily.sunrise.length-1?new Date(daily.sunrise[di+1]).getTime():set+43200000;
      if(timeMs>=rise&&timeMs<=set){
        // Daytime: sine arch 0→1→0
        return Math.sin(Math.PI*(timeMs-rise)/dayLen);
      }
      if(timeMs>=prevSet&&timeMs<rise){
        // Night before: -1 dip shaped as negative cosine
        var nightLen=rise-prevSet;
        var t=(timeMs-prevSet)/nightLen; // 0..1
        return -Math.sin(Math.PI*t); // 0 → -1 → 0
      }
    }
    // Last night after last set
    var lastSet=new Date(daily.sunset[daily.sunset.length-1]).getTime();
    if(timeMs>lastSet){
      var t2=Math.min(1,(timeMs-lastSet)/43200000);
      return -Math.sin(Math.PI*t2);
    }
    return -1;
  }

  // Moon altitude: proper astronomical calculation
  function getMoonAlt(timeMs){
    var d=(timeMs/86400000)-10957.5;
    var Lv=125.1228-0.0529538083*d;
    var Mv=115.3654+13.0649929509*d;
    var Mrad=Mv*Math.PI/180;
    var moonLon=218.316+13.176396*d+6.289*Math.sin(Mrad);
    var moonLat=5.128*Math.sin((Lv+moonLon)*Math.PI/180);
    var eps=23.439*Math.PI/180;
    var lRad=moonLon*Math.PI/180,bRad=moonLat*Math.PI/180;
    var ra=Math.atan2(Math.sin(lRad)*Math.cos(eps)-Math.tan(bRad)*Math.sin(eps),Math.cos(lRad));
    var dec=Math.asin(Math.sin(bRad)*Math.cos(eps)+Math.cos(bRad)*Math.sin(eps)*Math.sin(lRad));
    var lat=WD.latitude||50,lon=WD.longitude||15;
    var gmst=(280.46061837+360.98564736629*(timeMs/86400000-10957.5))*Math.PI/180;
    var lst=gmst+lon*Math.PI/180;
    var H=lst-ra;
    var latR=lat*Math.PI/180;
    var alt=Math.asin(Math.sin(latR)*Math.sin(dec)+Math.cos(latR)*Math.cos(dec)*Math.cos(H));
    return alt/(Math.PI/2); // -1..1
  }

  // Moon phase icon from date
  var refNM=new Date('2000-01-06T18:14:00Z').getTime(),lunarMs=29.530588853*24*3600*1000;
  var MOON_ICOS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  function moonPhaseIco(t){
    var ph=((t-refNM)%lunarMs+lunarMs)%lunarMs/lunarMs;
    if(ph<0.04||ph>0.96)return MOON_ICOS[0];if(ph<0.23)return MOON_ICOS[1];
    if(ph<0.27)return MOON_ICOS[2];if(ph<0.48)return MOON_ICOS[3];
    if(ph<0.52)return MOON_ICOS[4];if(ph<0.73)return MOON_ICOS[5];
    if(ph<0.77)return MOON_ICOS[6];return MOON_ICOS[7];
  }

  // ── Sky gradient: per-column, smooth twilight transition ──
  // Civil twilight ≈ 30 min, nautical ≈ 60 min, astronomical ≈ 90 min
  var cellW=(W-L.pL-L.pR)/Math.max(1,idxs.length-1);
  for(var i=0;i<idxs.length;i++){
    var tMs=new Date(WD.hourly.time[idxs[i]]).getTime();
    var x=xOf(i),x0b=i===0?L.pL:x-cellW/2,x1b=i===idxs.length-1?W-L.pR:x+cellW/2;
    var sa=getSunAlt(tMs); // -1..1 continuous

    // Map sun altitude to sky colour:
    // sa>=0: blue day  (sa=1 → bright blue, sa=0 → horizon blue)
    // sa in -0.2..0: civil twilight → deep blue-purple
    // sa in -0.4..-0.2: nautical twi → dark blue
    // sa<-0.4: night → near black
    var t=Math.max(0,Math.min(1,sa));  // 0..1 for daytime
    var tw=Math.max(0,Math.min(1,(sa+0.5)/0.5)); // 0..1 over full twilight zone

    var rT,gT,bT,rB,gB,bB,aT,aB;
    if(sa>=0){
      rT=Math.round(20+t*80);gT=Math.round(80+t*100);bT=Math.round(200+t*50);
      rB=Math.round(40+t*80);gB=Math.round(110+t*90);bB=Math.round(210+t*30);
      aT=0.90*opa;aB=0.70*opa;
    } else if(sa>=-0.5){
      var tw2=Math.max(0,(sa+0.5)/0.5);
      rT=Math.round(5+tw2*18);gT=Math.round(8+tw2*40);bT=Math.round(20+tw2*130);
      rB=Math.round(8+tw2*25);gB=Math.round(12+tw2*55);bB=Math.round(25+tw2*120);
      aT=(0.92+tw2*0.02)*opa;aB=(0.85+tw2*0.05)*opa;
    } else {
      rT=5;gT=8;bT=20;rB=8;gB=12;bB=30;aT=0.95*opa;aB=0.90*opa;
    }
    var sg=CX.createLinearGradient(0,cTop,0,cBot);
    sg.addColorStop(0,'rgba('+rT+','+gT+','+bT+','+aT+')');
    sg.addColorStop(1,'rgba('+rB+','+gB+','+bB+','+aB+')');
    CX.fillStyle=sg;CX.fillRect(x0b,cTop,x1b-x0b,cBot-cTop);
  }

  // ── Curve geometry ──
  var chartH=cBot-cTop;
  // km-to-y helper (same as in cloud drawing)
  function kmToYcurve(km){return cBot-(km/10)*chartH;}
  var km10y=kmToYcurve(10); // y position of 10km line = cTop
  var km65y=kmToYcurve(6.5); // y position of 6.5km line
  var highBandH=km65y-km10y;

  // Sun: icon peaks sit just below the 10km line
  // sunBase = horizon crossing point (sa=0), sunAmp = half-height of curve
  var icoFs=Math.max(11,chartFS()+1);
  var iconRoom=icoFs*1.1; // space for icon above peak
  var sunPeakY=km10y+iconRoom+4; // where noon sun peak sits (below icon)
  var sunAmp=Math.max(5,highBandH*0.22); // small amplitude
  var sunBase=sunPeakY+sunAmp; // sa=0 baseline (horizon)

  // Moon: just below sun's lowest point
  var moonAmp=sunAmp*0.7;
  var moonBase=sunBase+sunAmp+moonAmp+2;

  // Build point arrays
  var allSunPts=[],allMoonPts=[];
  for(var i=0;i<idxs.length;i++){
    var tMs=new Date(WD.hourly.time[idxs[i]]).getTime(),x=xOf(i);
    var sa=getSunAlt(tMs);
    var sunY=sunBase-sa*sunAmp;
    allSunPts.push({x:x,y:sunY,alt:sa,above:sa>=0,t:tMs});
    var ma=getMoonAlt(tMs);
    var moonY=moonBase-ma*moonAmp;
    allMoonPts.push({x:x,y:moonY,alt:ma,above:ma>0,t:tMs});
  }

  // Draw a curve splitting into solid/dashed segments (continuous, no gaps)
  function drawCurve(pts,solidColor,dashColor,lw){
    CX.save();
    // Draw full curve as dashed first, then overlay solid where above horizon
    CX.strokeStyle=dashColor;CX.lineWidth=lw;CX.setLineDash([4,5]);
    CX.beginPath();pts.forEach(function(p,i){if(i===0)CX.moveTo(p.x,p.y);else CX.lineTo(p.x,p.y);});
    CX.stroke();
    // Overlay solid segments where above horizon
    CX.setLineDash([]);CX.strokeStyle=solidColor;CX.lineWidth=lw;
    var inSeg=false;
    pts.forEach(function(p){
      if(p.above){if(!inSeg){CX.beginPath();CX.moveTo(p.x,p.y);inSeg=true;}else CX.lineTo(p.x,p.y);}
      else{if(inSeg){CX.stroke();inSeg=false;}}
    });
    if(inSeg)CX.stroke();
    CX.setLineDash([]);CX.restore();
  }

  drawCurve(allSunPts,'rgba(255,225,45,0.95)','rgba(255,210,30,0.42)',2);
  drawCurve(allMoonPts,'rgba(215,228,255,0.88)','rgba(200,215,255,0.44)',1.5);

  // ── Icons & labels ──
  CX.save();
  var afs=Math.max(7,chartFS()-1);
  // icoFs defined above in geometry section

  // Sun icon at every daily noon peak
  var abovePts=allSunPts.filter(function(p){return p.above;});
  var sunPeaks=[];
  for(var i=1;i<abovePts.length-1;i++){
    if(abovePts[i].alt>=abovePts[i-1].alt&&abovePts[i].alt>=abovePts[i+1].alt&&abovePts[i].alt>0.5){
      var dup=sunPeaks.some(function(p){return Math.abs(p.x-abovePts[i].x)<(cssW()/8);});
      if(!dup)sunPeaks.push(abovePts[i]);
    }
  }
  if(!sunPeaks.length&&abovePts.length)sunPeaks=[abovePts.reduce(function(a,b){return a.alt>b.alt?a:b;})];
  sunPeaks.forEach(function(pk){
    CX.font=icoFs+'px sans-serif';CX.textAlign='center';
    CX.shadowColor='rgba(0,0,0,0.7)';CX.shadowBlur=4;
    CX.fillText('☀️',pk.x,pk.y-icoFs*0.8);CX.shadowBlur=0;
  });

  // Sunrise/sunset time labels near curve
  if(hasSunData){
    function nearX(ms){var b=null,bd=Infinity;idxs.forEach(function(idx,ii){var d=Math.abs(new Date(WD.hourly.time[idx]).getTime()-ms);if(d<bd){bd=d;b=xOf(ii);}});return b;}
    daily.sunrise.forEach(function(sr,di){
      var rx=nearX(new Date(sr).getTime());
      if(rx!==null&&rx>L.pL+10&&rx<W-L.pR-10){
        var closest=allSunPts.reduce(function(a,b){return Math.abs(a.x-rx)<Math.abs(b.x-rx)?a:b;});
        var tr=new Date(sr),lb=String(tr.getHours()).padStart(2,'0')+':'+String(tr.getMinutes()).padStart(2,'0');
        CX.font='bold '+afs+'px sans-serif';CX.fillStyle='rgba(255,220,80,0.95)';CX.textAlign='center';
        CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
        CX.fillText('↑'+lb,rx,closest.y-afs-1);CX.shadowBlur=0;
      }
      if(daily.sunset&&daily.sunset[di]){
        var sx=nearX(new Date(daily.sunset[di]).getTime());
        if(sx!==null&&sx>L.pL+10&&sx<W-L.pR-10){
          var closest2=allSunPts.reduce(function(a,b){return Math.abs(a.x-sx)<Math.abs(b.x-sx)?a:b;});
          var ts=new Date(daily.sunset[di]),ls=String(ts.getHours()).padStart(2,'0')+':'+String(ts.getMinutes()).padStart(2,'0');
          CX.font='bold '+afs+'px sans-serif';CX.fillStyle='rgba(255,200,60,0.95)';CX.textAlign='center';
          CX.shadowColor='rgba(0,0,0,0.9)';CX.shadowBlur=3;
          CX.fillText('↓'+ls,sx,closest2.y-afs-1);CX.shadowBlur=0;
        }
      }
    });
  }

  // Moon icon at every visible peak
  var aboveMoon=allMoonPts.filter(function(p){return p.above;});
  var moonPeaks=[];
  for(var i=1;i<aboveMoon.length-1;i++){
    if(aboveMoon[i].alt>=aboveMoon[i-1].alt&&aboveMoon[i].alt>=aboveMoon[i+1].alt&&aboveMoon[i].alt>0.1){
      var dup2=moonPeaks.some(function(p){return Math.abs(p.x-aboveMoon[i].x)<(cssW()/6);});
      if(!dup2)moonPeaks.push(aboveMoon[i]);
    }
  }
  if(!moonPeaks.length&&aboveMoon.length>=2)moonPeaks=[aboveMoon.reduce(function(a,b){return a.alt>b.alt?a:b;})];
  moonPeaks.forEach(function(mp){
    CX.font=icoFs+'px sans-serif';CX.textAlign='center';
    CX.shadowColor='rgba(0,0,0,0.8)';CX.shadowBlur=3;
    CX.fillText(moonPhaseIco(mp.t),mp.x,mp.y-icoFs*0.8);CX.shadowBlur=0;
  });
  if(!moonPeaks.length){
    for(var i=0;i<idxs.length;i++){
      if(new Date(WD.hourly.time[idxs[i]]).getHours()===0){
        CX.font=icoFs+'px sans-serif';CX.textAlign='center';
        CX.shadowColor='rgba(0,0,0,0.8)';CX.shadowBlur=3;
        CX.fillText(moonPhaseIco(new Date(WD.hourly.time[idxs[i]]).getTime()),xOf(i),moonBase-icoFs);
        CX.shadowBlur=0;break;
      }
    }
  }
  CX.restore();
}

// Cloud "fluffy" shading over sky
function drawCloudShading(L,idxs,clCover,xOf,cTop,cBot,seed){
  var W=cssW();
  var cellW=(W-L.pL-L.pR)/Math.max(1,idxs.length-1);
  // Simple deterministic "random" for puff positions
  function rng(n){return((n*1664525+1013904223)&0x7fffffff)/0x7fffffff;}
  CX.save();
  for(var i=0;i<clCover.length;i++){
    var pct=Math.min(100,Math.max(0,clCover[i]||0))/100;
    if(pct<0.05)continue;
    var cx=xOf(i);
    var bandW=Math.max(cellW*0.9,4);
    // Number of puffs proportional to coverage
    var nPuffs=Math.round(pct*5)+1;
    var s=seed*1000+i;
    for(var p=0;p<nPuffs;p++){
      var px=cx+(rng(s+p*7)-0.5)*bandW*0.85;
      var py=cTop+(rng(s+p*13+3))*(cBot-cTop)*0.85+0.05*(cBot-cTop);
      var rx=bandW*(0.25+rng(s+p*17+5)*0.35)*pct;
      var ry=rx*(0.4+rng(s+p*23+7)*0.35);
      var alpha=0.18+pct*0.38;
      var gr=CX.createRadialGradient(px,py,0,px,py,Math.max(rx,ry));
      gr.addColorStop(0,'rgba(255,255,255,'+(alpha+0.2)+')');
      gr.addColorStop(0.5,'rgba(240,245,250,'+alpha+')');
      gr.addColorStop(1,'rgba(220,228,236,0)');
      CX.save();
      CX.translate(px,py);CX.scale(1,ry/Math.max(rx,1));CX.translate(-px,-py);
      CX.beginPath();CX.arc(px,py,Math.max(rx,2),0,Math.PI*2);
      CX.fillStyle=gr;CX.fill();
      CX.restore();
    }
  }
  CX.restore();
}

// ══ CLOUD A ════════════════════════════════════════════
function drawCloud(L,idxs,h,xOf,cTop,cBot,split){
  var cloudTop=cTop+4,cloudBot=cBot;
  function kmToY(km){return cloudBot-(km/10)*(cloudBot-cloudTop);}

  // Sky background with day/night + sun/moon curves
  drawSkyAndSunMoon(L,idxs,xOf,cloudTop,cloudBot);

  CX.save();
  drawCloudIcons(cloudTop,cloudBot,L.pL);
  var cafs=Math.max(7,chartFS()-1);
  [0,2,6.5,10].forEach(function(km){
    var y=kmToY(km);CX.strokeStyle='rgba(255,255,255,0.15)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(cssW()-L.pR,y);CX.stroke();
    var distVal=convDist(km),distStr=distVal===0?'0'+U('dist'):distVal+U('dist');
    CX.textAlign='right';axisText(distStr,L.pL-2,y+cafs/2,'#a0c8e8',true,cafs);
  });

  var clH=idxs.map(function(i){return h.cloud_cover_high[i];});
  var clM=idxs.map(function(i){return h.cloud_cover_mid[i];});
  var clL=idxs.map(function(i){return h.cloud_cover_low[i];});
  var clT=idxs.map(function(i){return h.cloud_cover[i];});

  // Fluffy cloud shading per layer
  var clHsub=idxs.map(function(i){return h.cloud_cover_high[i]||0;});
  var clMsub=idxs.map(function(i){return h.cloud_cover_mid[i]||0;});
  var clLsub=idxs.map(function(i){return h.cloud_cover_low[i]||0;});

  // Cloud A: filled area curve per band (původní varianta A)
  function drawBandArea(data,yTop,yBot,alpha){
    CX.save();
    var grad=CX.createLinearGradient(0,yTop,0,yBot);
    grad.addColorStop(0,'rgba(255,255,255,'+alpha+')');
    grad.addColorStop(1,'rgba(200,215,230,'+(alpha*0.5)+')');
    CX.beginPath();
    var started=false;
    for(var i=0;i<data.length;i++){
      var pct=Math.min(100,Math.max(0,data[i]||0))/100;
      var y=yBot-pct*(yBot-yTop),x=xOf(i);
      if(!started){CX.moveTo(x,yBot);CX.lineTo(x,y);started=true;}
      else CX.lineTo(x,y);
    }
    CX.lineTo(xOf(data.length-1),yBot);
    CX.closePath();CX.fillStyle=grad;CX.fill();
    // outline curve
    CX.beginPath();started=false;
    for(var i=0;i<data.length;i++){
      var pct=Math.min(100,Math.max(0,data[i]||0))/100;
      var y=yBot-pct*(yBot-yTop),x=xOf(i);
      if(!started){CX.moveTo(x,y);started=true;}else CX.lineTo(x,y);
    }
    CX.strokeStyle='rgba(255,255,255,'+(alpha*0.7)+')';CX.lineWidth=1;CX.stroke();
    CX.restore();
  }

  // Clip per band and draw area only (no puff overlay)
  CX.save();
  CX.beginPath();CX.rect(L.pL,kmToY(10),cssW()-L.pL-L.pR,kmToY(6.5)-kmToY(10));CX.clip();
  drawBandArea(clHsub,kmToY(10),kmToY(6.5),0.45);
  CX.restore();
  CX.save();
  CX.beginPath();CX.rect(L.pL,kmToY(6.5),cssW()-L.pL-L.pR,kmToY(2)-kmToY(6.5));CX.clip();
  drawBandArea(clMsub,kmToY(6.5),kmToY(2),0.55);
  CX.restore();
  CX.save();
  CX.beginPath();CX.rect(L.pL,kmToY(2),cssW()-L.pL-L.pR,kmToY(0)-kmToY(2));CX.clip();
  drawBandArea(clLsub,kmToY(2),kmToY(0),0.65);
  CX.restore();

  // maxima/minima per band
  function drawCloudBandLabels(data,yTop,yBot,col){
    var lfs=Math.max(7,chartFS()-1);var placed=[];var minD=lfs*3;
    CX.save();CX.textAlign='center';
    for(var i=1;i<data.length-1;i++){
      var v=data[i],p=data[i-1],n=data[i+1];if(v==null)continue;
      var isMax=v>=p&&v>=n&&v>p+2;var isMin=v<=p&&v<=n&&v<p-2;
      if(!isMax&&!isMin)continue;
      var bx=xOf(i),by=yBot-Math.min(100,Math.max(0,v))/100*(yBot-yTop);
      var ly=isMax?by-3:by+lfs+2;
      ly=Math.max(yTop+lfs,Math.min(yBot-2,ly));
      if(placed.some(function(q){return Math.hypot(q.x-bx,q.y-ly)<minD;}))continue;
      placed.push({x:bx,y:ly});
      CX.font='bold '+lfs+'px sans-serif';
      CX.shadowColor='rgba(4,10,22,0.95)';CX.shadowBlur=3;
      CX.fillStyle=col;CX.fillText(Math.round(v)+'%',bx,ly);CX.shadowBlur=0;
    }
    CX.restore();
  }
  drawCloudBandLabels(clH,kmToY(10),kmToY(6.5),'rgba(230,242,255,0.95)');
  drawCloudBandLabels(clM,kmToY(6.5),kmToY(2),'rgba(210,228,248,0.95)');
  drawCloudBandLabels(clL,kmToY(2),kmToY(0),'rgba(190,215,240,0.95)');

  var hi2=hoverIdx!==null?hoverIdx:getSlice().split;
  var cloudLabelFs=cafs*2;
  var sumFs=Math.round(cloudLabelFs*1.15);
  CX.save();CX.textAlign='right';var labX=cssW()-L.pR-2;
  axisText('H:'+Math.round(clH[hi2])+'%',labX,kmToY(8)+cloudLabelFs/2,'rgba(215,232,255,0.95)',true,cloudLabelFs);
  axisText('M:'+Math.round(clM[hi2])+'%',labX,kmToY(4.2)+cloudLabelFs/2,'rgba(185,205,238,0.95)',true,cloudLabelFs);
  axisText('L:'+Math.round(clL[hi2])+'%',labX,kmToY(1)+cloudLabelFs/2,'rgba(152,175,218,0.95)',true,cloudLabelFs);
  axisText('∑:'+Math.round(clT[hi2])+'%',labX,kmToY(0)-4,'rgba(232,242,255,1.0)',true,sumFs);
  CX.restore();CX.restore();
  setLegend([{color:'rgba(255,255,255,0.75)',label:T('high')+' >'+convDist(6.5)+U('dist'),dash:false},{color:'rgba(220,228,238,0.75)',label:T('mid')+' '+convDist(2)+'–'+convDist(6.5)+U('dist'),dash:false},{color:'rgba(190,210,230,0.75)',label:T('low')+' 0–'+convDist(2)+U('dist'),dash:false}]);
}

// ══ CLOUD B – symmetric bar chart per band ════════════
function drawCloudB(L,idxs,h,xOf,cTop,cBot,split){
  var cloudTop=cTop+4,cloudBot=cBot;
  function kmToY(km){return cloudBot-(km/10)*(cloudBot-cloudTop);}

  // Sky background with day/night + sun/moon curves
  drawSkyAndSunMoon(L,idxs,xOf,cloudTop,cloudBot);

  var clH=idxs.map(function(i){return h.cloud_cover_high[i]||0;});
  var clM=idxs.map(function(i){return h.cloud_cover_mid[i]||0;});
  var clL=idxs.map(function(i){return h.cloud_cover_low[i]||0;});

  // Cloud B: symetrické sloupce od středu každého pásma (původní varianta B)
  var cellW=(cssW()-L.pL-L.pR)/Math.max(1,L.total-1);
  var bands=[
    {km0:0,km1:2,data:clL,seed:3},
    {km0:2,km1:6.5,data:clM,seed:2},
    {km0:6.5,km1:10,data:clH,seed:1}
  ];
  bands.forEach(function(b){
    var yTop=kmToY(b.km1),yBot=kmToY(b.km0),yMid=(yTop+yBot)/2;
    var bandH=yBot-yTop;
    // centre dashed line
    CX.save();CX.strokeStyle='rgba(255,255,255,0.18)';CX.lineWidth=1;CX.setLineDash([3,3]);
    CX.beginPath();CX.moveTo(L.pL,yMid);CX.lineTo(cssW()-L.pR,yMid);CX.stroke();
    CX.setLineDash([]);
    // symmetric bars
    for(var i=0;i<L.total;i++){
      var pct=Math.min(100,Math.max(0,b.data[i]||0))/100;
      if(pct<0.02)continue;
      var halfH=pct*bandH/2;
      var bx=xOf(i)-cellW*0.42,bw=cellW*0.84;
      var bg=CX.createLinearGradient(0,yMid-halfH,0,yMid+halfH);
      bg.addColorStop(0,'rgba(255,255,255,0.72)');
      bg.addColorStop(0.5,'rgba(235,242,250,0.55)');
      bg.addColorStop(1,'rgba(200,215,230,0.35)');
      CX.fillStyle=bg;CX.fillRect(bx,yMid-halfH,bw,halfH*2);
    }
    // symmetric bars only (no puff overlay)
    CX.restore();
  });

  // Band centre dashed lines
  var bands=[{km0:0,km1:2,midA:0.3},{km0:2,km1:6.5,midA:0.22},{km0:6.5,km1:10,midA:0.18}];
  CX.save();
  bands.forEach(function(b){
    var yMid=(kmToY(b.km0)+kmToY(b.km1))/2;
    CX.strokeStyle='rgba(255,255,255,'+b.midA+')';CX.lineWidth=1;CX.setLineDash([3,3]);
    CX.beginPath();CX.moveTo(L.pL,yMid);CX.lineTo(cssW()-L.pR,yMid);CX.stroke();
    CX.setLineDash([]);
  });

  // Band boundary lines
  var cbfs=Math.max(7,chartFS()-1);
  [0,2,6.5,10].forEach(function(km){
    var y=kmToY(km);CX.strokeStyle='rgba(255,255,255,0.22)';CX.lineWidth=1;
    CX.beginPath();CX.moveTo(L.pL,y);CX.lineTo(cssW()-L.pR,y);CX.stroke();
    var distVal=convDist(km),distStr=distVal===0?'0'+U('dist'):distVal+U('dist');
    CX.textAlign='right';axisText(distStr,L.pL-2,y+cbfs/2,'#a0c8e8',true,cbfs);
  });
  CX.restore();

  drawCloudIcons(cloudTop,cloudBot,L.pL);

  // min/max % per band (cloud B)
  function drawCloudBBandLabels(data,yTop,yBot,col){
    var lfs=Math.max(7,chartFS()-1);var placed=[];var minD=lfs*3;
    CX.save();CX.textAlign='center';
    for(var i=1;i<data.length-1;i++){
      var v=data[i],p=data[i-1],n=data[i+1];if(v==null)continue;
      var isMax=v>=p&&v>=n&&v>p+2;var isMin=v<=p&&v<=n&&v<p-2;
      if(!isMax&&!isMin)continue;
      var pct=Math.min(100,Math.max(0,v))/100;
      var yMid=(yTop+yBot)/2,halfH=pct*(yBot-yTop)/2;
      var bx=xOf(i),by=isMax?yMid-halfH:yMid+halfH;
      var ly=isMax?by-3:by+lfs+2;
      ly=Math.max(yTop+lfs,Math.min(yBot-2,ly));
      if(placed.some(function(q){return Math.hypot(q.x-bx,q.y-ly)<minD;}))continue;
      placed.push({x:bx,y:ly});
      CX.font='bold '+lfs+'px sans-serif';
      CX.shadowColor='rgba(4,10,22,0.95)';CX.shadowBlur=3;
      CX.fillStyle=col;CX.fillText(Math.round(v)+'%',bx,ly);CX.shadowBlur=0;
    }
    CX.restore();
  }
  drawCloudBBandLabels(clL,kmToY(2),kmToY(0),'rgba(190,215,240,0.95)');
  drawCloudBBandLabels(clM,kmToY(6.5),kmToY(2),'rgba(210,228,248,0.95)');
  drawCloudBBandLabels(clH,kmToY(10),kmToY(6.5),'rgba(230,242,255,0.95)');

  var hi2=hoverIdx!==null?hoverIdx:getSlice().split;
  var bCloudLabelFs=cbfs*2;
  CX.save();CX.textAlign='right';var labX=cssW()-L.pR-2;
  axisText('H:'+Math.round(clH[hi2])+'%',labX,kmToY(8)+bCloudLabelFs/2,'rgba(215,232,255,0.95)',true,bCloudLabelFs);
  axisText('M:'+Math.round(clM[hi2])+'%',labX,kmToY(4.2)+bCloudLabelFs/2,'rgba(185,205,238,0.95)',true,bCloudLabelFs);
  axisText('L:'+Math.round(clL[hi2])+'%',labX,kmToY(1)+bCloudLabelFs/2,'rgba(152,175,218,0.95)',true,bCloudLabelFs);
  CX.restore();
  setLegend([{color:'rgba(255,255,255,0.75)',label:T('low')+' 0-'+convDist(2)+U('dist'),dash:false},{color:'rgba(220,228,238,0.75)',label:T('mid')+' '+convDist(2)+'-'+convDist(6.5)+U('dist'),dash:false},{color:'rgba(190,210,230,0.75)',label:T('high')+' '+convDist(6.5)+'-'+convDist(10)+U('dist'),dash:false}]);
}

// ══ HUM ════════════════════════════════════════════════
function drawHum(L,idxs,h,xOf,cTop,cBot,split){
  var hu=idxs.map(function(i){return h.relative_humidity_2m[i];});
  var dp=idxs.map(function(i){return convTemp(h.dewpoint_2m[i]);});
  var mn=0,mx=100,dpMn=Math.min.apply(null,dp)-2,dpMx=Math.max.apply(null,dp)+2;
  drawLeftAxisStep(mn,mx,cTop,cBot,25,'%','#5090a0');
  var gH=CX.createLinearGradient(0,cTop,0,cBot);gH.addColorStop(0,'rgba(60,200,240,0.40)');gH.addColorStop(1,'rgba(60,200,240,0.02)');
  drawFill(hu,xOf,cTop,cBot,mn,mx,gH);
  drawLine(hu.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#3cc8f0',null,2);
  drawLine(hu.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#3cc8f0',[6,4],2);
  drawLine(dp.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',null,1.5);
  drawLine(dp.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,dpMn,dpMx,'#a0e0ff',[4,4],1.5);
  drawDataLabels(hu,xOf,cTop,cBot,mn,mx,'%','rgba(120,230,255,1.0)');
  drawDataLabels(dp,xOf,cTop,cBot,dpMn,dpMx,U('temp'),'rgba(175,230,255,1.0)');
  CX.save();CX.textAlign='left';
  var rafs=Math.max(7,chartFS()-1);
  for(var i=0;i<=4;i++){var v=dpMn+(dpMx-dpMn)*i/4;axisText(Math.round(v)+U('temp'),cssW()-R_PAD+2,valToY(v,dpMn,dpMx,cTop,cBot)+rafs/2,'#5a90a8',true,rafs);}
  CX.restore();
  setLegend([{color:'#3cc8f0',label:T('hum')+' %',dash:false},{color:'#a0e0ff',label:T('dew')+' '+U('temp')+' →',dash:false}]);
}

// ══ PRESSURE ═══════════════════════════════════════════
function drawPressure(L,idxs,h,xOf,cTop,cBot,split){
  var pr=idxs.map(function(i){return convPress(h.surface_pressure[i]);});
  var rawMn=Math.min.apply(null,pr),rawMx=Math.max.apply(null,pr);
  var mn=Math.floor((rawMn-2)/5)*5,mx=Math.ceil((rawMx+2)/5)*5;
  var mid=(mn+mx)/2,yMid=valToY(mid,mn,mx,cTop,cBot);
  drawLeftAxisAuto(mn,mx,cTop,cBot,' '+U('pres'),'#9070b8');
  var prH=pr.map(function(v){return v>=mid?v:mid;}),prL=pr.map(function(v){return v<=mid?v:mid;});
  var gHi=CX.createLinearGradient(0,cTop,0,yMid);gHi.addColorStop(0,'rgba(160,100,255,0.50)');gHi.addColorStop(1,'rgba(160,100,255,0.05)');
  var gLo=CX.createLinearGradient(0,yMid,0,cBot);gLo.addColorStop(0,'rgba(80,110,190,0.05)');gLo.addColorStop(1,'rgba(80,110,190,0.45)');
  drawFill(prH,xOf,cTop,cBot,mn,mx,gHi,yMid);
  drawFill(prL,xOf,cTop,cBot,mn,mx,gLo,yMid);
  CX.save();CX.strokeStyle='rgba(165,135,225,0.52)';CX.lineWidth=1;CX.setLineDash([5,4]);
  CX.beginPath();CX.moveTo(L.pL,yMid);CX.lineTo(cssW()-L.pR,yMid);CX.stroke();CX.setLineDash([]);CX.restore();
  drawLine(pr.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,'#c080ff',null,2);
  drawLine(pr.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,'#c080ff',[6,4],2);
  drawDataLabels(pr,xOf,cTop,cBot,mn,mx,'','rgba(220,180,255,1.0)');
  setLegend([{color:'#c080ff',label:T('pressure')+' '+U('pres'),dash:false},{color:'rgba(160,100,255,0.65)',label:'↑ '+T('highPres'),dash:false},{color:'rgba(80,110,190,0.65)',label:'↓ '+T('lowPres'),dash:false}]);
}

function drawExtraGraph(tab,L,idxs,h,xOf,cTop,cBot,split){
  var vals,mn,mx,color,unit,label;
  if(tab==='vis'&&h.visibility){var visKm=idxs.map(function(i){return(h.visibility[i]||0)/1000;});vals=visKm.map(function(v){return convDist(v);});mn=0;mx=Math.max.apply(null,vals.concat([convDist(50)]));color='rgba(100,220,240,0.9)';unit=' '+U('dist');label=T('vis');}
  else if(tab==='wetbulb'&&h.wet_bulb_temperature_2m){vals=idxs.map(function(i){return convTemp(h.wet_bulb_temperature_2m[i]||0);});var av=vals.filter(function(v){return v!=null;});mn=Math.floor(Math.min.apply(null,av)-2);mx=Math.ceil(Math.max.apply(null,av)+2);color='rgba(200,100,255,0.9)';unit=U('temp');label=T('wetbulb');}
  else if(tab==='solar'&&h.shortwave_radiation){vals=idxs.map(function(i){return h.shortwave_radiation[i]||0;});mn=0;mx=Math.max.apply(null,vals.concat([1000]));color='rgba(255,220,60,0.9)';unit=' W/m²';label=T('solar');}
  else if(tab==='snow'&&h.snow_depth){vals=idxs.map(function(i){return(h.snow_depth[i]||0)*100;});mn=0;mx=Math.max.apply(null,vals.concat([10]));color='rgba(200,230,255,0.9)';unit=' cm';label=T('snow');}
  else if(tab==='soil'&&h.soil_moisture_0_to_1cm){vals=idxs.map(function(i){return(h.soil_moisture_0_to_1cm[i]||0)*100;});mn=0;mx=100;color='rgba(120,180,80,0.9)';unit='%';label=T('soil');}
  else{
    currentTab='temp';
    document.querySelectorAll('.mtile').forEach(function(t){t.classList.toggle('active',t.dataset.tab==='temp');});
    updateCloudModeBtn();scrollTileToActive();
    drawTemp(L,idxs,h,xOf,cTop,cBot,split);return;
  }
  // Solar: sky background first, then data, then UV overlay
  if(tab==='solar')drawSkyAndSunMoon(L,idxs,xOf,cTop,cBot,0.30);
  drawLeftAxisAuto(mn,mx,cTop,cBot,unit,color);
  var fillAlpha=tab==='solar'?'0.65':'0.42';
  var fillAlpha2=tab==='solar'?'0.08':'0.02';
  var gE=CX.createLinearGradient(0,cTop,0,cBot);
  gE.addColorStop(0,color.replace('0.9',fillAlpha));gE.addColorStop(1,color.replace('0.9',fillAlpha2));
  drawFill(vals,xOf,cTop,cBot,mn,mx,gE);
  var lineW=tab==='solar'?3:2;
  drawLine(vals.map(function(v,i){return i<=split?v:null;}),xOf,cTop,cBot,mn,mx,color,null,lineW);
  drawLine(vals.map(function(v,i){return i>=split?v:null;}),xOf,cTop,cBot,mn,mx,color,[6,4],lineW);
  drawDataLabels(vals,xOf,cTop,cBot,mn,mx,unit,color);
  // UV index overlay on solar graph (pink, secondary right axis)
  if(tab==='solar'&&h.uv_index){
    var uvColor='rgba(255,100,200,0.92)';
    var uvVals=idxs.map(function(i){return h.uv_index[i]||0;});
    var uvMax=Math.max.apply(null,uvVals.concat([11]));
    // Scale UV to same pixel space as solar (separate axis on right)
    var uvFs=Math.max(7,chartFS()-1);
    CX.save();CX.textAlign='left';
    for(var v=0;v<=uvMax;v+=v<6?2:5){
      var vy=valToY(v,0,uvMax,cTop,cBot);
      axisText('UV'+v,cssW()-R_PAD+2,vy+uvFs/2,uvColor,true,uvFs);
    }
    CX.restore();
    var uvGrad=CX.createLinearGradient(0,cTop,0,cBot);
    uvGrad.addColorStop(0,'rgba(255,100,200,0.25)');uvGrad.addColorStop(1,'rgba(255,100,200,0.02)');
    // Draw UV as separate normalized line
    function uvToY(v){return valToY(v,0,uvMax,cTop,cBot);}
    CX.save();
    CX.beginPath();
    for(var i=0;i<uvVals.length;i++){var ux=xOf(i),uy=uvToY(uvVals[i]);if(i===0)CX.moveTo(ux,uy);else CX.lineTo(ux,uy);}
    CX.lineTo(xOf(uvVals.length-1),cBot);CX.lineTo(xOf(0),cBot);CX.closePath();
    CX.fillStyle=uvGrad;CX.fill();CX.restore();
    CX.save();
    CX.strokeStyle=uvColor;CX.lineWidth=2;CX.setLineDash([]);
    CX.beginPath();
    for(var i=0;i<uvVals.length;i++){var ux2=xOf(i),uy2=uvToY(uvVals[i]);if(i===0)CX.moveTo(ux2,uy2);else if(i<=split)CX.lineTo(ux2,uy2);else{CX.stroke();CX.setLineDash([5,4]);CX.beginPath();CX.moveTo(ux2,uy2);}}
    CX.stroke();CX.setLineDash([]);CX.restore();
    setLegend([{color:color,label:label,dash:false},{color:uvColor,label:'UV index',dash:false}]);
  } else {
    setLegend([{color:color,label:label,dash:false}]);
  }
}

// ══ LANG POPUP ═════════════════════════════════════════
function openLang(){
  document.getElementById('langGrid').innerHTML=LANGS.map(function(l){
    return '<div class="lang-item'+(l.code===activeLang.code?' active':'')+'" onclick="selectLang(\''+l.code+'\')"><div class="lang-flag">'+l.flag+'</div><div>'+l.name+'</div></div>';
  }).join('');
  document.getElementById('langPopup').classList.add('open');
}
function closeLang(){document.getElementById('langPopup').classList.remove('open');}
function selectLang(code){var f=LANGS.filter(function(l){return l.code===code;});if(f.length)activeLang=f[0];localStorage.setItem('lang',code);closeLang();applyLang();}

// ══ EXTRA POPUP ════════════════════════════════════════
function openExtraPopup(){
  document.getElementById('extraTitle').textContent=T('extraGraphs');
  document.getElementById('extraList').innerHTML=EXTRA_DEFS.map(function(d){
    var chk=enabledExtras.indexOf(d.id)>=0;
    return '<div class="extra-item"><input type="checkbox" id="ex_'+d.id+'"'+(chk?' checked':'')+' onchange="toggleExtra(\''+d.id+'\')"><label for="ex_'+d.id+'">'+d.icon+' '+T(d.id)+'</label></div>';
  }).join('');
  document.getElementById('extraPopup').classList.add('open');
}
function closeExtraPopup(){
  document.getElementById('extraPopup').classList.remove('open');
  var last=localStorage.getItem('lastLocation');
  if(last){try{var loc=JSON.parse(last);loadWeather(loc.lat,loc.lon,loc.name);}catch(e){}}
}
function toggleExtra(id){
  var idx=enabledExtras.indexOf(id);
  if(idx>=0)enabledExtras.splice(idx,1);
  else{enabledExtras.push(id);}
  localStorage.setItem('enabledExtras',JSON.stringify(enabledExtras));
}

// ══ EVENTS ═════════════════════════════════════════════
document.getElementById('gpsBtn').addEventListener('click',useGPS);
document.getElementById('langBtn').addEventListener('click',openLang);
document.getElementById('goBtn').addEventListener('click',useCoords);
document.getElementById('fontBtn').addEventListener('click',cycleFontSize);
document.getElementById('langClose').addEventListener('click',closeLang);
document.getElementById('extraClose').addEventListener('click',closeExtraPopup);
document.getElementById('cloudModeBtn').addEventListener('click',function(){
  cloudMode=cloudMode==='A'?'B':'A';localStorage.setItem('cloudMode',cloudMode);
  document.getElementById('cloudModeBtn').textContent=cloudMode==='A'?'A/B':'B/A';
  if(WD)draw();
});
document.getElementById('extraGraphsBtn').addEventListener('click',openExtraPopup);

// ══ STARTUP ════════════════════════════════════════════
applyLang();
renderRecentChips();
window.addEventListener('load',function(){
  var last=localStorage.getItem('lastLocation');
  if(last){try{var loc=JSON.parse(last);cityQ.value=loc.name;loadWeather(loc.lat,loc.lon,loc.name);}catch(e){}}
});
</script>
